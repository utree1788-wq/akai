<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音楽理論ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#16131c; --panel:#211c2a; --panel2:#2a2435; --line:#3a3248; --text:#f3eef8; --mute:#a99fb8;
  --T:#ff7eb6; --SD:#4fd1c5; --D:#a78bfa; --SDm:#60a5fa; --acc:#ffd166;
  --wk:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"M PLUS Rounded 1c",system-ui,sans-serif;font-size:15px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:rgba(22,19,28,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.top h1{font-size:17px;margin:0;font-weight:800;flex:1;white-space:nowrap}
.top h1 small{color:var(--mute);font-weight:400;font-size:11px;margin-left:6px}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font:inherit;font-weight:700}
.midi{font-size:11px;padding:5px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.midi.ok{border-color:var(--SD);color:var(--SD)}
nav{display:flex;gap:6px;overflow-x:auto;padding:4px 12px 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--mute)}
nav button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
main{padding:14px 12px 230px;max-width:820px;margin:0 auto}
h2{font-size:20px;margin:4px 0 4px;font-weight:800}
h3{font-size:15px;margin:22px 0 8px;font-weight:800;color:var(--acc)}
p.lead{color:var(--mute);margin:0 0 12px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:active,.row.sel{background:var(--panel2)}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:8px 0}
.nm{font-weight:800;min-width:74px}
.sub{color:var(--mute);font-size:12px}
.grow{flex:1;min-width:0}
.notes{font-weight:700;letter-spacing:.02em}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;border:1.5px solid currentColor;margin-right:4px;white-space:nowrap}
.T{color:var(--T)} .SD{color:var(--SD)} .D{color:var(--D)} .SDm{color:var(--SDm)}
.hl{background:linear-gradient(transparent 55%,rgba(255,126,182,.35) 55%);padding:0 2px}
.hl2{background:linear-gradient(transparent 55%,rgba(79,209,197,.35) 55%);padding:0 2px}
.steps{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.steps span{font-size:11px;padding:0 6px;border-radius:6px;background:var(--panel2);color:var(--mute)}
.steps span.h{background:rgba(255,126,182,.25);color:var(--T)}
.steps span.w3{background:rgba(255,209,102,.2);color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;text-align:left}
.chip:active,.chip.sel{background:var(--panel2);border-color:var(--mute)}
.chip b{display:block;font-size:17px}
.note{font-size:12px;color:var(--mute);border-left:3px solid var(--acc);padding:4px 10px;margin:8px 0;background:rgba(255,209,102,.06);border-radius:0 8px 8px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mute);font-size:12px;font-weight:700}
tr.click{cursor:pointer} tr.click:active{background:var(--panel2)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin:4px 0 8px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--panel2);color:var(--text)}
.dict{border-radius:14px;background:var(--panel);border:1px solid var(--line);margin:10px 0;overflow:hidden}
.dict .hd{padding:10px 12px 4px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dict .hd b{font-size:17px}
.dict .bd{padding:0 12px 12px;font-size:14px}
.vars{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.vars button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:4px 10px;font-weight:800}
.vars button:active{border-color:var(--T)}
.to{font-size:12px;color:var(--mute)}
.keymap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.keymap .k{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 4px;cursor:pointer}
.keymap .k b{display:block;font-size:18px}
.keymap .k.main{border-color:var(--acc);background:rgba(255,209,102,.08)}
.quiz .q{font-size:18px;font-weight:800;margin:6px 0 12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:12px 6px;font-weight:800;font-size:15px}
.opts button.ok{border-color:var(--SD);background:rgba(79,209,197,.15)}
.opts button.ng{border-color:var(--T);background:rgba(255,126,182,.12)}
.btn{background:var(--text);color:var(--bg);border:0;border-radius:10px;padding:8px 14px;font-weight:800}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
/* bottom dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(22,19,28,.97);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.dinfo{display:flex;align-items:center;gap:8px;padding:0 12px 6px;max-width:820px;margin:0 auto}
.dinfo .t{flex:1;min-width:0}
.dinfo .t b{font-size:16px}
.dinfo .t div{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dinfo button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:800}
.kbwrap{overflow-x:auto;padding:0 8px;scrollbar-width:thin}
.kb{position:relative;height:118px;margin:0 auto;touch-action:manipulation}
.wk,.bk{position:absolute;top:0;border-radius:0 0 6px 6px;display:flex;align-items:flex-end;justify-content:center;font-size:10px;font-weight:800;padding-bottom:5px;user-select:none}
.wk{width:var(--wk);height:118px;background:#f7f3fb;border:1px solid #6b6178;color:#2a2435}
.bk{width:calc(var(--wk)*.62);height:72px;background:#251f2e;border:1px solid #000;z-index:2;color:#fff}
.wk.on{background:var(--T);color:#fff}
.bk.on{background:#d9478f}
.wk.on.r{background:var(--acc);color:#2a2435}
.bk.on.r{background:#d1a019}
.wk.m{box-shadow:inset 0 -8px 0 var(--SD)} .bk.m{box-shadow:inset 0 -8px 0 var(--SD)}
.wk.c::before{content:attr(data-o);position:absolute;top:4px;font-size:9px;color:#9a8fab;font-weight:400}
.wl{display:flex;flex-wrap:wrap;gap:6px}
.wl button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.wl button:active{border-color:var(--acc)}
#wq{width:100%;font:inherit;font-size:16px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);outline:none;margin:4px 0 4px}
#wq:focus{border-color:var(--acc)}
.cl{color:var(--acc);font-weight:800;border-bottom:1.5px dotted var(--acc);cursor:pointer;padding:0 1px;white-space:nowrap}
.cl:active,.cl.sel{background:rgba(255,209,102,.2);border-radius:4px}
.pgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pch{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:5px 9px;font-weight:800;font-size:14px;display:inline-flex;flex-direction:column;align-items:center;line-height:1.25}
.pch small{font-size:10px;color:var(--mute);font-weight:700}
.pch.sel,.pch:active{border-color:var(--T);background:rgba(255,126,182,.15)}
.uses{display:flex;flex-direction:column;gap:2px;margin-top:4px;font-size:12px;color:var(--mute)}
.uses .use b{font-weight:800;margin-right:2px}
.uses small{font-size:10.5px}
details.song{padding:10px 12px;border-bottom:1px solid var(--line)}
details.song:last-child{border-bottom:0}
details.song summary{cursor:pointer;line-height:1.5}
.midiline{font-size:12px;color:var(--SD);padding:0 12px 4px;max-width:820px;margin:0 auto;min-height:0}
@media(min-width:700px){:root{--wk:30px}}
.ctx{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:7px 0 2px;padding:6px 8px;border:1px dashed var(--line);border-radius:12px}
.sctx{margin:4px 0 8px 2px;padding-left:8px;border-left:2px solid var(--line)}
.sctxh{font-size:11.5px;color:var(--mute);margin-top:4px}
.ctxl{font-size:10.5px;color:var(--mute);width:100%}
.ctxtog{display:block;font-size:12.5px;margin:8px 2px 0;color:var(--mute)}
.uses .use{display:inline-block;margin-top:6px}
.ctx .arr{color:var(--mute);font-size:11px}
.ctx .pch{margin:0}
.pch.hi{outline:2px solid var(--acc);outline-offset:1px;font-weight:800}
.dh{cursor:grab;user-select:none;font-size:16px;line-height:1;padding:4px 6px;border:1px solid var(--line);border-radius:8px;color:var(--mute);align-self:center}
.dh:active{cursor:grabbing}
.ctx .cplay{border:1px solid var(--line);background:none;color:inherit;border-radius:999px;padding:3px 9px;font:inherit;font-size:12px;cursor:pointer}
[draggable=true]{-webkit-user-drag:element}.dragging{opacity:.45}
</style>
<script src="drag.js"></script>
</head>
<body>
<header>
  <div class="top">
    <h1>音楽理論ノート<small>手書きノートまとめ</small></h1>
    <select id="keySel" aria-label="キー"></select>
    <button class="midi" id="midiBtn">MIDI</button>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<div class="dock">
  <div class="midiline" id="midiLine"></div>
  <div class="dinfo">
    <div class="t"><b id="selName">鍵盤をタップ / 項目を選択</b><div id="selNotes">選ぶと音が鳴ります</div></div>
    <button id="playBlock">▶ 和音</button>
    <button id="playArp">▶ 分散</button>
  </div>
  <div class="kbwrap"><div class="kb" id="kb"></div></div>
</div>
<script>
/* ============ 基本データ ============ */
const LET='CDEFGAB', NAT=[0,2,4,5,7,9,11];
const IV={ // token: [半音, 度数, 日本語]
 P1:[0,1,'完全1度'],m2:[1,2,'短2度'],M2:[2,2,'長2度'],A2:[3,2,'増2度'],m3:[3,3,'短3度'],M3:[4,3,'長3度'],
 P4:[5,4,'完全4度'],A4:[6,4,'増4度'],d5:[6,5,'減5度'],P5:[7,5,'完全5度'],A5:[8,5,'増5度'],m6:[8,6,'短6度'],
 M6:[9,6,'長6度'],d7:[9,7,'減7度'],m7:[10,7,'短7度'],M7:[11,7,'長7度'],P8:[12,8,'完全8度']};
const SHORT={P1:'完1',m2:'短2',M2:'長2',A2:'増2',m3:'短3',M3:'長3',P4:'完4',A4:'増4',d5:'減5',P5:'完5',A5:'増5',m6:'短6',M6:'長6',d7:'減7',m7:'短7',M7:'長7'};
const MAJ_NAMES=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const MIN_NAMES=['C','C#','D','Eb','E','F','F#','G','G#','A','Bb','B'];
function parse(n){const l=LET.indexOf(n[0]);let a=0;for(const c of n.slice(1)){if(c=='#')a++;if(c=='b')a--;}return{l,pc:(NAT[l]+a+12)%12};}
function pcOf(n){return parse(n).pc}
function spell(root,tok){
  const r=parse(root),[semi,deg]=IV[tok];const tp=(r.pc+semi)%12, l=(r.l+deg-1)%7;
  let d=(tp-NAT[l]+12)%12;if(d>6)d-=12;
  return LET[l]+(d>0?'#'.repeat(d):'b'.repeat(-d));
}
function pn(s){ // pretty note name (letters + accidentals only)
  return s.replace(/^([A-G])(#+|b+)?/,(m,l,a)=>l+(a?(a[0]=='#'?(a.length==2?'𝄪':'♯'):'♭'.repeat(a.length)):''));
}
/* ============ コード ============ */
const CT={
 maj:{s:'',t:['P1','M3','P5'],n:'メジャー・トライアド',f:'ルート＋長3度＋完全5度'},
 m:{s:'m',t:['P1','m3','P5'],n:'マイナー・トライアド',f:'ルート＋短3度＋完全5度'},
 aug:{s:'aug',t:['P1','M3','A5'],n:'オーギュメント・トライアド',f:'ルート＋長3度＋増5度（長3度を2つ重ねる）'},
 dim:{s:'dim',t:['P1','m3','d5'],n:'ディミニッシュ・トライアド',f:'ルート＋短3度＋減5度（短3度を2つ重ねる）'},
 maj7:{s:'M7',t:['P1','M3','P5','M7'],n:'メジャー・セブンス',f:'メジャー△＋長7度'},
 '7':{s:'7',t:['P1','M3','P5','m7'],n:'（ドミナント）セブンス',f:'メジャー△＋短7度'},
 mM7:{s:'mM7',t:['P1','m3','P5','M7'],n:'マイナー・メジャー・セブンス',f:'マイナー△＋長7度'},
 m7:{s:'m7',t:['P1','m3','P5','m7'],n:'マイナー・セブンス',f:'マイナー△＋短7度'},
 m7b5:{s:'m7(♭5)',t:['P1','m3','d5','m7'],n:'（ハーフ）ディミニッシュ / m7♭5',f:'dim△＋短7度'},
 dim7:{s:'dim7',t:['P1','m3','d5','d7'],n:'（フル）ディミニッシュ・セブンス',f:'dim△＋減7度'},
 m6:{s:'m6',t:['P1','m3','P5','M6'],n:'マイナー・シックス',f:'マイナー△＋長6度'},
 augM7:{s:'augM7',t:['P1','M3','A5','M7'],n:'オーギュメント・メジャー・セブンス',f:'aug△＋長7度'},
};
function chordName(root,type,bass){return pn(root)+CT[type].s+(bass?'/'+pn(bass):'')}
function chordNotes(root,type){return CT[type].t.map(t=>spell(root,t))}
function chordMidi(root,type,bass){
  const r=pcOf(root);
  if(bass){const b=48+pcOf(bass);return [b,...CT[type].t.map(t=>60+r+IV[t][0])];}
  return CT[type].t.map(t=>48+r+IV[t][0]);
}
function roman(tok){const d=IV[tok][1];const R=['I','II','III','IV','V','VI','VII'][d-1];
  const pre={m2:'♭',m3:'♭',m6:'♭',m7:'♭',A4:'♯',A5:'♯',d5:'♭'}[tok]||'';return pre+R;}

/* ============ スケール ============ */
const MODES=[
 {k:'ionian',n:'イオニアン',en:'Ionian',from:'C',t:['P1','M2','M3','P4','P5','M6','M7'],mood:'明るい・完成形',memo:'完全＋長だけ。最も安定。（＝メジャー・スケール）'},
 {k:'dorian',n:'ドリアン',en:'Dorian',from:'D',t:['P1','M2','m3','P4','P5','M6','m7'],mood:'クール・中庸',memo:'短3・短7の「陰」と、長6の「光」が同居。'},
 {k:'phrygian',n:'フリジアン',en:'Phrygian',from:'E',t:['P1','m2','m3','P4','P5','m6','m7'],mood:'闇・緊張',memo:'完全＋短だけ。短の集合体。'},
 {k:'lydian',n:'リディアン',en:'Lydian',from:'F',t:['P1','M2','M3','A4','P5','M6','M7'],mood:'浮遊・神秘',memo:'増4が特徴。導音あり。'},
 {k:'mixolydian',n:'ミクソリディアン',en:'Mixolydian',from:'G',t:['P1','M2','M3','P4','P5','M6','m7'],mood:'開放・土臭い',memo:'明るいが終わらない（短7で導音がない）。'},
 {k:'aeolian',n:'エオリアン',en:'Aeolian',from:'A',t:['P1','M2','m3','P4','P5','m6','m7'],mood:'哀愁・内省',memo:'＝ナチュラル・マイナー（自然的短音階）。'},
 {k:'locrian',n:'ロクリアン',en:'Locrian',from:'B',t:['P1','m2','m3','P4','d5','m6','m7'],mood:'不安定・禁忌',memo:'減5。安定点ゼロ。崩壊、ノイズ。'},
];
const MINORS=[
 {n:'自然的短音階',en:'Natural minor',t:['P1','M2','m3','P4','P5','m6','m7'],memo:'平行長調（同じ調号）の<b>第6音</b>から始めた音階。'},
 {n:'和声的短音階',en:'Harmonic minor',t:['P1','M2','m3','P4','P5','m6','M7'],memo:'7番目の音を半音上げる → <span class="hl">導音</span>が生まれる。導音はドミナント・モーション（強い終止感）を生み出す役割がある。<br>※6・7音の間が増2度（1全半）になり、メロディーラインが不自然になりやすい。'},
 {n:'旋律的短音階',en:'Melodic minor',t:['P1','M2','m3','P4','P5','M6','M7'],memo:'旋律を成り立たせるために6番目の音も半音上げる。<br>※長調のような響きになるので、<b>下降するときは全てナチュラルにして</b>自然的短音階に戻す。'},
];
const EXTRA=[
 {n:'メジャー・ペンタトニック',t:['P1','M2','M3','P5','M6'],memo:'長音階の4・7番目を抜いた5音。ヨナ抜き長音階とも。'},
 {n:'マイナー・ペンタトニック',t:['P1','m3','P4','P5','m7'],memo:'自然的短音階の2・6番目を抜いた5音。'},
 {n:'ブルース・スケール',t:['P1','m3','P4','d5','P5','m7'],memo:'マイナー・ペンタに♭5（ブルーノート）を足したもの。'},
 {n:'ホールトーン・スケール',t:['P1','M2','M3','A4','A5','m7'],memo:'全音だけで並ぶ6音。浮遊感・夢見心地。'},
 {n:'コンビネーション・オブ・ディミニッシュ',t:['P1','m2','m3','M3','A4','P5','M6','m7'],memo:'半音・全音を交互に繰り返す8音（半全ディミニッシュ）。'},
];
const JP=[
 {n:'陽音階（ヨ音階）',t:['P1','M2','M3','P5','M6'],use:'童謡、沖縄音楽など'},
 {n:'陰音階（イン音階）',t:['P1','m2','P4','P5','m6'],use:'演歌、尺八、箏'},
 {n:'都節音階（みやこぶし）',t:['P1','m2','P4','P5','m7'],use:'いかにも日本'},
 {n:'律音階',t:['P1','M2','M3','P5','M6'],use:'陽音階と同じだが → 表現より秩序。雅楽由来、神事向け',alt:{t:['P1','M2','P4','P5','M6'],l:'一般的な形'}},
 {n:'琉音階（りゅう）',t:['P1','m2','m3','P5','m6'],use:'',alt:{t:['P1','M3','P4','P5','M7'],l:'一般的な琉球音階'}},
];
function stepStr(toks){
  const s=toks.map(t=>IV[t][0]).concat(12);let out=[];
  for(let i=1;i<s.length;i++){const d=s[i]-s[i-1];out.push(d==1?['半','h']:d==2?['全','']:d==3?['1全半','w3']:[d+'半','w3']);}
  return out.map(([a,c])=>`<span class="${c}">${a}</span>`).join('');
}
function scaleRoot(toks){const pc=KEY;return toks.includes('m3')&&!toks.includes('M3')?MIN_NAMES[pc]:MAJ_NAMES[pc];}
function scaleNotes(root,toks){return toks.map(t=>spell(root,t))}
function scaleMidi(root,toks){const r=48+pcOf(root);return toks.map(t=>r+IV[t][0]).concat(r+12);}

/* ============ ダイアトニック ============ */

const QUAL={'5':[0,7],'':[0,4,7],'m':[0,3,7],'7':[0,4,7,10],'m7':[0,3,7,10],'maj7':[0,4,7,11],'mmaj7':[0,3,7,11],

const TEN={'b5':null,'#5':null,'add9':14,'9':14,'b9':13,'#9':15,'11':17,'#11':18,'13':21,'b13':20};
function norm(s){return s.replace(/♭/g,'b').replace(/♯/g,'#').replace(/△/g,'maj')}
function parseRoot(s){const m=s.match(/^([A-G])([#b]?)/);if(!m)return null;let p=PC[m[1]]+(m[2]=='#'?1:m[2]=='b'?-1:0);return {pc:(p+12)%12,len:m[0].length}}
function parseChord(sym){
  let s=norm(sym), bass=null;
  const sl=s.indexOf('/'); if(sl>0){bass=parseRoot(s.slice(sl+1)).pc; s=s.slice(0,sl);}
  const r=parseRoot(s); let rest=s.slice(r.len);
  let paren=''; const pi=rest.indexOf('('); if(pi>=0){paren=rest.slice(pi+1,rest.lastIndexOf(')'));rest=rest.slice(0,pi);}
  let iv=(QUAL[rest]||QUAL['']).slice();
  paren.split(/[,、 ]+/).filter(Boolean).forEach(t=>{
    if(t=='b5'){iv=iv.map(x=>x==7?6:x)}
    else if(t=='#5'){iv=iv.map(x=>x==7?8:x)}
    else if(TEN[t]!=null){iv.push(TEN[t])}
  });
  return {root:r.pc,bass:bass==null?r.pc:bass,iv};
}

let AC,MASTER;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();const c=AC.createDynamicsCompressor();MASTER=AC.createGain();MASTER.gain.value=.5;MASTER.connect(c);c.connect(AC.destination);}if(AC.state=='suspended')AC.resume();return AC;}
const f=m=>440*Math.pow(2,(m-69)/12);
function voice(m,t0,dur,vel=.8){
  const a=ac(),o1=a.createOscillator(),o2=a.createOscillator(),g=a.createGain(),lp=a.createBiquadFilter();
  o1.type='triangle';o2.type='sine';o1.frequency.value=f(m);o2.frequency.value=f(m)*2;
  const g2=a.createGain();g2.gain.value=.25;o2.connect(g2);g2.connect(g);o1.connect(g);
  lp.type='lowpass';lp.frequency.value=2600;g.connect(lp);lp.connect(MASTER);
  const pk=.22*vel;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(pk,t0+.01);g.gain.exponentialRampToValueAtTime(pk*.45,t0+.35);
  o1.start(t0);o2.start(t0);
  if(dur!=null){g.gain.setTargetAtTime(0,t0+dur,.18);o1.stop(t0+dur+1);o2.stop(t0+dur+1);}
  return {stop(){const t=a.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.setTargetAtTime(0,t,.12);o1.stop(t+.8);o2.stop(t+.8);}};
}
function playBlock(ms){const a=ac(),t=a.currentTime+.02;ms.forEach(m=>voice(m,t,1.4,.75));}
function playArp(ms){const a=ac();let t=a.currentTime+.02;ms.forEach(m=>{voice(m,t,.42,.8);t+=.24;});}

const LOW=48,HIGH=84;
function buildKb(){
  const kb=document.getElementById('kb');kb.innerHTML='';
  const wk=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--wk'));
  let x=0;
  for(let m=LOW;m<HIGH;m++){
    const pc=m%12,black=[1,3,6,8,10].includes(pc);
    const el=document.createElement('div');el.dataset.m=m;
    if(black){el.className='bk';el.style.left=(x-wk*.31)+'px';}
    else{el.className='wk'+(pc==0?' c':'');el.style.left=x+'px';if(pc==0)el.dataset.o='C'+(m/12-1);x+=wk;}
    el.addEventListener('pointerdown',e=>{e.preventDefault();const v=voice(m,ac().currentTime+.005,null);el.classList.add('m');
      const up=()=>{v.stop();el.classList.remove('m');window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up)};
      window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);});
    kb.appendChild(el);
  }
  kb.style.width=x+'px';
}

let SEQ=null;
function stopSeq(){if(SEQ){SEQ.timers.forEach(clearTimeout);SEQ.btn&&SEQ.btn.classList.remove('sel');SEQ=null;}}
function seqPlay(items,btn,step=1000){ // items:[{name,sub,ms,names}]
  const same=SEQ&&SEQ.btn===btn;stopSeq();if(same)return;
  SEQ={btn,timers:[]};btn&&btn.classList.add('sel');
  items.forEach((it,i)=>SEQ.timers.push(setTimeout(()=>{select(it.name,it.sub||items.map((x,j)=>j==i?'<b style="color:var(--T)">'+x.name+'</b>':x.name).join(' → '),it.ms,it.names,'block',it.root);btn&&btn.classList.add('sel');},i*step)));
  SEQ.timers.push(setTimeout(()=>stopSeq(),items.length*step+200));
}
function chordItem(root,type){const ms=chordMidi(root,type),ns=chordNotes(root,type),nm={};ns.forEach((n,i)=>nm[ms[i]]=n);return {name:chordName(root,type),ms,names:nm};}
function scaleRun(root,toks,dir,btn,drone){
  stopSeq();const ms=scaleMidi(root,toks),ns=scaleNotes(root,toks).concat(root),nm={};ms.forEach((m,i)=>nm[m]=ns[i]);
  let seq=ms.map((m,i)=>[m,ns[i]]);if(dir=='down')seq=seq.reverse();if(dir=='both')seq=seq.concat(seq.slice(0,-1).reverse());
  const a=ac(),t0=a.currentTime+.03,st=drone?.34:.26;
  if(drone){const r=36+pcOf(root);[r,r+7,r+12].forEach(m=>voice(m,t0,seq.length*st+.6,.55));}
  seq.forEach(([m],i)=>voice(m+(drone?12:0),t0+i*st,st*1.3,.8));
  const shown=drone?ms.map(m=>m+12):ms,nm2={};shown.forEach((m,i)=>nm2[m]=ns[i]);
  select(btn?btn.dataset.title:'',ns.map(pn).join(' ・ '),shown,nm2,'arp',shown[0],true);
  SEQ={btn,timers:[setTimeout(()=>stopSeq(),seq.length*st*1000+300)]};btn&&btn.classList.add('sel');
}

 ['key','調'],['func','機能'],['diatonic','ダイアトニック'],['words','用語一覧'],['quiz','クイズ']];
const V={};

V.interval=()=>{
  const r=MAJ_NAMES[KEY];
  const rows=[
   ['P1',0,'完全1度',''],['m2',1,'短2度',''],['M2',2,'長2度',''],['m3',3,'短3度',''],['M3',4,'長3度',''],['P4',5,'完全4度',''],
   ['A4',6,'増4度 / 減5度','トライトーン'],['P5',7,'完全5度',''],['m6',8,'短6度',''],['M6',9,'長6度',''],['m7',10,'短7度',''],['M7',11,'長7度',''],['P1',12,'完全8度','オクターブ']];
  const comp=[[13,'短9度','♭9'],[14,'長9度','9'],[15,'短10度',''],[16,'長10度',''],[17,'完全11度','11'],[18,'増11度 / 減12度','♯11'],[19,'完全12度',''],[20,'短13度','♭13'],[21,'長13度','13'],[22,'短14度',''],[23,'長14度',''],[24,'完全15度','']];
  return `<h2>音程（インターバル）</h2><p class="lead">ルート ${pn(r)} からの距離。タップで2音を鳴らします。オクターブを超えると「＋7度」（9度＝2度＋オクターブ）。</p>
  <div class="list">${rows.map(([t,s,n,x])=>{const nn=s==12?r:spell(r,t);return `<div class="row" data-iv="${s}" data-n="${nn}"><span class="nm">${s}半音</span><span class="grow"><b>${n}</b> <span class="sub">${x}</span></span><span class="notes">${pn(r)} → ${pn(nn)}</span></div>`}).join('')}</div>
  <h3>オクターブ以上（テンション）</h3>
  <div class="list">${comp.map(([s,n,x])=>`<div class="row" data-iv="${s}" data-n="${MIN_NAMES[(KEY+s)%12]}"><span class="nm">${s}半音</span><span class="grow"><b>${n}</b></span><span class="sub">${x?'テンション '+x:''}</span></div>`).join('')}</div>`;
};
V.chord=()=>{
  const r=MAJ_NAMES[KEY];
  const g=(title,ks)=>`<h3>${title}</h3><div class="list">${ks.map(k=>`<div class="row" data-ch="${r}|${k}"><span class="nm">${chordName(r,k)}</span><span class="grow"><b>${CT[k].n}</b><div class="sub">${CT[k].f}</div></span><span class="notes">${chordNotes(r,k).map(pn).join(' ')}</span></div>`).join('')}</div>`;
  return `<h2>コードの成り立ち</h2><p class="lead">ルート ${pn(r)}（上のキーで変更）。△＝トライアド。</p>
  ${g('トライアド（3和音）',['maj','m','aug','dim'])}
  ${g('セブンス（4和音）',['maj7','7','mM7','m7','m7b5','dim7'])}
  <div class="note">※ dim に長7度は存在しない（dim△＋減7度＝dim7、dim△＋短7度＝m7♭5）。</div>
  <h3>セブンスの関係</h3>
  <div class="card" style="font-size:14px">
   <b>メジャー△</b> ＋ 長7 → <b>M7</b>　／ ＋ 短7 → <b>7</b><br>
   <b>マイナー△</b> ＋ 長7 → <b>mM7</b>　／ ＋ 短7 → <b>m7</b><br>
   <b>dim△</b> ＋ 短7 → <b>m7♭5</b>　／ ＋ 減7 → <b>dim7</b>
  </div>`;
};
V.scale=()=>{
  const mk=(list)=>`<div class="list">${list.map((s,i)=>{const r=scaleRoot(s.t);return `<div class="row" data-sc="${encodeURIComponent(JSON.stringify([pn(r)+' '+s.n,r,s.t]))}" style="align-items:flex-start"><span class="grow"><b>${pn(r)} ${s.n}</b> ${s.en?`<span class="sub">${s.en}</span>`:''}
   <div class="notes">${scaleNotes(r,s.t).map(pn).join(' ')}</div><div class="sub">${s.t.map(t=>SHORT[t]).join(' ')}</div><div class="steps">${stepStr(s.t)}</div>${s.memo?`<div class="sub" style="margin-top:4px">${s.memo}</div>`:''}</span></div>`}).join('')}</div>`;
  return `<h2>スケール</h2><p class="lead">タップで上行して鳴らします。全＝全音、半＝半音。</p>
  <h3>長調（メジャー・スケール）</h3>${mk([{n:'メジャー・スケール',en:'Major',t:MODES[0].t,memo:'<b>全全半全全全半</b>'}])}
  <h3>3種の短調</h3>
  <div class="card" style="font-size:14px">平行長調（＝同じ調号を持つ長調）の<b>第6音から始めた音階</b>が自然的短音階。<br>例：C メジャー ↔ A マイナー</div>
  ${mk(MINORS)}
  <h3>その他のよく使うスケール</h3>${mk(EXTRA)}`;
};
V.mode=()=>{
  return `<h2>モード（教会旋法）</h2><p class="lead">Cメジャー・スケールの白鍵を、どの音から始めるかで7つのモードになる。下は全て ${pn(KN())} 始まりに移調して比較。▶ で音階、コード名で特徴的な響きが鳴ります。</p>
  ${MODES.map(s=>{const rr=s.t.includes('m3')?MIN_NAMES[KEY]:MAJ_NAMES[KEY];const ch=MODE_CH[s.k];const cs=ch.slice(0,4).map(([tok,ty])=>[spell(rr,tok),ty]);
   return `<div class="dict"><div class="hd"><b>${s.n}</b><span class="sub">${s.en}・白鍵${s.from}〜</span><span class="tag T">${s.mood}</span></div><div class="bd">
   <div class="notes">${scaleNotes(rr,s.t).map(pn).join(' ')}</div><div class="sub">${s.t.map(t=>SHORT[t]).join(' ')}</div><div class="steps">${stepStr(s.t)}</div>
   <div class="sub" style="margin-top:4px">${s.memo}</div>
   ${scaleBtns(pn(rr)+' '+s.n,rr,s.t)}
   <div class="sub" style="margin-top:6px">特徴的なコード：${ch[4]}</div>
   <div class="vars"><button data-cseq="${encodeURIComponent(JSON.stringify(cs))}">▶ ${cs.map(([r,t])=>chordName(r,t)).join(' → ')}</button>${[...new Map(cs.map(c=>[c.join(),c])).values()].map(([r,t])=>`<button data-ch="${r}|${t}">${chordName(r,t)}</button>`).join('')}</div>
   </div></div>`}).join('')}
  <h3>明るさの順</h3>
  <div class="card" style="font-size:14px">リディアン ＞ イオニアン ＞ ミクソリディアン ＞ ドリアン ＞ エオリアン ＞ フリジアン ＞ ロクリアン<div class="sub">（隣同士は1音だけ違う）</div>
  <div class="vars" style="margin-top:8px"><button id="modeTour">▶ 明るい順に7つ全部聴く</button></div></div>`;
};
V.japan=()=>{
  const r=MAJ_NAMES[KEY];
  return `<h2>日本の音階</h2><p class="lead">基本は5音音階（ペンタトニック）。ルート ${pn(r)}。「ドローン＋旋律」は低音を鳴らしたまま音階を弾くので、雰囲気がつかみやすいです。</p>
  ${JP.map((s,i)=>{const cs=JP_CH[i][0].map(([tok,ty])=>[spell(r,tok),ty]);return `<div class="dict"><div class="hd"><b>${s.n}</b>${s.use?`<span class="tag SD">${s.use}</span>`:''}</div><div class="bd">
   <div class="notes">${scaleNotes(r,s.t).map(pn).join(' ')}</div><div class="sub">${s.t.map(t=>SHORT[t]).join(' ')}</div>
   ${scaleBtns(s.n,r,s.t)}
   ${s.alt?`<div class="sub" style="margin-top:6px">${s.alt.l}：${scaleNotes(r,s.alt.t).map(pn).join(' ')}（${s.alt.t.map(t=>SHORT[t]).join(' ')}）</div>${scaleBtns(s.n+'・'+s.alt.l,r,s.alt.t)}`:''}
   <div class="sub" style="margin-top:6px">合わせるコード例：${JP_CH[i][1]}</div>
   <div class="vars"><button data-cseq="${encodeURIComponent(JSON.stringify(cs))}">▶ ${cs.map(([r,t])=>chordName(r,t)).join(' → ')}</button></div>
   </div></div>`}).join('')}
  <div class="note">構成音はノートの記述をそのまま載せています。律音階・琉音階は資料によって構成音が違うので、一般によく見る形も聴き比べられます。コード例は雰囲気をつかむための参考です。</div>`;
};
V.key=()=>{
  const k=KN(),P5=spell(k,'P5'),P4=spell(k,'P4'),rel=spell(k,'M6');
  const box=(cls,n,ttl,sig,sc)=>`<div class="k ${cls}" data-sc="${encodeURIComponent(JSON.stringify(sc))}"><div class="sub">${ttl}</div><b>${n}</b><div class="sub">${sig}</div></div>`;
  const MJ=MODES[0].t,NM=MINORS[0].t;
  return `<h2>調（キー）の関係</h2><p class="lead">主調 ${pn(k)} メジャーの場合。タップで音階を再生。</p>
  <div class="keymap">
   ${box('',pn(spell(P4,'M6'))+'m','下属調の平行調',SIG[pcOf(P4)],[pn(spell(P4,'M6'))+'m',spell(P4,'M6'),NM])}
   ${box('',pn(rel)+'m','平行調',SIG[KEY],[pn(rel)+'m',rel,NM])}
   ${box('',pn(spell(P5,'M6'))+'m','属調の平行調',SIG[pcOf(P5)],[pn(spell(P5,'M6'))+'m',spell(P5,'M6'),NM])}
   ${box('',pn(P4),'下属調（♭+1）',SIG[pcOf(P4)],[pn(P4)+' メジャー',P4,MJ])}
   ${box('main',pn(k),'主調',SIG[KEY],[pn(k)+' メジャー',k,MJ])}
   ${box('',pn(P5),'属調（♯+1）',SIG[pcOf(P5)],[pn(P5)+' メジャー',P5,MJ])}
   <div></div>${box('',pn(k)+'m','同主調',' ',[pn(k)+'m',k,NM])}<div></div>
  </div>
  <h3>近親調（主調と関係の近い調）</h3>
  <div class="list">
   <div class="row"><span class="nm">平行調</span><span class="grow">調号が同じ長調と短調。<b>音階の構成音が全て同じ</b>。<div class="sub">C メジャー ↔ A マイナー</div></span></div>
   <div class="row"><span class="nm">同主調</span><span class="grow">主音が同じ長調と短調。<div class="sub">C メジャー ↔ C マイナー（E♭, A♭, B♭）</div></span></div>
   <div class="row"><span class="nm">属調</span><span class="grow">完全5度上。<b>♯が1つ増える</b>（♭が1つ減る）。<div class="sub">C メジャー ↔ G メジャー（F♯）</div></span></div>
   <div class="row"><span class="nm">下属調</span><span class="grow">完全5度下。<b>♭が1つ増える</b>（♯が1つ減る）。<div class="sub">C メジャー ↔ F メジャー（B♭）</div></span></div>
  </div>
  <p class="sub">これ以外の、関係の遠い調は「遠隔調」。</p>
  <h3>転調の使い方</h3>
  <div class="card" style="font-size:14px">
   <b class="T">属調（Dominant key）</b>：高揚感・緊張感が大きくなる。転調（Modulation）によく使われる。サビ前、ブリッジ時。<br><br>
   <b class="SD">下属調（Subdominant key）</b>：深い安らぎ、落ち着きを演出する。回想シーンなども。主調に戻る前や、エンディングの強調（サブドミナント的）。<br><br>
   <span class="sub">古典派音楽では、提示部で第1主題を主調、第2主題を属調で提示し、緊張感の対比を作ることが一般的。</span>
  </div>
  <h3>平行調（Relative key）一覧</h3>
  <p class="sub">見つけ方：長調のルート音から<b>3半音低い音</b>を探す。</p>
  <div class="card" style="padding:4px 8px"><table><tr><th>調号</th><th>長調</th><th>短調</th></tr>
  ${RELTAB.map(([s,M,m])=>`<tr><td>${s||'なし'}</td><td><b>${M}</b></td><td><b>${m}</b></td></tr>`).join('')}</table></div>`;
};
V.func=()=>`<h2>コード機能</h2><p class="lead">コードは3つの役割（機能）に分かれる。I・IV・V＝主要三和音。</p>
  <div class="list">
   <div class="row"><span class="nm">${tag('T','T')}</span><span class="grow"><b>トニック</b>（I）— 安定<div class="sub">中音・主音を含む。トニック機能は「緩和」。</div></span></div>
   <div class="row"><span class="nm">${tag('SD','SD')}</span><span class="grow"><b>サブドミナント</b>（IV）— 半緊張</div>
   <div class="row"><span class="nm">${tag('D','D')}</span><span class="grow"><b>ドミナント</b>（V）— 緊張<div class="sub">下属音（サブドミナント）と導音を含む。ドミナント機能は「緊張感」。</div></span></div>
  </div>
  <svg viewBox="0 0 340 200" style="width:100%;max-width:420px;display:block;margin:10px auto">
   <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a99fb8"/></marker></defs>
   <circle cx="170" cy="40" r="30" fill="none" stroke="#ff7eb6" stroke-width="2.5"/><text x="170" y="46" text-anchor="middle" fill="#ff7eb6" font-weight="800" font-size="18">T</text>
   <circle cx="70" cy="155" r="30" fill="none" stroke="#a78bfa" stroke-width="2.5"/><text x="70" y="161" text-anchor="middle" fill="#a78bfa" font-weight="800" font-size="18">D</text>
   <circle cx="270" cy="155" r="30" fill="none" stroke="#4fd1c5" stroke-width="2.5"/><text x="270" y="161" text-anchor="middle" fill="#4fd1c5" font-weight="800" font-size="18">SD</text>
   <path d="M196 56 L250 128" stroke="#a99fb8" stroke-width="2" marker-end="url(#ar)"/>
   <path d="M240 158 L104 158" stroke="#a99fb8" stroke-width="2" marker-end="url(#ar)"/>
   <path d="M88 130 L146 58" stroke="#a99fb8" stroke-width="2" marker-end="url(#ar)"/>
   <path d="M250 136 L196 64" stroke="#a99fb8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ar)"/>
   <text x="62" y="90" fill="#f3eef8" font-size="11" text-anchor="middle">緊張から</text><text x="62" y="104" fill="#f3eef8" font-size="11" text-anchor="middle">戻ろうとする力</text>
   <text x="282" y="90" fill="#f3eef8" font-size="11" text-anchor="middle">弱い緊張から</text><text x="282" y="104" fill="#f3eef8" font-size="11" text-anchor="middle">戻ろうとする力</text>
   <text x="170" y="196" fill="#a99fb8" font-size="11" text-anchor="middle">D → SD はあまり使用されない</text>
  </svg>
  <div class="vars" style="justify-content:center">
   <button data-prog="T,SD,D,T">▶ I → IV → V → I</button><button data-prog="T,D,T">▶ I → V → I</button><button data-prog="T,SD,T">▶ I → IV → I</button>
  </div>
  <h3>音度の名前と役割（長調）</h3>
  <div class="card" style="padding:4px 8px"><table>
   <tr><th></th><th>度</th><th>名前</th><th></th></tr>
   <tr><td>${tag('T','T')}</td><td>I</td><td>トニック</td><td>主音</td></tr>
   <tr><td>${tag('SD','SD')}</td><td>II</td><td>スーパートニック</td><td>上主音</td></tr>
   <tr><td>${tag('T','T')}</td><td>III</td><td>ミディアント</td><td>中音</td></tr>
   <tr><td>${tag('SD','SD')}</td><td>IV</td><td>サブドミナント</td><td>下属音</td></tr>
   <tr><td>${tag('D','D')}</td><td>V</td><td>ドミナント</td><td>属音</td></tr>
   <tr><td>${tag('T','T')}</td><td>VI</td><td>サブミディアント</td><td>下中音</td></tr>
   <tr><td>${tag('D','D')}</td><td>VII</td><td>リーディングトーン</td><td>導音</td></tr>
  </table></div>
  <div class="note">VI はトニック代理だが、サブドミナント・マイナーとしても使われる。</div>
  <div class="list">
   <div class="row"><span class="nm">VII 強</span><span class="grow"><b>リーディングトーン＝導音</b><div class="sub">トニックに対して<b>半音下</b>にある。主音へ進む力が強い。</div></span></div>
   <div class="row"><span class="nm">VII 弱</span><span class="grow"><b>サブトニック</b><div class="sub">自然的短音階の第7音。主音に対して全音で離れていて、導音と比べると主音へ進む傾向が強くない。</div></span></div>
  </div>
  <h3>3和音の種類（M＝メジャー、m＝マイナー）</h3>
  <div class="card" style="padding:4px 8px;overflow-x:auto"><table style="text-align:center">
   <tr><th></th><th>I</th><th>II</th><th>III</th><th>IV</th><th>V</th><th>VI</th><th>VII</th></tr>
   <tr><td class="sub">長調</td><td>M</td><td>m</td><td>m</td><td>M</td><td>M</td><td>m</td><td>dim</td></tr>
   <tr><td></td><td class="T">T</td><td class="SD">SD</td><td class="T">T</td><td class="SD">SD</td><td class="D">D</td><td class="T">T</td><td class="D">D</td></tr>
   <tr><td class="sub">自然的短調</td><td>m</td><td>dim</td><td>M</td><td>m</td><td>m</td><td>M</td><td>M</td></tr>
   <tr><td></td><td class="T">T</td><td class="SD">SD</td><td class="T">T</td><td class="SD">SD</td><td class="D">D</td><td class="SD">SD</td><td class="D">D</td></tr>
  </table></div>`;
let DMODE='major', DSEV=false;
V.diatonic=()=>{
  const d=DIA[DMODE],k=DMODE=='major'?MAJ_NAMES[KEY]:MIN_NAMES[KEY];
  return `<h2>ダイアトニック・コード</h2><p class="lead">${pn(k)}${DMODE=='major'?'':'m'}・${d.label}。タップで和音を再生。</p>
  <div class="seg" id="dmode">${Object.entries(DIA).map(([kk,v])=>`<button data-dm="${kk}" class="${kk==DMODE?'on':''}">${v.label.replace('（メジャー）','')}</button>`).join('')}</div>
  <div class="seg"><button data-dsev="0" class="${!DSEV?'on':''}">3和音</button><button data-dsev="1" class="${DSEV?'on':''}">4和音（7th）</button></div>
  <div class="list">${d.rows.map(([tok,t3,t4,fn,memo])=>{const r=spell(k,tok),ty=DSEV?t4:t3;return `<div class="row" data-ch="${r}|${ty}">
   <span class="nm">${roman(tok)}<span class="sub">${CT[ty].s.replace('M7','Δ7').replace('m7(♭5)','ø')}</span></span>
   <span class="grow"><b>${chordName(r,ty)}</b> ${tag(fn)}<div class="sub">${memo}</div></span><span class="notes">${chordNotes(r,ty).map(pn).join(' ')}</span></div>`}).join('')}</div>
  <div class="note">${d.note}</div>
  ${DMODE!='major'?`<h3>機能別まとめ（短調全体）</h3><div class="card" style="font-size:14px">${tag('T','Tonic系')} Im, ♭III, ♭III+<br>${tag('SD','SubDominant')} IIø, IVm / IV, ♭VI<br>${tag('D','Dominant')} V, VII°, ♭VII</div>`:''}`;
};
const DIATONIC_L=['IΔ7','IIm / IIm7','IIIm / IIIm7','IV / IVΔ7','V / V7','VIm / VIm7','VIIm(♭5) / VIIm7(♭5)'];
DICT.forEach(e=>e.odd=!DIATONIC_L.includes(e.l));
function dictCard(e,k){
  return `<div class="dict" id="d-${DICT.indexOf(e)}"><div class="hd"><b>${e.l}</b>${e.f.map(([fn,n])=>tag(fn,n?FN[fn]+'（'+n+'）':null)).join('')}</div><div class="bd">
   <div class="vars">${e.v.map(([tok,ty,b])=>{const r=spell(k,tok),bb=b?spell(k,b):'';return `<button data-ch="${r}|${ty}|${bb}">${chordName(r,ty,bb)}</button>`}).join('')}</div>
   ${e.to?`<div class="to">→ ${e.to}</div>`:''}<div style="margin-top:4px">${e.d}</div></div></div>`;
}
V.dict=()=>{
  const k=MAJ_NAMES[KEY];
  return `<h2>コード事典</h2><p class="lead">ダイアトニック・コード（スケールの音だけでできる基本の7つ）。キー ${pn(k)} メジャーで表示（ノートは C 基準）。</p>
  ${DICT.filter(e=>!e.odd).map(e=>dictCard(e,k)).join('')}
  <div class="note">セカンダリー・ドミナントや借用和音などは「<a href="#" data-goto="odd" style="color:var(--acc)">変わり者コード</a>」へ。</div>`;
};
V.odd=()=>{

  const cands=[];
  for(const r of pcs)for(const[k,c]of Object.entries(CT)){
    const set=c.t.map(t=>(r+IV[t][0])%12);
    if(set.length==pcs.length&&set.every(x=>pcs.includes(x)))cands.push([r,k]);
  }
  if(!cands.length)return pcs.length==2?IV[Object.keys(IV).find(t=>IV[t][0]==((Math.max(...notes)-Math.min(...notes))%12))||'P1'][2]:'';
  cands.sort((a,b)=>(b[0]==bass)-(a[0]==bass));
  const[r,k]=cands[0];const rn=MAJ_NAMES[r];return chordName(rn,k)+(r!=bass?'/'+pn(MAJ_NAMES[bass]):'');
}
function midiUI(){
  const ns=[...held.keys()].sort((a,b)=>a-b);
  document.querySelectorAll('#kb [data-m]').forEach(el=>el.classList.toggle('m',held.has(+el.dataset.m)));
  document.getElementById('midiLine').textContent=ns.length?'🎹 '+ns.map(n=>pn(MAJ_NAMES[n%12])).join(' ')+(detect(ns)?'　→ '+detect(ns):''):'';
}
document.getElementById('midiBtn').onclick=async()=>{
  const b=document.getElementById('midiBtn');ac();
  if(!navigator.requestMIDIAccess){b.textContent='MIDI非対応';return;}
  try{const acc=await navigator.requestMIDIAccess();
    const hook=()=>{let c=0;acc.inputs.forEach(inp=>{c++;inp.onmidimessage=ev=>{const[s,n,v]=ev.data,t=s&0xf0;
      if(t==0x90&&v>0){held.get(n)?.stop();held.set(n,voice(n,ac().currentTime+.003,null,.4+v/200));midiUI();}
      else if(t==0x80||(t==0x90&&v==0)){held.get(n)?.stop();held.delete(n);midiUI();}};});
      b.textContent=c?'MIDI ✓ '+c:'MIDI 機器なし';b.classList.toggle('ok',c>0);};
    hook();acc.onstatechange=hook;
  }catch(err){b.textContent='MIDI 使用不可';document.getElementById('midiLine').textContent='この画面ではMIDIが許可されていません（GitHub Pages等で開くと使えます）';}
};

window.MTN_KEY=()=>{let minor=false;try{if(TAB=='palette'){const t=palScale()[2];minor=!t.includes('M3')}}catch(_){}return{tonic:KEY,minor,from:'理論ノート'}};
window.getKey=()=>KEY;window.setKeyExt=k=>{if(k===KEY)return;KEY=k;ks.value=k;save();render();};
buildKb();render();
try{MTNDrag.bind(document.getElementById('main'),'[data-cl],[data-drag],[data-sym],[data-pseq]',el=>el.dataset.drag?JSON.parse(decodeURIComponent(el.dataset.drag)):el.dataset.pseq?JSON.parse(decodeURIComponent(el.dataset.pseq)):[el.dataset.cl||el.dataset.sym]);}catch(_){}
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{buildKb();drawKeys();},200)});
</script>
