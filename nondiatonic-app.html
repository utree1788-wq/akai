<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ダイアトニック外コード帖</title>
<link rel="manifest" href="nondiatonic.webmanifest">
<meta name="theme-color" content="#16150f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="外コード帖">
<link rel="apple-touch-icon" href="nondia-icon-192.png">
<link rel="icon" href="nondia-icon-192.png">
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#1d1b18;--mute:#7b746a;--line:#e6e1d8;--acc:#c2410c;--acc2:#1e40af;--chip:#f3efe8}
@media (prefers-color-scheme:dark){:root{--bg:#16150f;--card:#211f19;--ink:#efe9dd;--mute:#a39b8c;--line:#38342b;--acc:#fb923c;--acc2:#93c5fd;--chip:#2c2921}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.55}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px 8px}
h1{font-size:19px;margin:0 0 6px;letter-spacing:.04em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=search]{flex:1;min-width:140px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 10px;font-size:15px}
select,input[type=range]{accent-color:var(--acc)}select{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px}
.small{font-size:12px;color:var(--mute)}
#kb{display:flex;height:46px;margin-top:8px;position:relative;user-select:none}
.wk{flex:1;border:1px solid var(--line);background:#fff;border-radius:0 0 4px 4px;position:relative}
.bk{position:absolute;width:2.2%;height:28px;background:#222;border-radius:0 0 3px 3px;z-index:2}
.wk.on{background:#fdba74}.bk.on{background:var(--acc)}.wk.bs{background:#93c5fd}.bk.bs{background:#2563eb}
main{padding:10px 12px 80px;max-width:980px;margin:0 auto}
.cat{margin:16px 0 8px}.cat>summary{list-style:none;cursor:pointer;font-weight:800;font-size:17px;padding:8px 10px;border-left:5px solid var(--acc);background:var(--card);border-radius:6px;display:flex;justify-content:space-between;gap:8px}
.cat>summary::-webkit-details-marker{display:none}.cat>summary span{font-weight:400;font-size:12px;color:var(--mute);white-space:nowrap}
.cdesc{color:var(--mute);font-size:13px;margin:6px 4px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ch{display:flex;align-items:baseline;gap:8px}.nm{font-size:22px;font-weight:800}.dg{color:var(--acc2);font-weight:700}.ct{margin-left:auto;font-size:12px;color:var(--mute)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
button.p{border:none;background:var(--acc);color:#fff;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;font-size:13px}
button.p.s{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
button.p:active{transform:scale(.97)}
.flow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px;margin:6px 0}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:1px 7px;cursor:pointer}
.chip.me{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.chip.pl{outline:2px solid var(--acc2)}
.lbl{font-size:11px;color:var(--mute);margin-right:2px}
.ex{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px}
.ex .t{font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:6px;align-items:center}
.songs{font-size:11.5px;color:var(--mute);margin-top:6px}
.sel{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:12px}
.sel select{font-size:12px;padding:2px}
</style></head><body>

<div id="kb"></div></header>

function voice(c){const pcs=[...new Set(c.iv.map(i=>(c.r+i)%12))];let tones=pcs.length>4?pcs.filter(p=>p!==c.r):pcs;
 let best=null,bs=1e9;for(let base=52;base<=60;base++){const v=tones.map(p=>{let n=base+((p-base)%12+12)%12;return n}).sort((a,b)=>a-b);
  const sc=prevV?v.reduce((s,n,i)=>s+Math.abs(n-(prevV[i]??prevV[prevV.length-1])),0):Math.abs(v[0]-57)*2;
  const span=v[v.length-1]-v[0];const pen=span>14?20:0;if(sc+pen<bs){bs=sc+pen;best=v;}}
 prevV=best;let b=36+((c.bass-36)%12+12)%12;if(b>45)b-=12;return {top:best,bass:b};}
let ctx,master,rev;
function ac(){if(ctx)return;ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.7;
 const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
 rev=ctx.createConvolver();const len=ctx.sampleRate*1.8,buf=ctx.createBuffer(2,len,ctx.sampleRate);for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
 rev.buffer=buf;const rg=ctx.createGain();rg.gain.value=.22;rev.connect(rg);rg.connect(master);}
const mtof=m=>440*Math.pow(2,(m-69)/12);
const nodes=[];
function osc(t,f,type,end,det){const o=ctx.createOscillator();o.type=type;o.frequency.value=f;if(det)o.detune.value=det;o.start(t);o.stop(end);nodes.push(o);return o;}
function out(g){g.connect(master);g.connect(rev);}
function note(t,m,dur,vel,kind){const f=mtof(m),g=ctx.createGain(),lp=ctx.createBiquadFilter();lp.type='lowpass';const end=t+dur+1.5;
 if(kind==='piano'){lp.frequency.setValueAtTime(Math.min(9000,2200+f*5),t);lp.frequency.exponentialRampToValueAtTime(Math.max(500,f*2.2),t+1.3);
  osc(t,f,'triangle',end).connect(lp);const b=osc(t,f*2.002,'sine',end),gb=ctx.createGain();gb.gain.value=.35;b.connect(gb);gb.connect(lp);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09*vel,t+.004);g.gain.setTargetAtTime(.02*vel,t+.01,m<60?.9:.55);g.gain.setTargetAtTime(.0001,t+dur,.25);}
 else if(kind==='ep'){lp.frequency.value=2600;osc(t,f,'sine',end).connect(lp);const b=osc(t,f*3.5,'sine',end),gb=ctx.createGain();gb.gain.setValueAtTime(.25,t);gb.gain.setTargetAtTime(0,t,.08);b.connect(gb);gb.connect(lp);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11*vel,t+.006);g.gain.setTargetAtTime(.03*vel,t+.01,.7);g.gain.setTargetAtTime(.0001,t+dur,.2);}
 else if(kind==='organ'){lp.frequency.value=4000;[[1,1],[2,.6],[3,.35],[4,.2]].forEach(([h,a])=>{const o=osc(t,f*h,'sine',end),og=ctx.createGain();og.gain.value=a;o.connect(og);og.connect(lp);});
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.035*vel,t+.01);g.gain.setTargetAtTime(.0001,t+dur,.06);}
 else {lp.frequency.value=1800;[-8,0,8].forEach(d=>osc(t,f,'sawtooth',end,d).connect(lp));g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.018*vel,t+.25);g.gain.setTargetAtTime(.0001,t+dur,.4);}
 lp.connect(g);out(g);}
function bassN(t,m,dur){const f=mtof(m),g=ctx.createGain(),lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;
 osc(t,f,'triangle',t+dur+.4).connect(lp);osc(t,f,'sine',t+dur+.4).connect(g);lp.connect(g);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.008);g.gain.setTargetAtTime(.08,t+.02,.3);g.gain.setTargetAtTime(.0001,t+dur,.08);g.connect(master);}
let timers=[];
function stopAll(){timers.forEach(clearTimeout);timers=[];if(ctx){master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setValueAtTime(master.gain.value,ctx.currentTime);master.gain.linearRampToValueAtTime(0,ctx.currentTime+.08);
 const old=master;setTimeout(()=>{try{old.disconnect()}catch(e){}},200);master=ctx.createGain();master.gain.value=.7;const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
 const rg=ctx.createGain();rg.gain.value=.22;rev.disconnect();rev.connect(rg);rg.connect(master);}
 document.querySelectorAll('.chip.pl').forEach(e=>e.classList.remove('pl'));kbShow([],null);}
function playSeq(syms,els){ac();if(ctx.state==='suspended')ctx.resume();stopAll();prevV=null;
 const kind=document.getElementById('snd').value,beat=60/+document.getElementById('bpm').value,dur=beat*2,arp=document.getElementById('arp').checked;
 let t=ctx.currentTime+.06;syms.forEach((s,i)=>{const c=parse(s);if(!c)return;const v=voice(c);
  bassN(t,v.bass,dur*.95);v.top.forEach((m,j)=>note(arp?t+j*beat/4:t+j*.012,m,dur*.95-(arp?j*beat/4:0),i===syms.length-1?.9:.8,kind));
  const ms=(t-ctx.currentTime)*1000;timers.push(setTimeout(()=>{document.querySelectorAll('.chip.pl').forEach(e=>e.classList.remove('pl'));if(els&&els[i])els[i].classList.add('pl');kbShow(v.top,v.bass);},ms));t+=dur;});
 timers.push(setTimeout(()=>{document.querySelectorAll('.chip.pl').forEach(e=>e.classList.remove('pl'));},(t-ctx.currentTime)*1000+300));}
/* keyboard */
const KLO=36,KHI=84;function buildKb(){const kb=document.getElementById('kb');let whites=[];for(let m=KLO;m<=KHI;m++)if(![1,3,6,8,10].includes(m%12))whites.push(m);
 kb.innerHTML=whites.map(m=>`<div class="wk" data-m="${m}"></div>`).join('');const w=100/whites.length;
 for(let m=KLO;m<=KHI;m++)if([1,3,6,8,10].includes(m%12)){const idx=whites.indexOf(m-1);const d=document.createElement('div');d.className='bk';d.dataset.m=m;d.style.left=`calc(${(idx+1)*w}% - 1.1%)`;kb.appendChild(d);}}
function kbShow(top,b){document.querySelectorAll('#kb [data-m]').forEach(e=>{const m=+e.dataset.m;e.classList.toggle('on',top.includes(m));e.classList.toggle('bs',m===b);});}
/* render */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function chipRow(list,me){return list.map(x=>`<span class="chip${x===me?' me':''}" data-c="${esc(x)}">${esc(x)}</span>`).join('<span>→</span>');}
function render(){const q=document.getElementById('q').value.trim().toLowerCase().replace(/#/g,'♯');const m=document.getElementById('m');const cats=DATA[KEY];let html='';
 html+=`<p class="small">${KEY==='C'?'Cメジャーに移調した'+DATA.nC+'曲':'Aマイナーに移調した'+DATA.nA+'曲'}から、キーの音階（C D E F G A B）の外の音を含むコードを集めました。▶を押すと音が出ます。チップ（コード名）を押すとそのコードだけ鳴ります。</p>`;
 cats.forEach((cat,ci)=>{const items=cat.items.filter(it=>!q||it.name.toLowerCase().includes(q)||it.deg.toLowerCase().includes(q)||it.songs.some(s=>s[0].toLowerCase().includes(q)));if(!items.length)return;
  html+=`<details class="cat" ${q||ci<2?'open':''}><summary>${esc(cat.cls)}<span>${items.length}種・${items.reduce((s,i)=>s+i.n,0)}回</span></summary><div class="cdesc">${esc(cat.desc)}</div><div class="grid">`;
  items.forEach((it,ii)=>{const id=ci+'_'+ii;const pv=it.prev[0],nx=it.next[0];const flow=[pv,it.name,nx].filter(Boolean);
   html+=`<div class="card" data-id="${id}"><div class="ch"><span class="nm">${esc(it.name)}</span><span class="dg">${esc(it.deg)}</span><span class="ct">${it.n}回</span></div>
   <div class="btns"><button class="p" data-play="${esc(JSON.stringify([it.name]))}">▶ コード</button><button class="p" data-flow="${id}">▶ よく出る流れ</button></div>
   <div class="flow" id="f${id}">${chipRow(flow,it.name)}</div>
   <div class="sel"><span class="lbl">前</span><select data-pv="${id}">${['（なし）',...it.prev].map(x=>`<option${x===pv?' selected':''}>${esc(x)}</option>`).join('')}</select>
   <span class="lbl">後</span><select data-nx="${id}">${['（なし）',...it.next].map(x=>`<option${x===nx?' selected':''}>${esc(x)}</option>`).join('')}</select></div>`;
   it.ex.forEach((e,k)=>{html+=`<div class="ex"><div class="t"><span>${esc(e[0])}・${esc(e[2])}</span><button class="p s" data-ex="${id}_${k}">▶ 曲の中の流れ</button></div><div class="flow" id="e${id}_${k}">${chipRow(e[1],it.name)}</div></div>`;});
   const more=it.songs.length-4;html+=`<div class="songs">使われている曲：${it.songs.slice(0,8).map(s=>esc(s[0])+'('+s[1]+')').join('、')}${it.songs.length>8?' ほか'+(it.songs.length-8)+'曲':''}</div></div>`;});
  html+='</div></details>';});
 m.innerHTML=html||'<p>見つかりませんでした。</p>';}
document.addEventListener('click',e=>{const t=e.target;
 if(t.classList.contains('tab')){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b===t));KEY=t.dataset.k;render();return;}
 if(t.dataset.play){playSeq(JSON.parse(t.dataset.play));return;}
 if(t.dataset.flow){const box=document.getElementById('f'+t.dataset.flow);const ch=[...box.querySelectorAll('.chip')];playSeq(ch.map(c=>c.dataset.c),ch);return;}
 if(t.dataset.ex){const box=document.getElementById('e'+t.dataset.ex);const ch=[...box.querySelectorAll('.chip')];playSeq(ch.map(c=>c.dataset.c),ch);return;}
 if(t.classList.contains('chip')){playSeq([t.dataset.c],[t]);return;}
 if(t.id==='stop'){stopAll();}});
document.addEventListener('change',e=>{const t=e.target;const id=t.dataset.pv||t.dataset.nx;if(!id)return;const card=document.querySelector(`.card[data-id="${id}"]`);
 const me=card.querySelector('.nm').textContent;const pv=card.querySelector('[data-pv]').value,nx=card.querySelector('[data-nx]').value;
 const flow=[pv,me,nx].filter(x=>x&&x!=='（なし）');document.getElementById('f'+id).innerHTML=chipRow(flow,me);});
document.getElementById('q').addEventListener('input',render);
document.getElementById('bpm').addEventListener('input',e=>document.getElementById('bv').textContent=e.target.value);
buildKb();render();
</script></body></html>
