<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>哲学用語ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f2; --paper:#fff; --ink:#2a2530; --mute:#7c7584; --line:#e8e1d8;
  --pink:#d63a86; --pinkSoft:#fbe3ef; --anc:#c2622d; --mod:#3a7bb8; --con:#7b4fc0; --jp:#2f8f6d;
  --mincho:"Shippori Mincho",serif; --sans:"Zen Kaku Gothic New",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.8;-webkit-text-size-adjust:100%}
button{font:inherit}
header{padding:28px 18px 6px;max-width:900px;margin:0 auto}
h1{font-family:var(--mincho);font-weight:800;font-size:1.65rem;margin:0 0 2px;letter-spacing:.05em}
h1 em{font-style:normal;color:var(--pink)}
.sub{color:var(--mute);font-size:.86rem;margin:0}
.sticky{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 86%,rgba(250,247,242,0));padding:10px 18px 14px}
.wrap{max-width:900px;margin:0 auto}
.search{display:flex;gap:8px;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.search:focus-within{border-color:var(--pink)}
.search svg{flex:none;opacity:.5}
.search input{flex:1;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:16px}
.search button{background:none;border:0;color:var(--mute);font-size:1.1rem;cursor:pointer;display:none}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:9px;padding-bottom:2px}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:3px 12px;font-size:.82rem;cursor:pointer;white-space:nowrap}
.chip .n{opacity:.55;margin-left:4px;font-size:.75em}
.chip.on{color:#fff;border-color:transparent;font-weight:700}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:.8rem;color:var(--mute)}
.meta button{background:none;border:0;color:var(--pink);cursor:pointer;padding:0}
main{max-width:900px;margin:0 auto;padding:0 18px 70px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.toc a{font-size:.8rem;color:var(--ink);text-decoration:none;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:2px 9px}
.toc a:hover{border-color:var(--pink)}
h2{font-family:var(--mincho);font-size:1.05rem;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:6px;height:1.1em;border-radius:3px;background:currentColor}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.term{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;scroll-margin-top:190px;transition:box-shadow .3s}
.term.flash{box-shadow:0 0 0 3px var(--pink)}
.thead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tname{font-family:var(--mincho);font-weight:800;font-size:1.35rem;line-height:1.35;margin:0}
.yomi{font-size:.72rem;color:var(--mute);letter-spacing:.08em}
.who{flex:none;text-align:right;font-size:.78rem;font-weight:700}
.who span{display:block;font-weight:400;color:var(--mute);font-size:.7rem}
.one{margin:10px 0 0;padding:8px 12px;background:var(--pinkSoft);border-radius:10px;font-weight:700;font-size:.92rem;color:#7a1f4c}
dl{margin:10px 0 0;display:grid;grid-template-columns:4.2em 1fr;gap:2px 8px;font-size:.78rem}
dt{color:var(--mute)}
dd{margin:0}
.exp{font-size:.9rem;margin:10px 0 0}
ul.pts{margin:8px 0 0;padding-left:1.2em;font-size:.84rem}
ul.pts li{margin:2px 0}
ul.pts b{color:var(--pink)}
.meta2{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.mt{font-family:var(--mincho);font-size:.98rem}
.mt small,.ly small{display:block;font-family:var(--sans);font-size:.68rem;color:var(--mute)}
.ly{font-family:var(--mincho);font-size:.92rem;white-space:pre-wrap;color:#5a4a60}
.rel{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.rel small{font-size:.68rem;color:var(--mute)}
.rel a{font-size:.76rem;color:var(--pink);background:var(--pinkSoft);border-radius:6px;padding:0 8px;text-decoration:none}
.pg{font-size:.68rem;color:var(--mute);margin-top:8px;text-align:right}
mark{background:#ffe08a;color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--mute);padding:40px 0;display:none}
.note{color:var(--mute);font-size:.72rem;max-width:900px;margin:0 auto;padding:0 18px 40px}
</style>
</head>
<body>
<header>
  <h1>哲学用語<em>ノート</em></h1>
  <p class="sub">ロゴスから無分別智まで。用語ごとに「ひとことで」「解説」「比喩」をまとめた自分用の辞典。</p>
</header>

<div class="sticky"><div class="wrap">
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="検索（例：愛、ニーチェ、監視、夕日）" autocomplete="off">
    <button id="clr" aria-label="クリア">×</button>
  </div>
  <div class="row" id="eraRow"></div>
  <div class="row" id="whoRow"></div>
  <div class="meta"><span id="count"></span><button id="reset">絞り込み解除</button></div>
</div></div>

<main>
  <div class="toc" id="toc"></div>
  <div id="list"></div>
  <div class="empty" id="empty">該当する用語がありません</div>
</main>
<p class="note">※スキャンした本の内容をもとに、要点を自分の言葉でまとめ直したものです（ページ番号は元の本の掲載ページ）。比喩と歌詞の種はこのノートのための創作です。</p>

<script>

 {id:"anc",label:"西洋哲学・古代",color:"var(--anc)"},
 {id:"mod",label:"西洋哲学・近代",color:"var(--mod)"},

const T=[
 {id:"logos",era:"anc",name:"ロゴス",who:"タレスなど",book:"古代ギリシャの自然哲学",one:"世界を神話ではなく、筋道の通った理屈で理解しようとする考え方。",
  dl:[["意味","言葉・論理・秩序・理性（ギリシャ語）"],["語源","「拾い集める」という意味の動詞 legein"],["対義語","ミュトス（神話）、パトス（情念）"]],
  exp:"雷も季節の移り変わりも、それまでは神々の物語で説明されていた。古代ギリシャの哲学者たちはそれをやめ、自然を合理的に説明しようとした。この姿勢がロゴスで、哲学の出発点になった。",
  pts:[],meta:"神話の絵本を閉じて、設計図を広げること",lyric:"神様のせいにしてた雷を\n今夜は数式で数えてみる",rel:["episteme-p"],pg:"P031"},
 {id:"psyche",era:"anc",name:"魂への配慮",yomi:"プシュケー",who:"ソクラテス",book:"プラトン『ソクラテスの弁明』",one:"お金や名声より、まず自分の魂をよくすることに気を配れ。",
  dl:[["意味","幸福のためには、優れた魂を持つことが必要だということ"],["メモ","ソクラテスにとって「善く生きる」ことと同じ意味"]],
  exp:"富・健康・名誉だけでは心の平安は得られない。それらは優れた魂によって正しく使われたときにだけ、幸せを生む。ところが当時のアテナイの人々は、財産や評判ばかりに関心を向け、いちばん大切な魂をおろそかにしていた。ソクラテスはそれを批判した。",
  pts:["<b>主知主義</b>：何が善で何が悪か、何が美しいかを正しく知れば、魂は優れたものになる。だから「知ること」を最も大切にする考え方。"],
  meta:"宝石箱は毎日磨くのに、中に住む自分は埃をかぶったまま",lyric:"拍手の数を数えてた\n心の声は聞こえないまま",rel:["episteme-p","mesotes"],pg:"P046–047"},
 {id:"doxa",era:"anc",name:"ドクサ",who:"プラトン",book:"『国家』ほか",one:"五感からの情報を、考えずにそのまま信じ込んだ思い込み。",
  dl:[["意味","思い込み・臆見（おっけん）"],["対義語","エピステーメー（プラトンの場合）"],["メモ","ドクサとエピステーメーの区別は、パルメニデスにも見られる"]],

  pts:[],meta:"理性が眠っているあいだに、五感が勝手に書いた日記",lyric:"見たままを信じてた\n君の笑顔の裏までは",rel:["episteme-p"],pg:"P050"},
 {id:"episteme-p",era:"anc",name:"エピステーメー",yomi:"プラトン",who:"プラトン",book:"『国家』ほか",one:"理性で吟味して得られる、誰もが納得できる客観的な知識。",

  exp:"思い込み（ドクサ）を理性で吟味し、退けた先に手に入るのがエピステーメー。プラトンは、善く生きるにはドクサを捨ててエピステーメーを得る必要があると考えた。正しい知識があれば、根拠のない恐れにも振り回されなくなる（「人魂」も正体がわかれば怖くない）。",
  pts:[],meta:"思い込みの雲に虫眼鏡を向けると、ただの影だったとわかる",lyric:"怖かったのは闇じゃなくて\n闇の名前を知らなかったこと",rel:["doxa","episteme-f","psyche"],pg:"P051"},
 {id:"eros-p",era:"anc",name:"エロス",yomi:"プラトン",who:"プラトン",book:"『パイドロス』",one:"魂が、かつて見た「美そのもの」を懐かしんで求める純粋な愛。",

 {id:"mesotes",era:"anc",name:"中庸",yomi:"ちゅうよう",who:"アリストテレス",book:"『ニコマコス倫理学』",one:"やりすぎでも足りなさすぎでもない、ちょうどいいところを選ぶ精神。",

  pts:["無謀 ↔ <b>勇気</b> ↔ 臆病","虚栄 ↔ <b>誇り</b> ↔ 卑屈","鈍感 ↔ <b>おおらか</b> ↔ 神経質"],
  meta:"綱渡りの真ん中は、立ち止まっていては保てない",lyric:"強がりと弱音のあいだに\nちょうどいい声を探してる",rel:["psyche"],pg:"P072"},
 {id:"nihilism",era:"mod",name:"ニヒリズム",who:"ニーチェ",book:"『力への意志』",one:"それまで信じてきた価値が崩れ、生きる目的を見失った状態（虚無主義）。",
  dl:[["意味","既存の価値を否定する立場"],["関連","力への意志"],["メモ","日本語では「虚無主義」などと訳される"]],
  exp:"産業革命以降、工業化は公害や過酷な労働などの問題を生み、「文明の進歩は人を幸せにする」という信念が揺らいだ。さらに近代の合理性は、道徳の土台だったキリスト教の力を弱めていく。心のよりどころを失った時代を、ニーチェは「神は死んだ」と宣言して言い表した。",
  pts:["<b>受動的ニヒリズム</b>：価値の崩壊に打ちひしがれ、「もうどうでもいい」となる。","<b>能動的ニヒリズム</b>：これまでの価値が間違っていたなら、自分で新しい価値を作ろうとする。"],
  meta:"地図が燃えた夜。座り込むか、星を見て歩き出すか",lyric:"正解が全部燃えたなら\n今日から僕が決めていい",rel:["eternal"],pg:"P212–213"},
 {id:"eternal",era:"mod",name:"永劫回帰",yomi:"えいごうかいき",who:"ニーチェ",book:"『ツァラトゥストラ』",one:"世界はまったく同じ形で、永遠に何度でも繰り返される。",
  dl:[["関連","ニヒリズム、超人"],["メモ","スイスのシルヴァプラーナ湖畔を散歩中に着想したといわれる"]],
  exp:"いくつかの石を地面にばらまく行為を無限に繰り返せば、いつか同じ配置が何度も現れる。世界も有限の原子の組み合わせにすぎず、時間が無限に続くなら、「今とまったく同じ世界」は過去にも未来にも繰り返し現れるはず。歴史はゴールに向かってまっすぐ進むのではなく、円を描いて回り続ける。そこにあるのは進歩ではなく、繰り返される変化だけ。",
  pts:["キリスト教やヘーゲルの歴史観：目的に向かって進歩する直線。","ニーチェの歴史観：円環運動の中でただ変化する。"],

 {id:"id-ego",era:"mod",name:"エス｜自我｜超自我",yomi:"イド／エゴ／スーパーエゴ",who:"フロイト",book:"『自我とエス』",one:"心は「欲望」「ブレーキ」「調整役」の三つがせめぎ合ってできている。",

 {id:"eros-f",era:"mod",name:"エロス｜タナトス",yomi:"フロイト",who:"フロイト",book:"『快感原則の彼岸』",one:"人の中には「生きようとする力」と「無に還ろうとする力」が同居している。",

  exp:"エスは快楽だけを求める「快感原則」に、自我と超自我は社会で生きるための「現実原則」に従う。晩年のフロイトは、それだけでは説明できない行動があるとして、破壊や死、何もない状態へ向かう欲動を考えた。",
  pts:["<b>エロス（生の欲動）</b>：性や自己保存など、生命を維持・発展させようとする欲動。","<b>タナトス（死の欲動）</b>：破壊や死、何もない状態へ向かう欲動。"],

 {id:"episteme-f",era:"con",name:"エピステーメー",yomi:"フーコー",who:"フーコー",book:"『言葉と物』",one:"時代ごとにまったく異なる「ものの見方の枠組み」。",

  meta:"時代ごとに掛け替えられる、本人には見えない眼鏡",lyric:"百年後の誰かが笑うかな\n僕らの当たり前を",rel:["episteme-p","panopticon"],pg:"P352–353"},
 {id:"panopticon",era:"con",name:"パノプティコン",who:"フーコー",book:"『監獄の誕生』",one:"いつも見られている気がして、自分から規律に従ってしまう仕組み。",
  dl:[["関連","生の権力"],["メモ","功利主義の祖ベンサムが考案した監獄の設計。フーコーが権力論として読み解いた"]],
  exp:"円形に並んだ独房の中央に監視塔がある。塔からは囚人が見えるが、囚人からは監視者が見えない。そのため囚人は、実際に見られていなくても常に監視を意識し、やがて自分から規律を守るようになる。フーコーは、民主主義が生み出した権力（生の権力）が私たちの常識を形づくる様子を、この監獄にたとえた。",

  pts:["主観と客観、心と物の区別は、思考や言葉があとから作り出したもの。","主客が分かれる前のこの経験こそが、唯一の実在だと西田は考えた。"],

 {id:"iki",era:"jp",name:"いき",who:"九鬼周造",book:"『「いき」の構造』",one:"近づきながらも一つにならない、張りのある色気の美学。",

 {id:"mufunbetsu",era:"jp",name:"無分別智",yomi:"むふんべつち",who:"鈴木大拙",book:"『日本的霊性』",one:"言葉で区別する前の「すべてがひとつ」の世界を、直観でつかむ智慧。",

const state={q:"",era:null,who:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip=s=>String(s).replace(/<[^>]+>/g,"");
function hl(s,raw){const t=raw?s:esc(s);if(!state.q)return t;const q=esc(state.q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return t.replace(/(<[^>]+>)|([^<]+)/g,(m,tag,txt)=>tag?tag:txt.replace(new RegExp(q,"gi"),x=>`<mark>${x}</mark>`));}
const byId=Object.fromEntries(T.map(t=>[t.id,t]));
const label=t=>t.name+(t.yomi&&/^(プラトン|フロイト|フーコー)$/.test(t.yomi)?`（${t.yomi}）`:"");
const hay=t=>[t.name,t.yomi,t.who,t.book,t.one,t.exp,t.meta,t.lyric,...t.dl.flat(),...t.pts.map(strip)].join(" ").toLowerCase();
const match=t=>(!state.era||t.era===state.era)&&(!state.who||t.who===state.who)&&(!state.q||hay(t).includes(state.q.toLowerCase()));

function chips(){
  const er=$("#eraRow"),wr=$("#whoRow"); er.innerHTML="";wr.innerHTML="";
  ERAS.forEach(e=>{const b=document.createElement("button");const on=state.era===e.id;b.className="chip"+(on?" on":"");if(on)b.style.background=e.color;b.style.borderColor=on?"transparent":"";b.innerHTML=esc(e.label)+`<span class="n">${T.filter(t=>t.era===e.id).length}</span>`;b.onclick=()=>{state.era=on?null:e.id;state.who=null;render()};er.appendChild(b)});
  const whos=[...new Set(T.filter(t=>!state.era||t.era===state.era).map(t=>t.who))];
  whos.forEach(w=>{const b=document.createElement("button");const on=state.who===w;b.className="chip"+(on?" on":"");if(on)b.style.background="var(--pink)";b.textContent=w;b.onclick=()=>{state.who=on?null:w;render()};wr.appendChild(b)});
}
function render(){
  chips();
  $("#clr").style.display=state.q?"block":"none";
  const filtered=!!(state.q||state.era||state.who);
  $("#reset").style.display=filtered?"inline":"none";
  const rows=T.filter(match);
  $("#toc").innerHTML=rows.map(t=>`<a href="#${t.id}" data-jump="${t.id}">${esc(label(t))}</a>`).join("");
  let html="";
  for(const e of ERAS){
    const g=rows.filter(t=>t.era===e.id); if(!g.length) continue;
    html+=`<h2 style="color:${e.color}">${e.label}</h2><div class="grid">`+g.map(t=>`<article class="term" id="${t.id}">
      <div class="thead"><div>${t.yomi?`<div class="yomi">${hl(t.yomi)}</div>`:""}<h3 class="tname">${hl(t.name)}</h3></div><div class="who">${hl(t.who)}<span>${hl(t.book)}</span></div></div>
      <p class="one">${hl(t.one)}</p>
      <dl>${t.dl.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${hl(b)}</dd>`).join("")}</dl>
      <p class="exp">${hl(t.exp)}</p>
      ${t.pts.length?`<ul class="pts">${t.pts.map(p=>`<li>${hl(p,true)}</li>`).join("")}</ul>`:""}
      <div class="meta2"><div class="mt"><small>比喩にすると</small>${hl(t.meta)}</div><div class="ly"><small>歌詞の種</small>${hl(t.lyric)}</div></div>
      ${t.rel.length?`<div class="rel"><small>関連</small>${t.rel.map(r=>`<a href="#${r}" data-jump="${r}">${esc(label(byId[r]))}</a>`).join("")}</div>`:""}
      <div class="pg">${esc(t.pg)}</div></article>`).join("")+`</div>`;
  }
  $("#list").innerHTML=html;
  $("#empty").style.display=html?"none":"block";
  $("#count").textContent=filtered?`${rows.length} 件`:`全 ${T.length} 語`;
}
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-jump]"); if(!a) return; e.preventDefault();
  const id=a.dataset.jump;
  if(!document.getElementById(id)){ state.q="";state.era=null;state.who=null;$("#q").value="";render(); }
  const el=document.getElementById(id); el.scrollIntoView({behavior:"smooth",block:"start"});
  el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"),1400);
});
$("#q").addEventListener("input",e=>{state.q=e.target.value.trim();render()});
$("#clr").onclick=()=>{$("#q").value="";state.q="";render()};
$("#reset").onclick=()=>{$("#q").value="";Object.assign(state,{q:"",era:null,who:null});render()};
render();
</script>
