<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ポケットDTM Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=VT323&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0218;--bg2:#12052a;--panel:#170733;--panel2:#1d0a3d;--line:#52266f;--txt:#f6eaff;--dim:#b9a3d9;--acc:#ff4fd8;--acc2:#8b5cff;--grn:#05ffa1;--red:#ff4f7b;--lcd:#05010d;--lcdtxt:#3ff3ff;--cy:#3ff3ff;--yl:#ffe66d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:"Zen Kaku Gothic New",-apple-system,"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:14px;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
button{font:inherit;font-weight:700;color:var(--txt);background:linear-gradient(#0b0512,#12071e);border:1.5px solid var(--line);border-radius:12px;padding:5px 10px;cursor:pointer;min-height:32px;box-shadow:0 2px 0 #240f3c}
button:active{transform:translateY(1px);box-shadow:0 1px 0 #240f3c}
button.on{background:linear-gradient(#ff52bd,#ff52bc);color:#fff;border-color:#ff46b8;box-shadow:0 2px 0 #ff1faa}
select,input[type=number],input[type=text]{font:inherit;background:#0b0512;color:var(--txt);border:1.5px solid var(--line);border-radius:12px;padding:4px 8px;min-height:32px}
input[type=range]{accent-color:var(--acc)}
/* transport */
#top{display:flex;align-items:center;gap:5px;padding:7px 8px 6px;background:linear-gradient(90deg,#1c0c2e,#190b2a 55%,#210e36);border-bottom:1.5px solid var(--line)}
#top>button{width:34px;padding:3px 0;flex:none;font-size:14px}
#lcd{min-width:96px;background:#0b0512;border:1.5px solid var(--line);border-radius:12px;padding:2px 10px;font-family:ui-monospace,Menlo,monospace;color:var(--lcdtxt);min-width:0;flex:1 1 auto;max-width:300px;cursor:pointer;line-height:1.15;box-shadow:inset 0 1px 4px #250f3e;overflow:hidden}
#lcdPos{font-size:16px;font-weight:800;letter-spacing:.04em;white-space:nowrap}
#lcdSub{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#playBtn{width:44px!important;color:#1affa2!important;font-size:16px!important}
#playBtn.playing{background:linear-gradient(#52ffb4,#1fffa2);color:#fff!important;border-color:#1affa4}
#recBtn{color:var(--red)!important}
#recBtn.on{background:linear-gradient(#341656,#ff52b0);color:#fff!important}
#modeSeg{display:flex;flex:none}
#modeSeg button{min-height:32px;padding:0 7px;font-size:11px;font-weight:800;border-radius:0}
#modeSeg button:first-child{border-radius:12px 0 0 12px}#modeSeg button:last-child{border-radius:0 12px 12px 0}
#masterMeter{width:8px;height:32px;flex:none;border-radius:4px;background:#180a28}
/* tabs */
#tabs{display:flex;gap:4px;padding:5px 6px 0;background:var(--bg2)}
#tabs button{flex:1;border-radius:14px 14px 0 0;border-bottom:none;box-shadow:none;background:#0e0618;color:var(--dim);font-size:12px;padding:6px 2px;min-height:36px;display:flex;align-items:center;justify-content:center;gap:4px}
#tabs button .ti{font-size:14px}
#tabs button.on{color:#fff;background:linear-gradient(#341656,#ff52bc);border-color:#ff46b8}
#ctx{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:6px 8px;background:#0b0512;border-bottom:1.5px solid var(--line);min-height:44px}
#ctx:empty{display:none}
#ctx .lab{font-size:11px;color:var(--dim)}
#ctx select{max-width:170px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:0 4px;font-weight:700}
.pill .dot{width:10px;height:10px;border-radius:50%}
#views{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none}
#songWrap{position:absolute;inset:0;overflow-y:auto;padding:8px 8px 40px;-webkit-overflow-scrolling:touch}
.sgHead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;background:#0b0512;border:1.5px solid var(--line);border-radius:16px;padding:8px 12px;margin-bottom:8px}
.sgHead b{font-size:16px}.sgHead .st{font-size:12px;color:var(--dim);font-weight:700}
.sgLeg{display:flex;flex-wrap:wrap;gap:4px 10px;width:100%;font-size:11px;font-weight:700;color:var(--dim)}
.sgLeg span{display:inline-flex;align-items:center;gap:4px;cursor:pointer}.sgLeg span.mute{opacity:.35;text-decoration:line-through}
.sgLeg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sgRow{display:grid;gap:4px;margin-bottom:4px}
.sgBar{position:relative;background:#0b0512;border:1.5px solid var(--line);border-radius:12px;padding:3px 5px 4px;min-width:0;cursor:pointer;overflow:hidden}
.sgBar.empty{background:#0e0618;border-style:dashed}
.sgBar.now{border-color:var(--acc);box-shadow:0 0 0 2px #ff6fae55}
.sgBar.cur{outline:2px dashed var(--acc2);outline-offset:-2px}
.sgBar.loop{background:linear-gradient(#12071d,#0b0512)}
.sgTop{display:flex;align-items:center;gap:4px;min-height:18px}
.sgNo{font-size:10px;font-weight:800;color:var(--dim);font-family:ui-monospace,Menlo,monospace}
.sgSec{font-size:10px;font-weight:800;color:#fff;background:var(--acc2);border-radius:8px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%}
.sgSec.add{background:none;color:#e3c3d6;border:1px dashed #291144}
.sgCh{font-size:13px;font-weight:800;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:17px;display:flex;gap:6px}
.sgCh span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.sgCh span+span{color:#bfa1d9;font-size:11px;align-self:center}
.sgBar canvas{display:block;width:100%;height:var(--sgH,36px);border-radius:6px;background:#0d0616}
.sgSecStart{border-left:4px solid var(--acc2)}

.view.on{display:block}
.scroller{position:absolute;inset:0;overflow:auto;background:#0e0617}
.spacer{position:relative}
.scroller canvas{position:sticky;left:0;top:0;display:block;touch-action:pan-x pan-y}
#tools{display:flex;flex-wrap:wrap;gap:5px;padding:6px 8px calc(7px + env(safe-area-inset-bottom));background:linear-gradient(#0b0512,#12071e);border-top:1.5px solid var(--line);align-items:center}
#tools:empty{display:none}
.seg{display:flex}.seg button{border-radius:0}.seg button:first-child{border-radius:12px 0 0 12px}.seg button:last-child{border-radius:0 12px 12px 0}
#tools select{max-width:120px}
.grow{flex:1}
/* chord bar */
#chordBar{background:linear-gradient(90deg,#10071b,#11071d);border-bottom:1.5px solid var(--line);padding:5px 8px;display:flex;flex-direction:column;gap:5px}
#chordBar.hidden{display:none}
.cb-row{display:flex;gap:5px;align-items:center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.cb-row::-webkit-scrollbar{display:none}
.cb-row select{min-height:30px;padding:2px 4px}
#chordIn{flex:1 1 150px;min-width:0;min-height:30px}
#chordBar .cb-row:first-child{flex-wrap:wrap}
.chip{flex:none;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:52px;min-height:40px;padding:2px 8px;border-radius:14px;background:linear-gradient(#0b0512,#150923);border:1.5px solid #2a1246;box-shadow:0 2px 0 #240f3c;cursor:grab;font-weight:800;color:var(--txt)}
.chip small{font-size:9px;color:var(--dim);font-weight:700}
.chip.c1{background:linear-gradient(#0b0512,#170a27)}.chip.c2{background:linear-gradient(#0b0512,#150923);border-color:#230f3a}.chip.c3{background:linear-gradient(#0b0512,#1b0b2c);border-color:#52ffb5}.chip.c4{background:linear-gradient(#0b0512,#1b0b2c);border-color:#ffc652}
.chip.prog{background:linear-gradient(#2a1246,#ff52bd);color:#fff;border-color:#ff46b8}
.chip.prog small{color:#fff}
.ghost{position:fixed;z-index:50;pointer-events:none;padding:6px 12px;border-radius:14px;background:#ff52bc;color:#fff;font-weight:800;box-shadow:0 6px 18px #ff6fae66;transform:translate(-50%,-130%);white-space:nowrap;font-size:13px}
.ghost small{display:block;font-size:10px;font-weight:700;opacity:.9}
.cb-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.cb-tabs::-webkit-scrollbar{display:none}
.cb-tabs button{flex:none;min-height:28px;padding:2px 10px;font-size:11px;border-radius:20px}
.dim{color:var(--dim)}
#cbInfo{font-size:11px;line-height:1.5;background:#0b0512;border:1.5px dashed #2a1246;border-radius:12px;padding:5px 9px;max-height:64px;overflow-y:auto}
#cbInfo b{color:#ff26ae}
#cbInfo .nt{color:#7d39ff;font-weight:700;white-space:nowrap}
.chip.fT{background:linear-gradient(#0b0512,#170a27);border-color:#2a1246}
.chip.fSD{background:linear-gradient(#0b0512,#1b0b2c);border-color:#52ffb5}
.chip.fD{background:linear-gradient(#0b0512,#1d0c30);border-color:#ffc652}
.chip.fA{background:linear-gradient(#0b0512,#150923);border-color:#230f3a}
.chip.fB{background:linear-gradient(#0b0512,#150923);border-color:#281042}
.chip.prog{min-width:96px}
/* mastering */
#v-master{overflow:auto;background:#0e0617}
#masterWrap{padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;max-width:1200px}
.mcard{background:#0b0512;border:1.5px solid var(--line);border-radius:18px;padding:8px 12px 10px}
.mcard h3{margin:2px 0 6px;font-size:13px;color:#ff26ae;display:flex;align-items:center;gap:6px}
.mcard h3 .mtog{margin-left:auto;min-height:26px;padding:0 12px;font-size:11px}
.mtop{grid-column:1/-1}
.mbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.mbar select{flex:1;min-width:150px}
#mMeter{width:100%;height:130px;display:block;border-radius:12px;border:1.5px solid var(--line)}
.mread{font-size:11px;color:var(--dim);margin-top:4px}
.mread b{color:#ff26ae}
.ib{min-height:0!important;width:20px;height:20px;padding:0!important;border-radius:50%!important;font-size:11px!important;line-height:1;color:#7d39ff!important;background:#12081f!important;border:1px solid #1f0d34!important;box-shadow:none!important;vertical-align:middle;flex:none}
.infobox{display:none;font-size:11.5px;line-height:1.6;color:#f2dffb;background:#0f0618;border-left:3px solid #341656;border-radius:8px;padding:6px 9px;margin:2px 0 8px}
.infobox.open{display:block}
.row label{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
/* step sequencer / drum editor */
#v-step{background:#0e0617}
#v-step.on{display:flex;flex-direction:column}
#stepScroll{flex:1;min-height:0;overflow:auto}
#stepWrap{padding:8px 8px 14px;min-width:max-content}
#stepPanel{flex:none;max-height:36%;overflow:auto;background:#0b0512;border-top:1.5px solid var(--line);padding:6px 10px 12px}
#stepPanel:empty{display:none}
.srow{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.sname{width:100px;flex:none;min-height:30px;font-size:11px;text-align:left;display:grid;grid-template-columns:8px 1fr;column-gap:4px;align-items:center;align-content:center;padding:0 6px;position:sticky;left:0;z-index:3;white-space:nowrap;overflow:hidden;line-height:1.1}
.sname .led{grid-row:1/3}
.sname .ab{font-size:8px;color:var(--dim);font-weight:800}
.sname .led{width:7px;height:7px;border-radius:50%;background:#240f3c;flex:none}
.sname .led.hit{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.srow.rsel .sname{background:linear-gradient(#180a27,#230f3a);border-color:#ff46b8}
.srow.rsel .stp{border-color:#2e134c}
.steps{display:flex;gap:3px}
.stp{position:relative;overflow:hidden;width:24px;height:30px;border-radius:7px;padding:0;min-height:0;border:1.5px solid #210e38;background:#12071e;box-shadow:none}
.stp.alt{background:#12081f;border-color:#1b0b2d}
.stp.bb{box-shadow:inset 3px 0 0 #ff52bf}
.stp.on{background:#0b0512;border-color:#ff46b8}
.stp .vb{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#2b1248,#ff52bc)}
.stp.gh .vb{background:#1d0c30}
.stp.ac .vb{background:linear-gradient(#ff52bc,#ff1aa9)}
.stp .vn{position:absolute;left:0;right:0;top:2px;font-size:8.5px;font-weight:800;color:#f2dffb;text-align:center;z-index:1}
.stp .am{position:absolute;right:1px;bottom:1px;font-size:9px;color:#fff;background:#7d39ff;border-radius:4px;padding:0 2px;z-index:1;line-height:1.25;font-style:normal}
.stp .om{position:absolute;bottom:2px;width:6px;height:6px;border-radius:50%;background:#1affa2;border:1px solid #0b0512;transform:translateX(-50%);z-index:2}
.stp.sel{outline:2px solid #7d39ff;outline-offset:-2px}
.stp.now{box-shadow:0 0 0 2px #341656}
.shead .sname,.lanehead .sname{min-height:0}
.lanehead{position:sticky;bottom:0;z-index:4;background:linear-gradient(transparent,#0e0617 18%);padding:8px 0 4px;margin:0}
.shead{position:sticky;top:0;z-index:4;background:#0e0617;padding-bottom:2px}
.ghostname{visibility:hidden;border:none!important;background:none!important;box-shadow:none!important}
.snum{width:24px;font-size:8px;color:var(--dim);white-space:nowrap;overflow:visible}
.lanelab{visibility:visible;display:flex;flex-direction:column;font-size:11px;color:#ff26ae;font-weight:800;line-height:1.2;background:#0e0617!important}
.lanelab small{font-size:10px;color:var(--dim)}
#lane{display:block;height:76px;border:1.5px solid var(--line);border-radius:8px;touch-action:none;cursor:ns-resize;background:#0b0512}
#stepModes button{display:flex;flex-direction:column;align-items:center;line-height:1;padding:3px 7px;min-height:38px;font-size:14px}
#stepModes small{font-size:8.5px;margin-top:2px}
.phead{display:flex;gap:6px;align-items:center;margin-bottom:2px;flex-wrap:wrap}
#stepPanel h4{font-size:12px;color:#ff26ae;margin:8px 0 4px;display:flex;align-items:center;gap:6px}
.pbtns{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0;align-items:center}
.pbtns button{min-height:28px;padding:2px 9px;font-size:11.5px}
#stepPanel .row{grid-template-columns:86px 1fr 54px;margin:4px 0}
#stepPanel .row input[type=number]{width:54px;min-height:28px;padding:2px 4px}
.dimtxt{font-size:11px;color:var(--dim);line-height:1.5}
.lab{font-size:11px;color:var(--dim)}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.tplb{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:46px;font-size:12px}
.tplb small{font-size:10px;color:var(--dim);font-weight:700}
.tplb.on small{color:#fff}
.shint{color:var(--dim);font-size:11.5px;margin:2px 0 8px;line-height:1.6;position:sticky;left:0;max-width:92vw}
/* mixer */
#v-mixer{overflow:auto;background:#0e0617}
#mixWrap{display:flex;gap:6px;padding:8px;min-width:max-content;min-height:100%}
.strip{width:80px;flex:none;background:linear-gradient(#0b0512,#11071d);border:1.5px solid var(--line);border-radius:16px;padding:6px 5px;display:flex;flex-direction:column;align-items:center;gap:5px}
.strip.master{background:linear-gradient(#0b0512,#140821);width:88px;border-color:#1f0d34}
.strip.sel{box-shadow:0 0 0 2px var(--acc)}
.strip .nm{font-size:11px;font-weight:800;width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:4px solid var(--c);border-radius:3px;padding-top:4px}
.strip button{width:100%;min-height:26px;padding:0;font-size:11px}
.strip .fxs{font-size:9px;color:var(--dim);min-height:24px;text-align:center;line-height:1.3}
.strip .fxs b{color:var(--acc);font-weight:800}
.fwrap{display:flex;gap:5px;align-items:stretch;height:180px}
.fwrap canvas{width:8px;height:180px;background:#180a28;border-radius:4px}
.fader{writing-mode:vertical-lr;direction:rtl;width:26px;height:180px;margin:0}
.strip .db{font-size:10px;color:var(--dim);font-family:ui-monospace,monospace}
.strip .panr{width:64px}
.ms{display:flex;gap:3px;width:100%}
.ms button.m.on{background:linear-gradient(#2b1248,#ff52b3);color:#fff;border-color:#ff50b2}
.ms button.s.on{background:linear-gradient(#52ffb6,#1fffa2);color:#fff;border-color:#1affa4}
/* sheet */
#sheet{position:fixed;inset:0;background:rgba(5,0,15,.65);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#sheet.hidden{display:none}
#sheetBody{background:#0b0512;width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:22px 22px 0 0;padding:14px 14px calc(20px + env(safe-area-inset-bottom));border:1.5px solid var(--line)}
#sheetBody h2{font-size:16px;margin:2px 0 12px;display:flex;align-items:center;gap:8px}
#sheetBody h2 .x{margin-left:auto}
#sheetBody h3{font-size:12px;color:var(--acc);margin:16px 0 8px;font-weight:800;letter-spacing:.05em}
.row{display:grid;grid-template-columns:100px 1fr 52px;gap:8px;align-items:center;margin:7px 0}
.row label{color:var(--dim);font-size:12px}
.row output{font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.row input[type=range]{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.btns button{flex:1 1 30%}
button.danger{color:#ff52b0}
button.primary{background:linear-gradient(#341656,#ff52bc);color:#fff;border-color:#ff46b8}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1.5px solid var(--line);border-radius:14px;padding:8px 10px}
.pitem .info{flex:1;min-width:0}
.pitem .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .info small{color:var(--dim)}
.help p{margin:6px 0;line-height:1.7}
.help b{color:var(--acc)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#5a2a45ee;color:#fff;padding:9px 16px;border-radius:16px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#fileIn{display:none}
@media (max-width:430px){ #homeBtn,#metBtn{display:none} #lcdSub{font-size:9px} #tabs button .ti{display:none} #tabs button{font-size:10.5px;padding:6px 1px} #tabs{gap:2px} }
@media (min-width:900px){ #tabs button{font-size:13px} .strip{width:88px} .fwrap,.fwrap canvas,.fader{height:240px} }
/* ===== landscape phone: side tab rail, single-row bars ===== */
@media (orientation:landscape) and (max-height:560px){
  #app{display:grid;grid-template-columns:74px minmax(0,1fr) auto;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"top top top" "tabs ctx chords" "tabs views chords" "tabs tools chords"}
  #top{grid-area:top;padding:4px calc(8px + env(safe-area-inset-right)) 4px calc(8px + env(safe-area-inset-left))}
  #top>button,#modeSeg button{min-height:30px}
  #lcd{max-width:240px;display:flex;align-items:baseline;gap:8px}
  #lcdPos{font-size:15px}
  #tabs{grid-area:tabs;flex-direction:column;padding:6px 4px 6px calc(4px + env(safe-area-inset-left));gap:5px;border-right:1.5px solid var(--line);overflow-y:auto}
  #tabs button{flex:1;flex-direction:column;gap:1px;border-radius:14px;border-bottom:1.5px solid var(--line);font-size:9px;padding:2px;min-height:0;line-height:1.1;word-break:keep-all}
  #tabs button .ti{display:block;font-size:18px}
  #ctx{grid-area:ctx;flex-wrap:nowrap;overflow-x:auto;min-height:38px;padding:3px 8px;scrollbar-width:none}
  #ctx>*{flex:none}
  #chordBar{grid-area:chords;width:216px;flex-direction:column;overflow-y:auto;padding:6px calc(6px + env(safe-area-inset-right)) 6px 6px;border-bottom:none;border-left:1.5px solid var(--line);background:linear-gradient(#10071b,#11071d)}
  #chordBar .cb-row{flex-wrap:wrap;overflow:visible}
  #chordBar .cb-row select{flex:1 1 40%;min-width:0}
  #chordIn{min-width:0;flex:1 1 100%}
  #cbPlay,#cbPlace{flex:1}
  #chips{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .chip{min-height:38px;min-width:0;padding:2px 4px}
  .chip.prog{grid-column:1/-1}
  #views{grid-area:views}

// scheduling: song (arrangement) and pattern
function scheduleSong(mix, a, b, tAt){
  for(const tr of P.tracks){
    if(!audible(tr)) continue;
    for(const c of tr.clips){
      const pat = patById(c.pat); if(!pat || pat.len <= 0) continue;
      const cl = clipLen(c), cEnd = c.t + cl;
      if(cEnd <= a || c.t >= b) continue;
      const k0 = Math.max(0, Math.floor((a - c.t) / pat.len)), k1 = Math.floor((Math.min(b, cEnd) - c.t) / pat.len);
      for(let k = k0; k <= k1; k++){
        const base = c.t + k * pat.len;
        for(const n of hitsOf(tr, pat)){
          const at = base + n.t;
          if(at >= a && at < b && at < cEnd){
            playNote(mix, tr, n.p, tAt(at + swingOff(n.base)), Math.min(n.d || 24, cEnd - at) * spt(), n.v);

      }
    }
  }

  const tr = trackById(pat.track); if(!tr) return;

function songNotes(tr){
  const out = [];
  for(const c of tr.clips){
    const pat = patById(c.pat); if(!pat || pat.len <= 0) continue;
    const cl = clipLen(c), hits = hitsOf(tr, pat);
    for(let base = c.t; base < c.t + cl; base += pat.len)
      for(const n of hits){ const at = base + n.t; if(at < c.t + cl) out.push({t:at, d:Math.min(n.d || 24, c.t + cl - at), p:n.p, v:n.v}); }
  }
  return out;
}
function contentEnd(){ let e = 0; P.tracks.forEach(t => t.clips.forEach(c => e = Math.max(e, c.t + clipLen(c)))); return e; }
function detectChord(notes, a, b){
  const w = Array(12).fill(0); let bass = null;
  for(const n of notes){ const s = Math.max(a, n.t), e = Math.min(b, n.t + n.d); if(e <= s) continue; w[n.p % 12] += (e - s) * (n.v / 100); if(bass === null || n.p < bass) bass = n.p; }
  const tot = w.reduce((x, y) => x + y, 0); if(tot <= 0) return null;
  const used = w.filter(x => x > tot * .04).length; if(used < 2) return null;
  const bpc = bass % 12; let best = null;
  for(let r = 0; r < 12; r++){
    if(w[r] <= 0) continue;
    for(const qn of SG_QUALS){
      const q = qualEntry(qn); if(!q) continue;
      const iv = [...new Set(q[1].map(x => x % 12))], set = new Set(iv.map(x => (r + x) % 12));
      let inW = 0, outW = 0, miss = 0;
      for(let pc = 0; pc < 12; pc++){ if(set.has(pc)) { inW += w[pc]; if(w[pc] <= tot * .02) miss++; } else outW += w[pc]; }
      const sc = inW - outW * 1.2 - miss * tot * .22 - iv.length * tot * .015 + (r === bpc ? tot * .12 : 0);
      if(!best || sc > best.sc) best = {sc, r, q, set};
    }
  }
  if(!best || best.sc < tot * .35) return null;
  let name = NOTE[best.r] + best.q[2];
  if(bpc !== best.r && best.set.has(bpc)) name += '/' + NOTE[bpc];
  return name;
}
function songKeyName(all){
  const h = Array(12).fill(0); all.forEach(n => h[n.p % 12] += n.d); let best = 0, bs = -1, minor = false;
  for(let k = 0; k < 12; k++){ const sc = [0,2,4,5,7,9,11].reduce((s, i) => s + h[(k + i) % 12], 0); if(sc > bs){ bs = sc; best = k; } }
  if(bs <= 0) return '—';
  const rel = (best + 9) % 12; if(h[rel] > h[best] * 1.15) minor = true;
  return minor ? NOTE[rel] + 'm（' + NOTE[best] + 'メジャーと同じ調号）' : NOTE[best] + 'メジャー';
}
let SGcache = null;

function drawSongBar(cv, b){
  const dpr = window.devicePixelRatio || 1, Wd = cv.clientWidth || 80, H = cv.clientHeight || 36;
  cv.width = Math.round(Wd * dpr); cv.height = Math.round(H * dpr); const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const bt = barT(), a = b * bt, e = a + bt, tn = SGcache.tn, rh = H / tn.length;
  for(let i = 1; i < P.beats; i++){ g.fillStyle = '#1a0b2b'; g.fillRect(Math.round(i / P.beats * Wd), 0, 1, H); }
  tn.forEach((x, i) => {
    const y = i * rh, tr = x.tr, act = x.tr.clips.some(c => c.t < e && c.t + clipLen(c) > a);
    if(!act) return;
    g.globalAlpha = audible(tr) ? 1 : .25;
    g.fillStyle = tr.color + '22'; g.fillRect(0, y + .5, Wd, rh - 1);
    const ns = x.notes.filter(n => n.t < e && n.t + n.d > a); if(!ns.length) return;
    g.fillStyle = tr.color;
    if(tr.kind === 'drum'){
      ns.forEach(n => { const nx = (n.t - a) / bt * Wd; g.globalAlpha = (audible(tr) ? 1 : .25) * (.35 + n.v / 127 * .65); g.fillRect(nx, y + rh * .15, Math.max(1.5, Wd / 64), rh * .7); });
    } else {
      let lo = 127, hi = 0; x.notes.forEach(n => { lo = Math.min(lo, n.p); hi = Math.max(hi, n.p); }); const span = Math.max(6, hi - lo);

}

const TICK480 = 5;                     // UI shows ticks at 480 PPQ (internal 96 PPQ)
const FLAM_G = 4, RUFF_G = 3;          // grace-note gaps (internal ticks)
const CORE_DRUMS = [36,38,37,39,42,44,46,48,45,41,49,51];
const DIVS = [[24,'16分'],[32,'8分3連'],[16,'16分3連'],[12,'32分']];

const stepT = p => p.div || 24;
// expand one drum pattern into actual hits (flam / ruff / roll / location offset)
function drumHits(pat){
  const out = [], len = pat.len;
  for(const n of pat.notes){
    if(n.t >= len) continue;
    const t0 = n.t + (n.off || 0), base = n.t;
    if(n.art === 'flam') out.push({t:t0 - FLAM_G, p:n.p, v:Math.max(1, Math.round(n.v * .42)), base});
    if(n.art === 'ruff'){ out.push({t:t0 - RUFF_G * 2, p:n.p, v:Math.max(1, Math.round(n.v * .38)), base}); out.push({t:t0 - RUFF_G, p:n.p, v:Math.max(1, Math.round(n.v * .48)), base}); }
    if(n.art === 'roll'){
      const L = Math.max(6, n.d || 24);
      for(let k = 0; k * 6 < L; k++) out.push({t:t0 + k * 6, p:n.p, v:clamp(Math.round(k === 0 ? n.v : n.v * (.72 + (k % 2 ? -.05 : .05))), 1, 127), base});
    } else out.push({t:t0, p:n.p, v:n.v, base});
  }
  out.forEach(h => { if(h.t < 0) h.t += len; if(h.t >= len) h.t -= len; });
  return out;
}
function hitsOf(tr, pat){ return tr.kind === 'drum' ? drumHits(pat) : pat.notes.filter(n => n.t < pat.len).map(n => ({t:n.t, p:n.p, v:n.v, d:n.d, base:n.t})); }

function tplNotes(tp){
  const st = tp.div, out = [];
  for(const [k, str] of Object.entries(tp.r)){
    const p = TPL_ROW[k];
    [...str].forEach((ch, i) => { if(ch === '.') return; const n = {t:i * st, d:st, p, v:TPL_VEL[ch] || 100}; if(TPL_ART[ch]) n.art = TPL_ART[ch]; if(tp.off && tp.off[k]) n.off = tp.off[k] / TICK480; out.push(n); });
  }
  const steps = Math.max(...Object.values(tp.r).map(s => s.length));
  return {notes:out, len:Math.ceil(steps * st / barT()) * barT()};
}

function applyAccent(ns, k){
  const S = ST.strong, W = ST.weak, M = Math.round((S + W) / 2); ns.sort((a, b) => a.t - b.t);
  ns.forEach((n, i) => {
    const inBeat = n.t % PPQ;
    if(k === 'even') n.v = S;
    else if(k === 'on') n.v = inBeat === 0 ? S : inBeat === PPQ / 2 ? M : W;
    else if(k === 'offb') n.v = inBeat === 0 ? W : inBeat === PPQ / 2 ? S : M;
    else if(k === 'bar') n.v = n.t % barT() === 0 ? S : W;
    else if(k === 'alt') n.v = i % 2 ? W : S;
    else if(k === 'cresc') n.v = Math.round(W + (S - W) * (ns.length > 1 ? i / (ns.length - 1) : 1));
    else if(k === 'decresc') n.v = Math.round(S - (S - W) * (ns.length > 1 ? i / (ns.length - 1) : 1));
  });
}
function applyTiming(ns, k){
  const A = ST.amt / TICK480;
  ns.forEach(n => {
    const inBeat = n.t % PPQ, beat = Math.floor((n.t % barT()) / PPQ);
    let o = 0;
    if(k === 'push') o = -A; else if(k === 'lay') o = A;
    else if(k === 'back') o = inBeat === 0 && beat % 2 === 1 ? A : (n.off || 0);
    else if(k === 'offlate') o = inBeat === PPQ / 2 ? A : inBeat ? A / 2 : 0;
    n.off = o; if(!n.off) delete n.off;
  });
}
function humanize(ns){
  ns.forEach(n => { n.v = clamp(Math.round(n.v + (Math.random() * 2 - 1) * ST.humV), 1, 127); const o = (n.off || 0) + (Math.random() * 2 - 1) * ST.humT / TICK480; n.off = Math.round(o * 10) / 10; if(!n.off) delete n.off; });
}

const NOTE_STYLE = {fingered:'ebass', pick:'pickbass', slap:'slapbass', fretless:'fretless', acoustic:'upright', synth:'synbass'};

  const m = String(raw || '').match(/(DRUMNOTE1|BASSNOTE1|MULTINOTE1):([A-Za-z0-9+/=]+)/); let d = null;

  if(d && m[1] === 'MULTINOTE1') return importMulti(d, o);
  if(!d || !Array.isArray(d.notes) || !d.len){ toast('読み込めませんでした。「…NOTE1:」から全部貼り付けてください'); return false; }
  stopAudition && stopAudition(); pushUndo();
  const isBass = m[1] === 'BASSNOTE1'; let tr;
  if(isBass){
    const pk = NOTE_STYLE[d.style] || 'ebass';

    if(!tr){ tr = mkTrack('synth', PRESETS[pk].name, pk, P.tracks.length); P.tracks.push(tr); }
  } else {
    const kc = o.kit || 'auto', kit = kc === 'auto' ? (KITS[d.kit] ? d.kit : null) : kc === 'keep' ? null : kc;
    tr = o.cur && o.cur.kind === 'drum' ? o.cur : P.tracks.find(t => t.kind === 'drum');

  ensureBars(); syncMix(); closeSheet(); selectPattern(np.id); markDirty(); updateLcd(); renderChrome();

  return true;
}
function importMulti(d, o){

      if(!tr){ tr = mkTrack('synth', pt.name, pk, P.tracks.length); P.tracks.push(tr); } }

}

const KEYMAP = 'awsedftgyhujkolp;'; let kbOct = 4; const held = {}, recs = {}, keyDown = {};

function noteOn(p, vel = 100){

  }
}
function noteOff(p){
  const h = held[p]; if(!h) return; delete held[p];

  if(r){ delete recs[p]; const pt = patTick(); const st = Math.round(r.tick / prSnapT()) * prSnapT() % r.pat.len; let len = pt == null ? prSnapT() : pt - r.tick; if(len <= 0) len += r.pat.len;

}
function keyToPitch(k){
  const i = KEYMAP.indexOf(k); if(i < 0) return null;
  const tr = inputTrack(); if(tr.kind === 'drum') return STEP_ORDER[i] ? STEP_ORDER[i].p : null;

async function saveCloud(){

function openChordGuide(){

  <h3>3つの機能（T・SD・D）</h3>
  <p><b>T トニック</b>＝「家」。安定・終止。I（代理: IIIm, VIm）</p>
  <p><b>SD サブドミナント</b>＝「出かける」。広がり・展開。IV（代理: IIm）</p>
  <p><b>D ドミナント</b>＝「帰りたい」緊張。V / V7（代理: VIIm♭5）。D→T の解決が音楽の推進力の基本です。</p>
  <p>基本の流れは <b>T→SD→D→T</b>。SD→T（IV→I、アーメン終止）や T→D→T も OK。D→SD は「戻る」感じで、ロック的な響きになります。</p>
  <h3>代理コード</h3>
  <p>同じ機能を持つ別のコードに置き換えるテクニック。共通音が多いほど自然です。I→VIm（切なく）、IV→IIm（なめらかに）、V7→♭II7（裏コード、ベースが半音で滑らか）。</p>
  <h3>セカンダリードミナント</h3>
  <p>ダイアトニックの各コードを一時的に「I」とみなし、その V7 を前に置く方法。C キーなら A7→Dm、E7→Am、D7→G。コード進行に強い推進力と色彩を加えます。V7/V は特に「ドッペルドミナント」と呼ばれます。</p>
  <h3>裏コード（トライトーン代理）</h3>
  <p>V7 の3度と7度（増4度＝トライトーン）は、増4度離れた7th コードと共通。G7 の代わりに D♭7 を使うと Dm7→D♭7→C とベースが半音ずつ下がります。</p>
  <h3>モーダルインターチェンジ（借用和音）</h3>
  <p>同じ主音の短調（または長調）からコードを借りる方法。IVm、♭VI、♭VII、♭III などは、長調の曲に切なさや壮大さを加えます。</p>
  <h3>ドミナントの変化形</h3>
  <p><b>sus4</b>：3度を4度に吊って「溜め」を作り、元のコードで解決。<b>aug</b>：5度を上げて次へ押し出す経過和音。<b>dim7</b>：半音上のコードへの橋渡し（パッシングディミニッシュ）。<b>7(♭9) / 7(#9) / alt</b>：緊張を強めて短調へドラマチックに解決。</p>
  <h3>テンション（9・11・13）</h3>
  <p>7th コードの上に3度ずつ積んだ音。<b>9th</b>は柔らかい広がり、<b>11th</b>はモーダルで開放的（メジャー系では3度とぶつかるので #11 を使うことが多い）、<b>13th</b>はジャズ的な豪華さ。maj9・m9・m11 はシティポップやネオソウルの要です。</p>
  <h3>使い方のコツ</h3>
  <p>迷ったら「ダイアトニック」の中から選べば外れません。慣れたら「応用・代理」で1つだけ置き換えてみるのがおすすめ。メロディの音がコードの構成音に含まれる（または隣の音）と自然に聞こえます。</p></div>`);

const getPath = (o, p) => p.split('.').reduce((a, k) => a[k], o);

function sizeMeter(){ const cv = $('mMeter'); if(!cv) return; const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }

}
function openMasterGuide(){
  openSheet(`<h2>📘 マスタリングの手順<button class="x">✕</button></h2><div class="help">
  <p><b>0. 準備</b>：まずミキサーで各トラックのバランスを整えます。マスタリング前のピーク（メーターの IN）が -6〜-3dB くらいに収まっていると余裕があり理想的です。</p>
  <p><b>1. プリセットから始める</b>：曲のジャンルに近いプリセットを選び、そこから微調整するのが早道です。</p>
  <p><b>2. EQ</b>：全体の音色をほんの少し整えます。こもる→250Hz を少し下げる、暗い→12kHz を少し上げる。±3dB 以内が目安。</p>
  <p><b>3. マルチバンドコンプ（任意）</b>：低音だけ暴れる、高音だけ刺さる、など帯域ごとの問題がある時だけ使います。</p>
  <p><b>4. グルーコンプ</b>：GR が -1〜-3dB 動く程度に。曲全体がまとまり、一体感が出ます。</p>
  <p><b>5. サチュレーション</b>：少しだけ倍音を足して太さ・暖かさを。</p>
  <p><b>6. ステレオ幅</b>：広げたい時は 110〜120% から。モノラルで聞いても破綻しないか確認を。</p>
  <p><b>7. リミッター</b>：天井を -1dB に設定し、入力ゲインで音圧を上げます。GR が常に大きく動いているなら上げすぎです。</p>
  <p><b>8. 確認</b>：ON/OFF を同じくらいの音量で聴き比べ、良くなっているかを判断。ヘッドホン・スマホ・スピーカーなど複数の環境で聴き、耳が疲れたら休憩してから最終判断しましょう。</p>
  <p><b>音圧の目安</b>：Spotify や YouTube などの配信サービスは、音量を自動で約 -14 LUFS にそろえます。ここで表示する RMS はその簡易的な目安で、-14〜-10dB あたりなら十分です。無理に上げても、配信では下げられるだけで音がつぶれ損になります。</p>
  <p><b>書き出し</b>：WAV 書き出しには、このマスタリングがそのまま反映されます。</p></div>`);
}

// ======================================================================
// 律動アプリから受け取る（ドラッグ＆ドロップ / 「DTMへ送る」ボタン）
// ======================================================================
const RX_TAG = 'POCKETDTM_RHYTHM:';
const RX_VAL = '0123456789ABCDEFGHIJKLMNOPQRSTUV';
function rxBeatSize(r){ const [n, d] = r.ts.split('/').map(Number); const beats = d === 4 ? n : (d === 8 && (n === 6 || n === 12)) ? n / 3 : d === 8 ? n / 2 : n / 4; return r.steps / beats; }

function rxVel(r, k, b, i){ const t = r.v && r.v[k]; if(!t) return 0; const c = t[b % t.length][i]; return c === '-' || c === undefined ? 0 : RX_VAL.indexOf(c) * 4 + 3; }
function rxNote(k, ch){
  switch(k){
    case 'K': return {p:36}; case 'X': return {p:37}; case 'F': return {p:44}; case 'C': return {p:49}; case 'Z': return {p:52}; case 'B': return {p:56};
    case 'S': return ch === 'f' ? {p:38, art:'flam'} : ch === 'z' ? {p:38, art:'roll'} : {p:38};
    case 'H': return {p:(ch === 'o' || ch === 'h') ? 46 : 42};
    case 'R': return {p:ch === 'c' ? 53 : 51};
    case 'T1': return {p:48}; case 'T2': return {p:45}; case 'T3': return {p:41};
