<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#3a2f27"/>
      <stop offset="1" stop-color="#17120e"/>
    </radialGradient>
    <linearGradient id="pageL" x1="0" x2="1">
      <stop offset="0" stop-color="#efe6d2"/>
      <stop offset="1" stop-color="#fffaf0"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" x2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#ece2cc"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9532a"/>
      <stop offset="1" stop-color="#a8320f"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- faint stars / sparks of ideas -->
  <g fill="#e9c77b" opacity=".55">
    <circle cx="96" cy="104" r="3"/><circle cx="420" cy="88" r="2.5"/><circle cx="446" cy="150" r="2"/>
    <circle cx="70" cy="170" r="2"/><circle cx="388" cy="56" r="1.8"/>
  </g>
  <!-- open notebook -->
  <g filter="url(#sh)">
    <path d="M256 150 C206 128 146 124 92 136 L92 392 C146 380 206 384 256 406 Z" fill="url(#pageL)"/>
    <path d="M256 150 C306 128 366 124 420 136 L420 392 C366 380 306 384 256 406 Z" fill="url(#pageR)"/>
  </g>
  <!-- spine shadow -->
  <path d="M256 150 L256 406" stroke="#c9b997" stroke-width="3"/>
  <path d="M246 152 C250 250 250 320 246 402" stroke="#000" stroke-opacity=".08" stroke-width="10" fill="none"/>
  <!-- left page: ruled lines + a little wave (melody/words) -->
  <g stroke="#cdbf9f" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M122 196 C160 188 200 190 228 198"/>
    <path d="M122 232 C160 224 200 226 228 234"/>
    <path d="M122 268 C160 260 200 262 228 270"/>
    <path d="M122 304 C160 296 200 298 228 306"/>
  </g>
  <path d="M124 340 q14 -22 28 0 t28 0 t28 0 t20 -4" stroke="#7c5bb0" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- bookmark ribbon -->
  <path d="M394 131 L394 440 L405 426 L416 440 L416 133" fill="#b8892d"/>
  <!-- red seal with 創 -->
  <g transform="rotate(-4 324 262)">
    <rect x="264" y="200" width="122" height="122" rx="16" fill="url(#seal)"/>
    <rect x="273" y="209" width="104" height="104" rx="10" fill="none" stroke="#fff3e6" stroke-opacity=".75" stroke-width="3"/>
    <text x="325" y="291" text-anchor="middle" font-family="Noto Serif CJK JP, Noto Serif JP, serif" font-weight="900" font-size="86" fill="#fffaf0">創</text>
  </g>
</svg>
