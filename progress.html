<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コード進行100 ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf7f4; --paper:#ffffff; --ink:#2b2730; --sub:#6f6873; --line:#ece4e6;
  --accent:#d6457a; --accent-soft:#fde8f0; --mint:#2f9e8f; --mint-soft:#e2f5f2;
  --gold:#c98a1a; --chip:#f5f0f2; --shadow:0 1px 2px rgba(60,30,40,.06),0 4px 16px rgba(60,30,40,.05);
  --key-on:#d6457a; --bass-on:#2f9e8f;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#17151a; --paper:#211e25; --ink:#f1edf3; --sub:#a59fab; --line:#34303a;
    --accent:#ff6fa0; --accent-soft:#3a2230; --mint:#4fc7b5; --mint-soft:#1d3532; --chip:#2b2730;
    --shadow:none; --key-on:#ff6fa0; --bass-on:#4fc7b5;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 220px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hrow{max-width:760px;margin:0 auto;padding:12px 14px 8px;display:flex;align-items:center;gap:10px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.02em}
h1 small{display:block;font-size:11px;color:var(--sub);font-weight:500;letter-spacing:0}
.tabs{max-width:760px;margin:0 auto;padding:0 14px;display:flex;gap:4px}
.tab{flex:1;background:none;border:none;padding:9px 4px 10px;font-size:14px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-color:var(--accent)}
.tools{display:flex;gap:8px;align-items:center;margin:14px 0 8px;flex-wrap:wrap}
.search{flex:1;min-width:180px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;font:inherit;color:var(--ink);font-size:15px}
.sel{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 10px;font:inherit;color:var(--ink);font-size:14px}
.pill{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 12px;font-size:13px;white-space:nowrap}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.filters{display:flex;gap:6px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.flabel{font-size:11px;color:var(--sub);margin:6px 0 0}
.count{font-size:12px;color:var(--sub);margin:8px 2px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;margin:10px 0;box-shadow:var(--shadow)}
.card.playing{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ctop{display:flex;align-items:flex-start;gap:10px}
.num{flex:none;min-width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:15px}
.roman{font-weight:700;font-size:16px;line-height:1.35;word-break:break-word}
.name{display:inline-block;font-size:11px;font-weight:700;background:var(--mint-soft);color:var(--mint);border-radius:6px;padding:2px 7px;margin-bottom:3px}
.fav{margin-left:auto;background:none;border:none;font-size:22px;line-height:1;padding:4px;color:var(--sub)}
.fav.on{color:var(--gold)}
.chords{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
.ch{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:7px 10px;font-size:15px;font-weight:700;min-width:44px;text-align:center}
.ch.now{background:var(--accent);border-color:var(--accent);color:#fff}
.desc{font-size:14px;line-height:1.75;color:var(--ink);margin:4px 0 8px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;color:var(--sub);background:var(--chip);border-radius:6px;padding:3px 7px}
.cbtns{display:flex;gap:8px;margin-top:10px}
.play{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:9px 16px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.play.stop{background:var(--ink);color:var(--bg)}
.ghost{background:none;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px}
/* bottom player */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.06)}
.dockin{max-width:760px;margin:0 auto;padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
.drow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.drow label{display:flex;align-items:center;gap:5px;color:var(--sub)}
.drow select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:5px 6px;font:inherit;font-size:13px}
.drow input[type=range]{width:90px;accent-color:var(--accent)}
.now-chord{font-weight:700;font-size:15px;min-width:70px;color:var(--accent)}
.piano{position:relative;height:62px;margin-top:8px;user-select:none}
.wk,.bk{position:absolute;top:0;border-radius:0 0 5px 5px}
.wk{height:62px;background:#fff;border:1px solid #cfc7cb}
.bk{height:38px;background:#2b2730;z-index:2}
.wk.on{background:var(--key-on)} .bk.on{background:var(--key-on)}
.wk.bass{background:var(--bass-on)} .bk.bass{background:var(--bass-on)}
.klab{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:9px;color:#9a9298;pointer-events:none}
.wk.on .klab,.wk.bass .klab{color:#fff}
/* theory */
.tcard{background:var(--paper);border:1px solid var(--line);border-radius:16px;margin:10px 0;box-shadow:var(--shadow);overflow:hidden}
.thead{width:100%;text-align:left;background:none;border:none;padding:14px;display:flex;align-items:center;gap:10px}
.thead h3{margin:0;font-size:16px;flex:1}
.ttag{font-size:11px;font-weight:700;color:var(--mint);background:var(--mint-soft);padding:3px 8px;border-radius:6px;white-space:nowrap}
.tbody{padding:0 14px 14px;font-size:14px;line-height:1.85;white-space:pre-wrap;display:none}
.tcard.open .tbody{display:block}
.chev{transition:transform .2s;color:var(--sub)}
.tcard.open .chev{transform:rotate(90deg)}
.exrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;white-space:normal}
.ex{border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700}
.ex.on{background:var(--accent);color:#fff}
.circle{display:block;margin:12px auto 0;max-width:340px;width:100%}
.circle .k{cursor:pointer}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.itable{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.irow{display:grid;grid-template-columns:40px 1fr;gap:2px 10px;padding:9px 12px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.irow:first-child{border-top:none}
.irow:active{background:var(--chip)}
.irow.playing{background:var(--accent-soft)}
.inum{grid-row:span 2;font-weight:700;color:var(--accent);font-size:14px;text-align:center;background:none;border:none;padding:6px 0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.ir{font-size:13px;font-weight:700;line-height:1.35}
.ir .iname{font-size:10px;color:var(--mint);background:var(--mint-soft);border-radius:5px;padding:1px 5px;margin-left:5px;font-weight:700;vertical-align:1px}
.ic{font-size:12.5px;color:var(--sub);line-height:1.4}
.ic b{color:var(--accent);font-weight:700}
mark{background:#ffe58a;color:inherit;border-radius:3px;padding:0 1px}
@media (min-width:620px){.irow{grid-template-columns:44px minmax(0,1.1fr) minmax(0,1fr)}.inum{grid-row:auto}}
.hidden{display:none!important}
.dtab{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.drow2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:8px 10px;border-top:1px solid var(--line);align-items:center}
.drow2:first-child{border-top:none}
.drow2.op{background:var(--chip)}
.dl{background:none;border:none;padding:0;text-align:left;min-width:0}
.dln{display:block;font-weight:700;font-size:14px;line-height:1.3}
.dlf{display:block;font-size:11px;font-weight:700;line-height:1.4}
.dlf small{font-weight:500;font-size:10px}
.dcs{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.dch{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 7px;font-size:13px;font-weight:700;min-width:36px}
.dch.now{background:var(--accent);border-color:var(--accent);color:#fff}
.dto{grid-column:1/-1;font-size:11.5px;color:var(--sub);line-height:1.4}
.dmore{grid-column:1/-1;font-size:13px;line-height:1.7;padding-top:4px}
.intro{font-size:13px;color:var(--sub);line-height:1.7;margin:12px 2px 0}
.gacha{background:var(--mint);color:#fff;border:none;border-radius:12px;padding:9px 12px;font-weight:700;font-size:13px}
.hkey{margin-left:auto;display:flex;align-items:center;gap:4px;flex:none}
.hkey button{border:1px solid var(--line);background:var(--paper);border-radius:10px;width:34px;height:34px;font-weight:700;font-size:15px}
.hkey select{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:6px 8px;font:inherit;font-weight:700;font-size:15px}
.hkey small{font-size:10px;color:var(--sub);display:block;text-align:center}
[draggable=true]{-webkit-user-drag:element}
.dragging{opacity:.45}
.drag{cursor:grab}
.toast{position:fixed;left:50%;bottom:190px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:12px;font-size:13px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:.95}
</style>
<script src="drag.js"></script>
</head>
<body>
<header>
  <div class="hrow">
    <h1>コード進行100 ノート<small>手書きノートのまとめ — タップで鳴らして覚える</small></h1>
    <div class="hkey"><button id="kdn" aria-label="半音下げ">−</button><div><select id="key2" aria-label="キー"></select><small>キー</small></div><button id="kup" aria-label="半音上げ">＋</button></div>
  </div>
  <div class="tabs">
    <button class="tab on" data-v="list">進行100</button>
    <button class="tab" data-v="index">一覧</button>
    <button class="tab" data-v="dict">コード事典</button>
  </div>
</header>

<div class="wrap">
  <section id="v-list">
    <div class="tools">
      <input id="q" class="search" type="search" placeholder="検索（例：切ない、サビ、借用、Am、IV#dim）">
      <button id="gacha" class="gacha">🎲 ランダム</button>
    </div>
    <div class="flabel">はじまりのコード</div>
    <div class="filters" id="f-start"></div>
    <div class="flabel">雰囲気・使いどころ・テクニック</div>
    <div class="filters" id="f-tag"></div>
    <div class="count" id="count"></div>
    <div id="list"></div>
  </section>

  <section id="v-index" class="hidden">
    <div class="tools">
      <input id="qi" class="search" type="search" placeholder="一覧を検索（例：丸サ、IVm、借用、切ない、E7）">
    </div>
    <div class="count" id="icount"></div>
    <div class="itable" id="itable"></div>
    <p class="intro">行をタップで再生／停止。番号をタップすると詳しいページに移動します。</p>
  </section>

  <section id="v-dict" class="hidden">
    <div class="tools"><input id="qd" class="search" type="search" placeholder="コードを検索（例：セカンダリー、IVm、切ない、A7）"></div>
    <div class="filters" id="f-dict"></div>
    <div class="count" id="dcount"></div>
    <div id="dictlist"></div>
  </section>
</div>

<div class="dock">
  <div class="dockin">
    <div class="drow">
      <span class="now-chord" id="nowc">—</span>
      <label>キー<select id="key"></select></label>
      <label>BPM<input type="range" id="bpm" min="50" max="160" value="88"><span id="bpmv">88</span></label>
      <label>奏法<select id="style">
        <option value="pad">白玉</option>
        <option value="arp">アルペジオ</option>
        <option value="beat">8ビート</option>
      </select></label>
      <label><input type="checkbox" id="loop" checked> ループ</label>
    </div>
    <div class="piano" id="piano"></div>
  </div>
</div>

<script>
const P1 = [
{n:1, r:"I・IIm・IIIm・IIm", c:["C","Dm","Em","Dm"], d:"上がって下がるシンプルな進行。派手さはない。Aメロなどゆったりした場面に。繰り返し使用可能。"},
{n:2, r:"I・IIm・IIIm・IV", c:["C","Dm","Em","F"], d:"柔らかくゆったり、シンプル。派手さはない。Aメロなど。響きがシンプルすぎる場合はセブンスへ。"},
{n:3, r:"I・IIIm・IV・V", c:["C","Em","F","G"], d:"シンプル。可愛いイメージの曲にも。（IIIm は I の代理）"},
{n:4, r:"I・V・VIm・IV", c:["C","G","Am","F"], d:"切なさのスパイス。邦楽・洋楽問わずバラード〜ロックまで。IV→Iへ戻る柔らかい動きもPOP。"},
{n:5, r:"I・V・IIIm・IV", c:["C","G","Em","F"], d:"定番進行からの流れで使われる。IIIm→IVが少し弱々しい。J-POPより洋楽。途中からこの進行に使われる。"},
{n:6, r:"I・V・VIm・IIIm・IV・I・IV・V", c:["C","G","Am","Em","F","C","F","G"], name:"カノン進行", d:"J-POPのサビでよく使われる。徐々に下がっていくようなメロディーに合う。転回形により低音をスムーズにしたり、2-5を使う形、途中で違うコードに分岐したりする。"},
{n:7, r:"I・VIm・IIm・V", c:["C","Am","Dm","G"], name:"イチロクニーゴー", d:"繰り返しOK。明るく素直。派手さはない。（T・T・T・D）"},
{n:8, r:"I・VIm・IV・V", c:["C","Am","F","G"], d:"繰り返しのメロディが使いやすい。明るく素直。起伏に欠けるので、童謡やフォークソングのような牧歌的な雰囲気。"},
{n:9, r:"I・Iaug・I6・I7", c:["C","Caug","C6","C7"], d:"クリシェ（ソ→ソ#→ラ→シ♭）。ポジティブ、明るい。I7はセカンダリードミナント（I7→IV, IV△7へ）。"},
{n:10, r:"I・IV/I・I", c:["C","F/C","C"], d:"ベース音を固定したまま上のコードだけ動く。※メモ「First Love」: I・V/VII・VIm・I/V・IV△7・IIm7/V・I・IV/I・I（C・G/B・Am・C/G・F△7・Dm7/G・C・F/C・C）下降するベース。"},
{n:11, r:"I・I△7/VII・I7/VII♭・VI7", c:["C","C△7/B","C7/B♭","A7"], d:"ベースラインクリシェ。バラードとの相性よし。派手さはない。音数が少ないAメロなど。VI7はセカンダリードミナント（→IIm）。"},
{n:12, r:"I・I△7・I7・IV", c:["C","C△7","C7","F"], d:"少しずつ脱力。（上声のクリシェ：C→B→B♭→A）"},
{n:13, r:"I・I7/VII♭・IV/VI・IVm/VI♭", c:["C","C7/B♭","F/A","Fm/A♭"], d:"ベースラインクリシェ。壮大で堂々。I7/VII♭はセカンダリードミナント（Fへの）、IVm/VI♭はサブドミナントマイナー（Cへの）。"},
{n:14, r:"I・V/VII・Vm/VII♭・IV/VI・IVm/VI♭・I/V・II/IV#・V", c:["C","G/B","Gm/B♭","F/A","Fm/A♭","C/G","D/F#","G"], d:"ベースラインクリシェ。緩やかに下降→バラード。ポップもあり。"},
{n:15, r:"I・I7・IV・IVm", c:["C","C7","F","Fm"], d:"優しく温かみ、大人びた。I7はセカンダリードミナント、IVmはサブドミナントマイナー。"},
{n:16, r:"I・II♭・I", c:["C","D♭","C"], d:"珍しい進行。気持ちいい違和感。II♭はVの裏コードだが、今回は飾り道具的にIの半音上のコードが使われている。"},
{n:17, r:"I・II7/I", c:["C","D7/C"], d:"本来はDm。ベースペダルポイント＝ベース音が長く固定されたまま上のコードだけが変化すること。浮遊感のある少ない動きの進行。静かなイントロ、Aメロ。II7/Iは属調（Gメジャーキーから D7＝D・F#・A・C）、転調感が強い。"},
{n:18, r:"I・III♭・IV", c:["C","E♭","F"], d:"III♭（E♭）は同主調であるCマイナーからの借用コード。未来的な雰囲気も感じる魅力のある響き。（Iトニックへ、Vドミナントへ、VII♭同主コードへ）"},
{n:19, r:"I・IIIm・Vm7・I7", c:["C","Em","Gm7","C7"], d:"Vm7（Gm7＝G B♭ D F）はサブドミナントマイナー（ナチュラルマイナー＝Cエオリアン C D E♭ F G A♭ B♭）。I7（C7＝C E G B♭）はIV(F)へのセカンダリードミナント（Cミクソリディアン C D E F G A B♭）。"},
{n:20, r:"I・III7・VIm・I7", c:["C","E7","Am","C7"], d:"J-POPで多く使われる。優しさ＆切なさ。III7（E7＝E G# B D）はAmへのセカンダリードミナント（Aハーモニックマイナー A B C D E F G#）。"},
{n:21, r:"I・III7・VIm・Vm7・I7", c:["C","E7","Am","Gm7","C7"], d:"Vm7の開放感がプラスされ2-5の動きも取り入れて、ドラマチックになった形。VImとVmの間にV#mやV#augなどの経過的なコードを挟む形もよくある。"},
{n:22, r:"I・VIIm7(♭5)・III7・VIm・Vm7・I7", c:["C","Bm7(b5)","E7","Am","Gm7","C7"], d:"VIIm7(♭5)を入れて2-5の動きを入れて切なく。コロコロと曲調が変わり目まぐるしい印象。"},
{n:23, r:"I・IV・V・V#dim・VIm", c:["C","F","G","G#dim","Am"], d:"切ない印象。V#dim（G#・B・D）はIII/V#（E/G#）で代用もあり。"},
{n:24, r:"I・IV・VII♭・I", c:["C","F","B♭","C"], d:"洋楽っぽい。VII♭は同主調からの借用コード（Cマイナー＝C D E♭ F G A♭ B♭）。"},
{n:25, r:"I・Vm", c:["C","Gm"], d:"→隣接するVIm, IVへ。Aメロなどをさり気なくおしゃれにする。"},
{n:26, r:"I・VII♭・I", c:["C","B♭","C"], d:"独特な力強さ、勢いのあるシンプルな進行。VII♭は同主調（Cマイナー）と下属調（Fメジャー＝F G A B♭ C D E）の借用コード。（I・VII♭・VI♭・VII♭の形も）"},
{n:27, r:"I・VII♭・VIm・VI♭", c:["C","B♭","Am","A♭"], d:"ふわふわとした印象。ベースラインが下降、脱力感。VII♭・VI♭は同主調からの借用コード。"},

<script>
const PROG=[...P1,...P2,...P3,...P4];
const THEORY=[...T1,...T2];

/* ---------- chord parsing ---------- */
const PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const KEYS=[['C',0],['D♭',1],['D',2],['E♭',3],['E',4],['F',5],['F#',6],['G',7],['A♭',8],['A',9],['B♭',10],['B',11]];
const QUAL={'':[0,4,7],'m':[0,3,7],'7':[0,4,7,10],'m7':[0,3,7,10],'maj7':[0,4,7,11],'mmaj7':[0,3,7,11],
 '6':[0,4,7,9],'m6':[0,3,7,9],'aug':[0,4,8],'dim':[0,3,6],'dim7':[0,3,6,9],'sus4':[0,5,7],'sus2':[0,2,7],
 '7sus4':[0,5,7,10],'9':[0,4,7,10,14],'maj9':[0,4,7,11,14],'m9':[0,3,7,10,14]};
const TEN={'b5':null,'#5':null,'add9':14,'9':14,'b9':13,'#9':15,'11':17,'#11':18,'13':21,'b13':20};
function norm(s){return s.replace(/♭/g,'b').replace(/♯/g,'#').replace(/△/g,'maj')}
function parseRoot(s){const m=s.match(/^([A-G])([#b]?)/);if(!m)return null;let p=PC[m[1]]+(m[2]=='#'?1:m[2]=='b'?-1:0);return {pc:(p+12)%12,len:m[0].length}}
function parseChord(sym){
  let s=norm(sym), bass=null;
  const sl=s.indexOf('/'); if(sl>0){bass=parseRoot(s.slice(sl+1)).pc; s=s.slice(0,sl);}
  const r=parseRoot(s); let rest=s.slice(r.len);
  let paren=''; const pi=rest.indexOf('('); if(pi>=0){paren=rest.slice(pi+1,rest.lastIndexOf(')'));rest=rest.slice(0,pi);}
  let iv=(QUAL[rest]||QUAL['']).slice();
  paren.split(/[,、 ]+/).filter(Boolean).forEach(t=>{
    if(t=='b5'){iv=iv.map(x=>x==7?6:x)}
    else if(t=='#5'){iv=iv.map(x=>x==7?8:x)}
    else if(TEN[t]!=null){iv.push(TEN[t])}
  });
  return {root:r.pc,bass:bass==null?r.pc:bass,iv};
}
function useFlat(k){return [1,3,5,8,10].includes(k)||k===0}
function spell(pc,k){return (useFlat(k)?FLAT:SHARP)[(pc+120)%12]}
function transpose(sym,k){
  if(!k) return sym.replace(/b(?=[^a-z]|$)/g,'♭').replace(/\(b/g,'(♭').replace(/,b/g,',♭');
  const s=norm(sym); const parts=s.split('/');
  const conv=x=>{const r=parseRoot(x);return spell(r.pc+k,k)+x.slice(r.len)};
  let out=conv(parts[0]); if(parts[1]) out+='/'+conv(parts[1]);
  return out.replace(/maj/g,'△').replace(/\(b/g,'(♭').replace(/,b/g,',♭');
}
function pretty(sym){return transpose(sym,0)}

/* ---------- voicing ---------- */
let prevTop=null;
function voice(sym,k){
  const c=parseChord(sym); const root=c.root+k, bass=c.bass+k;
  const bassN=36+((bass%12)+12)%12; // C2..B2
  const pcs=c.iv.map(i=>root+i);
  // candidate: stack tones above a floor; pick floor nearest previous center
  let best=null,bestScore=1e9;
  for(let floor=52;floor<=64;floor++){
    const notes=pcs.map(p=>{let n=((p%12)+12)%12;while(n<floor)n+=12;return n}).sort((a,b)=>a-b);
    // tensions above 14 go one octave higher than base when needed
    const center=notes.reduce((a,b)=>a+b,0)/notes.length;
    const target=prevTop==null?62:prevTop;
    const sc=Math.abs(center-target)+(notes[notes.length-1]>79?20:0);
    if(sc<bestScore){bestScore=sc;best=notes}
  }
  prevTop=best.reduce((a,b)=>a+b,0)/best.length;
  return {bass:bassN,upper:[...new Set(best)]};
}

/* ---------- audio ---------- */
let ac=null,master=null;
function audio(){
  if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.55;
    const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);}
  if(ac.state==='suspended')ac.resume();
  return ac;
}
const hz=n=>440*Math.pow(2,(n-69)/12);
function note(n,t,dur,vel=.18,type='keys'){
  const a=ac; const g=a.createGain(); const f=a.createBiquadFilter();
  f.type='lowpass'; f.frequency.value=type=='bass'?900:2600; f.Q.value=.6;
  const o1=a.createOscillator(),o2=a.createOscillator();
  if(type=='bass'){o1.type='triangle';o2.type='sine';}else{o1.type='triangle';o2.type='sawtooth';}
  o1.frequency.value=hz(n);o2.frequency.value=hz(n)*(type=='bass'?1:1.003);
  const g2=a.createGain();g2.gain.value=type=='bass'?.6:.12;
  o1.connect(g);o2.connect(g2);g2.connect(g);g.connect(f);f.connect(master);
  const atk=.012,rel=type=='bass'?.12:.35;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vel,t+atk);
  g.gain.exponentialRampToValueAtTime(vel*.45,t+Math.min(dur,.6));
  g.gain.setValueAtTime(vel*.45,t+dur);g.gain.exponentialRampToValueAtTime(.0001,t+dur+rel);
  f.frequency.setValueAtTime(type=='bass'?900:3200,t);f.frequency.exponentialRampToValueAtTime(type=='bass'?500:1400,t+dur);
  [o1,o2].forEach(o=>{o.start(t);o.stop(t+dur+rel+.05)});
}
function playVoicing(v,t,dur,style){
  note(v.bass,t,dur*.98,.32,'bass');
  if(style=='arp'){
    const seq=[...v.upper,...v.upper.slice(1,-1).reverse()]; const step=dur/8;
    for(let i=0;i<8;i++) note(seq[i%seq.length],t+i*step,step*1.6,.16);
  }else if(style=='beat'){
    const step=dur/8;
    for(let i=0;i<8;i++){v.upper.forEach(n=>note(n,t+i*step,step*.7,i%2?.07:.1))}
  }else{
    v.upper.forEach((n,i)=>note(n,t+i*.012,dur*.96,.13));
  }
}

/* ---------- player ---------- */
const S={key:0,bpm:88,style:'pad',loop:true,playing:null,timer:null,fav:new Set()};
try{const f=JSON.parse(localStorage.getItem('cp100fav')||'[]');S.fav=new Set(f)}catch(e){}
function saveFav(){try{localStorage.setItem('cp100fav',JSON.stringify([...S.fav]))}catch(e){}}

function stop(){
  if(S.timer){clearTimeout(S.timer);S.timer=null}
  if(ac&&master){master.gain.cancelScheduledValues(ac.currentTime);master.gain.setValueAtTime(master.gain.value,ac.currentTime);master.gain.linearRampToValueAtTime(0,ac.currentTime+.08);
    const m=master;setTimeout(()=>{m.disconnect()},150);
    master=ac.createGain();master.gain.value=.55;const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);}
  const p=S.playing;S.playing=null;
  document.querySelectorAll('.ch.now,.ex.on').forEach(e=>e.classList.remove('now','on'));
  document.querySelectorAll('.card.playing,.irow.playing').forEach(e=>e.classList.remove('playing'));if(p&&String(p)[0]=='i'&&typeof renderIndex=='function')renderIndex();
  document.querySelectorAll('.play.stop').forEach(b=>{b.classList.remove('stop');b.innerHTML='▶ 再生'});
  setPiano(null);document.getElementById('nowc').textContent='—';
  return p;
}
function playSeq(id,chords,onStep,loop=S.loop){
  audio(); stop(); prevTop=null; S.playing=id;
  const bar=60/S.bpm*4; let i=0;
  const tick=()=>{
    if(S.playing!==id)return;
    if(i>=chords.length){ if(loop){i=0}else{stop();return} }
    const sym=chords[i]; const v=voice(sym,S.key);
    playVoicing(v,ac.currentTime+.03,bar,S.style);
    setPiano(v); document.getElementById('nowc').textContent=transpose(sym,S.key);
    onStep&&onStep(i); i++;
    S.timer=setTimeout(tick,bar*1000);
  };
  tick();
}
function playOne(sym){
  audio(); if(S.playing)stop(); prevTop=null;
  const v=voice(sym,S.key); playVoicing(v,ac.currentTime+.02,1.6,'pad'); setPiano(v);
  document.getElementById('nowc').textContent=transpose(sym,S.key);
}

const PLO=36,PHI=84;
function buildPiano(){
  const el=document.getElementById('piano'); el.innerHTML='';
  const whites=[];for(let n=PLO;n<=PHI;n++)if(![1,3,6,8,10].includes(n%12))whites.push(n);
  const W=100/whites.length;
  whites.forEach((n,i)=>{const d=document.createElement('div');d.className='wk';d.dataset.n=n;d.style.left=(i*W)+'%';d.style.width=W+'%';
    if(n%12==0){d.innerHTML='<span class="klab">C'+(n/12-1)+'</span>'}el.appendChild(d)});
  for(let n=PLO;n<=PHI;n++)if([1,3,6,8,10].includes(n%12)){
    const wi=whites.indexOf(n-1);const d=document.createElement('div');d.className='bk';d.dataset.n=n;
    d.style.left=((wi+1)*W-W*.3)+'%';d.style.width=(W*.6)+'%';el.appendChild(d)}
}
function setPiano(v){
  document.querySelectorAll('#piano .on,#piano .bass').forEach(e=>e.classList.remove('on','bass'));
  if(!v)return;
  const b=document.querySelector(`#piano [data-n="${v.bass}"]`);b&&b.classList.add('bass');
  v.upper.forEach(n=>{let m=n;while(m>PHI)m-=12;const e=document.querySelector(`#piano [data-n="${m}"]`);e&&e.classList.add('on')});
}

const TT={cur:null};
function circleSVG(){
  const maj=['C','G','D','A','E','B','F#','D♭','A♭','E♭','B♭','F'], kk=[0,7,2,9,4,11,6,1,8,3,10,5];
  const min=['Am','Em','Bm','F#m','C#m','G#m','D#m','B♭m','Fm','Cm','Gm','Dm'];
  const acc=['','#1','#2','#3','#4','#5','#6/♭6','♭5','♭4','♭3','♭2','♭1'];
  let s='<svg class="circle" viewBox="-170 -170 340 340" role="img" aria-label="五度圏">';
  s+='<circle r="150" fill="none" stroke="var(--line)"/><circle r="92" fill="none" stroke="var(--line)"/>';
  maj.forEach((m,i)=>{const a=(i*30-90)*Math.PI/180;const x=Math.cos(a)*128,y=Math.sin(a)*128,x2=Math.cos(a)*72,y2=Math.sin(a)*72,x3=Math.cos(a)*103,y3=Math.sin(a)*103;
    const on=kk[i]===S.key;
    s+=`<g class="k" data-k="${kk[i]}"><circle cx="${x}" cy="${y}" r="21" fill="${on?'var(--accent)':'var(--accent-soft)'}"/><text x="${x}" y="${y+6}" text-anchor="middle" font-size="17" font-weight="700" fill="${on?'#fff':'var(--accent)'}">${m}</text>
    <text x="${x3}" y="${y3+4}" text-anchor="middle" font-size="9" fill="var(--sub)">${acc[i]}</text>
    <circle cx="${x2}" cy="${y2}" r="16" fill="var(--mint-soft)"/><text x="${x2}" y="${y2+4}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--mint)">${min[i]}</text></g>`});
  s+='<text y="5" text-anchor="middle" font-size="10" fill="var(--sub)">タップでキー変更</text></svg>';
  return s;
}

 {l:'♯IVm(♭5) / ♯IVm7(♭5)',c:['F#dim','F#m7(b5)'],f:[['T'],['D','IIの代理と見なす場合']],odd:1,to:'IV, IVΔ7, V, V7',d:'VImなどと構成音が似ているため、トニックの代理コードとして使うことができる。また、II7の代理コードとして使うこともできる。緊張と不安が混じり合ったような複雑な響き。ルートが半音下がってIVやIVΔ7などに移動するか、ルートが半音上がってVやV7などに移動する。'},
 {l:'♯Vdim / ♯Vdim7',c:['G#dim','G#dim7'],f:[['D']],odd:1,to:'VIm, VIm7',d:'IIIやIII7の代理コード。強い切なさを感じる響きもほぼ同様。V・♯Vdim・VImという流れで使う。'},
 {l:'♭VI / ♭VIΔ7',c:['Ab','Ab△7'],f:[['SDm']],odd:1,to:'V, V7, ♭VII, ♭VII7',d:'IVmなどのサブドミナント・マイナーの代理コード。転調感が強く、浮遊感のある響き。♭VI・♭VII・Iという流れで使う。ルートが半音下がってVなどのドミナントに進行もする。'},
 {l:'♭VII / ♭VII7',c:['Bb','Bb7'],f:[['D','同主調'],['SD','IVmの代理と見なす場合']],odd:1,to:'I, IΔ7, ♭III, ♭IIIΔ7, V, V7',d:'同主調のドミナントコードで、「別解のドミナント」（Iに移動することができるもう一つのドミナント）のような意外性があるものの、不思議と納得させられてしまう力強さがある。♭VI・♭VII・I、IVm7・♭VII7 など。'},
 {l:'♭II / ♭IIΔ7',c:['Db','Db△7'],f:[['SD']],odd:1,to:'',d:'下属調のサブドミナントコード。唐突に使用することで、ありきたりな流れを変える。'},
];
const FNM={T:['トニック','#d6457a'],SD:['サブドミナント','#2f9e8f'],D:['ドミナント','#7c5cd6'],SDm:['サブドミナント・マイナー','#3b82c4']};
const DF={kind:'all',q:'',view:'list',open:new Set()};
try{const v=localStorage.getItem('cp100dview');if(v)DF.view=v}catch(e){}
const LTR='CDEFGAB',NPC=[0,2,4,5,7,9,11];
function spDeg(name,semi,deg){const l=LTR.indexOf(name[0]);let a=0;for(const ch of name.slice(1)){if(ch=='#'||ch=='♯')a++;if(ch=='b'||ch=='♭')a--;}
  const rp=(NPC[l]+a+12)%12,tl=(l+deg-1)%7,tp=(rp+semi)%12;let d=(tp-NPC[tl]+12)%12;if(d>6)d-=12;return LTR[tl]+(d>0?'♯'.repeat(d):'♭'.repeat(-d));}
function chordTones(sym){const c=parseChord(sym);const t=transpose(sym,S.key);const rn=t.match(/^[A-G][♯#♭b]?/)[0];
  const DEG={0:1,1:2,2:2,3:3,4:3,5:4,6:5,7:5,8:5,9:6,10:7,11:7,13:2,14:2,15:2,17:4,18:4,20:6,21:6};
  const q=norm(sym);const tones=c.iv.map(i=>spDeg(rn,i%12,i==9&&/dim7/.test(q)?7:i==8&&/b13/.test(q)?6:DEG[i]));
  const bass=t.includes('/')?t.split('/')[1]+' ＋ ':'';return bass+tones.join(' ')}
function renderDict(){
  const fd=document.getElementById('f-dict');if(!fd)return;
  pills(fd,[['all','すべて'],['dia','ダイアトニック'],['odd','変わり者']],DF.kind,v=>{DF.kind=v;renderDict()});
  const q=DF.q.toLowerCase();
  const L=CD.filter(e=>(DF.kind=='all'||(DF.kind=='odd')==!!e.odd)&&(!q||(e.l+' '+e.d+' '+e.to+' '+e.c.join(' ')+' '+e.c.map(c=>transpose(c,S.key)).join(' ')+' '+e.f.map(f=>FNM[f[0]][0]).join(' ')+(e.odd?' 変わり者':' ダイアトニック')).toLowerCase().includes(q)));
  document.getElementById('dcount').textContent=`${L.length} 件　（キー：${KEYS[S.key][0]} メジャー）`;
  const card=e=>`<article class="card"><div class="ctop"><div style="flex:1"><span class="name" style="${e.odd?'background:var(--accent-soft);color:var(--accent)':''}">${e.odd?'変わり者':'ダイアトニック'}</span><div class="roman">${esc(e.l)}</div>
     <div class="tags" style="margin-top:4px">${e.f.map(([f,n])=>`<span class="tag" style="color:${FNM[f][1]};font-weight:700">${FNM[f][0]}${n?'（'+n+'）':''}</span>`).join('')}</div></div></div>
    <div class="chords">${e.c.map(c=>`<button class="ch" data-dc="${c}">${esc(transpose(c,S.key))}</button>`).join('')}</div>
    <div class="tags">${e.c.map(c=>`<span class="tag">${esc(transpose(c,S.key))}：${chordTones(c)}</span>`).join('')}</div>
    ${e.to?`<div class="desc" style="color:var(--sub);margin:8px 0 0">→ ${esc(e.to)}</div>`:''}<div class="desc">${esc(e.d)}</div></article>`;
  const el=document.getElementById('dictlist');
  const vt=`<div class="filters" style="margin-top:2px">${[['list','☰ 一覧'],['card','▤ カード']].map(([v,l])=>`<button class="pill${DF.view==v?' on':''}" data-dview="${v}">${l}</button>`).join('')}</div>`;
  if(!L.length){el.innerHTML=vt+'<div class="empty">該当するコードがありません</div>';return}
  const dia=L.filter(e=>!e.odd),odd=L.filter(e=>e.odd);
  if(DF.view=='list'){
    const row=e=>{const i=CD.indexOf(e),op=DF.open.has(i);return `<div class="drow2${op?' op':''}">
      <button class="dl" data-dopen="${i}"><span class="dln">${esc(e.l)}</span><span class="dlf">${e.f.map(([f,n])=>`<span style="color:${FNM[f][1]}">${FNM[f][0].replace('サブドミナント・マイナー','SDm').replace('サブドミナント','SD').replace('ドミナント','D').replace('トニック','T')}${n?'<small>（'+n.replace('major scale','長').replace('minor scale','短').replace('と見なす場合','')+'）</small>':''}</span>`).join(' ')}</span></button>
      <div class="dcs">${e.c.map(c=>`<button class="dch" data-dc="${c}">${esc(transpose(c,S.key))}</button>`).join('')}</div>
      ${e.to?`<div class="dto">→ ${esc(e.to)}</div>`:''}
      ${op?`<div class="dmore"><div class="tags" style="margin:2px 0 6px">${e.c.map(c=>`<span class="tag">${esc(transpose(c,S.key))}：${chordTones(c)}</span>`).join('')}</div>${esc(e.d)}</div>`:''}
    </div>`};
    el.innerHTML=vt+(dia.length?`<div class="flabel" style="margin-top:10px">ダイアトニック（${dia.length}）</div><div class="dtab">${dia.map(row).join('')}</div>`:'')+
      (odd.length?`<div class="flabel" style="margin-top:14px">変わり者コード（${odd.length}）</div><div class="dtab">${odd.map(row).join('')}</div>`:'')+
      `<p class="intro">コード名タップで再生。左の名前をタップすると構成音と説明が開きます。T＝トニック、SD＝サブドミナント、D＝ドミナント、SDm＝サブドミナント・マイナー</p>`;
    return;
  }
  el.innerHTML=vt+(dia.length?`<div class="flabel" style="margin-top:12px">ダイアトニック・コード（スケールの音だけでできる基本の7つ）</div>${dia.map(card).join('')}`:'')+
    (odd.length?`<div class="flabel" style="margin-top:16px">変わり者コード（セカンダリー・ドミナント、借用、代理など）</div>${odd.map(card).join('')}`:'');
}
document.getElementById('dictlist').addEventListener('click',e=>{const v=e.target.closest('[data-dview]');if(v){DF.view=v.dataset.dview;try{localStorage.setItem('cp100dview',DF.view)}catch(_){}renderDict();return}
  const o=e.target.closest('[data-dopen]');if(o){const i=+o.dataset.dopen;DF.open.has(i)?DF.open.delete(i):DF.open.add(i);renderDict();return}
  const b=e.target.closest('[data-dc]');if(!b)return;playOne(b.dataset.dc);b.classList.add('now');setTimeout(()=>b.classList.remove('now'),900);});
document.getElementById('qd').addEventListener('input',e=>{DF.q=e.target.value.trim();renderDict()});
window.openDict=t=>{DF.kind='all';DF.q=t=='変わり者コード'?'':t;if(t=='変わり者コード')DF.kind='odd';document.getElementById('qd').value=DF.q;showView('dict');renderDict();window.scrollTo(0,0);};
/* ---------- index (一覧) ---------- */
const I={q:''};
function hl(s,q){s=esc(s);if(!q)return s;q.split(/\s+/).filter(Boolean).forEach(w=>{const ww=esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');s=s.replace(new RegExp('('+ww+')','gi'),'<mark>$1</mark>')});return s}
function renderIndex(){
  const L=PROG.filter(p=>matchQ(p,I.q));
  document.getElementById('icount').textContent=`${L.length} / 100 件　（キー：${KEYS[S.key][0]}）`;
  const el=document.getElementById('itable');
  if(!L.length){el.innerHTML='<div class="empty">該当する進行がありません</div>';return}
  el.innerHTML=L.map(p=>`<div class="irow${S.playing==='i'+p.n?' playing':''}" data-n="${p.n}">
    <button class="inum" data-act="go">${p.n}</button>
    <div class="ir">${hl(p.r,I.q)}${p.name?`<span class="iname">${hl(p.name,I.q)}</span>`:''}</div>
    <div class="ic">${p.c.map(c=>hl(transpose(c,S.key),I.q)).join(' → ')}</div></div>`).join('');
}
document.getElementById('qi').addEventListener('input',e=>{I.q=e.target.value.trim();renderIndex()});
document.getElementById('itable').addEventListener('click',e=>{
  const row=e.target.closest('.irow');if(!row)return;const p=PROG.find(x=>x.n==row.dataset.n);
  if(e.target.closest('[data-act=go]')){stop();F.start='all';F.tag=null;F.q='';document.getElementById('q').value='';renderFilters();renderList();showView('list');
    const el=document.getElementById('p'+p.n);el.scrollIntoView({block:'center'});el.classList.add('playing');setTimeout(()=>el.classList.remove('playing'),1400);return}
  if(S.playing==='i'+p.n){stop();return}
  const ics=row.querySelector('.ic');
  playSeq('i'+p.n,p.c,i=>{ics.innerHTML=p.c.map((c,j)=>j==i?`<b>${esc(transpose(c,S.key))}</b>`:hl(transpose(c,S.key),I.q)).join(' → ')});
  row.classList.add('playing');
});
try{const k=localStorage.getItem('cp100key');if(k!=null){S.key=+k;}}catch(e){}
keySel.value=S.key;keySel2.value=S.key;
window.MTN_KEY=()=>({tonic:S.key,minor:false,from:'コード進行100'});
MTNDrag.bind(document.getElementById('list'),'.ch,[data-act=drag]',el=>{const p=PROG.find(x=>x.n==el.closest('.card').dataset.n);return el.classList.contains('ch')?[transpose(p.c[+el.dataset.i],S.key)]:p.c.map(c=>transpose(c,S.key))},()=>S.bpm);
MTNDrag.bind(document.getElementById('itable'),'.irow',el=>PROG.find(x=>x.n==el.dataset.n).c.map(c=>transpose(c,S.key)),()=>S.bpm);
MTNDrag.bind(document.getElementById('dictlist'),'[data-dc]',el=>[transpose(el.dataset.dc,S.key)]);
buildPiano();renderFilters();renderList();renderIndex();renderDict();
</script>
