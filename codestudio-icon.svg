<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1233"/><stop offset="1" stop-color="#0d0918"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/><stop offset=".55" stop-color="#ff5fa2"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ef2e0" stop-opacity=".9"/><stop offset="1" stop-color="#3ef2e0" stop-opacity=".15"/>
    </linearGradient>
    <clipPath id="sunclip"><circle cx="256" cy="232" r="132"/></clipPath>
    <clipPath id="floor"><rect x="0" y="300" width="512" height="212"/></clipPath><clipPath id="round"><rect width="512" height="512" rx="112"/></clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g clip-path="url(#round)"><rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 夕日（ストライプ入り） -->
  <g clip-path="url(#sunclip)" filter="url(#glow)">
    <rect x="100" y="90" width="312" height="290" fill="url(#sun)"/>
    <g fill="#1c1233">
      <rect x="100" y="250" width="312" height="6"/><rect x="100" y="270" width="312" height="9"/>
      <rect x="100" y="292" width="312" height="12"/>
    </g>
  </g>
  <!-- グリッドの床 -->
  <g clip-path="url(#floor)" stroke="url(#grid)" stroke-width="3" fill="none">
    <rect x="0" y="300" width="512" height="212" fill="#0d0918" stroke="none"/>
    <line x1="0" y1="300" x2="512" y2="300" stroke="#3ef2e0" stroke-opacity=".9"/><line x1="0" y1="322" x2="512" y2="322" stroke="#3ef2e0" stroke-opacity=".7"/><line x1="0" y1="352" x2="512" y2="352" stroke="#3ef2e0" stroke-opacity=".5"/>
    <line x1="0" y1="394" x2="512" y2="394" stroke="#3ef2e0" stroke-opacity=".35"/><line x1="0" y1="452" x2="512" y2="452" stroke="#3ef2e0" stroke-opacity=".22"/>
    <line x1="256" y1="300" x2="256" y2="512"/><line x1="216" y1="300" x2="136" y2="512"/><line x1="296" y1="300" x2="376" y2="512"/>
    <line x1="176" y1="300" x2="16" y2="512"/><line x1="336" y1="300" x2="496" y2="512"/>
    <line x1="136" y1="300" x2="-104" y2="512"/><line x1="376" y1="300" x2="616" y2="512"/>
  </g>
  <!-- 積み重なったコード（3和音＋テンション） -->
  <g filter="url(#glow)">
    <rect x="150" y="392" width="212" height="30" rx="15" fill="#3ef2e0"/>
    <rect x="150" y="352" width="212" height="30" rx="15" fill="#a78bfa"/>
    <rect x="150" y="312" width="212" height="30" rx="15" fill="#ff5fa2"/>
    <rect x="190" y="272" width="132" height="30" rx="15" fill="#ffd166"/>
  </g>
  <!-- ベース音 -->
  <rect x="110" y="440" width="292" height="16" rx="8" fill="#45d0e6" opacity=".55"/>
  </g><rect x="0.5" y="0.5" width="511" height="511" rx="111.5" fill="none" stroke="#ff5fa2" stroke-opacity=".35"/>
</svg>
