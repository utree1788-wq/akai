<!DOCTYPE html>
<html lang="ja">
<head>

<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f1e1c;--sub:#5f5d58;--mute:#8a877f;--line:#e2dfd6;--acc:#0f6e56;--accbg:#e1f5ee;--q:#534ab7;--qbg:#eeedfe;--warm:#993c1d;--warmbg:#faece7;--end:#444441;--endbg:#f1efe8}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1a;--card:#262624;--ink:#ecebe6;--sub:#b4b2a9;--mute:#888780;--line:#3a3a37;--acc:#5dcaa5;--accbg:#0e3a2f;--q:#afa9ec;--qbg:#2b2752;--warm:#f0997b;--warmbg:#4a1b0c;--end:#d3d1c7;--endbg:#33332f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:16px;margin:0;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 10px;font-size:14px;text-decoration:none}
main{max-width:720px;margin:0 auto;padding:16px 16px calc(90px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;text-align:center;padding:10px 0 8px;font-size:12px;color:var(--mute);text-decoration:none}
nav.tabs a b{display:block;font-size:18px;line-height:1.1;font-weight:500}
nav.tabs a.on{color:var(--acc)}
h2{font-size:18px;margin:8px 0 4px}
h3{font-size:15px;margin:20px 0 8px;color:var(--sub);font-weight:600}
p.lead{color:var(--sub);font-size:14px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);text-decoration:none}
.card small{display:block;color:var(--mute);font-size:12px}
.card strong{font-size:15px;font-weight:600}
input.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;margin-bottom:12px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
details>summary{list-style:none;padding:12px 14px;cursor:pointer;font-weight:600;font-size:15px}
details>summary::-webkit-details-marker{display:none}
details>summary small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.sec{border-top:1px solid var(--line);padding:10px 14px}
.sec .no{display:inline-block;min-width:34px;font-weight:700;color:var(--acc)}
.sec .tt{font-weight:600}
.sec ul{margin:6px 0 4px;padding-left:20px;font-size:14px;color:var(--sub)}
.sec a.go{font-size:13px;color:var(--acc)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--accbg);color:var(--acc);margin-left:6px;vertical-align:2px}
.flow{display:flex;flex-direction:column;align-items:stretch}
.node{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
.node .h{font-weight:600;font-size:15px;display:flex;gap:8px;align-items:baseline}
.node .h .n{color:var(--mute);font-size:12px;font-weight:500;min-width:16px}
.node .d{display:none;font-size:14px;color:var(--sub);margin-top:6px}
.node.open .d{display:block}
.node .s{font-size:12px;color:var(--mute)}
.node.q{background:var(--qbg);border-color:transparent}.node.q .h{color:var(--q)}
.node.a{background:var(--accbg);border-color:transparent}.node.a .h{color:var(--acc)}
.node.w{background:var(--warmbg);border-color:transparent}.node.w .h{color:var(--warm)}
.node.e{background:var(--endbg);border-color:transparent}.node.e .h{color:var(--end)}
.arrow{align-self:center;height:22px;width:2px;background:var(--mute);position:relative;margin:2px 0 6px}
.arrow:after{content:"";position:absolute;bottom:-5px;left:-4px;border:5px solid transparent;border-top:6px solid var(--mute);border-bottom:0}
.arrow span{position:absolute;left:10px;top:0;font-size:12px;color:var(--mute);white-space:nowrap}
.branch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.branch .col{display:flex;flex-direction:column}
.blabel{font-size:12px;font-weight:700;color:var(--q);text-align:center;margin-bottom:4px}
.note{font-size:13px;color:var(--sub);background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin:12px 0}
.wiz{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:18px}
.wiz .qq{font-weight:600;margin-bottom:10px}
.wiz button{font-size:15px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-right:8px;cursor:pointer}
.wiz .res{background:var(--accbg);color:var(--acc);border-radius:10px;padding:10px 12px;font-weight:600}
.wiz .res small{display:block;font-weight:400;color:var(--sub)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mute);margin:0 0 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.seg{display:flex;gap:6px;margin:4px 0 14px}
.seg button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--card);border-color:var(--acc)}
.role{font-size:13px;background:var(--qbg);color:var(--q);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.cl{counter-reset:c;list-style:none;padding:0;margin:0}
.cl li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 44px;margin-bottom:8px;position:relative;font-size:14px}
.cl li:before{counter-increment:c;content:counter(c);position:absolute;left:12px;top:9px;width:22px;height:22px;border-radius:50%;background:var(--accbg);color:var(--acc);font-size:12px;font-weight:700;text-align:center;line-height:22px}
.cl li b{display:block;font-size:15px}
.hidden{display:none!important}
.pb{font-size:13px;padding:6px 10px;border-radius:99px;border:1px solid var(--acc);background:var(--card);color:var(--acc);cursor:pointer;margin:3px 4px 3px 0;font-family:inherit;text-align:left}
.pb.sm{font-size:12px;padding:3px 9px;margin-top:6px}
.pb.playing{background:var(--acc);color:var(--card)}
.pbs{display:flex;flex-wrap:wrap}
.specwrap{position:sticky;top:52px;z-index:4;background:var(--bg);padding:6px 0 8px;margin:-6px 0 8px}
#spec{width:100%;height:64px;display:block;background:var(--card);border:1px solid var(--line);border-radius:10px}
.specnote{font-size:11px;color:var(--mute);margin-top:2px}
.kb{position:relative;height:130px;margin:12px 0 4px;user-select:none;-webkit-user-select:none;touch-action:none}
.wk{position:absolute;top:0;width:calc(100%/15 - 2px);height:100%;background:#fff;border:1px solid #bbb;border-radius:0 0 6px 6px;font-size:10px;color:#888;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
.bk{position:absolute;top:0;width:calc(100%/15*.6);height:60%;background:#222;border-radius:0 0 4px 4px;z-index:2}
.wk.down{background:var(--accbg)}.bk.down{background:var(--acc)}
.xy{position:relative;height:150px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;touch-action:none;overflow:hidden;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:25% 25%}
.xy .dot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--acc);opacity:.85;pointer-events:none}
.xy .xl,.xy .yl{position:absolute;font-size:11px;color:var(--mute)}.xy .xl{bottom:4px;left:50%;transform:translateX(-50%)}.xy .yl{top:4px;left:6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.panel h4{margin:0 0 6px;font-size:14px}
.ctl{display:block;margin:6px 0;font-size:13px;color:var(--sub)}
.ctl span{display:flex;justify-content:space-between}.ctl b{color:var(--ink);font-weight:600}
.ctl input[type=range]{width:100%;accent-color:var(--acc)}
.ctl select{width:100%;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;margin-top:2px}
.ctl.chk{display:inline-flex;gap:6px;align-items:center;margin-right:14px}
.pre{display:flex;flex-wrap:wrap;gap:6px}
.pre button{font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-family:inherit}
.pre button.on{border-color:var(--acc);color:var(--acc)}
.hint{font-size:12px;color:var(--mute);margin:4px 0 8px}
.wave{width:100%;height:70px;display:block;margin-top:8px;background:var(--bg);border-radius:8px}
.fxh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel.fx.on{border-color:var(--acc)}
.sw{position:relative;width:44px;height:26px;flex:none}.sw input{opacity:0;width:0;height:0}.sw span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.15s}.sw span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}.sw input:checked+span{background:var(--acc)}.sw input:checked+span:before{transform:translateX(18px)}
.recb{font-size:13px;padding:5px 12px;border-radius:99px;border:1px solid #c33;background:var(--card);color:#c33;cursor:pointer;font-family:inherit}.recb.on{background:#c33;color:#fff}
.clip{border-top:1px solid var(--line);padding:8px 0;font-size:13px}.clip audio{width:100%;margin:4px 0;height:36px}
.fxind{font-size:12px;font-weight:700;color:var(--card);background:var(--acc);border-radius:99px;padding:2px 9px;text-decoration:none}
.cmp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.cmp small{display:block;color:var(--mute);font-size:12px}

.pill{font-size:11px;font-weight:700;color:var(--q);background:var(--card);border-radius:99px;padding:0 7px;flex:none}
.node .h{flex-wrap:wrap}
.legend i{border:1px solid var(--mute)}

/* ---- color system ---- */
:root{--k0:#D85A30;--b0:#FAECE7;--k1:#534AB7;--b1:#EEEDFE;--k2:#185FA5;--b2:#E6F1FB;--k3:#993556;--b3:#FBEAF0;--k4:#3B6D11;--b4:#EAF3DE;--k5:#854F0B;--b5:#FAEEDA;--k6:#0F6E56;--b6:#E1F5EE;--k7:#A32D2D;--b7:#FCEBEB;--k8:#5F5E5A;--b8:#F1EFE8}
@media (prefers-color-scheme:dark){:root{--k0:#F0997B;--b0:#4A1B0C;--k1:#AFA9EC;--b1:#26215C;--k2:#85B7EB;--b2:#042C53;--k3:#ED93B1;--b3:#4B1528;--k4:#97C459;--b4:#173404;--k5:#EF9F27;--b5:#412402;--k6:#5DCAA5;--b6:#04342C;--k7:#F09595;--b7:#501313;--k8:#D3D1C7;--b8:#2C2C2A}}
.ch0{--cc:var(--k0);--cb:var(--b0)}.ch1{--cc:var(--k1);--cb:var(--b1)}.ch2{--cc:var(--k2);--cb:var(--b2)}.ch3{--cc:var(--k3);--cb:var(--b3)}.ch4{--cc:var(--k4);--cb:var(--b4)}.ch5{--cc:var(--k5);--cb:var(--b5)}.ch6{--cc:var(--k6);--cb:var(--b6)}.ch7{--cc:var(--k7);--cb:var(--b7)}.ch8{--cc:var(--k8);--cb:var(--b8)}
body{--cc:var(--acc);--cb:var(--accbg)}
.card.cc,a.card[class*="ch"]{border-left:5px solid var(--cc);background:var(--cb)}
a.card[class*="ch"] small{color:var(--cc);font-weight:600}
details[class*="ch"]{border-left:5px solid var(--cc)}
details[class*="ch"]>summary{background:var(--cb);color:var(--cc)}
details[class*="ch"] .sec .no{color:var(--cc)}
details[class*="ch"] .sec a.go{color:var(--cc);font-weight:600}
.pb{border-color:var(--cc);color:var(--cc);background:var(--card)}
.pb.playing{background:var(--cc);color:var(--card)}
.grp{border-left:5px solid var(--cc);background:var(--cb);border-radius:0 12px 12px 0;padding:8px 10px 6px 12px;margin:0 0 12px}
.grp h3{margin:0 0 6px;color:var(--cc)}
header{border-bottom:3px solid var(--cc)}
header h1{color:var(--cc)}
.back{border-color:var(--cc);color:var(--cc)}
#spec{border-color:var(--cc)}
nav.tabs a[data-t="home"].on{color:var(--k8)}nav.tabs a[data-t="list"].on{color:var(--k1)}nav.tabs a[data-t="flows"].on{color:var(--k2)}nav.tabs a[data-t="examples"].on{color:var(--k0)}nav.tabs a[data-t="sounds"].on{color:var(--k6)}
nav.tabs a.on{border-top:3px solid currentColor;margin-top:-3px}
/* flow node types: 判断=紫 作業=青 ポイント=オレンジ 完成=緑 */
.node.q{background:var(--b1);border:1.5px solid var(--k1)}.node.q .h{color:var(--k1)}
.node.a{background:var(--b2);border:1.5px solid var(--k2)}.node.a .h{color:var(--k2)}
.node.w{background:var(--b0);border:1.5px solid var(--k0)}.node.w .h{color:var(--k0)}
.node.e{background:var(--b4);border:1.5px solid var(--k4)}.node.e .h{color:var(--k4)}
.node .h:after{margin-left:auto;font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px;color:var(--card);flex:none;align-self:center}
.node.q .h:after{content:"判断";background:var(--k1)}.node.a .h:after{content:"作業";background:var(--k2)}.node.w .h:after{content:"ポイント";background:var(--k0)}.node.e .h:after{content:"完成";background:var(--k4)}
.node .h .n{color:inherit;opacity:.7}
.node .d{color:var(--ink)}
.node .pb{border-color:currentColor}
.node.q .pb{color:var(--k1)}.node.a .pb{color:var(--k2)}.node.w .pb{color:var(--k0)}.node.e .pb{color:var(--k4)}
.arrow{background:var(--sub);width:3px}.arrow:after{border-top-color:var(--sub)}
.blabel{color:var(--card)!important;background:var(--k1);border-radius:99px;padding:2px 0}
.pill{color:var(--card)!important;background:var(--k1)}
.legend span{display:inline-flex;align-items:center;font-weight:600}
.legend i{width:14px;height:14px;border-width:1.5px!important}
.seg button.b1.on{background:var(--k2);border-color:var(--k2);color:#fff}.seg button.b2.on{background:var(--k0);border-color:var(--k0);color:#fff}
.seg button.b1{color:var(--k2);border-color:var(--k2)}.seg button.b2{color:var(--k0);border-color:var(--k0)}
.role{background:var(--cb2,var(--b1));color:var(--cc2,var(--k1));border-left:5px solid var(--cc2,var(--k1));border-radius:0 10px 10px 0;font-weight:600}
.mode-basic{--cc2:var(--k2);--cb2:var(--b2)}.mode-adv{--cc2:var(--k0);--cb2:var(--b0)}
.panel.fx{border-left:5px solid var(--cc)}.panel.fx h4{color:var(--cc)}.panel.fx.on{border-color:var(--cc);background:var(--cb)}
.panel.fx .ctl input[type=range]{accent-color:var(--cc)}.panel.fx .sw input:checked+span{background:var(--cc)}
.panel h4{color:var(--cc)}
.colorkey{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}.colorkey span{font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--cb);color:var(--cc);border:1px solid var(--cc)}
</style>

<script>
let AC,M,AN,RV,CMP,NB,BB;
function A(){
  if(!AC){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    CMP=AC.createDynamicsCompressor();CMP.threshold.value=-10;CMP.ratio.value=12;CMP.attack.value=.003;CMP.release.value=.25;
    M=AC.createGain();M.gain.value=.8;
    AN=AC.createAnalyser();AN.fftSize=4096;AN.smoothingTimeConstant=.7;
    M.connect(CMP);CMP.connect(AN);AN.connect(AC.destination);
    NB=mkNoise(false);BB=mkNoise(true);
    RV=AC.createConvolver();RV.buffer=imp(2.8,3);RV.connect(M);
    buildFX();M.disconnect();M.connect(FX.in);FX.out.connect(CMP);
    requestAnimationFrame(drawSpec);
  }
  if(AC.state!=='running')AC.resume();
  return AC;
}
function mkNoise(brown){const n=AC.sampleRate*3,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;if(brown){l=(l+.02*w)/1.02;d[i]=l*3.5}else d[i]=w*.8}return b}
function imp(sec,dec){const n=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(2,n,AC.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,dec)}return b}
const R=(a,b)=>a+Math.random()*(b-a);
function out(node,o={}){let n=node;if(o.pan!==undefined&&AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=o.pan;n.connect(p);n=p}const g=AC.createGain();g.gain.value=o.vol??1;n.connect(g);g.connect(o.dest||M);if(o.rev){const s=AC.createGain();s.gain.value=o.rev;g.connect(s);s.connect(RV)}return g}
function noise(t,dur,brown){const s=AC.createBufferSource();s.buffer=brown?BB:NB;s.loop=true;s.start(t,Math.random()*2);s.stop(t+dur+.1);return s}
function osc(type,f,t,dur){const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.start(t);o.stop(t+dur+.1);return o}
function filt(type,f,q=1,gain=0){const b=AC.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;b.gain.value=gain;return b}
function vca(t,a,peak,d,hold=0){const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);if(hold)g.gain.setValueAtTime(peak,t+a+hold);g.gain.exponentialRampToValueAtTime(.0001,t+a+hold+d);return g}
function chain(...n){for(let i=0;i<n.length-1;i++)n[i].connect(n[i+1]);return n[n.length-1]}
function shaper(k){const s=AC.createWaveShaper(),n=2048,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(1+k)*x/(1+k*Math.abs(x))}s.curve=c;s.oversample='2x';return s}
function lfo(t,dur,type,rate,depth,param){const l=osc(type,rate,t,dur),g=AC.createGain();g.gain.value=depth;l.connect(g);g.connect(param);return l}
function bus(o={}){const g=AC.createGain();out(g,o);return g}
function delayBus(time,fb,o={}){const inp=AC.createGain(),d=AC.createDelay(2),f=AC.createGain(),lp=filt('lowpass',2500);d.delayTime.value=time;f.gain.value=fb;inp.connect(d);d.connect(lp);lp.connect(f);f.connect(d);out(inp,o);out(lp,o);return inp}

function thump(t,f0=120,f1=40,dur=.3,vol=1,o={}){const s=osc('sine',f0,t,dur);s.frequency.exponentialRampToValueAtTime(f1,t+dur*.6);out(chain(s,vca(t,.002,vol,dur)),o)}
function nb(t,dur,type,f,q,vol,o={},a=.002,brown=false){const n=noise(t,dur+a,brown);out(chain(n,filt(type,f,q),vca(t,a,vol,dur)),o)}
function tone(t,type,f,dur,vol,o={},a=.005){const s=osc(type,f,t,dur);out(chain(s,filt('lowpass',6000),vca(t,a,vol,dur)),o);return s}
function metal(t,mul=1,dur=1.6,vol=.4,o={}){[523,1397,2331,3520,4870].forEach((f,i)=>{const s=osc('sine',f*mul,t,dur);out(chain(s,vca(t,.001,vol/(i+1.2),dur/(1+i*.3))),o)});nb(t,.03,'highpass',3000,1,.3*vol,o)}
function hiss(t,dur,vol=.05){const n=noise(t,dur),g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.1);g.gain.setValueAtTime(vol,t+dur-.2);g.gain.linearRampToValueAtTime(0,t+dur);out(chain(n,filt('highpass',2500,.5),g))}
function swoosh(t,dur,f0,f1,vol,o={}){const n=noise(t,dur),f=filt('bandpass',f0,1.5);f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);out(chain(n,f,vca(t,dur*.6,vol,dur*.5)),o)}

function windS(t,dur=5,brown=false,o={}){const n=noise(t,dur,brown),f=filt('lowpass',300,brown?10:14),g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(brown?.9:.55,t+1);g.gain.setValueAtTime(brown?.9:.55,t+dur-1.5);g.gain.linearRampToValueAtTime(0,t+dur);let x=t;f.frequency.setValueAtTime(300,t);while(x<t+dur-.3){x+=R(.35,.8);f.frequency.linearRampToValueAtTime(R(250,brown?900:1500),x)}out(chain(n,f,g),{rev:.15,...o})}
function footStep(t,o={},v=1,var_=true){const f=var_?R(450,750):600;nb(t,.1,'bandpass',f,1.2,.7*v,o);thump(t,var_?R(100,130):115,55,.09,.6*v,o);nb(t+.07,.06,'bandpass',f*2.4,1.5,.35*v,o)}
function cuteStep(t,p=1){const s=osc('sine',900*p,t,.15);s.frequency.exponentialRampToValueAtTime(380*p,t+.08);out(chain(s,vca(t,.002,.45,.13)))}
function boomCore(t,o={},vol=1){const n=noise(t,1.8,true),f=filt('lowpass',500,.7);f.frequency.setValueAtTime(1800,t);f.frequency.exponentialRampToValueAtTime(220,t+1.2);out(chain(n,f,shaper(25),vca(t,.004,.55*vol,1.5)),o);thump(t,70,28,1.3,.9*vol,o)}
function pew(t,f0=1800,f1=140,dur=.3,vol=.3,o={}){const s=osc('square',f0,t,dur);s.frequency.exponentialRampToValueAtTime(f1,t+dur);lfo(t,dur,'sine',40,60,s.frequency);out(chain(s,filt('lowpass',4000),vca(t,.002,vol,dur)),o)}
function formantVoice(t,f0,dur,forms,vol=.5,o={},type='sawtooth'){const s=osc(type,f0,t,dur),mix=AC.createGain();forms.forEach(([f,q,g])=>{const b=filt('bandpass',f,q),gg=AC.createGain();gg.gain.value=g;s.connect(b);b.connect(gg);gg.connect(mix)});out(chain(mix,vca(t,.03,vol,dur*.4,dur*.5)),o);return s}

function thumpTo(t,f0,f1,dur,vol,dest){const s=osc('sine',f0,t,dur);s.frequency.exponentialRampToValueAtTime(f1,t+dur*.6);chain(s,vca(t,.002,vol,dur),dest);const n=noise(t,.1,true);chain(n,vca(t,.002,vol*.6,.08),dest)}
function heliS(t,p){const d=5,fade=g=>{g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+.8);g.gain.setValueAtTime(1,t+d-1);g.gain.linearRampToValueAtTime(0,t+d);return g};
  if(p.rotor){const n=noise(t,d,true),f=filt('lowpass',450,1),am=AC.createGain();am.gain.value=.5;lfo(t,d,'triangle',6,.5,am.gain);out(chain(n,f,am,fade(AC.createGain())),{vol:1.2})}
  if(p.tail){const n=noise(t,d),f=filt('bandpass',1800,2),am=AC.createGain();am.gain.value=.08;lfo(t,d,'sine',22,.08,am.gain);out(chain(n,f,am,fade(AC.createGain())))}
  if(p.engine){const s=osc('sawtooth',120,t,d);s.frequency.exponentialRampToValueAtTime(240,t+d);const w=osc('sine',3100,t,d);w.frequency.linearRampToValueAtTime(3600,t+d);const wg=AC.createGain();wg.gain.value=.25;w.connect(wg);const mix=AC.createGain();s.connect(mix);wg.connect(mix);out(chain(mix,filt('lowpass',2500),fade(AC.createGain())),{vol:.12})}}
function screamS(t){const s=osc('sawtooth',850,t,1.6);s.frequency.exponentialRampToValueAtTime(1150,t+.1);for(let x=.15;x<1.1;x+=.05)s.frequency.linearRampToValueAtTime(R(1050,1200),t+x);s.frequency.exponentialRampToValueAtTime(650,t+1.5);
  const mix=AC.createGain();[[1000,3,1],[2700,4,.6],[3600,5,.4]].forEach(([f,q,g])=>{const b=filt('bandpass',f,q),gg=AC.createGain();gg.gain.value=g;s.connect(b);b.connect(gg);gg.connect(mix)});
  out(chain(mix,shaper(6),filt('lowpass',5000),vca(t,.04,.35,.35,1.1)),{rev:.35})}

function synthBus(){A();if(!delayIn||delayIn.context!==AC){delayIn=delayBus(.3,.4)}return delayIn}
function noteOn(m){const ac=A();noteOff(m,true);const t=ac.currentTime+.005,f=440*Math.pow(2,(m-69)/12+SP.oct);
  const v={srcs:[],m};const mix=AC.createGain();

    if(SP.lfoT==='pitch'){lg.gain.value=SP.lfoD*f*.3;v.srcs.forEach(s=>s.frequency&&s!==l&&lg.connect(s.frequency))}
    else if(SP.lfoT==='filter'){lg.gain.value=SP.lfoD*SP.cut;lg.connect(fl.frequency)}
    else{const tg=AC.createGain();tg.gain.value=1-SP.lfoD/2;lg.gain.value=SP.lfoD/2;lg.connect(tg.gain);lvl.disconnect();lvl.connect(tg);lvl._o=tg}}

const SM={buf:null,name:'',start:0,len:1,pitch:0,rev:false,cut:18000,res:1,A:.002,Rl:.2,rv:.1,dist:0,loop:false};const svoices={};

function makeClap(){A();const sr=AC.sampleRate,n=sr*.4,b=AC.createBuffer(1,n,sr),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){const t=i/sr,w=Math.random()*2-1;l+=.3*(w-l);const e=[0,.008,.017].reduce((a,x)=>a+(t>=x?Math.exp(-(t-x)*60):0),0);d[i]=(w-l)*e*.6}return b}
function revBuf(b){const c=AC.createBuffer(b.numberOfChannels,b.length,b.sampleRate);for(let ch=0;ch<b.numberOfChannels;ch++){const s=b.getChannelData(ch),d=c.getChannelData(ch);for(let i=0;i<s.length;i++)d[i]=s[s.length-1-i]}return c}
function sOn(m){if(!SM.buf)return;const ac=A();sOff(m,true);const t=ac.currentTime+.005;const s=AC.createBufferSource();s.buffer=SM.rev?(SM._rb||(SM._rb=revBuf(SM.buf))):SM.buf;s.playbackRate.value=Math.pow(2,(m-60+SM.pitch)/12);
  const dur=SM.buf.duration,st=SM.start*dur,ln=Math.max(.02,SM.len*(dur-st));if(SM.loop){s.loop=true;s.loopStart=st;s.loopEnd=st+ln}
  const fl=filt('lowpass',SM.cut,SM.res),g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+SM.A);let last=chain(s,fl);if(SM.dist>0)last=chain(last,shaper(SM.dist*40));chain(last,g);out(g,{rev:SM.rv,vol:.9});

function kbHTML(){let h='<div class="kb">';const bl=[1,3,6,8,10];let wi=0;for(let m=48;m<=72;m++){const n=m%12;if(!bl.includes(n)){h+=`<div class="wk" data-m="${m}" style="left:${wi*100/15}%">${n===0?'C'+(Math.floor(m/12)-1):''}</div>`;wi++}}wi=0;for(let m=48;m<=72;m++){const n=m%12;if(bl.includes(n))h+=`<div class="bk" data-m="${m}" style="left:${wi*100/15-100/15*.3}%"></div>`;else wi++}return h+'</div>'}

function kbInit(on,off){KB={on,off};const kb=document.querySelector('.kb');if(!kb)return;const act={};
  kb.addEventListener('pointerdown',e=>{const k=e.target.closest('[data-m]');if(!k)return;e.preventDefault();kb.setPointerCapture(e.pointerId);const m=+k.dataset.m;act[e.pointerId]=m;KB.on(m)});
  kb.addEventListener('pointermove',e=>{if(act[e.pointerId]===undefined)return;const el=document.elementFromPoint(e.clientX,e.clientY);const k=el&&el.closest&&el.closest('[data-m]');if(k&&+k.dataset.m!==act[e.pointerId]){KB.off(act[e.pointerId]);act[e.pointerId]=+k.dataset.m;KB.on(+k.dataset.m)}});
  const up=e=>{if(act[e.pointerId]!==undefined){KB.off(act[e.pointerId]);delete act[e.pointerId]}};kb.addEventListener('pointerup',up);kb.addEventListener('pointercancel',up)}

addEventListener('keydown',e=>{if(e.repeat||e.target.tagName==='INPUT'&&e.target.type!=='range')return;const m=KMAP[e.key.toLowerCase()];if(m!==undefined&&document.querySelector('.kb')&&!held[m]){held[m]=1;KB.on(m)}});
addEventListener('keyup',e=>{const m=KMAP[e.key.toLowerCase()];if(m!==undefined&&held[m]){delete held[m];KB.off(m)}});

function xyHTML(lbx,lby){return `<div class="xy" id="xy"><div class="dot" id="xydot"></div><span class="xl">← ${lbx} →</span><span class="yl">↑ ${lby}</span></div>`}
function xyInit(get,set){const p=document.getElementById('xy'),d=document.getElementById('xydot');if(!p)return;const place=()=>{const [x,y]=get();d.style.left=x*100+'%';d.style.top=(1-y)*100+'%'};window._xyPlace=place;place();
  const mv=e=>{const r=p.getBoundingClientRect();const x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),y=Math.min(1,Math.max(0,1-(e.clientY-r.top)/r.height));set(x,y);place()};
  p.addEventListener('pointerdown',e=>{e.preventDefault();p.setPointerCapture(e.pointerId);mv(e)});p.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')mv(e)})}
const lg=(v,a,b)=>Math.log(v/a)/Math.log(b/a),ex=(x,a,b)=>a*Math.pow(b/a,x);

function ctl(obj,key,label,min,max,step,fmt,live){const v=obj[key];return `<label class="ctl"><span>${label}<b id="v_${key}">${fmt?fmt(v):v}</b></span><input type="range" min="${min}" max="${max}" step="${step}" value="${v}" data-k="${key}" data-live="${live||''}"></label>`}
function sel(obj,key,label,opts){return `<label class="ctl"><span>${label}</span><select data-k="${key}">${opts.map(o=>`<option value="${o[0]}" ${obj[key]==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label>`}
function bindCtl(obj,fmts,onLive){document.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;el.addEventListener(el.tagName==='SELECT'?'change':'input',()=>{obj[k]=el.tagName==='SELECT'?el.value:(el.type==='checkbox'?el.checked:parseFloat(el.value));const b=document.getElementById('v_'+k);if(b)b.textContent=fmts[k]?fmts[k](obj[k]):obj[k];if(onLive)onLive(k)})})}
const fHz=v=>v>=1000?(v/1000).toFixed(1)+'kHz':Math.round(v)+'Hz',fS=v=>(+v).toFixed(2)+'秒',fP=v=>Math.round(v*100)+'%',fSt=v=>(v>0?'+':'')+v;
const WAVES=[['sine','サイン波'],['triangle','三角波'],['square','矩形波'],['sawtooth','ノコギリ波'],['noise','ノイズ']];

function synthInit(){bindCtl(SP,{det:v=>v+'cent',mix2:fP,oct:fSt,A:fS,D:fS,S:fP,Rl:fS,cut:fHz,res:v=>(+v).toFixed(1),fenv:fP,pAmt:v=>fSt(v)+'半音',pTime:fS,lfoR:v=>(+v).toFixed(1)+'Hz',lfoD:fP,dist:fP,dly:fP,rv:fP,vol:fP},k=>{if(k==='cut'||k==='res'){liveFilter();window._xyPlace&&_xyPlace()}});kbInit(noteOn,noteOff);xyInit(xyG,xyS)}
const xyG=()=>[lg(SP.cut,60,16000),(SP.res-.5)/24.5],xyS=(x,y)=>{SP.cut=ex(x,60,16000);SP.res=.5+y*24.5;liveFilter();syncCtl(SP,['cut','res'])};

V.sampler=function(){setHead("サンプラー",true,"sounds");back.href='#sounds';
  return SPEC+`<div class="panel ch4" style="border-left:5px solid var(--cc)"><h4>音を読み込む</h4><p class="hint" style="margin-top:0">スマホで録った息や身近なモノの音など、自分の音声ファイル（mp3・wav・m4aなど）を選べます。0-3の「スマホで風の音」もここで試せます。</p>

  <a class="card" href="#fx" style="margin-bottom:10px"><small>EQ・歪み・ワウ・コーラス・ディレイ・リバーブなど</small><strong>エフェクターを開く →</strong></a>${recHTML()}<div class="note">試してみよう：手拍子を読み込み、ピッチを-48半音（4オクターブ下）、ディストーションを上げると6-9の爆発音になります。息の音はフィルターを下げ、レゾナンスを上げてパッドを動かすと風になります。</div>`};
function samplerInit(){bindCtl(SM,{start:fP,len:fP,pitch:v=>fSt(v)+'半音',cut:fHz,res:v=>(+v).toFixed(1),A:fS,Rl:fS,dist:fP,rv:fP},k=>{if(k==='cut'||k==='res'){sLive();window._xyPlace&&_xyPlace()}if(k==='start'||k==='len')drawWave()});kbInit(sOn,sOff);xyInit(sxyG,sxyS);drawWave();
  document.getElementById('sfile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const ab=await f.arrayBuffer();A();SM.buf=await AC.decodeAudioData(ab);SM._rb=null;SM.name=f.name;document.getElementById('sname').textContent='読み込み中：'+f.name;drawWave();sOn(60);setTimeout(()=>sOff(60),1500)}catch(err){document.getElementById('sname').textContent='このファイルは読み込めませんでした'}})}
const sxyG=()=>[lg(SM.cut,60,18000),(SM.res-.5)/24.5],sxyS=(x,y)=>{SM.cut=ex(x,60,18000);SM.res=.5+y*24.5;sLive();syncCtl(SM,['cut','res'])};
function loadBuiltin(k){SM.buf=k==='breath'?makeBreath():makeClap();SM._rb=null;SM.name=k==='breath'?'内蔵：息の音':'内蔵：手拍子';if(k==='breath'){Object.assign(SM,{pitch:0,cut:500,res:12,loop:true,start:.1,len:.8,A:.3,Rl:1})}else{Object.assign(SM,{pitch:0,cut:18000,res:1,loop:false,start:0,len:1,A:.002,Rl:.3})}render();sOn(60);setTimeout(()=>sOff(60),1200)}
function drawWave(){const cv=document.getElementById('wave');if(!cv)return;const c=cv.getContext('2d'),w=cv.width=cv.clientWidth*devicePixelRatio,h=cv.height=cv.clientHeight*devicePixelRatio;c.clearRect(0,0,w,h);const cs=getComputedStyle(document.documentElement);if(!SM.buf){c.fillStyle=cs.getPropertyValue('--line');c.fillRect(0,h/2,w,1);return}
  const d=SM.buf.getChannelData(0),st=Math.floor(d.length/w);c.fillStyle=cs.getPropertyValue('--mute');for(let x=0;x<w;x++){let mx=0;for(let i=0;i<st;i+=4)mx=Math.max(mx,Math.abs(d[x*st+i]||0));c.fillRect(x,h/2-mx*h/2,1,mx*h)}
  const a=SM.start*w,b=a+SM.len*(w-a);c.fillStyle=cs.getPropertyValue('--acc');c.globalAlpha=.25;c.fillRect(a,0,b-a,h);c.globalAlpha=1;c.fillRect(a,0,2*devicePixelRatio,h);c.fillRect(b-2,0,2*devicePixelRatio,h)}

const FXORDER=['eq','dist','wah','ring','mod','trem','dly','rev'];
const FXSERIAL={eq:1,dist:1,wah:1,ring:1,trem:1};
let FX=null,REC=null,MR=null,CLIPS=[],recChunks=[];
function blk(){const b={in:AC.createGain(),out:AC.createGain(),dry:AC.createGain(),wet:AC.createGain()};b.in.connect(b.dry);b.dry.connect(b.out);b.wet.connect(b.out);return b}
function buildFX(){const F={};const T=AC.currentTime;
  {const b=blk(),hp=filt('highpass',20,.7),ls=filt('lowshelf',120),pk=filt('peaking',1000,1),hs=filt('highshelf',6000),lp=filt('lowpass',20000,.7);chain(b.in,hp,ls,pk,hs,lp,b.wet);Object.assign(b,{hp,ls,pk,hs,lp});F.eq=b}
  {const b=blk(),sh=AC.createWaveShaper(),tr=AC.createGain();sh.oversample='4x';chain(b.in,sh,tr,b.wet);Object.assign(b,{sh,tr});F.dist=b}
  {const b=blk(),bp=filt('bandpass',700,6),l=AC.createOscillator(),lg=AC.createGain(),mk=AC.createGain();mk.gain.value=2.2;l.start();l.connect(lg);lg.connect(bp.frequency);chain(b.in,bp,mk,b.wet);Object.assign(b,{bp,l,lg});F.wah=b}
  {const b=blk(),g=AC.createGain(),o=AC.createOscillator();g.gain.value=0;o.start();o.connect(g.gain);chain(b.in,g,b.wet);Object.assign(b,{o});F.ring=b}
  {const b=blk(),d=AC.createDelay(.1),fb=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();l.start();l.connect(lg);lg.connect(d.delayTime);chain(b.in,d,b.wet);d.connect(fb);fb.connect(d);Object.assign(b,{d,fb,l,lg});F.mod=b}
  {const b=blk(),g=AC.createGain(),p=AC.createStereoPanner(),l=AC.createOscillator(),lv=AC.createGain(),lp=AC.createGain();l.start();l.connect(lv);lv.connect(g.gain);l.connect(lp);lp.connect(p.pan);chain(b.in,g,p,b.wet);Object.assign(b,{g,p,l,lv,lp});F.trem=b}
  {const b=blk(),d=AC.createDelay(2),fb=AC.createGain(),tn=filt('lowpass',4000);chain(b.in,d,tn,b.wet);tn.connect(fb);fb.connect(d);Object.assign(b,{d,fb,tn});F.dly=b}
  {const b=blk(),pre=AC.createDelay(.5),cv=AC.createConvolver();cv.buffer=imp(2.5,3);chain(b.in,pre,cv,b.wet);Object.assign(b,{pre,cv,_size:2.5});F.rev=b}
  F.in=AC.createGain();let last=F.in;FXORDER.forEach(k=>{last.connect(F[k].in);last=F[k].out});F.out=last;F._d=null;FX=F;fxApply()}
function distCurve(drive,bits){const n=4096,c=new Float32Array(n),k=drive*60+.5,L=Math.pow(2,bits-1);for(let i=0;i<n;i++){const x=i*2/n-1;let y=Math.tanh(k*x)/Math.tanh(k);if(bits<16)y=Math.round(y*L)/L;c[i]=y}return c}
function fxApply(){if(!FX)return;const t=AC.currentTime,S=(p,v)=>p.setTargetAtTime(v,t,.02);
  FXORDER.forEach(k=>{const b=FX[k],P=FXP[k],mix=P.mix??1;if(!P.on){S(b.dry.gain,1);S(b.wet.gain,0)}else if(FXSERIAL[k]){S(b.dry.gain,1-mix);S(b.wet.gain,mix)}else{S(b.dry.gain,1);S(b.wet.gain,mix)}});
  const e=FXP.eq,E=FX.eq;S(E.hp.frequency,e.hp);S(E.ls.gain,e.low);S(E.pk.gain,e.mid);S(E.pk.frequency,e.midF);S(E.pk.Q,e.midQ);S(E.hs.gain,e.high);S(E.lp.frequency,e.lp);
  const d=FXP.dist;const key=d.drive+'_'+d.bits;if(FX._d!==key){FX.dist.sh.curve=distCurve(d.drive,d.bits);FX._d=key}S(FX.dist.tr.gain,1/(1+d.drive*1.5));
  const w=FXP.wah;S(FX.wah.bp.frequency,w.base);S(FX.wah.bp.Q,w.q);S(FX.wah.l.frequency,w.rate);S(FX.wah.lg.gain,w.base*w.depth*.9);
  S(FX.ring.o.frequency,FXP.ring.freq);
  const m=FXP.mod;S(FX.mod.d.delayTime,m.time/1000);S(FX.mod.lg.gain,m.time/1000*m.depth*.9);S(FX.mod.l.frequency,m.rate);S(FX.mod.fb.gain,m.fb*.9);
  const r=FXP.trem;S(FX.trem.l.frequency,r.rate);if(r.pan){S(FX.trem.g.gain,1);S(FX.trem.lv.gain,0);S(FX.trem.lp.gain,r.depth)}else{S(FX.trem.g.gain,1-r.depth/2);S(FX.trem.lv.gain,r.depth/2);S(FX.trem.lp.gain,0)}
  const y=FXP.dly;S(FX.dly.d.delayTime,y.time);S(FX.dly.fb.gain,y.fb);S(FX.dly.tn.frequency,y.tone);
  const v=FXP.rev;S(FX.rev.pre.delayTime,v.pre);if(Math.abs(FX.rev._size-v.size)>.05){clearTimeout(FX._rt);FX._rt=setTimeout(()=>{FX.rev.cv.buffer=imp(v.size,3);FX.rev._size=v.size},150)}
  const c=FXP.comp;S(CMP.threshold,c.on?c.th:0);S(CMP.ratio,c.on?c.ratio:1);S(M.gain,FXP.master.vol);
  const ind=document.getElementById('fxind');if(ind){const n=FXORDER.filter(k=>FXP[k].on).length;ind.textContent=n?'FX '+n:'';ind.classList.toggle('hidden',!n)}}
const FXPRE={

const FXTEST=['wind','footFoley','metalHit','vowels','scream','laserTape','clap','decide','heli','envHard'];
V.fx=function(){setHead("エフェクター",true,"sounds");back.href='#sounds';
  return SPEC+`<p class="lead">ここで設定したエフェクトは、アプリで鳴るすべての音（効果音・シンセ・サンプラー）にかかります。上から順に音が通ります。</p>
  <div class="panel"><h4>プリセット</h4><div class="pre">${Object.keys(FXPRE).map(p=>`<button onclick="fxPreset('${p}')">${p}</button>`).join('')}</div></div>
  <div class="panel"><h4>試す音</h4><div class="pbs">${FXTEST.map(k=>pb(k,1)).join('')}</div>${kbHTML()}<p class="hint">鍵盤はシンセの音（シンセ画面で選んだ音色）で鳴ります。</p></div>
  ${recHTML()}
  ${fxPanel('eq','① イコライザー（5-3）','いらない帯域を削り、欲しい帯域を持ち上げる',fxCtl('eq','hp','ローカット',20,1000,1,fHz)+fxCtl('eq','low','低域（120Hz）',-18,18,.5,fDb)+fxCtl('eq','midF','中域の周波数',150,8000,1,fHz)+fxCtl('eq','mid','中域の量',-18,18,.5,fDb)+fxCtl('eq','midQ','中域の幅（Q）',.3,10,.1,fX)+fxCtl('eq','high','高域（6kHz）',-18,18,.5,fDb)+fxCtl('eq','lp','ハイカット',500,20000,1,fHz))}
  ${fxPanel('dist','② ディストーション／ビット','歪ませて荒々しさ・迫力を出す（2-2の叫び声、6-9の爆発）',fxCtl('dist','drive','ドライブ',0,1,.01,fP)+fxCtl('dist','bits','ビット数を下げる',2,16,1,FXFMT['dist.bits'])+fxCtl('dist','mix','かかり具合',0,1,.01,fP))}
  ${fxPanel('wah','③ オートワウ','フィルターをLFOで揺らす（1-2の線の表現）',fxCtl('wah','base','中心の周波数',150,4000,1,fHz)+fxCtl('wah','depth','深さ',0,1,.01,fP)+fxCtl('wah','rate','速さ',.1,12,.1,FXFMT['wah.rate'])+fxCtl('wah','q','鋭さ',1,20,.1,fX))}
  ${fxPanel('ring','④ リングモジュレーター（3-4）','金属的・ロボット的な音に（大きな音に注意）',fxCtl('ring','freq','周波数',20,3000,1,fHz)+fxCtl('ring','mix','かかり具合',0,1,.01,fP))}
  ${fxPanel('mod','⑤ コーラス／フランジャー','短いディレイを揺らしてうねりを作る（2-1のPhaser的な効果）',fxCtl('mod','time','ディレイ時間',.5,20,.1,FXFMT['mod.time'])+fxCtl('mod','depth','深さ',0,1,.01,fP)+fxCtl('mod','rate','速さ',.05,8,.01,FXFMT['mod.rate'])+fxCtl('mod','fb','フィードバック',0,1,.01,fP)+fxCtl('mod','mix','かかり具合',0,1,.01,fP))}
  ${fxPanel('trem','⑥ トレモロ／オートパン','音量や左右の位置を周期的に揺らす',fxCtl('trem','rate','速さ',.1,20,.1,FXFMT['trem.rate'])+fxCtl('trem','depth','深さ',0,1,.01,fP)+`<label class="ctl chk"><input type="checkbox" data-fxchk="trem.pan" ${FXP.trem.pan?'checked':''}> 左右に揺らす（オートパン）</label>`)}
  ${fxPanel('dly','⑦ ディレイ','やまびこ。6-7のスローモーション表現',fxCtl('dly','time','間隔',.02,1.5,.01,fMs)+fxCtl('dly','fb','くり返し',0,.9,.01,fP)+fxCtl('dly','tone','音色（こもらせる）',500,12000,1,fHz)+fxCtl('dly','mix','かかり具合',0,1,.01,fP))}
  ${fxPanel('rev','⑧ リバーブ（3-3）','空間の響き。長くすると洞窟やホールに',fxCtl('rev','size','響きの長さ',.3,8,.1,fS)+fxCtl('rev','pre','プリディレイ',0,.3,.005,fMs)+fxCtl('rev','mix','かかり具合',0,1.5,.01,fP))}
  ${fxPanel('comp','⑨ コンプレッサー／リミッター（3-1）','音量のばらつきを抑え、0dBを超えないように守る',fxCtl('comp','th','スレッショルド',-40,0,1,FXFMT['comp.th'])+fxCtl('comp','ratio','レシオ',1,20,.5,FXFMT['comp.ratio']))}
  <div class="panel"><h4>マスター音量</h4>${fxCtl('master','vol','音量',0,1,.01,fP)}</div>`};
function fxInit(){A();if(!FX)buildFX();kbInit(noteOn,noteOff);recInit();
  document.querySelectorAll('[data-fx]').forEach(el=>el.addEventListener('input',()=>{const [b,k]=el.dataset.fx.split('.');FXP[b][k]=parseFloat(el.value);const o=document.getElementById(`fv_${b}_${k}`);if(o)o.textContent=FXFMT[b+'.'+k]?FXFMT[b+'.'+k](FXP[b][k]):FXP[b][k];if(!FXP[b].on&&b!=='master'){FXP[b].on=true;const c=document.querySelector(`[data-fxon="${b}"]`);if(c)c.checked=true;document.getElementById('fxp_'+b).classList.add('on')}fxApply()}));
  document.querySelectorAll('[data-fxon]').forEach(el=>el.addEventListener('change',()=>{const b=el.dataset.fxon;FXP[b].on=el.checked;document.getElementById('fxp_'+b).classList.toggle('on',el.checked);fxApply()}));
  document.querySelectorAll('[data-fxchk]').forEach(el=>el.addEventListener('change',()=>{const [b,k]=el.dataset.fxchk.split('.');FXP[b][k]=el.checked?1:0;fxApply()}))}

/* ---------- Recorder (in-app) ---------- */
function recHTML(){return `<div class="panel"><div class="fxh"><h4>録音（アプリ内）</h4><button class="recb${MR&&MR.state==='recording'?' on':''}" id="recb" onclick="recToggle()">${MR&&MR.state==='recording'?'■ 停止':'● 録音'}</button></div><p class="hint" style="margin:0 0 6px">エフェクト後の音をそのまま録音します。録った音はここで再生したり、サンプラーに送ってさらに加工できます（アプリを閉じると消えます）。</p><div id="clips">${clipsHTML()}</div></div>`}
function clipsHTML(){return CLIPS.length?CLIPS.map((c,i)=>`<div class="clip"><span>${esc(c.name)}</span><audio controls src="${c.url}"></audio><div class="pre"><button onclick="clipToSampler(${i})">サンプラーへ送る</button><button onclick="clipDel(${i})">削除</button></div></div>`).join(''):'<div class="hint">まだ録音はありません</div>'}
function recInit(){}
function recToggle(){A();if(!REC){REC=AC.createMediaStreamDestination();CMP.connect(REC)}
  if(MR&&MR.state==='recording'){MR.stop();return}
  if(!window.MediaRecorder){document.getElementById('clips').innerHTML='<div class="hint">このブラウザでは録音できません</div>';return}
  recChunks=[];try{MR=new MediaRecorder(REC.stream)}catch(e){document.getElementById('clips').innerHTML='<div class="hint">このブラウザでは録音できません</div>';return}
  MR.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};MR.onstop=()=>{const blob=new Blob(recChunks,{type:MR.mimeType||'audio/webm'});CLIPS.unshift({blob,url:URL.createObjectURL(blob),name:'録音 '+new Date().toLocaleTimeString('ja-JP')});updRec()};MR.start();updRec()}
function updRec(){document.querySelectorAll('#recb').forEach(b=>{const on=MR&&MR.state==='recording';b.textContent=on?'■ 停止':'● 録音';b.classList.toggle('on',on)});const c=document.getElementById('clips');if(c)c.innerHTML=clipsHTML()}
async function clipToSampler(i){const c=CLIPS[i];try{A();const ab=await c.blob.arrayBuffer();SM.buf=await AC.decodeAudioData(ab);SM._rb=null;SM.name=c.name;Object.assign(SM,{start:0,len:1,loop:false});location.hash='#sampler'}catch(e){alertBox('この録音はサンプラーで読み込めませんでした')}}
function clipDel(i){URL.revokeObjectURL(CLIPS[i].url);CLIPS.splice(i,1);updRec()}
function alertBox(t){const c=document.getElementById('clips');if(c)c.insertAdjacentHTML('afterbegin',`<div class="hint" style="color:var(--warm)">${t}</div>`)}

let last='';
addEventListener('hashchange',()=>{const h=location.hash;if(EX[h.slice(1)]&&last!==h)window._mode='basic';last=h;render();scrollTo(0,0)});
render();
</script>
<script>
if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
</html>
