&lt;html lang=&quot;ja&quot;&gt;

&lt;style&gt;
:root{
  --bg:#16131c; --panel:#211c2a; --panel2:#2a2435; --line:#3a3248; --text:#f3eef8; --mute:#a99fb8;
  --T:#ff7eb6; --SD:#4fd1c5; --D:#a78bfa; --SDm:#60a5fa; --acc:#ffd166;
  --wk:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:&quot;M PLUS Rounded 1c&quot;,system-ui,sans-serif;font-size:15px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:rgba(22,19,28,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.top h1{font-size:17px;margin:0;font-weight:800;flex:1;white-space:nowrap}
.top h1 small{color:var(--mute);font-weight:400;font-size:11px;margin-left:6px}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font:inherit;font-weight:700}
.midi{font-size:11px;padding:5px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.midi.ok{border-color:var(--SD);color:var(--SD)}
nav{display:flex;gap:6px;overflow-x:auto;padding:4px 12px 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--mute)}
nav button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
main{padding:14px 12px 230px;max-width:820px;margin:0 auto}
h2{font-size:20px;margin:4px 0 4px;font-weight:800}
h3{font-size:15px;margin:22px 0 8px;font-weight:800;color:var(--acc)}
p.lead{color:var(--mute);margin:0 0 12px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:active,.row.sel{background:var(--panel2)}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:8px 0}
.nm{font-weight:800;min-width:74px}
.sub{color:var(--mute);font-size:12px}
.grow{flex:1;min-width:0}
.notes{font-weight:700;letter-spacing:.02em}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;border:1.5px solid currentColor;margin-right:4px;white-space:nowrap}
.T{color:var(--T)} .SD{color:var(--SD)} .D{color:var(--D)} .SDm{color:var(--SDm)}
.hl{background:linear-gradient(transparent 55%,rgba(255,126,182,.35) 55%);padding:0 2px}
.hl2{background:linear-gradient(transparent 55%,rgba(79,209,197,.35) 55%);padding:0 2px}
.steps{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.steps span{font-size:11px;padding:0 6px;border-radius:6px;background:var(--panel2);color:var(--mute)}
.steps span.h{background:rgba(255,126,182,.25);color:var(--T)}
.steps span.w3{background:rgba(255,209,102,.2);color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;text-align:left}
.chip:active,.chip.sel{background:var(--panel2);border-color:var(--mute)}
.chip b{display:block;font-size:17px}
.note{font-size:12px;color:var(--mute);border-left:3px solid var(--acc);padding:4px 10px;margin:8px 0;background:rgba(255,209,102,.06);border-radius:0 8px 8px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mute);font-size:12px;font-weight:700}
tr.click{cursor:pointer} tr.click:active{background:var(--panel2)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin:4px 0 8px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--panel2);color:var(--text)}
.dict{border-radius:14px;background:var(--panel);border:1px solid var(--line);margin:10px 0;overflow:hidden}
.dict .hd{padding:10px 12px 4px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dict .hd b{font-size:17px}
.dict .bd{padding:0 12px 12px;font-size:14px}
.vars{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.vars button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:4px 10px;font-weight:800}
.vars button:active{border-color:var(--T)}
.to{font-size:12px;color:var(--mute)}
.keymap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.keymap .k{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 4px;cursor:pointer}
.keymap .k b{display:block;font-size:18px}
.keymap .k.main{border-color:var(--acc);background:rgba(255,209,102,.08)}
.quiz .q{font-size:18px;font-weight:800;margin:6px 0 12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:12px 6px;font-weight:800;font-size:15px}
.opts button.ok{border-color:var(--SD);background:rgba(79,209,197,.15)}
.opts button.ng{border-color:var(--T);background:rgba(255,126,182,.12)}
.btn{background:var(--text);color:var(--bg);border:0;border-radius:10px;padding:8px 14px;font-weight:800}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
/* bottom dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(22,19,28,.97);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.dinfo{display:flex;align-items:center;gap:8px;padding:0 12px 6px;max-width:820px;margin:0 auto}
.dinfo .t{flex:1;min-width:0}
.dinfo .t b{font-size:16px}
.dinfo .t div{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dinfo button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:800}
.kbwrap{overflow-x:auto;padding:0 8px;scrollbar-width:thin}
.kb{position:relative;height:118px;margin:0 auto;touch-action:manipulation}
.wk,.bk{position:absolute;top:0;border-radius:0 0 6px 6px;display:flex;align-items:flex-end;justify-content:center;font-size:10px;font-weight:800;padding-bottom:5px;user-select:none}
.wk{width:var(--wk);height:118px;background:#f7f3fb;border:1px solid #6b6178;color:#2a2435}
.bk{width:calc(var(--wk)*.62);height:72px;background:#251f2e;border:1px solid #000;z-index:2;color:#fff}
.wk.on{background:var(--T);color:#fff}
.bk.on{background:#d9478f}
.wk.on.r{background:var(--acc);color:#2a2435}
.bk.on.r{background:#d1a019}
.wk.m{box-shadow:inset 0 -8px 0 var(--SD)} .bk.m{box-shadow:inset 0 -8px 0 var(--SD)}
.wk.c::before{content:attr(data-o);position:absolute;top:4px;font-size:9px;color:#9a8fab;font-weight:400}
.wl{display:flex;flex-wrap:wrap;gap:6px}
.wl button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.wl button:active{border-color:var(--acc)}
#wq{width:100%;font:inherit;font-size:16px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);outline:none;margin:4px 0 4px}
#wq:focus{border-color:var(--acc)}
.cl{color:var(--acc);font-weight:800;border-bottom:1.5px dotted var(--acc);cursor:pointer;padding:0 1px;white-space:nowrap}
.cl:active,.cl.sel{background:rgba(255,209,102,.2);border-radius:4px}
.pgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pch{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:5px 9px;font-weight:800;font-size:14px;display:inline-flex;flex-direction:column;align-items:center;line-height:1.25}
.pch small{font-size:10px;color:var(--mute);font-weight:700}
.pch.sel,.pch:active{border-color:var(--T);background:rgba(255,126,182,.15)}
.uses{display:flex;flex-direction:column;gap:2px;margin-top:4px;font-size:12px;color:var(--mute)}
.uses .use b{font-weight:800;margin-right:2px}
.uses small{font-size:10.5px}
details.song{padding:10px 12px;border-bottom:1px solid var(--line)}
details.song:last-child{border-bottom:0}
details.song summary{cursor:pointer;line-height:1.5}
.midiline{font-size:12px;color:var(--SD);padding:0 12px 4px;max-width:820px;margin:0 auto;min-height:0}
@media(min-width:700px){:root{--wk:30px}}

&lt;header&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;h1&gt;音楽理論ノート&lt;small&gt;手書きノートまとめ&lt;/small&gt;&lt;/h1&gt;
    &lt;select id=&quot;keySel&quot; aria-label=&quot;キー&quot;&gt;&lt;/select&gt;
    &lt;button class=&quot;midi&quot; id=&quot;midiBtn&quot;&gt;MIDI&lt;/button&gt;
  &lt;/div&gt;

&lt;/header&gt;
&lt;main id=&quot;main&quot;&gt;&lt;/main&gt;
&lt;div class=&quot;dock&quot;&gt;
  &lt;div class=&quot;midiline&quot; id=&quot;midiLine&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;dinfo&quot;&gt;
    &lt;div class=&quot;t&quot;&gt;&lt;b id=&quot;selName&quot;&gt;鍵盤をタップ / 項目を選択&lt;/b&gt;&lt;div id=&quot;selNotes&quot;&gt;選ぶと音が鳴ります&lt;/div&gt;&lt;/div&gt;
    &lt;button id=&quot;playBlock&quot;&gt;▶ 和音&lt;/button&gt;
    &lt;button id=&quot;playArp&quot;&gt;▶ 分散&lt;/button&gt;

&lt;script&gt;
/* ============ 基本データ ============ */
const LET=&#x27;CDEFGAB&#x27;, NAT=[0,2,4,5,7,9,11];
const IV={ // token: [半音, 度数, 日本語]
 P1:[0,1,&#x27;完全1度&#x27;],m2:[1,2,&#x27;短2度&#x27;],M2:[2,2,&#x27;長2度&#x27;],A2:[3,2,&#x27;増2度&#x27;],m3:[3,3,&#x27;短3度&#x27;],M3:[4,3,&#x27;長3度&#x27;],
 P4:[5,4,&#x27;完全4度&#x27;],A4:[6,4,&#x27;増4度&#x27;],d5:[6,5,&#x27;減5度&#x27;],P5:[7,5,&#x27;完全5度&#x27;],A5:[8,5,&#x27;増5度&#x27;],m6:[8,6,&#x27;短6度&#x27;],
 M6:[9,6,&#x27;長6度&#x27;],d7:[9,7,&#x27;減7度&#x27;],m7:[10,7,&#x27;短7度&#x27;],M7:[11,7,&#x27;長7度&#x27;],P8:[12,8,&#x27;完全8度&#x27;]};
const SHORT={P1:&#x27;完1&#x27;,m2:&#x27;短2&#x27;,M2:&#x27;長2&#x27;,A2:&#x27;増2&#x27;,m3:&#x27;短3&#x27;,M3:&#x27;長3&#x27;,P4:&#x27;完4&#x27;,A4:&#x27;増4&#x27;,d5:&#x27;減5&#x27;,P5:&#x27;完5&#x27;,A5:&#x27;増5&#x27;,m6:&#x27;短6&#x27;,M6:&#x27;長6&#x27;,d7:&#x27;減7&#x27;,m7:&#x27;短7&#x27;,M7:&#x27;長7&#x27;};
const MAJ_NAMES=[&#x27;C&#x27;,&#x27;Db&#x27;,&#x27;D&#x27;,&#x27;Eb&#x27;,&#x27;E&#x27;,&#x27;F&#x27;,&#x27;F#&#x27;,&#x27;G&#x27;,&#x27;Ab&#x27;,&#x27;A&#x27;,&#x27;Bb&#x27;,&#x27;B&#x27;];
const MIN_NAMES=[&#x27;C&#x27;,&#x27;C#&#x27;,&#x27;D&#x27;,&#x27;Eb&#x27;,&#x27;E&#x27;,&#x27;F&#x27;,&#x27;F#&#x27;,&#x27;G&#x27;,&#x27;G#&#x27;,&#x27;A&#x27;,&#x27;Bb&#x27;,&#x27;B&#x27;];
function parse(n){const l=LET.indexOf(n[0]);let a=0;for(const c of n.slice(1)){if(c==&#x27;#&#x27;)a++;if(c==&#x27;b&#x27;)a--;}return{l,pc:(NAT[l]+a+12)%12};}
function pcOf(n){return parse(n).pc}
function spell(root,tok){
  const r=parse(root),[semi,deg]=IV[tok];const tp=(r.pc+semi)%12, l=(r.l+deg-1)%7;
  let d=(tp-NAT[l]+12)%12;if(d&gt;6)d-=12;
  return LET[l]+(d&gt;0?&#x27;#&#x27;.repeat(d):&#x27;b&#x27;.repeat(-d));
}
function pn(s){ // pretty note name (letters + accidentals only)
  return s.replace(/^([A-G])(#+|b+)?/,(m,l,a)=&gt;l+(a?(a[0]==&#x27;#&#x27;?(a.length==2?&#x27;𝄪&#x27;:&#x27;♯&#x27;):&#x27;♭&#x27;.repeat(a.length)):&#x27;&#x27;));
}
/* ============ コード ============ */
const CT={
 maj:{s:&#x27;&#x27;,t:[&#x27;P1&#x27;,&#x27;M3&#x27;,&#x27;P5&#x27;],n:&#x27;メジャー・トライアド&#x27;,f:&#x27;ルート＋長3度＋完全5度&#x27;},
 m:{s:&#x27;m&#x27;,t:[&#x27;P1&#x27;,&#x27;m3&#x27;,&#x27;P5&#x27;],n:&#x27;マイナー・トライアド&#x27;,f:&#x27;ルート＋短3度＋完全5度&#x27;},
 aug:{s:&#x27;aug&#x27;,t:[&#x27;P1&#x27;,&#x27;M3&#x27;,&#x27;A5&#x27;],n:&#x27;オーギュメント・トライアド&#x27;,f:&#x27;ルート＋長3度＋増5度（長3度を2つ重ねる）&#x27;},
 dim:{s:&#x27;dim&#x27;,t:[&#x27;P1&#x27;,&#x27;m3&#x27;,&#x27;d5&#x27;],n:&#x27;ディミニッシュ・トライアド&#x27;,f:&#x27;ルート＋短3度＋減5度（短3度を2つ重ねる）&#x27;},
 maj7:{s:&#x27;M7&#x27;,t:[&#x27;P1&#x27;,&#x27;M3&#x27;,&#x27;P5&#x27;,&#x27;M7&#x27;],n:&#x27;メジャー・セブンス&#x27;,f:&#x27;メジャー△＋長7度&#x27;},
 &#x27;7&#x27;:{s:&#x27;7&#x27;,t:[&#x27;P1&#x27;,&#x27;M3&#x27;,&#x27;P5&#x27;,&#x27;m7&#x27;],n:&#x27;（ドミナント）セブンス&#x27;,f:&#x27;メジャー△＋短7度&#x27;},
 mM7:{s:&#x27;mM7&#x27;,t:[&#x27;P1&#x27;,&#x27;m3&#x27;,&#x27;P5&#x27;,&#x27;M7&#x27;],n:&#x27;マイナー・メジャー・セブンス&#x27;,f:&#x27;マイナー△＋長7度&#x27;},
 m7:{s:&#x27;m7&#x27;,t:[&#x27;P1&#x27;,&#x27;m3&#x27;,&#x27;P5&#x27;,&#x27;m7&#x27;],n:&#x27;マイナー・セブンス&#x27;,f:&#x27;マイナー△＋短7度&#x27;},
 m7b5:{s:&#x27;m7(♭5)&#x27;,t:[&#x27;P1&#x27;,&#x27;m3&#x27;,&#x27;d5&#x27;,&#x27;m7&#x27;],n:&#x27;（ハーフ）ディミニッシュ / m7♭5&#x27;,f:&#x27;dim△＋短7度&#x27;},
 dim7:{s:&#x27;dim7&#x27;,t:[&#x27;P1&#x27;,&#x27;m3&#x27;,&#x27;d5&#x27;,&#x27;d7&#x27;],n:&#x27;（フル）ディミニッシュ・セブンス&#x27;,f:&#x27;dim△＋減7度&#x27;},
 m6:{s:&#x27;m6&#x27;,t:[&#x27;P1&#x27;,&#x27;m3&#x27;,&#x27;P5&#x27;,&#x27;M6&#x27;],n:&#x27;マイナー・シックス&#x27;,f:&#x27;マイナー△＋長6度&#x27;},
 augM7:{s:&#x27;augM7&#x27;,t:[&#x27;P1&#x27;,&#x27;M3&#x27;,&#x27;A5&#x27;,&#x27;M7&#x27;],n:&#x27;オーギュメント・メジャー・セブンス&#x27;,f:&#x27;aug△＋長7度&#x27;},
};
function chordName(root,type,bass){return pn(root)+CT[type].s+(bass?&#x27;/&#x27;+pn(bass):&#x27;&#x27;)}
function chordNotes(root,type){return CT[type].t.map(t=&gt;spell(root,t))}
function chordMidi(root,type,bass){
  const r=pcOf(root);
  if(bass){const b=48+pcOf(bass);return [b,...CT[type].t.map(t=&gt;60+r+IV[t][0])];}
  return CT[type].t.map(t=&gt;48+r+IV[t][0]);
}
function roman(tok){const d=IV[tok][1];const R=[&#x27;I&#x27;,&#x27;II&#x27;,&#x27;III&#x27;,&#x27;IV&#x27;,&#x27;V&#x27;,&#x27;VI&#x27;,&#x27;VII&#x27;][d-1];
  const pre={m2:&#x27;♭&#x27;,m3:&#x27;♭&#x27;,m6:&#x27;♭&#x27;,m7:&#x27;♭&#x27;,A4:&#x27;♯&#x27;,A5:&#x27;♯&#x27;,d5:&#x27;♭&#x27;}[tok]||&#x27;&#x27;;return pre+R;}

/* ============ スケール ============ */
const MODES=[

function symNotes(sym){

.drow2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:8px 10px;border-top:1px solid var(--line);align-items:center}
.drow2:first-child{border-top:none}
.drow2.op{background:var(--chip)}
.dl{background:none;border:none;padding:0;text-align:left;min-width:0}
.dln{display:block;font-weight:700;font-size:14px;line-height:1.3}
.dlf{display:block;font-size:11px;font-weight:700;line-height:1.4}
.dlf small{font-weight:500;font-size:10px}
.dcs{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.dch{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 7px;font-size:13px;font-weight:700;min-width:36px}
.dch.now{background:var(--accent);border-color:var(--accent);color:#fff}
.dto{grid-column:1/-1;font-size:11.5px;color:var(--sub);line-height:1.4}
.dmore{grid-column:1/-1;font-size:13px;line-height:1.7;padding-top:4px}
.intro{font-size:13px;color:var(--sub);line-height:1.7;margin:12px 2px 0}
.gacha{background:var(--mint);color:#fff;border:none;border-radius:12px;padding:9px 12px;font-weight:700;font-size:13px}

const QUAL={&#x27;&#x27;:[0,4,7],&#x27;m&#x27;:[0,3,7],&#x27;7&#x27;:[0,4,7,10],&#x27;m7&#x27;:[0,3,7,10],&#x27;maj7&#x27;:[0,4,7,11],&#x27;mmaj7&#x27;:[0,3,7,11],
 &#x27;6&#x27;:[0,4,7,9],&#x27;m6&#x27;:[0,3,7,9],&#x27;aug&#x27;:[0,4,8],&#x27;dim&#x27;:[0,3,6],&#x27;dim7&#x27;:[0,3,6,9],&#x27;sus4&#x27;:[0,5,7],&#x27;sus2&#x27;:[0,2,7],
 &#x27;7sus4&#x27;:[0,5,7,10],&#x27;9&#x27;:[0,4,7,10,14],&#x27;maj9&#x27;:[0,4,7,11,14],&#x27;m9&#x27;:[0,3,7,10,14]};
const TEN={&#x27;b5&#x27;:null,&#x27;#5&#x27;:null,&#x27;add9&#x27;:14,&#x27;9&#x27;:14,&#x27;b9&#x27;:13,&#x27;#9&#x27;:15,&#x27;11&#x27;:17,&#x27;#11&#x27;:18,&#x27;13&#x27;:21,&#x27;b13&#x27;:20};
function norm(s){return s.replace(/♭/g,&#x27;b&#x27;).replace(/♯/g,&#x27;#&#x27;).replace(/△/g,&#x27;maj&#x27;)}
function parseRoot(s){const m=s.match(/^([A-G])([#b]?)/);if(!m)return null;let p=PC[m[1]]+(m[2]==&#x27;#&#x27;?1:m[2]==&#x27;b&#x27;?-1:0);return {pc:(p+12)%12,len:m[0].length}}
function parseChord(sym){
  let s=norm(sym), bass=null;
  const sl=s.indexOf(&#x27;/&#x27;); if(sl&gt;0){bass=parseRoot(s.slice(sl+1)).pc; s=s.slice(0,sl);}
  const r=parseRoot(s); let rest=s.slice(r.len);
  let paren=&#x27;&#x27;; const pi=rest.indexOf(&#x27;(&#x27;); if(pi&gt;=0){paren=rest.slice(pi+1,rest.lastIndexOf(&#x27;)&#x27;));rest=rest.slice(0,pi);}
  let iv=(QUAL[rest]||QUAL[&#x27;&#x27;]).slice();
  paren.split(/[,、 ]+/).filter(Boolean).forEach(t=&gt;{
    if(t==&#x27;b5&#x27;){iv=iv.map(x=&gt;x==7?6:x)}
    else if(t==&#x27;#5&#x27;){iv=iv.map(x=&gt;x==7?8:x)}
    else if(TEN[t]!=null){iv.push(TEN[t])}
  });
  return {root:r.pc,bass:bass==null?r.pc:bass,iv};
}
function useFlat(k){return [1,3,5,8,10].includes(k)||k===0}
function spell(pc,k){return (useFlat(k)?FLAT:SHARP)[(pc+120)%12]}
function transpose(sym,k){
  if(!k) return sym.replace(/b(?=[^a-z]|$)/g,&#x27;♭&#x27;).replace(/\(b/g,&#x27;(♭&#x27;).replace(/,b/g,&#x27;,♭&#x27;);
  const s=norm(sym); const parts=s.split(&#x27;/&#x27;);
  const conv=x=&gt;{const r=parseRoot(x);return spell(r.pc+k,k)+x.slice(r.len)};
  let out=conv(parts[0]); if(parts[1]) out+=&#x27;/&#x27;+conv(parts[1]);
  return out.replace(/maj/g,&#x27;△&#x27;).replace(/\(b/g,&#x27;(♭&#x27;).replace(/,b/g,&#x27;,♭&#x27;);
}
function pretty(sym){return transpose(sym,0)}

/* ---------- voicing ---------- */
let prevTop=null;
function voice(sym,k){
  const c=parseChord(sym); const root=c.root+k, bass=c.bass+k;
  const bassN=36+((bass%12)+12)%12; // C2..B2
  const pcs=c.iv.map(i=&gt;root+i);
  // candidate: stack tones above a floor; pick floor nearest previous center
  let best=null,bestScore=1e9;
  for(let floor=52;floor&lt;=64;floor++){
    const notes=pcs.map(p=&gt;{let n=((p%12)+12)%12;while(n&lt;floor)n+=12;return n}).sort((a,b)=&gt;a-b);
    // tensions above 14 go one octave higher than base when needed
    const center=notes.reduce((a,b)=&gt;a+b,0)/notes.length;
    const target=prevTop==null?62:prevTop;
    const sc=Math.abs(center-target)+(notes[notes.length-1]&gt;79?20:0);
    if(sc&lt;bestScore){bestScore=sc;best=notes}
  }
  prevTop=best.reduce((a,b)=&gt;a+b,0)/best.length;
  return {bass:bassN,upper:[...new Set(best)]};
}

/* ---------- audio ---------- */
let ac=null,master=null;
function audio(){
  if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.55;
    const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);}
  if(ac.state===&#x27;suspended&#x27;)ac.resume();
  return ac;
}
const hz=n=&gt;440*Math.pow(2,(n-69)/12);
function note(n,t,dur,vel=.18,type=&#x27;keys&#x27;){
  const a=ac; const g=a.createGain(); const f=a.createBiquadFilter();
  f.type=&#x27;lowpass&#x27;; f.frequency.value=type==&#x27;bass&#x27;?900:2600; f.Q.value=.6;
  const o1=a.createOscillator(),o2=a.createOscillator();
  if(type==&#x27;bass&#x27;){o1.type=&#x27;triangle&#x27;;o2.type=&#x27;sine&#x27;;}else{o1.type=&#x27;triangle&#x27;;o2.type=&#x27;sawtooth&#x27;;}
  o1.frequency.value=hz(n);o2.frequency.value=hz(n)*(type==&#x27;bass&#x27;?1:1.003);
  const g2=a.createGain();g2.gain.value=type==&#x27;bass&#x27;?.6:.12;
  o1.connect(g);o2.connect(g2);g2.connect(g);g.connect(f);f.connect(master);
  const atk=.012,rel=type==&#x27;bass&#x27;?.12:.35;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vel,t+atk);
  g.gain.exponentialRampToValueAtTime(vel*.45,t+Math.min(dur,.6));
  g.gain.setValueAtTime(vel*.45,t+dur);g.gain.exponentialRampToValueAtTime(.0001,t+dur+rel);
  f.frequency.setValueAtTime(type==&#x27;bass&#x27;?900:3200,t);f.frequency.exponentialRampToValueAtTime(type==&#x27;bass&#x27;?500:1400,t+dur);
  [o1,o2].forEach(o=&gt;{o.start(t);o.stop(t+dur+rel+.05)});
}
function playVoicing(v,t,dur,style){
  note(v.bass,t,dur*.98,.32,&#x27;bass&#x27;);
  if(style==&#x27;arp&#x27;){
    const seq=[...v.upper,...v.upper.slice(1,-1).reverse()]; const step=dur/8;
    for(let i=0;i&lt;8;i++) note(seq[i%seq.length],t+i*step,step*1.6,.16);
  }else if(style==&#x27;beat&#x27;){
    const step=dur/8;
    for(let i=0;i&lt;8;i++){v.upper.forEach(n=&gt;note(n,t+i*step,step*.7,i%2?.07:.1))}
  }else{
    v.upper.forEach((n,i)=&gt;note(n,t+i*.012,dur*.96,.13));
  }
}

function stop(){
  if(S.timer){clearTimeout(S.timer);S.timer=null}
  if(ac&amp;&amp;master){master.gain.cancelScheduledValues(ac.currentTime);master.gain.setValueAtTime(master.gain.value,ac.currentTime);master.gain.linearRampToValueAtTime(0,ac.currentTime+.08);
    const m=master;setTimeout(()=&gt;{m.disconnect()},150);
    master=ac.createGain();master.gain.value=.55;const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);}
  const p=S.playing;S.playing=null;
  document.querySelectorAll(&#x27;.ch.now,.ex.on&#x27;).forEach(e=&gt;e.classList.remove(&#x27;now&#x27;,&#x27;on&#x27;));
  document.querySelectorAll(&#x27;.card.playing,.irow.playing&#x27;).forEach(e=&gt;e.classList.remove(&#x27;playing&#x27;));if(p&amp;&amp;String(p)[0]==&#x27;i&#x27;&amp;&amp;typeof renderIndex==&#x27;function&#x27;)renderIndex();

}
function playSeq(id,chords,onStep,loop=S.loop){
  audio(); stop(); prevTop=null; S.playing=id;
  const bar=60/S.bpm*4; let i=0;
  const tick=()=&gt;{
    if(S.playing!==id)return;
    if(i&gt;=chords.length){ if(loop){i=0}else{stop();return} }
    const sym=chords[i]; const v=voice(sym,S.key);

    onStep&amp;&amp;onStep(i); i++;

  tick();
}

  audio(); if(S.playing)stop(); prevTop=null;
  const v=voice(sym,S.key); playVoicing(v,ac.currentTime+.02,1.6,&#x27;pad&#x27;); setPiano(v);

  const o=e.target.closest(&#x27;[data-dopen]&#x27;);if(o){const i=+o.dataset.dopen;DF.open.has(i)?DF.open.delete(i):DF.open.add(i);renderDict();return}

function hl(s,q){s=esc(s);if(!q)return s;q.split(/\s+/).filter(Boolean).forEach(w=&gt;{const ww=esc(w).replace(/[.*+?^${}()|[\]\\]/g,&#x27;\\$&amp;&#x27;);s=s.replace(new RegExp(&#x27;(&#x27;+ww+&#x27;)&#x27;,&#x27;gi&#x27;),&#x27;&lt;mark&gt;$1&lt;/mark&gt;&#x27;)});return s}
function renderIndex(){

    const el=document.getElementById(&#x27;p&#x27;+p.n);el.scrollIntoView({block:&#x27;center&#x27;});el.classList.add(&#x27;playing&#x27;);setTimeout(()=&gt;el.classList.remove(&#x27;playing&#x27;),1400);return}

  row.classList.add(&#x27;playing&#x27;);
});

<script>
const F={theory:document.getElementById('theory'),progress:document.getElementById('progress')};
let cur='theory';
try{const s=localStorage.getItem('mtn-app');if(s&&F[s])cur=s;}catch(e){}
if(location.hash=='#progress'||location.hash=='#theory')cur=location.hash.slice(1);
function keyOf(a){try{return a=='theory'?F.theory.contentWindow.getKey():+F.progress.contentWindow.document.getElementById('key').value}catch(e){return null}}
function show(a,sync=true){
  const prev=cur;
  if(sync&&prev!==a){const k=keyOf(prev);try{
    if(k!=null){if(a=='theory')F.theory.contentWindow.setKeyExt(k);else if(keyOf('progress')!==k)F.progress.contentWindow.setKey(k);}}catch(e){}}
  if(a=='theory'){try{const w=F.progress.contentWindow;if(w.document.readyState=='complete'&&!/native code/.test(String(w.stop)))w.stop();}catch(e){}}
  cur=a;for(const k in F)F[k].classList.toggle('off',k!==a);
  document.querySelectorAll('.bar button').forEach(b=>b.classList.toggle('on',b.dataset.a==a));
  try{localStorage.setItem('mtn-app',a)}catch(e){}
}
document.querySelectorAll('.bar button').forEach(b=>b.onclick=()=>show(b.dataset.a));
// 理論ノートの用語一覧から呼ばれる
window.openProg=(term,mode)=>{
  show('progress');
  const w=F.progress.contentWindow,d=w.document;
  if(mode=='d'){w.openDict(term);
  }else{
    w.showView('list');const q=d.getElementById('q');q.value=term;q.dispatchEvent(new Event('input',{bubbles:true}));w.scrollTo(0,0);
  }
};
show(cur,false);
</script>
