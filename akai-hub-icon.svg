<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242833"/>
      <stop offset="1" stop-color="#12141a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 4つのパッド（左上:SFX 右上:譜面 左下:ドラム 右下:リズム） -->
  <g>
    <rect x="96"  y="96"  width="152" height="152" rx="30" fill="#ff7a59"/>
    <rect x="264" y="96"  width="152" height="152" rx="30" fill="#5aa9ff"/>
    <rect x="96"  y="264" width="152" height="152" rx="30" fill="#ffc94d"/>
    <rect x="264" y="264" width="152" height="152" rx="30" fill="#5fd39a"/>
    <rect x="96"  y="96"  width="152" height="152" rx="30" fill="url(#shine)"/>
    <rect x="264" y="96"  width="152" height="152" rx="30" fill="url(#shine)"/>
    <rect x="96"  y="264" width="152" height="152" rx="30" fill="url(#shine)"/>
    <rect x="264" y="264" width="152" height="152" rx="30" fill="url(#shine)"/>
  </g>

  <g fill="none" stroke="#14161c" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <!-- SFX：波形 -->
    <path d="M122 172 L140 172 L152 140 L166 204 L180 120 L194 222 L206 156 L216 172 L222 172"/>
    <!-- 譜面：音符 -->
    <path d="M362 126 L362 196" />
    <path d="M362 126 Q384 134 392 156" />
  </g>
  <ellipse cx="344" cy="198" rx="22" ry="17" transform="rotate(-20 344 198)" fill="#14161c"/>

  <!-- ドラム：太鼓 -->
  <g fill="none" stroke="#14161c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="172" cy="330" rx="44" ry="14"/>
    <path d="M128 330 L128 372 Q172 392 216 372 L216 330"/>
    <path d="M146 302 L176 324 M200 300 L178 324"/>
  </g>

  <!-- リズム：拍のドット -->
  <g fill="#14161c">
    <rect x="290" y="300" width="22" height="22" rx="5"/>
    <rect x="320" y="300" width="22" height="22" rx="5" opacity=".25"/>
    <rect x="350" y="300" width="22" height="22" rx="5"/>
    <rect x="380" y="300" width="22" height="22" rx="5" opacity=".25"/>
    <rect x="290" y="330" width="22" height="22" rx="5" opacity=".25"/>
    <rect x="320" y="330" width="22" height="22" rx="5"/>
    <rect x="350" y="330" width="22" height="22" rx="5" opacity=".25"/>
    <rect x="380" y="330" width="22" height="22" rx="5"/>
    <rect x="290" y="360" width="22" height="22" rx="5"/>
    <rect x="320" y="360" width="22" height="22" rx="5"/>
    <rect x="350" y="360" width="22" height="22" rx="5"/>
    <rect x="380" y="360" width="22" height="22" rx="5"/>
  </g>
</svg>
