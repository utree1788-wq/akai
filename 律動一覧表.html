function metal(t,dur,gain,base){[1,1.342,1.2312,1.6532,1.9523,2.1523].forEach(r=>{const o=ac.createOscillator();o.type='square';o.frequency.value=base*r;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=7000;const g=ac.createGain();g.gain.setValueAtTime(gain/6,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05)})}
function snare(t,v){tone(t,240,170,.12,.45*v,'triangle');nz(t,.18,'highpass',1500,0,.6*v)}
function tom(t,f,v){tone(t,f*1.4,f,.35,.85*v);nz(t,.04,'lowpass',2000,0,.15*v)}
function hit(k,ch,t,sd,vel){const v=Math.pow(vel/105,1.6);
switch(k){
case'K':tone(t,150,45,.35,1.1*v);nz(t,.02,'lowpass',3000,0,.3*v);break;
case'S':if(ch==='z'){for(let i=0;i<6;i++)snare(t+i*sd/6,.45*v);break}if(ch==='f')snare(t-.025,.35*v);snare(t,v);break;
case'X':tone(t,1700,1600,.04,.5*v,'triangle');nz(t,.03,'bandpass',2500,4,.6*v);break;
case'H':if(ch==='o'){metal(t,.35,.55,40);nz(t,.35,'highpass',8000,0,.25)}else if(ch==='h'){metal(t,.16,.5,40);nz(t,.15,'highpass',7000,0,.25)}else{metal(t,.05,.45*v,40);nz(t,.04,'highpass',8000,0,.18*v)}break;
case'F':metal(t,.04,.3,40);nz(t,.04,'bandpass',6000,1,.15);break;
case'R':if(ch==='c'){metal(t,.5,.5,58);tone(t,2400,2350,.4,.06)}else{metal(t,.45,.32*v,55);nz(t,.4,'highpass',9000,0,.06*v)}break;
case'C':metal(t,1.4,.6,48);nz(t,1.5,'highpass',5000,0,.35,.005);break;
case'Z':metal(t,1,.6,42);nz(t,1,'bandpass',4000,.7,.45,.003);break;
case'B':tone(t,800,800,.25,.25*v,'square');tone(t,540,540,.25,.18*v,'square');break;
case'T1':tom(t,240,v);break;case'T2':tom(t,170,v);break;case'T3':tom(t,110,v);break;
case'P':nz(t,.12,'bandpass',3000,.8,.35*v,.005);break;
case'W':nz(t,sd*2,'bandpass',2500,.6,.25,sd*.8);break}}
let playing=null,step=0,nextT=0,timer=null,useClick=false,startT=0,hitE=0;
const bpm=()=>+$('#bpm').value;const stepDur=p=>60/bpm()/beatSize(p);
function sched(){const p=playing;if(!p)return;const total=bars(p)*p.steps,bs=beatSize(p);
while(nextT<ac.currentTime+.12){const b=Math.floor(step/p.steps),i=step%p.steps,sd=stepDur(p);let t=nextT;if(p.swing&&i%2===1)t+=sd*.33;
let pow=0;for(const k in p.tr){const tr=p.tr[k],c=tr[b%tr.length][i];if(c!=='-'){hit(k,c,t,sd,vOf(p,k,b,i));if(k==='K')pow=Math.max(pow,.9);else if(k==='S'&&c!=='g')pow=Math.max(pow,c==='>'?1:.75);else if(k==='C'||k==='Z')pow=1}}
if(useClick&&i%bs===0)tone(t,i===0?1800:1200,i===0?1800:1200,.03,.25);
const st=step,pw=pow;setTimeout(()=>{mark(st);if(pw)hitE=Math.max(hitE,pw)},Math.max(0,(t-ac.currentTime)*1000));
nextT+=sd;step=(step+1)%total}}
let lastMarked=[];function mark(st){lastMarked.forEach(e=>e.classList.remove('now'));const card=playing&&document.getElementById('p'+playing.id);if(!card)return;lastMarked=[...card.querySelectorAll('.c[data-s="'+st+'"],.mini b[data-s="'+st+'"]')];lastMarked.forEach(e=>e.classList.add('now'))}
function start(p){initAudio();ac.resume();stopPlay(true);playing=p;step=0;nextT=ac.currentTime+.06;startT=ac.currentTime;$('#bpm').value=defBpm(p);showBpm();timer=setInterval(sched,25);sched();setTape();
document.querySelectorAll('.card').forEach(c=>{const on=c.id==='p'+p.id;c.classList.toggle('playing',on);c.querySelector('.pl').textContent=on?'■':'▶'});
const g=document.querySelector('#p'+p.id+' .grid');if(g&&!g.dataset.done&&MODE!=='compact')drawGrid(g);
$('#nowN').innerHTML=code(p)+' '+p.name+' <small>'+p.ts+'</small>';$('#osd b').textContent='▶ PLAY';$('#osd').classList.add('rec')}
function stopPlay(keep){clearInterval(timer);timer=null;lastMarked.forEach(e=>e.classList.remove('now'));if(!keep){playing=null;$('#nowN').innerHTML='<small>■ STOP</small>';$('#osd b').textContent='■ STOP';$('#osd').classList.remove('rec');setTape()}
document.querySelectorAll('.card.playing').forEach(c=>{c.classList.remove('playing');c.querySelector('.pl').textContent='▶'})}
function toggle(p){playing===p?stopPlay():start(p)}
$('#stop').onclick=()=>stopPlay();
function jump(d){const v=[...document.querySelectorAll('.card')].map(c=>flat.find(p=>'p'+p.id===c.id));if(!v.length)return;let i=playing?v.indexOf(playing):-1;i=(i+d+v.length)%v.length;start(v[i]);document.getElementById('p'+v[i].id).scrollIntoView({block:'center',behavior:'smooth'})}
$('#next').onclick=()=>jump(1);$('#prev').onclick=()=>jump(-1);
$('#click').onclick=e=>{useClick=!useClick;e.currentTarget.classList.toggle('on',useClick)};
function showBpm(){$('#bpmV').innerHTML=bpm()+'<small>BPM</small>'}
$('#bpm').oninput=showBpm;$('#tm').onclick=()=>{$('#bpm').value=bpm()-2;showBpm()};$('#tp').onclick=()=>{$('#bpm').value=bpm()+2;showBpm()};

// ===== MIDI / ZIP export =====
const GM={K:36,S:38,X:37,F:44,C:49,Z:52,B:56,T1:48,T2:45,T3:41,P:38,W:38};
function gmNote(k,c){if(k==='H')return c==='o'||c==='h'?46:42;if(k==='R')return c==='c'?53:51;return GM[k]}
function vlq(n){const b=[n&127];while(n>>=7)b.unshift((n&127)|128);return b}
function midiOf(p,tempo){const Q=96,bs=beatSize(p),st=Q/bs,nb=bars(p),ev=[];
 for(const k in p.tr){const t=p.tr[k];for(let b=0;b<nb;b++){const s=t[b%t.length];for(let i=0;i<p.steps;i++){const c=s[i];if(c==='-')continue;
  const v=Math.max(1,Math.min(127,vOf(p,k,b,i))),n=gmNote(k,c);let t0=Math.round((b*p.steps+i)*st+(p.swing&&i%2===1?st*.33:0));
  if(c==='f')ev.push([Math.max(0,t0-4),n,Math.round(v*.42),3]);
  if(c==='z'||k==='W'){const L=Math.round(k==='W'?st*2:st);for(let r=0;r<L;r+=Math.max(3,Math.round(Q/16)))ev.push([t0+r,n,r?Math.round(v*.8):v,3]);continue}
  ev.push([t0,n,v,Math.max(6,Math.round(st*.5))])}}}
 const [num,den]=p.ts.split('/').map(Number),us=Math.round(6e7/tempo),L=Math.round(nb*p.steps*st);
 const m=[];ev.forEach(([t,n,v,d])=>{m.push([t,1,[0x99,n,v]]);m.push([t+d,0,[0x89,n,0]])});m.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
 const name=new TextEncoder().encode(code(p)+' '+p.name);
 let tr=[0,0xFF,0x03,...vlq(name.length),...name,0,0xFF,0x51,3,us>>16&255,us>>8&255,us&255,0,0xFF,0x58,4,num,Math.log2(den),24,8];let last=0;
 m.forEach(([t,,b])=>{tr.push(...vlq(t-last),...b);last=t});tr.push(...vlq(Math.max(0,L-last)),0xFF,0x2F,0);
 return new Uint8Array([0x4d,0x54,0x68,0x64,0,0,0,6,0,0,0,1,0,Q,0x4d,0x54,0x72,0x6b,tr.length>>>24&255,tr.length>>16&255,tr.length>>8&255,tr.length&255,...tr])}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(d){let c=0xFFFFFFFF;for(let i=0;i<d.length;i++)c=CRC[(c^d[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;
 const u16=n=>[n&255,n>>8&255],u32=n=>[n&255,n>>8&255,n>>16&255,n>>>24&255];
 files.forEach(([name,data])=>{if(typeof data==='string')data=enc.encode(data);const nm=enc.encode(name),cr=crc32(data);
  const h=[0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(cr),...u32(data.length),...u32(data.length),...u16(nm.length),...u16(0)];
  parts.push(new Uint8Array(h),nm,data);
  cen.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(cr),...u32(data.length),...u32(data.length),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
  off+=h.length+nm.length+data.length});
 const cs=cen.reduce((a,b)=>a+b.length,0),end=new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cs),...u32(off),0,0]);
 return new Blob([...parts,...cen,end])}
const safe=s=>s.replace(/[\\/:*?"<>|＊？]/g,'_').slice(0,60);
const fname=p=>code(p)+'_'+safe(p.name)+'.mid';
let DL=null;(async()=>{try{DL=window.claude&&await window.claude.use('downloads')}catch(e){}if(DL)document.body.classList.add('candl')})();
function toastV(m){let t=$('#vt');if(!t){t=document.createElement('div');t.id='vt';document.body.appendChild(t)}t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600)}
async function saveFile(filename,data){if(!DL)return toastV('この表示ではダウンロードできません');try{await DL.save({filename,data});toastV('保存しました')}catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited')return toastV('少し待ってからもう一度押してください');toastV('保存できませんでした')}}
const readme=()=>'律動図鑑 RHYTHM ARCHIVE — MIDIファイル\r\n\r\n・GM配列のドラム（チャンネル10）、96 PPQ。1ファイル＝1パターン（1〜2小節）。DAW側でループさせて使ってください。\r\n・ベロシティはパターンごとのデータどおり（アクセント122／ゴースト35／拍の頭は強め・裏は弱め）。\r\n・テンポは譜面の推奨テンポの中間値（自由のものは目安の値）。ハネのパターンはスウィングして書き出しています。\r\n・音の割り当て：バスドラ36 スネア38 リム37 クローズHH42 オープンHH46 ペダルHH44 ハイタム48 ミッドタム45 フロア41 クラッシュ49 チャイナ52 ライド51 カップ53 カウベル56\r\n';
function dlOne(p){saveFile(code(p)+'_'+safe(p.name)+'.zip',zip([[fname(p),midiOf(p,defBpm(p))]]))}
function dlAll(){const list=[...document.querySelectorAll('.card')].map(c=>flat.find(p=>'p'+p.id===c.id)).filter(Boolean);const ps=list.length?list:flat;
 const files=ps.map(p=>['第'+p.ch.n+'話_'+safe(p.ch.t)+'/'+fname(p),midiOf(p,defBpm(p))]);files.push(['はじめに.txt',readme()]);
 files.push(['rhythms.json',JSON.stringify(ps.map(p=>({code:code(p),no:p.id,name:p.name,chapter:p.ch.t,genre:p.ch.g,time:p.ts,tempo:p.tempo,swing:!!p.swing,steps:p.steps,tracks:p.tr,velocity:p.v})))]);
 saveFile(ps.length===flat.length?'律動図鑑_全326パターン_MIDI.zip':'律動図鑑_'+ps.length+'パターン_MIDI.zip',zip(files))}
$('#dlAll').onclick=dlAll;

// ===== DTMへ渡す =====
const TAG='POCKETDTM_RHYTHM:';
const payload=p=>TAG+JSON.stringify({code:code(p),no:p.id,name:p.name,chapter:p.ch.t,genre:p.ch.g,ts:p.ts,tempo:p.tempo,swing:!!p.swing,steps:p.steps,tr:p.tr,v:p.v});
function sendDTM(p){const s=payload(p);let ok=false;try{localStorage.setItem('pocketdtm-inbox',Date.now()+'|'+s);ok=true}catch(e){}try{new BroadcastChannel('pocketdtm').postMessage(s);ok=true}catch(e){}
 toastV(ok?'DTMへ送りました（DTMを開いておくと今の位置に入ります）':'送れませんでした')}
function hookDrag(el,p){el.draggable=true;el.addEventListener('dragstart',e=>{e.dataTransfer.effectAllowed='copy';e.dataTransfer.setData('text/plain',payload(p));el.classList.add('dragging')});el.addEventListener('dragend',()=>el.classList.remove('dragging'))}
// ===== visuals =====
const bg=$('#bg'),g=bg.getContext('2d'),sc=$('#scope'),sg=sc.getContext('2d');let W,H,DPR,gridOff=0,lastF=0,tbuf;
const stars=[...Array(70)].map(()=>[Math.random(),Math.random()*.55,Math.random()*1.4+.3,Math.random()*6]);
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;bg.width=W*DPR;bg.height=H*DPR;const r=sc.getBoundingClientRect();sc.width=r.width*DPR;sc.height=r.height*DPR}
addEventListener('resize',resize);resize();
function drawBG(now,dt){const c=g;c.setTransform(DPR,0,0,DPR,0,0);const hz=H*.62;
const sky=c.createLinearGradient(0,0,0,hz);sky.addColorStop(0,'#0b0218');sky.addColorStop(.55,'#3a0a5e');sky.addColorStop(1,'#ff4fa8');c.fillStyle=sky;c.fillRect(0,0,W,hz);
stars.forEach(s=>{c.globalAlpha=.4+.6*Math.abs(Math.sin(now/900+s[3]));c.fillStyle='#fff';c.fillRect(s[0]*W,s[1]*H,s[2],s[2])});c.globalAlpha=1;
// sun
const R=Math.min(W,H)*.26,cx=W*.5,cy=hz-R*.25;const sun=c.createLinearGradient(0,cy-R,0,cy+R);sun.addColorStop(0,'#ffe66d');sun.addColorStop(.5,'#ff7ab8');sun.addColorStop(1,'#ff2fd0');
c.save();c.beginPath();c.arc(cx,cy,R,0,Math.PI*2);c.clip();c.fillStyle=sun;c.fillRect(cx-R,cy-R,R*2,R*2);
c.fillStyle='#3a0a5e';for(let i=0;i<9;i++){const yy=cy+R*(.05+i*.11)+((now/60)%(R*.11));const hh=2+i*1.4;c.fillRect(cx-R,yy,R*2,hh)}c.restore();
c.globalAlpha=.25+hitE*.4;c.fillStyle='#ff4fd8';c.beginPath();c.arc(cx,cy,R*1.18,0,Math.PI*2);c.fill();c.globalAlpha=1;
// mountains silhouette
c.fillStyle='#1a0533';c.beginPath();c.moveTo(0,hz);for(let x=0;x<=W;x+=W/12){c.lineTo(x,hz-(Math.sin(x*.013)*.5+.6)*H*.05-(x%3)*2)}c.lineTo(W,hz);c.fill();
// ground + grid
const gr=c.createLinearGradient(0,hz,0,H);gr.addColorStop(0,'#2a0450');gr.addColorStop(1,'#07010f');c.fillStyle=gr;c.fillRect(0,hz,W,H-hz);
const sp=playing?bpm()/60*.5:.12;gridOff=(gridOff+dt*sp)%1;c.strokeStyle='rgba(63,243,255,'+(.55+hitE*.45)+')';c.lineWidth=1+hitE*1.5;c.shadowColor='#3ff3ff';c.shadowBlur=6+hitE*10;
c.beginPath();for(let i=0;i<14;i++){const z=(i+gridOff)/14;const y=hz+(H-hz)*Math.pow(z,2.2);c.moveTo(0,y);c.lineTo(W,y)}
for(let i=-14;i<=14;i++){c.moveTo(cx+i*W*.012,hz);c.lineTo(cx+i*W*.22,H)}c.stroke();c.shadowBlur=0;
c.fillStyle='rgba(255,79,216,.8)';c.fillRect(0,hz-1,W,2);
// glitch slices on hits
if(hitE>.35){const n=1+Math.floor(hitE*4);for(let i=0;i<n;i++){const y=Math.random()*H,h=4+Math.random()*24,dx=(Math.random()-.5)*50*hitE;try{c.drawImage(bg,0,y*DPR,W*DPR,h*DPR,dx,y,W,h)}catch(e){}c.fillStyle=Math.random()<.5?'rgba(63,243,255,.10)':'rgba(255,79,216,.12)';c.fillRect(0,y,W,h)}}}
function drawScope(){const c=sg,w=sc.width,h=sc.height;c.fillStyle='rgba(8,0,20,.35)';c.fillRect(0,0,w,h);
c.strokeStyle='rgba(139,92,255,.25)';c.lineWidth=1;c.beginPath();for(let x=0;x<w;x+=w/16){c.moveTo(x,0);c.lineTo(x,h)}c.moveTo(0,h/2);c.lineTo(w,h/2);c.stroke();
if(!analyser){const t=performance.now()/600;c.strokeStyle='rgba(63,243,255,.5)';c.beginPath();for(let x=0;x<w;x+=3){const y=h/2+Math.sin(x*.02+t)*h*.04+(Math.random()-.5)*2;x?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();return}
if(!tbuf)tbuf=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(tbuf);
const draw=(col,off,lw)=>{c.strokeStyle=col;c.lineWidth=lw*DPR;c.beginPath();for(let i=0;i<tbuf.length;i+=2){const x=i/tbuf.length*w+off,y=(tbuf[i]/128-1)*h*.9+h/2;i?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()};
c.shadowBlur=8;c.shadowColor='#ff4fd8';draw('rgba(255,79,216,.75)',-2*DPR,1.5);c.shadowColor='#3ff3ff';draw('rgba(63,243,255,.95)',2*DPR,1.5);c.shadowBlur=0}
function frame(now){requestAnimationFrame(frame);if(document.hidden)return;const dt=Math.min(.1,(now-lastF)/1000);if(now-lastF<30)return;lastF=now;
hitE*=Math.pow(.02,dt);document.documentElement.style.setProperty('--hit',hitE.toFixed(3));
drawBG(now,dt);drawScope();
if(playing&&ac){const s=Math.max(0,ac.currentTime-startT),hh=String(Math.floor(s/3600)).padStart(2,'0'),mm=String(Math.floor(s/60)%60).padStart(2,'0'),ss=String(Math.floor(s)%60).padStart(2,'0');$('#tc').textContent='SP '+hh+':'+mm+':'+ss}}
requestAnimationFrame(frame);
render();
</script></body></html>
