<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>比喩ノート — 鬱・感情・不快回避</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14161b; --panel:#1c1f26; --panel2:#232733; --line:#2e3340;
  --ink:#e9e6df; --mute:#9a9caa; --accent:#c9a7e8; --accent2:#8fc7c0; --warm:#e8b48f; --danger:#e88f8f;
  --mincho:"Shippori Mincho",serif; --sans:"Zen Kaku Gothic New",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-text-size-adjust:100%}
button{font:inherit}
header{padding:28px 18px 10px;max-width:920px;margin:0 auto;display:flex;gap:10px;align-items:flex-start}
header .ttl{flex:1}
h1{font-family:var(--mincho);font-weight:700;font-size:1.65rem;margin:0 0 4px;letter-spacing:.04em}
.sub{color:var(--mute);font-size:.88rem;margin:0}
.menuBtn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:.85rem;white-space:nowrap}
.banner{max-width:920px;margin:6px auto 0;padding:0 18px;font-size:.78rem;color:var(--mute)}
.banner span{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 10px}
.banner .warn{color:var(--warm);border-color:rgba(232,180,143,.4)}
.sticky{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 85%,transparent);padding:10px 18px 14px}
.wrap{max-width:920px;margin:0 auto}
.search{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.search svg{flex:none;opacity:.6}
.search input{flex:1;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:16px}
.search button{background:none;border:0;color:var(--mute);font-size:1.1rem;cursor:pointer;display:none}
.filters{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.row::-webkit-scrollbar{display:none}
.lbl{flex:none;font-size:.72rem;color:var(--mute);align-self:center;width:3.2em}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:.82rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#1a1420;font-weight:700}
.chip .n{opacity:.6;margin-left:4px;font-size:.75em}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:.8rem;color:var(--mute)}
.meta button{background:none;border:0;color:var(--accent2);cursor:pointer;padding:0}
main{max-width:920px;margin:0 auto;padding:0 18px 110px}
section{margin-top:22px}
h2{font-family:var(--mincho);font-size:1.1rem;margin:0 0 4px;color:var(--accent)}
.secnote{color:var(--mute);font-size:.82rem;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;position:relative}
.card .img{display:block;width:calc(100% + 28px);margin:-14px -14px 12px;height:170px;object-fit:cover;border-radius:14px 14px 0 0;background:var(--panel2)}
.card .theme{display:inline-block;font-size:.72rem;color:var(--accent2);border:1px solid rgba(143,199,192,.35);border-radius:6px;padding:0 7px;margin-bottom:6px}
.card .style{font-size:.7rem;color:var(--mute);margin-left:6px}
.card .m{font-family:var(--mincho);font-size:1.12rem;font-weight:700;line-height:1.5;margin:0 64px 4px 0}
.card .d{font-size:.86rem;color:#cfccc4;margin:0}
.card .kw{margin-top:8px;font-size:.74rem;color:var(--warm)}
.card .alt{margin-top:6px;font-size:.76rem;color:var(--mute)}
.acts{position:absolute;top:10px;right:10px;display:flex;gap:4px}
.ic{background:rgba(0,0,0,.45);border:0;border-radius:999px;width:30px;height:30px;cursor:pointer;color:#c2c4cf;font-size:.95rem;line-height:1;display:flex;align-items:center;justify-content:center}
.ic.star.on{color:#f0c96a}
.lyric{background:var(--panel2);border-left:3px solid var(--accent);border-radius:0 12px 12px 0;padding:14px 16px;margin-bottom:10px;position:relative}
.lyric .t{font-size:.74rem;color:var(--mute);margin-bottom:6px;margin-right:110px}
.lyric pre{font-family:var(--mincho);white-space:pre-wrap;margin:0;font-size:1rem;line-height:1.95}
.copy{background:var(--panel);border:1px solid var(--line);color:var(--mute);border-radius:8px;font-size:.72rem;padding:2px 8px;cursor:pointer;height:30px}
.pick{background:linear-gradient(135deg,#2a2236,#1e2a2b);border:1px solid #3a3346;border-radius:14px;padding:14px 16px;margin-bottom:10px;position:relative}
.pick .m{font-family:var(--mincho);font-size:1.2rem;font-weight:700;margin-right:40px}
.pick p{margin:6px 0 0;font-size:.88rem;color:#d6d2ca}
mark{background:rgba(232,180,143,.35);color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--mute);padding:40px 18px;display:none}
.fab{position:fixed;right:18px;bottom:22px;z-index:20;background:var(--accent);color:#1a1420;border:0;border-radius:999px;padding:12px 20px;font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:620px;max-height:92vh;overflow-y:auto;padding:18px 18px 26px}
.sheet h3{margin:0 0 12px;font-family:var(--mincho);font-size:1.15rem}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:.76rem;color:var(--mute);margin-bottom:4px}
.fld input,.fld textarea,.fld select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;font-size:16px;padding:8px 10px}
.fld textarea{min-height:80px;resize:vertical}
.fld .hint{font-size:.7rem;color:var(--mute);margin-top:3px}
.imgbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.imgbox img{width:110px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{flex:1;min-width:90px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;padding:10px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1a1420;font-weight:700}
.btn.del{color:var(--danger);border-color:rgba(232,143,143,.4)}
.btn.del.armed{background:var(--danger);color:#1a1414}
.btn:disabled{opacity:.5}
.choice{display:flex;flex-direction:column;gap:8px}
.err{color:var(--danger);font-size:.8rem;margin-top:8px;min-height:1em}
.hide{display:none!important}
.ta-out{width:100%;min-height:200px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;font-size:12px;padding:8px}
</style>
</head>
<body>
<header>
  <div class="ttl">
    <h1>比喩ノート</h1>
    <p class="sub">鬱・感情・「不快回避」を何かに例えるアイデア集。歌詞・物語のモチーフ用。</p>
  </div>
  <button class="menuBtn" id="menuBtn">⋯ メニュー</button>
</header>
<div class="banner" id="banner"></div>

<div class="sticky"><div class="wrap">
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="検索（例：花、時計、孤独、ノイズ）" autocomplete="off">
    <button id="clr" aria-label="クリア">×</button>
  </div>
  <div class="filters">
    <div class="row" id="themeRow"><span class="lbl">テーマ</span></div>
    <div class="row" id="styleRow"><span class="lbl">雰囲気</span></div>
  </div>
  <div class="meta"><span id="count">読み込み中…</span><button id="reset">絞り込み解除</button></div>
</div></div>

<main id="main"></main>
<div class="empty" id="empty"></div>
<button class="fab hide" id="fab">＋ 追加</button>

<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>
<input type="file" id="importFile" accept="application/json,.json" class="hide">

 "m072", "sec": "avoidShort", "theme": "不快回避", "text": "小さな棘を抜き続けて、花を摘み忘れた。", "desc": "", "style": "詩的", "kw": "", "alt": "", "img": "", "order": 72}, {"id": "m073", "sec": "avoidShort", "theme": "不快回避", "text": "靴の汚れを嫌って、旅をやめた。", "desc": "", "style": "詩的", "kw": "", "alt": "", "img": "", "order": 73}, {"id": "m074", "sec": "avoidShort", "theme": "不快回避", "text": "雨粒を嫌って、海を知らなかった。", "desc": "", "style": "詩的", "kw": "", "alt": "", "img": "", "order": 74}, {"id": "m075", "sec": "avoidShort", "theme": "不快回避", "text": "ノイズを消し続けて、音楽まで消した。", "desc": "いちばん強いと評価された一文。", "style": "詩的", "kw": "おすすめ", "alt": "", "img": "", "order": 75}, {"id": "m076", "sec": "avoidShort", "theme": "不快回避", "text": "虫を嫌って、森を捨てた。", "desc": "", "style": "詩的", "kw": "", "alt": "", "img": "", "order": 76}, {"id": "m077", "sec": "avoidShort", "theme": "不快回避", "text": "火傷を恐れて、太陽を嫌いになった。", "desc": "", "style": "詩的", "kw": "", "alt": "", "img": "", "order": 77}, {"id": "m078", "sec": "avoidShort", "theme": "不快回避", "text": "服のシワを気にして、パーティーに行けなかった。", "desc": "", "style": "詩的", "kw": "", "alt": "", "img": "", "order": 78}, {"id": "m079", "sec": "avoidShort", "theme": "不快回避", "text": "失点を恐れて、試合に出なかった。", "desc": "", "style": "詩的", "kw": "", "alt": "", "img": "", "order": 79}, {"id": "m080", "sec": "avoidShort", "theme": "不快回避", "text": "部屋の埃を嫌って、窓を閉め切った。", "desc": "", "style": "詩的", "kw": "", "alt": "", "img": "", "order": 80}, {"id": "m081", "sec": "avoidShort", "theme": "不快回避", "text": "傷つかないように、誰にも触れなかった。", "desc": "", "style": "詩的", "kw": "", "alt": "", "img": "", "order": 81}], "lyrics": [{"id": "l001", "title": "季節を忘れた植物", "theme": "鬱", "body": "春が来たことにも気づかずに\n僕だけ去年の土の中\n咲き方を忘れた花たちは\n枯れることさえ許されない", "order": 1}, {"id": "l002", "title": "温室", "theme": "自分への甘さ", "body": "甘い水だけを飲んで育った\n僕は雨の味を知らなかった\n温室の中で咲いた花には\n季節の変わり目が怖かった", "order": 2}, {"id": "l003", "title": "日常 × 不穏", "theme": "鬱・逃避・後悔", "body": "人生のオートプレイに身を任せ\n沈没船のファーストクラスで眠る\n自分専用の裁判所では\n今日も全員が無罪になった\n\n心の中では閉店BGM\nそれでも笑顔の看板を出している\n昨日に宛てた手紙はまだ\n宛先不明で戻ってこない", "order": 3}, {"id": "l004", "title": "ノイズキャンセリング", "theme": "不快回避", "body": "小さなノイズを消すために\nボリュームを下げ続けた\n気づけば君の声どころか\n世界の音もしなくなった", "order": 4}, {"id": "l005", "title": "綺麗なままの靴", "theme": "不快回避", "body": "靴が汚れるのが嫌だった\n雨に濡れるのも嫌だった\nそうして綺麗なままの靴で\n一度も旅に出なかった", "order": 5}], "picks": [{"id": "p001", "motif": "季節を忘れた植物", "desc": "鬱を「悲しみ」ではなく、生きているのに生きるリズムを失った状態として描ける。美化しすぎず、それでも美しい世界観に。", "order": 1}, {"id": "p002", "motif": "温室", "desc": "守っていたものが、いつしか成長を妨げるものになる。「自分への甘さ」を一番うまく表すモチーフ。", "order": 2}, {"id": "p003", "motif": "日常的なもの × 不穏な意味", "desc": "オートプレイ、機内モード、閉店BGM……。鬱の歌でなく、皮肉・ブラックユーモア・哲学が混ざった独特な世界観に。", "order": 3}, {"id": "p004", "motif": "ノイズキャンセリング", "desc": "不快回避のテーマを一語に。核となる一文は「傷つかない人生を選び続けた結果、生きた実感まで失ってしまった。」", "order": 4}]}</script>
<script>
/* ===== 固定設定 ===== */
const SECTIONS = [
 {id:"utsu", title:"鬱を何かに例える", note:"「枯れた花」ではなく、本来咲くはずだったものが違う姿になったもの、という方向。"},
 {id:"poetic", title:"青春＝◯◯、鬱＝◯◯（対の比喩）", note:"青春を何かに例えたとき、鬱をその「裏側」として置く詩的なペア。"},
 {id:"emotion", title:"感情・性質を自然やモノに例える", note:"ネガティブな言葉を、花・季節・自然現象・物体に置き換える。"},
 {id:"poison", title:"毒のある比喩", note:"少し残酷で美しい方向。"},
 {id:"plant", title:"世界観：植物の一生", note:"全部を一つの植物の一生に置き換えると、ひとつの世界観になる。"},
 {id:"tricky", title:"トリッキーな比喩", note:"王道から離れて、一見関係なさそうな物事に心理的な意味を持たせる。"},
 {id:"surreal", title:"文学的・シュールな比喩", note:"「日常的なもの × 不穏な意味」の組み合わせ。皮肉・ブラックユーモア寄り。"},
 {id:"avoid", title:"不快回避の皮肉", note:"小さな不快を避けることに夢中になるうちに、本当に守りたかったものを失ってしまう。"},
 {id:"avoidShort", title:"不快回避：短く強烈な一文", note:""},
 {id:"other", title:"その他（追加分）", note:""}
];
const THEME_ORDER=["鬱","青春","失敗","自分への甘さ","楽な方に流れる","恐さ","後悔","怠惰","自己嫌悪","逃避","孤独","焦り","劣等感","希望","無気力","執着","努力","再生","大人になること","不快回避"];
const STYLES=["王道","詩的","毒","トリッキー","シュール"];
const KINDS=["metaphors","lyrics","picks"];
const LOCAL_KEY="hiyu-data-standalone-v1";

/* ===== 状態 ===== */
const store={metaphors:[],lyrics:[],picks:[]};
const state={q:"",theme:null,style:null,fav:false};
let mode="loading";      // cloud | local
let db=null, canEdit=true, loaded={metaphors:false,lyrics:false,picks:false};
let favs=new Set();
try{favs=new Set(JSON.parse(localStorage.getItem("hiyu-favs2")||"[]"))}catch(e){}
const saveFavs=()=>{try{localStorage.setItem("hiyu-favs2",JSON.stringify([...favs]))}catch(e){}};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hl=s=>{const t=esc(s);if(!state.q)return t;const q=esc(state.q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return t.replace(new RegExp(q,"gi"),m=>`<mark>${m}</mark>`)};
const byOrder=(a,b)=>(a.order??0)-(b.order??0);
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ===== 起動：claude.ai ならクラウド保存、それ以外（GitHub Pages など）はローカル保存 ===== */
async function init(){
  try{ if(window.claude && typeof claude.use==="function") db=await claude.use("db"); }catch(e){ db=null; }
  if(db){
    mode="cloud";
    try{ const u=await claude.use("user"); if(u){ const c=await u.canEdit(); if(c===false) canEdit=false; } }catch(e){}
    const timer=setTimeout(()=>{ if(!KINDS.every(k=>loaded[k])) setBanner("データにまだ接続できません。電波の良いところで開き直してください。","warn"); },10000);
    KINDS.forEach(k=>{
      db.collection(k).onSnapshot(snap=>{
        store[k]=snap.docs.map(d=>({...d.data(),id:d.id}));
        if(!snap.metadata.fromCache){ loaded[k]=true; if(KINDS.every(x=>loaded[x])){ clearTimeout(timer); setBanner(canEdit?"☁︎ クラウド保存（編集はすぐ反映されます）":"閲覧のみ"); } }
        render();
      },err=>{ clearTimeout(timer); setBanner("データを読み込めませんでした（"+err.code+"）","warn"); render(); });
    });
  }else{
    mode="local";
    let data=null;
    try{ const s=localStorage.getItem(LOCAL_KEY); if(s) data=JSON.parse(s); }catch(e){}
    if(data){ setBanner("このブラウザに保存した編集を表示中。メニューの「JSONを書き出す」で data/data.json に反映できます。","warn"); }
    else{
      const embEl=document.getElementById("embedded-data");
      if(embEl){ data=JSON.parse(embEl.textContent); setBanner("編集はこのブラウザに保存されます。メニューから書き出せます。"); }
      else try{ const r=await fetch("data/data.json",{cache:"no-cache"}); data=await r.json(); setBanner("data/data.json を表示中。編集はこのブラウザに保存されます。"); }
      catch(e){ data={metaphors:[],lyrics:[],picks:[]}; setBanner("data/data.json を読み込めませんでした","warn"); }
    }
    KINDS.forEach(k=>store[k]=Array.isArray(data[k])?data[k]:[]);
    render();
  }
  if(canEdit) $("#fab").classList.remove("hide");
}

function setBanner(t,cls){ $("#banner").innerHTML=t?`<span class="${cls||""}">${esc(t)}</span>`:""; }
function persistLocal(){ try{ localStorage.setItem(LOCAL_KEY,JSON.stringify(store)); setBanner("このブラウザに保存しました。メニューの「JSONを書き出す」で data/data.json に反映できます。","warn"); }catch(e){ setBanner("ブラウザに保存できませんでした（容量オーバーの可能性）","warn"); } }

/* ===== 保存・削除 ===== */
async function saveItem(kind,id,data){
  if(mode==="cloud"){
    const ref=id?db.doc(kind+"/"+id):db.collection(kind).doc();
    await ref.set(data);
  }else{
    if(id){ const i=store[kind].findIndex(x=>x.id===id); store[kind][i]={...data,id}; }
    else store[kind].push({...data,id:newId(kind[0])});
    persistLocal(); render();
  }
}
async function deleteItem(kind,id){
  if(mode==="cloud") await db.doc(kind+"/"+id).delete();
  else{ store[kind]=store[kind].filter(x=>x.id!==id); persistLocal(); render(); }
  favs.delete(id); saveFavs();
}

/* ===== 一覧表示 ===== */
function themesList(){
  const cnt={}; store.metaphors.forEach(r=>{ if(r.theme) cnt[r.theme]=(cnt[r.theme]||0)+1; });
  const extra=Object.keys(cnt).filter(t=>!THEME_ORDER.includes(t)).sort();
  return {cnt,list:[...THEME_ORDER.filter(t=>cnt[t]),...extra]};
}
function chips(){
  const tr=$("#themeRow"), sr=$("#styleRow");
  tr.querySelectorAll(".chip").forEach(e=>e.remove()); sr.querySelectorAll(".chip").forEach(e=>e.remove());
  const mk=(label,on,fn,n)=>{const b=document.createElement("button");b.className="chip"+(on?" on":"");b.innerHTML=esc(label)+(n!=null?`<span class="n">${n}</span>`:"");b.onclick=fn;return b};
  const {cnt,list}=themesList();
  tr.appendChild(mk("★ お気に入り",state.fav,()=>{state.fav=!state.fav;render()}));
  list.forEach(t=>tr.appendChild(mk(t,state.theme===t,()=>{state.theme=state.theme===t?null:t;render()},cnt[t])));
  STYLES.forEach(s=>sr.appendChild(mk(s,state.style===s,()=>{state.style=state.style===s?null:s;render()})));
}
function match(r){
  if(state.theme&&r.theme!==state.theme)return false;
  if(state.style&&r.style!==state.style)return false;
  if(state.fav&&!favs.has(r.id))return false;
  if(state.q){const hay=[r.theme,r.text,r.desc,r.style,r.kw,r.alt].join(" ").toLowerCase();if(!hay.includes(state.q.toLowerCase()))return false}
  return true;
}
const editBtn=(kind,id)=>canEdit?`<button class="ic" data-edit="${kind}" data-id="${esc(id)}" aria-label="編集">✎</button>`:"";

function render(){
  chips();
  $("#clr").style.display=state.q?"block":"none";
  const filtered=!!(state.q||state.theme||state.style||state.fav);
  $("#reset").style.display=filtered?"inline":"none";
  const ql=state.q.toLowerCase();
  let html="",total=0;
  if(!state.theme&&!state.style&&!state.fav){
    const ps=[...store.picks].sort(byOrder).filter(p=>!ql||(p.motif+" "+p.desc).toLowerCase().includes(ql));
    if(ps.length) html+=`<section><h2>特に強いモチーフ</h2><p class="secnote">会話の中で特におすすめとされたもの。</p>`+ps.map(p=>`<div class="pick"><div class="acts">${editBtn("picks",p.id)}</div><div class="m">${hl(p.motif)}</div><p>${hl(p.desc)}</p></div>`).join("")+`</section>`;
  }
  const known=new Set(SECTIONS.map(s=>s.id));
  for(const s of SECTIONS){
    const rows=store.metaphors.filter(r=>(known.has(r.sec)?r.sec:"other")===s.id&&match(r)).sort(byOrder);
    if(!rows.length)continue; total+=rows.length;
    html+=`<section><h2>${esc(s.title)}</h2>${s.note?`<p class="secnote">${esc(s.note)}</p>`:""}<div class="grid">`+rows.map(r=>{
      const f=favs.has(r.id);
      return `<div class="card">${r.img?`<img class="img" src="${esc(r.img)}" alt="${esc(r.text)}" loading="lazy">`:""}<div class="acts">${editBtn("metaphors",r.id)}<button class="ic star${f?" on":""}" data-star="${esc(r.id)}" aria-label="お気に入り">${f?"★":"☆"}</button></div><span class="theme">${hl(r.theme)}</span>${r.style?`<span class="style">${esc(r.style)}</span>`:""}<p class="m">${hl(r.text)}</p>${r.desc?`<p class="d">${hl(r.desc)}</p>`:""}${r.kw?`<div class="kw">${hl(r.kw)}</div>`:""}${r.alt?`<div class="alt">別案：${hl(r.alt)}</div>`:""}</div>`}).join("")+`</div></section>`;
  }
  if(!state.style&&!state.fav){
    const ls=[...store.lyrics].sort(byOrder).filter(l=>(!state.theme||(l.theme||"").includes(state.theme))&&(!ql||[l.title,l.theme,l.body].join(" ").toLowerCase().includes(ql)));
    if(ls.length){ html+=`<section><h2>歌詞にするなら</h2><p class="secnote">比喩から作った歌詞の方向性。</p>`+ls.map(l=>`<div class="lyric"><div class="acts">${editBtn("lyrics",l.id)}<button class="copy" data-copy="${esc(l.id)}">コピー</button></div><div class="t">${hl(l.title)} ／ ${hl(l.theme)}</div><pre>${hl(l.body)}</pre></div>`).join("")+`</section>`; total+=ls.length; }
  }
  $("#main").innerHTML=html;
  const allEmpty=!store.metaphors.length&&!store.lyrics.length&&!store.picks.length;
  const em=$("#empty");
  if(html){ em.style.display="none"; }
  else{ em.style.display="block"; em.textContent=mode==="loading"?"読み込み中…":allEmpty?"まだ何もありません。「＋ 追加」から登録するか、メニューの「JSONを読み込む」で data.json を取り込めます。":"該当する比喩がありません"; }
  $("#count").textContent=mode==="loading"?"読み込み中…":filtered?`${total} 件ヒット`:`比喩 ${store.metaphors.length} 件・歌詞 ${store.lyrics.length} 件`;
}

/* ===== クリック操作 ===== */
document.addEventListener("click",e=>{
  const st=e.target.closest("[data-star]");
  if(st){const k=st.dataset.star;favs.has(k)?favs.delete(k):favs.add(k);saveFavs();render();return}
  const ed=e.target.closest("[data-edit]");
  if(ed){ openForm(ed.dataset.edit, store[ed.dataset.edit].find(x=>x.id===ed.dataset.id)); return }
  const cp=e.target.closest("[data-copy]");
  if(cp){ const l=store.lyrics.find(x=>x.id===cp.dataset.copy); if(!l)return;
    try{navigator.clipboard.writeText(l.body).then(()=>{cp.textContent="コピー済";setTimeout(()=>cp.textContent="コピー",1200)}).catch(()=>{cp.textContent="不可"})}catch(_){cp.textContent="不可"} }
});
$("#q").addEventListener("input",e=>{state.q=e.target.value.trim();render()});
$("#clr").onclick=()=>{$("#q").value="";state.q="";render()};
$("#reset").onclick=()=>{$("#q").value="";Object.assign(state,{q:"",theme:null,style:null,fav:false});render()};
$("#ov").addEventListener("click",e=>{ if(e.target.id==="ov") closeSheet(); });
function openSheet(html){ $("#sheet").innerHTML=html; $("#ov").classList.add("show"); $("#sheet").scrollTop=0; }
function closeSheet(){ $("#ov").classList.remove("show"); $("#sheet").innerHTML=""; }

/* ===== 追加メニュー ===== */
$("#fab").onclick=()=>{
  openSheet(`<h3>何を追加しますか？</h3><div class="choice">
    <button class="btn pri" data-new="metaphors">比喩を追加</button>
    <button class="btn" data-new="lyrics">歌詞を追加</button>
    <button class="btn" data-new="picks">おすすめモチーフを追加</button>
    <button class="btn" id="cx">キャンセル</button></div>`);
  $("#cx").onclick=closeSheet;
  $("#sheet").querySelectorAll("[data-new]").forEach(b=>b.onclick=()=>openForm(b.dataset.new,null));
};

/* ===== 入力フォーム ===== */
const FORMS={
  metaphors:{label:"比喩",fields:[
    {k:"text",l:"比喩（タイトル）",t:"textarea",req:true,rows:2},
    {k:"theme",l:"テーマ",t:"theme",req:true,hint:"候補から選ぶか、新しいテーマを入力"},
    {k:"sec",l:"項目",t:"sec"},
    {k:"style",l:"雰囲気",t:"style"},
    {k:"desc",l:"説明",t:"textarea"},
    {k:"kw",l:"キーワード",t:"text",hint:"例：息苦しさ・孤独・隔絶"},
    {k:"alt",l:"別案",t:"text",hint:"「、」区切りで複数"},
    {k:"img",l:"画像",t:"img"}]},
  lyrics:{label:"歌詞",fields:[
    {k:"title",l:"タイトル",t:"text",req:true},
    {k:"theme",l:"テーマ",t:"text",hint:"例：鬱・逃避"},
    {k:"body",l:"歌詞",t:"textarea",req:true,rows:8}]},
  picks:{label:"おすすめモチーフ",fields:[
    {k:"motif",l:"モチーフ",t:"text",req:true},
    {k:"desc",l:"説明",t:"textarea"}]}
};
let formImg="";
function openForm(kind,item){
  const F=FORMS[kind]; const v=item||{}; formImg=v.img||"";
  const {list}=themesList();
  const fld=f=>{
    const val=esc(v[f.k]??(f.k==="sec"?"other":""));
    let inp;
    if(f.t==="textarea") inp=`<textarea name="${f.k}" rows="${f.rows||3}">${val}</textarea>`;
    else if(f.t==="theme") inp=`<input name="theme" list="themeList" value="${val}"><datalist id="themeList">${[...new Set([...THEME_ORDER,...list])].map(t=>`<option value="${esc(t)}">`).join("")}</datalist>`;
    else if(f.t==="sec") inp=`<select name="sec">${SECTIONS.map(s=>`<option value="${s.id}"${(v.sec||"other")===s.id?" selected":""}>${esc(s.title)}</option>`).join("")}</select>`;
    else if(f.t==="style") inp=`<select name="style"><option value="">（なし）</option>${STYLES.map(s=>`<option${v.style===s?" selected":""}>${s}</option>`).join("")}</select>`;
    else if(f.t==="img") inp=`<div class="imgbox"><img id="imgPrev" class="${formImg?"":"hide"}" src="${esc(formImg)}" alt=""><label class="btn" style="flex:none">画像を選ぶ<input type="file" accept="image/*" id="imgIn" class="hide"></label><button type="button" class="btn ${formImg?"":"hide"}" id="imgDel" style="flex:none">画像を外す</button></div>`;
    else inp=`<input name="${f.k}" value="${val}">`;
    return `<div class="fld"><label>${esc(f.l)}${f.req?" *":""}</label>${inp}${f.hint?`<div class="hint">${esc(f.hint)}</div>`:""}</div>`;
  };
  openSheet(`<h3>${esc(F.label)}を${item?"編集":"追加"}</h3><form id="frm">${F.fields.map(fld).join("")}
    <div class="err" id="ferr"></div>
    <div class="btns"><button type="button" class="btn" id="fcancel">キャンセル</button><button type="submit" class="btn pri" id="fsave">保存</button></div>
    ${item?`<div class="btns"><button type="button" class="btn del" id="fdel">削除</button></div>`:""}</form>`);
  $("#fcancel").onclick=closeSheet;
  const imgIn=$("#imgIn");
  if(imgIn){
    imgIn.onchange=async()=>{ const f=imgIn.files[0]; if(!f)return; $("#ferr").textContent="画像を処理中…";
      try{ formImg=await shrinkImage(f); $("#imgPrev").src=formImg; $("#imgPrev").classList.remove("hide"); $("#imgDel").classList.remove("hide"); $("#ferr").textContent=""; }
      catch(e){ $("#ferr").textContent="画像を読み込めませんでした"; } };
    $("#imgDel").onclick=()=>{ formImg=""; $("#imgPrev").classList.add("hide"); $("#imgDel").classList.add("hide"); };
  }
  if(item){ const d=$("#fdel"); d.onclick=async()=>{
    if(!d.classList.contains("armed")){ d.classList.add("armed"); d.textContent="もう一度押すと削除します"; return; }
    d.disabled=true; try{ await deleteItem(kind,item.id); closeSheet(); }catch(e){ $("#ferr").textContent="削除できませんでした（"+(e.code||e.message)+"）"; d.disabled=false; } }; }
  $("#frm").onsubmit=async ev=>{
    ev.preventDefault();
    const fd=new FormData(ev.target); const data={};
    for(const f of F.fields){ if(f.t==="img") data.img=formImg; else data[f.k]=(fd.get(f.k)||"").toString().trim(); }
    const miss=F.fields.find(f=>f.req&&!data[f.k]); if(miss){ $("#ferr").textContent=`「${miss.l}」を入力してください`; return; }
    data.order=item?.order??Date.now();
    const b=$("#fsave"); b.disabled=true; b.textContent="保存中…";
    try{ await saveItem(kind,item?.id,data); closeSheet(); }
    catch(e){ $("#ferr").textContent=e.code==="invalid_argument"?"保存できませんでした（編集権限がないか、画像が大きすぎます）":"保存できませんでした（"+(e.code||e.message)+"）"; b.disabled=false; b.textContent="保存"; }
  };
}
function shrinkImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const im=new Image();
    im.onload=()=>{ const max=480; let w=im.naturalWidth,h=im.naturalHeight; const s=Math.min(1,max/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
      const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(im,0,0,w,h); URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg",0.8)); };
    im.onerror=()=>{URL.revokeObjectURL(url);rej()}; im.src=url;
  });
}

/* ===== メニュー：書き出し・読み込み ===== */
$("#menuBtn").onclick=()=>{
  openSheet(`<h3>メニュー</h3><div class="choice">
    <button class="btn" id="mXml">XMLを書き出す</button>
    <button class="btn" id="mJson">JSONを書き出す（data.json）</button>
    ${canEdit?`<button class="btn" id="mImp">JSONを読み込む</button>`:""}
    ${mode==="local"?`<button class="btn del" id="mResetLocal">ブラウザ内の編集を破棄して data.json に戻す</button>`:""}
    <div class="err" id="merr"></div>
    <button class="btn" id="mClose">閉じる</button></div>`);
  $("#mClose").onclick=closeSheet;
  $("#mXml").onclick=async()=>{ $("#merr").textContent="作成中…"; try{ await download("hiyu-note.xml",await buildXml(),"application/xml"); $("#merr").textContent=""; }catch(e){ $("#merr").textContent="書き出せませんでした"; } };
  $("#mJson").onclick=async()=>{ try{ await download("data.json",buildJson(),"application/json"); }catch(e){ $("#merr").textContent="書き出せませんでした"; } };
  const imp=$("#mImp"); if(imp) imp.onclick=()=>$("#importFile").click();
  const rl=$("#mResetLocal"); if(rl) rl.onclick=()=>{ if(!rl.classList.contains("armed")){rl.classList.add("armed");rl.textContent="もう一度押すと破棄します";return;} try{localStorage.removeItem(LOCAL_KEY)}catch(e){} location.reload(); };
};
function buildJson(){
  const out={}; KINDS.forEach(k=>out[k]=[...store[k]].sort(byOrder).map(x=>{const o={...x}; return o;}));
  return JSON.stringify(out,null,1);
}
async function toBase64(src){
  if(src.startsWith("data:")) return src.split(",")[1];
  const r=await fetch(src); const buf=new Uint8Array(await r.arrayBuffer()); let s=""; for(let i=0;i<buf.length;i+=8192) s+=String.fromCharCode.apply(null,buf.subarray(i,i+8192)); return btoa(s);
}
async function buildXml(){
  const e=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  let x=`<?xml version="1.0" encoding="UTF-8"?>\n<metaphorNote title="比喩ノート — 鬱・感情・不快回避">\n  <picks>\n`;
  for(const p of [...store.picks].sort(byOrder)) x+=`    <pick id="${e(p.id)}">\n      <motif>${e(p.motif)}</motif>\n      <description>${e(p.desc)}</description>\n    </pick>\n`;
  x+=`  </picks>\n  <sections>\n`;
  const known=new Set(SECTIONS.map(s=>s.id));
  for(const s of SECTIONS){
    const rows=store.metaphors.filter(r=>(known.has(r.sec)?r.sec:"other")===s.id).sort(byOrder); if(!rows.length) continue;
    x+=`    <section id="${s.id}" title="${e(s.title)}">\n`+(s.note?`      <note>${e(s.note)}</note>\n`:"");
    for(const r of rows){
      x+=`      <metaphor id="${e(r.id)}" theme="${e(r.theme)}" style="${e(r.style)}">\n        <text>${e(r.text)}</text>\n`;
      if(r.desc) x+=`        <description>${e(r.desc)}</description>\n`;
      if(r.kw) x+=`        <keywords>${e(r.kw)}</keywords>\n`;
      if(r.alt) x+=`        <alternatives>\n`+r.alt.split("、").map(a=>`          <alt>${e(a.trim())}</alt>`).join("\n")+`\n        </alternatives>\n`;
      if(r.img){ try{ x+=`        <image type="image/jpeg" encoding="base64">${await toBase64(r.img)}</image>\n`; }catch(_){} }
      x+=`      </metaphor>\n`;
    }
    x+=`    </section>\n`;
  }
  x+=`  </sections>\n  <lyrics>\n`;
  for(const l of [...store.lyrics].sort(byOrder)) x+=`    <lyric id="${e(l.id)}" title="${e(l.title)}" theme="${e(l.theme)}">\n`+String(l.body||"").split("\n").map(t=>t?`      <line>${e(t)}</line>`:`      <break/>`).join("\n")+`\n    </lyric>\n`;
  return x+`  </lyrics>\n</metaphorNote>\n`;
}
async function download(filename,text,mime){
  if(mode==="cloud"){
    let dl=null; try{ dl=await claude.use("downloads"); }catch(e){}
    if(dl){ try{ await dl.save({filename,data:text}); return; }catch(e){ if(e&&/declin|cancel/i.test(e.code||e.message||"")) return; } }
    openSheet(`<h3>${esc(filename)}</h3><p class="secnote">ダウンロードできない環境です。全文をコピーして保存してください。</p><textarea class="ta-out" readonly>${esc(text)}</textarea><div class="btns"><button class="btn" id="tclose">閉じる</button></div>`);
    $("#tclose").onclick=closeSheet; return;
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:mime})); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
$("#importFile").onchange=async()=>{
  const f=$("#importFile").files[0]; $("#importFile").value=""; if(!f) return;
  let data; try{ data=JSON.parse(await f.text()); }catch(e){ setBanner("JSONを読み込めませんでした","warn"); closeSheet(); return; }
  closeSheet();
  if(mode==="local"){ KINDS.forEach(k=>store[k]=Array.isArray(data[k])?data[k]:[]); persistLocal(); render(); return; }
  let n=0,fail=0; const all=KINDS.flatMap(k=>(Array.isArray(data[k])?data[k]:[]).map(x=>[k,x]));
  for(const [k,x] of all){
    const {id,...body}=x; setBanner(`取り込み中… ${n+fail+1} / ${all.length}`);
    try{ await (id?db.doc(k+"/"+id):db.collection(k).doc()).set(body); n++; }catch(e){ fail++; }
  }
  setBanner(`取り込み完了：${n} 件`+(fail?`（失敗 ${fail} 件）`:""),fail?"warn":"");
};
render();
init();
</script>
