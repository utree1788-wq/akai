<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>K32s プレイヤー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#d6353a;--body:#eeedf4;--edge:#d9d7e4;--ink:#3a3842}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'M PLUS Rounded 1c',system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;
 background-color:#5a4638;background-image:repeating-linear-gradient(176deg,rgba(255,255,255,.035) 0 3px,transparent 3px 11px),linear-gradient(#6b5545,#4a382c);
 display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font-family:inherit;cursor:pointer}
.dev{margin:8px;padding:10px 10px 12px;background:linear-gradient(#f6f5fa,var(--body));border-radius:16px;
 box-shadow:0 2px 0 #fff inset,0 -3px 0 var(--edge) inset,0 8px 20px rgba(0,0,0,.45);flex:none}
.top{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.lcd{flex:1 1 260px;min-width:0;background:#1d2a1f;border-radius:10px;padding:8px 12px;color:#9dff9a;font-family:'DotGothic16',monospace;
 box-shadow:inset 0 2px 8px rgba(0,0,0,.7);position:relative;min-height:84px}
.lcd .l1{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 6px rgba(120,255,120,.5)}
.lcd .l1 b{color:#d7ffd5;margin-right:8px}
.lcd .l2{font-size:13px;opacity:.85;margin-top:2px;white-space:nowrap;overflow:hidden}
.lcd .l3{font-size:18px;color:#ffe08a;margin-top:3px;min-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcd .led{position:absolute;right:10px;top:10px;width:8px;height:8px;border-radius:50%;background:#3f3;box-shadow:0 0 8px #3f3}
.lcd.shift{color:#ffb4b4}.lcd.shift .l1{text-shadow:0 0 6px rgba(255,120,120,.6)}
.ctrls{display:flex;gap:12px;align-items:center;flex:1 1 300px;justify-content:space-between;flex-wrap:nowrap}
.grp{display:flex;flex-direction:column;align-items:center;gap:3px}
.lbl{font-size:10px;font-weight:800;color:var(--red);letter-spacing:.12em}
.octs{display:flex;gap:8px}
.sq{width:44px;height:38px;border:none;border-radius:7px;background:linear-gradient(#55535c,#2c2b31);color:#fff;font-size:22px;font-weight:800;
 box-shadow:0 3px 0 #9a98a4,0 4px 6px rgba(0,0,0,.3)}
.sq:active,.sq.down{transform:translateY(2px);box-shadow:0 1px 0 #9a98a4}
.shiftb{width:52px;height:52px;border-radius:50%;border:none;background:radial-gradient(circle at 40% 35%,#d4d3da,#a9a7b1);color:#3b3a40;font-weight:800;font-size:11px;
 box-shadow:0 3px 0 #85838e,0 4px 8px rgba(0,0,0,.3)}
.shiftb.on{background:radial-gradient(circle at 40% 35%,#ff8a8d,#d6353a);color:#fff;box-shadow:0 0 14px rgba(214,53,58,.8)}
.vol{width:120px;height:38px;border-radius:19px;background:#e2e0ea;box-shadow:inset 0 2px 5px rgba(0,0,0,.25);display:flex;align-items:center;padding:0 10px}
.vol input{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:30px}
.vol input::-webkit-slider-runnable-track{height:6px;background:#2a2930;border-radius:3px}
.vol input::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:26px;margin-top:-10px;border-radius:7px;background:linear-gradient(#fff,#d8d7df);box-shadow:0 2px 4px rgba(0,0,0,.35)}
.vol input::-moz-range-track{height:6px;background:#2a2930;border-radius:3px}
.vol input::-moz-range-thumb{width:34px;height:26px;border-radius:7px;border:none;background:linear-gradient(#fff,#d8d7df);box-shadow:0 2px 4px rgba(0,0,0,.35)}
.knob{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#cfcdd8);box-shadow:0 4px 8px rgba(0,0,0,.35),inset 0 -3px 4px rgba(0,0,0,.12);
 position:relative;touch-action:none;cursor:grab}
.knob i{position:absolute;left:50%;top:5px;width:4px;height:14px;margin-left:-2px;border-radius:2px;background:var(--red)}
.mid{display:flex;gap:8px;margin-top:10px}
.side{display:flex;flex-direction:column;gap:6px;align-items:center;flex:none;width:52px}
.wave{width:52px;height:40px;border:none;border-radius:7px;background:linear-gradient(#e9e8ee,#c9c7d0);box-shadow:0 3px 0 #9e9ca8;font-size:10px;font-weight:800;color:#555;line-height:1.05;padding:2px}
.wave svg{display:block;margin:0 auto 1px}
.wave.on{background:linear-gradient(#ffd2d3,#f19a9c);color:#7a1418;box-shadow:0 0 10px rgba(214,53,58,.55),0 2px 0 #b66}
.strip{flex:1;width:40px;border-radius:6px;background:linear-gradient(90deg,#141317,#2b2a31,#141317);position:relative;touch-action:none;min-height:90px}
.strip .dot{position:absolute;left:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;top:50%}
.strip span{position:absolute;left:0;right:0;text-align:center;font-size:9px;color:#888;font-weight:700}
.kbwrap{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;border-radius:6px}
.labels{position:relative;height:36px;touch-action:pan-x}
.labels .g{position:absolute;top:0;font-size:9px;font-weight:800;color:var(--red);transform:translateX(-50%);letter-spacing:.1em;white-space:nowrap}
.labels .t{position:absolute;bottom:2px;font-size:10px;color:var(--red);transform:translateX(-50%);white-space:pre;text-align:center;line-height:1;font-weight:700;padding:2px 3px;border-radius:4px}
.labels .t.enter{background:var(--red);color:#fff}
.kb.shift .labels .t{background:#ffe3e3;outline:1px solid #f3a3a5}
.kb.shift .labels .t.enter{background:var(--red)}
.keys{position:relative;touch-action:none}
.wk,.bk{position:absolute;top:0}
.wk{background:linear-gradient(#fff 80%,#f1f0f4);border-radius:0 0 6px 6px;box-shadow:inset 0 -7px 0 #e1e0e6,0 1px 2px rgba(0,0,0,.35);
 display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:10px;font-size:10px;color:#9a98a3;overflow:hidden}
.wk.c{color:var(--red);font-weight:800}
.wk.on{background:linear-gradient(#ffdfe0,#ffb9bc);box-shadow:inset 0 -3px 0 #e99}
.wk.pl{background:linear-gradient(#e0f0ff,#b9dcff)}
.bk{z-index:2;background:linear-gradient(90deg,#111,#3a3a3a 45%,#1a1a1a);border-radius:0 0 4px 4px;box-shadow:inset 0 -6px 0 #000,1px 3px 4px rgba(0,0,0,.45);
 display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:9px;font-size:9px;color:#aaa;overflow:hidden}
.bk.on{background:linear-gradient(90deg,#8a1a1e,#d6353a 45%,#8a1a1e)}
.bk.pl{background:linear-gradient(90deg,#1b4d80,#3a8ee0 45%,#1b4d80)}
.dn{writing-mode:vertical-rl;font-size:10px;line-height:1;letter-spacing:-.02em;margin-bottom:4px;color:#5b5a66;font-weight:700;max-height:62%}
.bk .dn{color:#ddd;font-size:9px}
.tools{display:flex;gap:6px;padding:0 8px 6px;flex-wrap:nowrap;overflow-x:auto;flex:none;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tb{flex:none;height:34px;padding:0 11px;border:none;border-radius:17px;background:rgba(255,255,255,.12);color:#f3ece6;font-size:13px;font-weight:700;white-space:nowrap;border:1px solid rgba(255,255,255,.15)}
.tb.on{background:#f3ece6;color:#4a382c}
.tb.rec.on{background:var(--red);color:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.6}}
.bpm{display:flex;align-items:center;gap:4px;color:#f3ece6;font-size:13px;font-weight:700;flex:none}
.bpm button{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.12);color:#fff;font-size:16px}
.browser{flex:1;min-height:0;margin:0 8px 8px;background:rgba(20,14,10,.55);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px;flex:none;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:15px;border:none;background:rgba(255,255,255,.1);color:#eadfd6;font-size:13px;font-weight:700}
.chip.on{background:var(--red);color:#fff}
.search{margin:0 8px 6px;display:flex;gap:6px}
.search input{flex:1;height:34px;border-radius:9px;border:none;padding:0 12px;font-family:inherit;font-size:14px;background:rgba(255,255,255,.9)}
.grid{flex:1;overflow-y:auto;padding:0 8px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;align-content:start}
.tone{border:none;border-radius:9px;padding:9px 10px;text-align:left;background:rgba(255,255,255,.08);color:#f4ede7;font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center}
.tone small{font-family:'DotGothic16',monospace;color:#ff9c9f;font-size:13px;min-width:28px}
.tone.on{background:#f3ece6;color:#3b2c22}
.tone.on small{color:var(--red)}
.hint{color:#cdbfb3;font-size:11px;padding:2px 10px 8px;flex:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;z-index:9}
.toast.show{opacity:1}
@media (max-width:640px){
 .dev{margin:6px;padding:8px}
 .lcd{min-height:74px;padding:6px 10px}.lcd .l1{font-size:19px}.lcd .l3{font-size:16px}
 .ctrls{gap:6px}.vol{width:92px}.sq{width:38px}.shiftb{width:46px;height:46px}.knob{width:48px;height:48px}
 .side{width:44px}.wave{width:44px}.strip{width:34px}
}

.main{flex:none;display:flex;flex-direction:column;min-width:0}
.kb.tight .labels .t{font-size:8px;padding:1px 0;letter-spacing:-.04em}
.kb.tight .labels .g{font-size:8px}
.kb.tight .wk{font-size:8px;padding-bottom:6px}
.kb.tight .dn{font-size:8px}
@media (orientation:portrait){
 .side{width:36px}.wave{width:36px;height:46px;font-size:8px;padding:1px}.wave svg{width:20px}.strip{width:28px}
 .mid{gap:5px}
}
@media (orientation:landscape){
 body{flex-direction:row}
 .main{flex:1;min-width:0;height:100dvh}
 .dev{margin:6px 0 6px 6px;padding:8px}
 .top{flex-wrap:nowrap;gap:8px}
 .lcd{flex:1 1 auto;min-height:0;padding:5px 10px}
 .lcd .l1{font-size:17px}.lcd .l2{font-size:11px}.lcd .l3{font-size:14px;min-height:17px}
 .ctrls{flex:none;gap:8px}
 .sq{width:34px;height:32px;font-size:18px}.octs{gap:5px}
 .shiftb{width:42px;height:42px;font-size:10px}
 .vol{width:84px;height:32px}.knob{width:42px;height:42px}
 .lbl{font-size:9px}
 .mid{margin-top:6px}
 .tools{padding:0 0 6px 6px}
 .browser{flex:none;width:clamp(230px,34vw,340px);margin:6px;height:calc(100dvh - 12px)}
 .hint{display:none}
 .grid{grid-template-columns:1fr}
 .tone{padding:7px 10px}
}
@media (orientation:landscape) and (min-width:1100px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="main">
<div class="dev">
 <div class="top">
  <div class="lcd" id="lcd"><div class="led"></div><div class="l1" id="l1"></div><div class="l2" id="l2"></div><div class="l3" id="l3"></div></div>
  <div class="ctrls">
   <div class="grp"><span class="lbl">RESET</span><div class="octs"><button class="sq" id="octDn">−</button><button class="sq" id="octUp">＋</button></div><span class="lbl">OCTAVE</span></div>
   <div class="grp"><button class="shiftb" id="shift">SHIFT</button></div>
   <div class="grp"><div class="vol"><input type="range" id="vol" min="0" max="100" value="80"></div><span class="lbl">VOLUME</span></div>
   <div class="grp"><div class="knob" id="knob"><i></i></div><span class="lbl">DATA</span></div>
  </div>
 </div>
 <div class="mid">
  <div class="side">
   <button class="wave" id="sus"><svg width="26" height="10" viewBox="0 0 26 10"><path d="M1 8 Q4 1 7 8 T13 8 T19 8 T25 8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M1 9.5H25" stroke="currentColor"/></svg>サステイン</button>
   <div class="strip" id="strip"><span style="top:3px">＋</span><span style="bottom:3px">−</span><div class="dot" id="dot"></div></div>
   <button class="wave" id="mod"><svg width="26" height="10" viewBox="0 0 26 10"><path d="M1 5 Q3 1 5 5 T9 5 T13 5 T17 5 T21 5 T25 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>ビブラート</button>
  </div>
  <div class="kbwrap" id="kbwrap"><div class="kb" id="kb"><div class="labels" id="labels"></div><div class="keys" id="keys"></div></div></div>
 </div>
</div>
<div class="tools">
 <button class="tb rec" id="rec">● 録音</button>
 <button class="tb" id="play">▶ 再生</button>
 <button class="tb" id="stop">■ 停止</button>
 <button class="tb" id="met">メトロノーム</button>
 <div class="bpm"><button id="bpmDn">−</button><span id="bpm">100</span><button id="bpmUp">＋</button></div>
 <button class="tb" id="midi">MIDI接続</button>
 <button class="tb" id="nm">音名</button>
 <button class="tb" id="panic">全音停止</button>
</div>
</div>
<div class="browser">
 <div class="chips" id="chips"></div>
 <div class="search"><input id="q" placeholder="音色を検索（例：ギター、パッド、108）"></div>
 <div class="grid" id="grid"></div>
 <div class="hint">SHIFTを押してから鍵盤：トランスポーズ／タッチ／リバーブ／番号入力＋Enter（実機と同じ配置）。左の帯＝ピッチベンド。PCではZ〜/・Q〜Pで演奏、スペース＝サステイン、↑↓＝音色。</div>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== データ =====
const NAMES=['ピアノ 1','ピアノ 2','ピアノ 3','ホンキートンク','E.ピアノ 1','E.ピアノ 2','ハープシコード','クラビネット','チェレスタ','グロッケン','ミュージックボックス','ビブラフォン','マリンバ','シロホン','ティンカーベル','ダルシマー','オルガン 1','オルガン 2','オルガン 3','チャーチ オルガン','リード オルガン','アコーディオン','ハーモニカ','バンドネオン','ナイロン ギター','スティール ギター','ジャズ ギター','クリーン ギター','ギター ミュート','オーバードライブ ギター','ディストーション ギター','ギター ハーモニクス','アコースティック ベース','フィンガー ベース','ピック ベース','フレットレス ベース','スラップ ベース 1','スラップ ベース 2','シンセ ベース 1','シンセ ベース 2','バイオリン','ビオラ','チェロ','コントラバス','トレモロ ストリングス','ピチカート','ハープ','ティンパニ','ストリングス','スロー ストリングス','シンセ ストリングス 1','シンセ ストリングス 2','クワイア Aahs','ボイス Oohs','シンセ ボックス','オーケストラヒット','トランペット','トロンボーン','チューバ','ミュート トランペット','フレンチホルン','ブラス','シンセ ブラス 1','シンセ ブラス 2','ソプラノ サックス','アルト サックス','テナー サックス','バリトン サックス','オーボエ','イングリッシュ ホルン','バスーン','クラリネット','ピッコロ','フルート','リコーダー','パンフルート','ボトルブロー','尺八','ホイッスル','オカリナ','リード 1（スクエア）','リード 2（ソートゥース）','リード 3（カリオペ）','リード 4（クリフ）','リード 5（チャラング）','リード 6（ボイス）','リード 7（5th）','リード 8（ベース+リード）','パッド 1（ニューエイジ）','パッド 2（ウォーム）','パッド 3（ポリシンセ）','パッド 4（クワイア）','パッド 5（ボウ）','パッド 6（メタリック）','パッド 7（ハロー）','パッド 8（スイープ）','Fx 1（レイン）','Fx 2（サウンドトラック）','Fx 3（クリスタル）','Fx 4（アトモスフィア）','Fx 5（ブライトネス）','Fx 6（ゴブリン）','Fx 7（エコーズ）','Fx 8（SFX）','シタール','バンジョー','三味線','琴','カリンバ','バグパイプ','フィドル','シャナイ','ティンカーベル','アゴゴ','スティールドラム','ウッドブロック','太鼓','メロディックタム','シンセ ドラム','リバースシンバル','ギター フレットノイズ','ブレスノイズ','シーショア','バード','テレホン','ヘリコプター','アプローズ','ガンショット'];
const DRUMS={211:'スタンダード セット',212:'パワー セット',213:'ブラシ',214:'オーケストラ',215:'CM-64/32'};
const CATS=[['すべて',0],['ピアノ',1],['クロマチック',9],['オルガン',17],['ギター',25],['ベース',33],['ストリングス',41],['アンサンブル',49],['ブラス',57],['リード',65],['パイプ',73],['シンセリード',81],['シンセパッド',89],['シンセFX',97],['エスニック',105],['パーカッシブ',113],['効果音',121],['ドラム',211]];
const ORDER=[...Array(128)].map((_,i)=>i+1).concat([211,212,213,214,215]);
const DN={35:'キック2',36:'キック',37:'サイドスティック',38:'スネア',39:'クラップ',40:'スネア2',41:'ロータム2',42:'HH クローズ',43:'ロータム',44:'HH ペダル',45:'ミッドタム2',46:'HH オープン',47:'ミッドタム',48:'ハイタム2',49:'クラッシュ',50:'ハイタム',51:'ライド',52:'チャイナ',53:'ライドベル',54:'タンバリン',55:'スプラッシュ',56:'カウベル',57:'クラッシュ2',58:'ビブラスラップ',59:'ライド2',60:'ハイボンゴ',61:'ローボンゴ',62:'コンガ ミュート',63:'コンガ オープン',64:'ローコンガ',65:'ティンバレス高',66:'ティンバレス低',67:'アゴゴ高',68:'アゴゴ低',69:'カバサ',70:'マラカス',71:'ホイッスル短',72:'ホイッスル長',73:'ギロ短',74:'ギロ長',75:'クラベス',76:'ウッド高',77:'ウッド低',78:'クイーカ1',79:'クイーカ2',80:'トライアングル1',81:'トライアングル2'};
const PC=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const isDrum=p=>p>200;
const pname=p=>isDrum(p)?DRUMS[p]:NAMES[p-1];
const pad3=n=>String(n).padStart(3,'0');
const nn=m=>PC[((m%12)+12)%12]+(Math.floor(m/12)-1);

// ===== 音色パラメータ =====
// w:[波形,倍率,音量,デチューン] perc:減衰秒 a/d/s/r lpM:基本カットオフ倍率 lpE:ピーク倍率 lpA/lpD q fm:[比,深さ,減衰] vib:[速さ,cent,遅れ] trem:[速さ,深さ] dist noise:[量,周波数,Q,長さ] pe:[半音,秒] form:[フォルマント] oct g
const S='sine',T='triangle',W='sawtooth',Q='square',U='pulse';
const PRE={
1:{w:[[T,1,.55],[S,2,.22],[W,1,.12,4]],perc:2.6,lpM:2,lpE:10,lpD:.5,r:.3,noise:[.05,3000,1,.012],g:.62},
2:{w:[[T,1,.5],[S,2,.2],[W,1,.2,3]],perc:2.4,lpM:3,lpE:16,lpD:.45,r:.3,noise:[.06,3500,1,.012],g:.58},
3:{w:[[W,1,.28],[T,1,.4,-5],[S,2,.2]],perc:2.2,lpM:2.5,lpE:8,lpD:.4,r:.3,g:.55},
4:{w:[[T,1,.4,-14],[T,1,.4,14],[W,1,.12]],perc:2.2,lpM:3,lpE:10,lpD:.4,r:.3,g:.55},
5:{w:[[S,1,.75],[S,2,.08]],fm:[1,2.2,.5],perc:3.2,trem:[4.5,.18],r:.35,g:.62},
6:{w:[[S,1,.6],[S,1,.2,7]],fm:[14,1.3,.12],perc:2.6,r:.35,g:.6},
7:{w:[[W,1,.4],[W,2,.15]],perc:1.7,lpM:6,lpE:25,lpD:.08,q:2,r:.15,g:.45},

function step(d){const i=ORDER.indexOf(st.prog);setProg(ORDER[Math.max(0,Math.min(ORDER.length-1,i+d))])}
let kd=null;
knob.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();knob.setPointerCapture(e.pointerId);kd={y:e.clientY,x:e.clientX,acc:0,moved:false}});
knob.addEventListener('pointermove',e=>{if(!kd)return;const dy=(kd.y-e.clientY)+(e.clientX-kd.x);kd.y=e.clientY;kd.x=e.clientX;kd.acc+=dy;while(Math.abs(kd.acc)>=14){const s=Math.sign(kd.acc);step(s);kd.acc-=14*s;kd.moved=true}});
knob.addEventListener('pointerup',e=>{if(kd&&!kd.moved){const r=knob.getBoundingClientRect();step(e.clientX<r.left+r.width/2?-1:1)}kd=null;if(ac)previewTone()});
knob.addEventListener('wheel',e=>{e.preventDefault();step(e.deltaY>0?1:-1)},{passive:false});
// サステイン・ビブラート
$('sus').onclick=()=>{initAudio();setSus(!st.sus);lcd()};
$('mod').onclick=()=>{initAudio();setMod(!st.mod)};
// ピッチベンド帯
const strip=$('strip'),dot=$('dot');let sp=null;
function bendAt(e){const r=strip.getBoundingClientRect();const y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));dot.style.top=(y*100)+'%';st.bend=Math.round((.5-y)*4*100)/100;applyBend()}
strip.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();strip.setPointerCapture(e.pointerId);sp=e.pointerId;bendAt(e)});
strip.addEventListener('pointermove',e=>{if(sp===e.pointerId)bendAt(e)});
const sUp=e=>{if(sp!==e.pointerId)return;sp=null;st.bend=0;dot.style.top='50%';applyBend()};
strip.addEventListener('pointerup',sUp);strip.addEventListener('pointercancel',sUp);

// コード判定
const CH=[['',[0,4,7]],['m',[0,3,7]],['7',[0,4,7,10]],['M7',[0,4,7,11]],['m7',[0,3,7,10]],['mM7',[0,3,7,11]],['6',[0,4,7,9]],['m6',[0,3,7,9]],['sus4',[0,5,7]],['sus2',[0,2,7]],['7sus4',[0,5,7,10]],['dim',[0,3,6]],['dim7',[0,3,6,9]],['m7(♭5)',[0,3,6,10]],['aug',[0,4,8]],['add9',[0,2,4,7]],['madd9',[0,2,3,7]],['9',[0,2,4,7,10]],['M9',[0,2,4,7,11]],['m9',[0,2,3,7,10]],['7(♭9)',[0,1,4,7,10]],['5',[0,7]],['(omit5)',[0,4]],['m(omit5)',[0,3]],['7(omit5)',[0,4,10]],['M7(omit5)',[0,4,11]]];
function updChord(){
 const ms=[...new Set([...H.values()].map(h=>h.midi))].sort((a,b)=>a-b);
 if(isDrum(st.prog)){$('l3').textContent=ms.map(m=>DN[m]||nn(m)).join(' ');return}
 if(!ms.length){$('l3').textContent='';return}
 const pcs=[...new Set(ms.map(m=>m%12))],bass=ms[0]%12;let name='';
 if(pcs.length>=2){let best=null;for(const r of pcs){const iv=pcs.map(p=>(p-r+12)%12).sort((a,b)=>a-b).join();const c=CH.find(c=>c[1].join()===iv);if(c&&(!best||r===bass)){best=[r,c[0]];if(r===bass)break}}
  if(best)name=PC[best[0]]+best[1]+(best[0]!==bass?'/'+PC[bass]:'')}
 $('l3').textContent=(name?name+'  ':'')+'('+ms.map(nn).join(' ')+')';
}

// 録音・再生
let rec=null,take=null,playT=[],playV=new Map(),pStart=0;
function recEv(type,midi,vel){if(rec)rec.push({t:performance.now()-rec.t0,type,midi,vel,prog:st.prog})}
$('rec').onclick=()=>{initAudio();if(rec){stopRec();return}stopPlay();rec=[];rec.t0=performance.now();$('rec').classList.add('on');$('rec').textContent='● 録音中…';toast('録音中。もう一度押すか■で終了')};
function stopRec(){if(!rec)return;take=rec.filter(e=>1);take.dur=performance.now()-rec.t0;rec=null;$('rec').classList.remove('on');$('rec').textContent='● 録音';
 toast(take.length?`録音しました（${(take.dur/1000).toFixed(1)}秒・${take.filter(e=>e.type==='on').length}音）。▶で再生`:'何も録音されませんでした')}
function stopPlay(){playT.forEach(clearTimeout);playT=[];for(const[,v]of playV)relV(v,true);playV.clear();document.querySelectorAll('.pl').forEach(e=>e.classList.remove('pl'));$('play').classList.remove('on')}
$('play').onclick=()=>{initAudio();stopRec();if(!take||!take.length){toast('先に●録音してください');return}stopPlay();$('play').classList.add('on');
 for(const e of take){playT.push(setTimeout(()=>{const idx=e.midi-base();const k=keyEl[idx];
  if(e.type==='on'){const v=noteOn(e.midi,e.vel,e.prog);if(playV.has(e.midi))relV(playV.get(e.midi),true);if(v)playV.set(e.midi,v);if(k)k.classList.add('pl')}
  else{const v=playV.get(e.midi);if(v){relV(v,true);playV.delete(e.midi)}if(k)k.classList.remove('pl')}},e.t))}
 playT.push(setTimeout(stopPlay,take.dur+300))};
$('stop').onclick=()=>{stopRec();stopPlay()};
$('panic').onclick=()=>{stopPlay();panic()};

// メトロノーム
let metOn=false,metT=null,nextT=0,beat=0;
$('bpm').textContent=st.bpm;
function sched(){while(nextT<ac.currentTime+.12){const d=ac.createGain();d.gain.value=.5;d.connect(master);dT(nextT,beat%4?1300:2000,beat%4?1300:2000,.04,beat%4?.5:.8,d,'sine',.01);nextT+=60/st.bpm;beat++}}
$('met').onclick=()=>{initAudio();metOn=!metOn;$('met').classList.toggle('on',metOn);if(metOn){beat=0;nextT=ac.currentTime+.05;metT=setInterval(sched,25)}else clearInterval(metT)};
function bpm(d){st.bpm=Math.max(40,Math.min(240,st.bpm+d));$('bpm').textContent=st.bpm;save()}
let bt;['bpmDn','bpmUp'].forEach((id,j)=>{const el=$(id),d=j?1:-1;el.addEventListener('pointerdown',e=>{e.preventDefault();bpm(d);bt=setTimeout(function r(){bpm(d*5);bt=setTimeout(r,120)},450)});['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>clearTimeout(bt)))});

// MIDI入力（実機のK32sをUSBでつないで鳴らす）
$('midi').onclick=async()=>{initAudio();
 if(!navigator.requestMIDIAccess){toast('この環境ではMIDI接続が使えません（PCのChrome/Edgeで開くと使えます）');return}
 try{const acc=await navigator.requestMIDIAccess();const bind=()=>{let c=0;acc.inputs.forEach(inp=>{inp.onmidimessage=onMidi;c++});$('midi').classList.toggle('on',c>0);toast(c?`MIDI機器 ${c}台を接続しました。実機の鍵盤でこの音が鳴ります`:'MIDI機器が見つかりません。USBでつないでからもう一度押してください')};bind();acc.onstatechange=bind}
 catch(e){toast('MIDI接続が許可されませんでした（表示中の画面では使えない場合があります）')}};
function onMidi(ev){const[s,a,b]=ev.data;const c=s&0xf0,ch=s&15;const id='m'+ch+'_'+a;
 if(c===0x90&&b>0){if(ch===9){initAudio();drum(a,b/127,isDrum(st.prog)?st.prog:211);return}const idx=a-base();press(id,a,b/127,idx>=0&&idx<32?idx:null)}
 else if(c===0x80||(c===0x90&&b===0)){if(ch!==9)release(id)}
 else if(c===0xB0){if(a===64)setSus(b>=64);if(a===1)setMod(b>20)}
 else if(c===0xE0){st.bend=(((b<<7)|a)-8192)/8192*2;applyBend()}
 else if(c===0xC0&&ch!==9)setProg(a+1)}

// PCキーボード
const KM={KeyZ:0,KeyS:1,KeyX:2,KeyD:3,KeyC:4,KeyV:5,KeyG:6,KeyB:7,KeyH:8,KeyN:9,KeyJ:10,KeyM:11,Comma:12,KeyL:13,Period:14,Semicolon:15,Slash:16,
 KeyQ:12,Digit2:13,KeyW:14,Digit3:15,KeyE:16,KeyR:17,Digit5:18,KeyT:19,Digit6:20,KeyY:21,Digit7:22,KeyU:23,KeyI:24,Digit9:25,KeyO:26,Digit0:27,KeyP:28};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
 if(e.code==='Space'){e.preventDefault();if(!e.repeat){initAudio();setSus(true);lcd()}return}
 if(e.code==='ArrowUp'||e.code==='ArrowDown'){e.preventDefault();step(e.code==='ArrowUp'?-1:1);return}
 if(e.repeat||!(e.code in KM)||e.metaKey||e.ctrlKey)return;const i=7+KM[e.code];press('k'+e.code,keyMidi(i),.8,i<32?i:null)});
addEventListener('keyup',e=>{if(e.code==='Space'){setSus(false);lcd();return}if(e.code in KM)release('k'+e.code)});
addEventListener('blur',()=>{for(const id of [...H.keys()])if(id[0]==='k')release(id)});

// 音色ブラウザ
let cat=0;
function renderChips(){$('chips').innerHTML=CATS.map(([n,s])=>`<button class="chip${s===cat?' on':''}" data-s="${s}">${n}</button>`).join('')}
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cat=+b.dataset.s;$('q').value='';renderChips();renderGrid()};
function renderGrid(keepScroll){
 const q=$('q').value.trim();let list=ORDER;
 if(q)list=ORDER.filter(p=>pname(p).includes(q)||String(p)===q.replace(/^0+/,''));
 else if(cat)list=cat===211?[211,212,213,214,215]:ORDER.filter(p=>p>=cat&&p<cat+8);
 const g=$('grid'),sc=g.scrollTop;
 g.innerHTML=list.map(p=>`<button class="tone${p===st.prog?' on':''}" data-p="${p}"><small>${pad3(p)}</small>${pname(p)}</button>`).join('')||'<div style="color:#cbb;padding:10px">見つかりません</div>';
 if(keepScroll)g.scrollTop=sc;
}
$('grid').onclick=e=>{const b=e.target.closest('.tone');if(!b)return;initAudio();setProg(+b.dataset.p,true)};
$('q').oninput=()=>renderGrid();
$('nm').onclick=()=>{st.names=!st.names;layout();save()};
addEventListener('resize',()=>{clearTimeout(window._r);window._r=setTimeout(layout,120)});
addEventListener('orientationchange',()=>setTimeout(layout,300));
document.addEventListener('visibilitychange',()=>{if(document.hidden){for(const id of [...H.keys()])release(id)}});

// 起動
renderChips();layout();lcd();knobUpd();renderGrid();

</script>
