<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="songs.webmanifest">
<meta name="theme-color" content="#0b0d18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="songs-icon-192.png">
<link rel="icon" href="songs-icon-192.png">
<title>コード分析ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0e0a; --bg2:#16170f; --card:#1e2016; --line:#34372a;
  --ink:#f6f4e8; --mute:#a3a28c; --accent:#f5e04a;
  --T:#6cc6ff; --SD:#8fe39a; --D:#ff8f6b; --SDm:#c8a2ff; --piv:#f5e04a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--grad),var(--bg);min-height:100vh}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:20px 16px 120px}
header h1{font-size:clamp(26px,6vw,40px);font-weight:900;margin:8px 0 2px;letter-spacing:.02em}
header .sub{color:var(--mute);font-size:14px}
.mono{font-family:"JetBrains Mono",monospace}

/* transport */
.wrap{padding:10px 10px 40px}
header h1{font-size:18px;margin:0}
header .sub{font-size:11px}
.transport{position:sticky;top:0;z-index:5;margin:8px -10px 0;padding:8px 10px;background:var(--tbg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.play{width:40px;height:40px;border-radius:50%;border:none;background:var(--accent);color:var(--playink);font-size:16px;cursor:pointer;flex:none}
.now{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.now .big{font-family:"JetBrains Mono",monospace;font-size:22px;font-weight:700;min-width:70px;line-height:1}
.now .meta{font-size:11px;color:var(--mute);line-height:1.35}
.now .meta b{color:var(--ink)}
.ctrls{display:flex;gap:5px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--mute)}
.ctrls input[type=range]{width:64px;accent-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:transparent;color:var(--mute);border:none;padding:3px 7px;font:inherit;font-size:10px;cursor:pointer}
.seg button.on{background:var(--line);color:var(--ink)}
.tog{background:transparent;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:3px 7px;font:inherit;font-size:10px;cursor:pointer}
.tog.on{border-color:var(--accent);color:var(--ink)}
.prog{height:2px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--T),var(--accent))}
.desc{margin-top:4px;font-size:10.5px;line-height:1.4;color:var(--ink);opacity:.9;min-height:2.8em;max-height:2.8em;overflow:hidden}

.legend{display:flex;flex-wrap:wrap;gap:3px 9px;margin:6px 0 0;font-size:10px;color:var(--mute)}
.lg{display:flex;align-items:center;gap:4px}
.dot{width:8px;height:8px;border-radius:2px}

details.intro{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11px;line-height:1.6;color:var(--text2);margin-top:6px}
details.intro summary{cursor:pointer;color:var(--accent);font-size:11px}
details.intro b{color:var(--ink)}
details.intro p{margin:6px 0 2px}

section.sec{margin-top:5px}
.sechead{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.sechead h2{margin:0;font-size:12px;font-weight:700}
.key{font-size:9px;padding:1px 6px;border-radius:999px;background:var(--keybg);color:var(--accent)}
.key.mod{background:rgba(255,209,102,.14);color:var(--piv)}

.bars{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
@media (max-width:700px){.bars{grid-template-columns:repeat(4,1fr)}}
.bar{display:flex;gap:2px;border-left:1px solid var(--line);padding-left:2px;position:relative}
.chord{flex:1;min-width:0;background:var(--card);border-radius:4px;border-top:3px solid var(--fc);padding:2px 3px 1px;cursor:pointer;position:relative;transition:background .12s,box-shadow .12s}
.chord .nm{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:12px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:clip;letter-spacing:-.03em}
.chord .dg{font-family:"JetBrains Mono",monospace;font-size:9px;line-height:1.2;color:var(--fc);white-space:nowrap;overflow:hidden;letter-spacing:-.03em}
.chord .fn{display:none}
.chord .pv{position:absolute;top:0;right:2px;font-size:8px;color:var(--piv)}
.chord.active{background:color-mix(in srgb,var(--fc) 32%,var(--card));box-shadow:0 0 0 1.5px var(--fc),0 0 12px color-mix(in srgb,var(--fc) 50%,transparent)}
.chord.sel{outline:1px dashed var(--accent);outline-offset:1px}
.secnote{display:none}
body.notes .secnote{display:block;font-size:10.5px;color:var(--mute);line-height:1.55;margin:0 0 4px}

.foot{margin-top:10px;font-size:9.5px;color:var(--mute);line-height:1.6;border-top:1px solid var(--line);padding-top:6px}
.foot a{color:var(--accent)}
.bar.two .nm{font-size:10.5px}.bar.two .dg{font-size:8.5px}
.sec{display:grid;grid-template-columns:22px 1fr;gap:4px;align-items:stretch}
.sechead{flex-direction:column;justify-content:flex-start;margin:0;background:var(--bg2);border-radius:4px;padding:3px 0;gap:3px}
.sechead h2{writing-mode:vertical-rl;font-size:11px;letter-spacing:.05em}
.sechead .key{writing-mode:vertical-rl;padding:4px 1px;font-size:8.5px}
.secbody{min-width:0}
.bpmbox{display:inline-flex;align-items:center;gap:4px}
.ar{width:26px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font-size:10px;cursor:pointer;padding:0;touch-action:manipulation}
.ar:active{background:var(--line)}

.explain{margin-top:16px}
.explain h2{font-size:15px;margin:0 0 6px}
.exsec{margin:10px 0 4px;font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center}
.exitem{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;padding:6px 8px;background:var(--bg2);border-left:3px solid var(--fc);border-radius:6px;margin-bottom:4px;cursor:pointer}
.exitem .cn{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:13px;white-space:nowrap}
.exitem .cd{font-size:10.5px;color:var(--fc);font-family:"JetBrains Mono",monospace;align-self:center}
.exitem .ct{grid-column:1/3;font-size:11px;line-height:1.6;color:var(--text2)}
.summary{margin-top:18px;background:linear-gradient(160deg,var(--sg1),var(--sg2));border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.summary h2{font-size:15px;margin:0 0 8px}
.summary h3{font-size:12.5px;margin:12px 0 4px;color:var(--accent)}
.summary p{font-size:11.5px;line-height:1.8;margin:0;color:var(--text4)}
.summary b{color:var(--ink)}
.flow{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 2px;font-size:10.5px}
.flow span{padding:3px 7px;border-radius:999px;background:var(--keybg)}
.flow span.m{background:rgba(196,155,255,.18);color:var(--SDm)}
.flow i{font-style:normal;color:var(--mute);align-self:center}

.main{display:grid;grid-template-columns:44px minmax(0,1fr);gap:5px;align-items:start}
.dia{position:sticky;top:var(--th,150px);display:flex;flex-direction:column;gap:2px;margin-top:5px}
.dh{font-size:9px;font-weight:700;text-align:center;color:var(--accent);background:var(--keybg);border-radius:4px;padding:1px 0;margin-top:3px}
.dc{background:var(--card);border-left:3px solid var(--fc);border-radius:3px;padding:2px 2px 1px 3px;cursor:pointer}
.dc .dn{font-family:"JetBrains Mono",monospace;font-size:9px;font-weight:700;line-height:1.15;white-space:nowrap;letter-spacing:-.04em}
.dc .dd{font-family:"JetBrains Mono",monospace;font-size:8px;color:var(--fc);line-height:1.1}
.dc.on{background:color-mix(in srgb,var(--fc) 35%,var(--card));box-shadow:0 0 0 1px var(--fc)}
.sec{grid-template-columns:18px minmax(0,1.1fr) minmax(0,1fr)!important}
.bars{grid-template-columns:repeat(2,1fr)!important}
@media (min-width:900px){.bars{grid-template-columns:repeat(4,1fr)!important}.main{grid-template-columns:70px minmax(0,1fr)}.dc .dn{font-size:11px}.dc .dd{font-size:9.5px}}
.exwrap{position:relative;min-height:120px}
.exlist{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:2px;scrollbar-width:thin}
.exitem{background:var(--bg2);border-left:3px solid var(--fc);border-radius:4px;padding:3px 5px;margin-bottom:3px;cursor:pointer}
.exitem .eh{display:flex;flex-wrap:wrap;gap:0 5px;align-items:baseline}
.exitem .cn{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:10.5px}
.exitem .cd{font-family:"JetBrains Mono",monospace;font-size:8.5px;color:var(--fc)}
.exitem .ct{font-size:9.5px;line-height:1.45;color:var(--text3)}
.exitem.active{background:color-mix(in srgb,var(--fc) 22%,var(--bg2));box-shadow:0 0 0 1px var(--fc)}
@media (min-width:900px){.exitem .cn{font-size:12px}.exitem .ct{font-size:11px}}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:0 -10px 6px;padding:6px 10px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--bg2);color:var(--mute);border-radius:999px;padding:5px 11px;font:inherit;font-size:11px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--playink);font-weight:700}
.chord .ndm{position:absolute;right:2px;bottom:0;font-size:9px;font-weight:700;color:var(--accent);line-height:1}
.chord.nd{background-image:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,transparent) 0 18%,transparent 18%)}
.exitem .ndn{font-size:9px;color:var(--accent);margin-top:2px;line-height:1.4}
@media (min-width:900px){.exitem .ndn{font-size:10.5px}}
.dh small{display:block;font-size:7.5px;font-weight:500;color:var(--mute);line-height:1.2}
.dc .dr{font-family:"JetBrains Mono",monospace;font-size:7.5px;color:var(--mute);line-height:1.1;white-space:nowrap}
.dc .ndm2{color:var(--accent);font-size:8px}
.main{grid-template-columns:50px minmax(0,1fr)}
@media (min-width:900px){.main{grid-template-columns:84px minmax(0,1fr)}.dh small{font-size:9px}.dc .dr{font-size:9px}}

.rhythm{margin-top:18px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px}
.rhythm h2{font-size:15px;margin:0 0 4px}
.rhythm .rmeta{font-size:11px;color:var(--mute);margin-bottom:8px}
.rhythm .rmeta b{color:var(--accent)}
.rlv{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.rlv button{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:999px;padding:3px 9px;font:inherit;font-size:10.5px;cursor:pointer}
.rlv button.on{border-color:var(--accent);color:var(--ink);background:var(--keybg)}
.rgrid{display:grid;grid-template-columns:44px repeat(16,minmax(0,1fr));gap:2px;align-items:center}
.rgrid .rl{font-size:9.5px;color:var(--mute);white-space:nowrap}
.rgrid .rh{font-family:"JetBrains Mono",monospace;font-size:8.5px;color:var(--mute);text-align:center}
.rgrid .rh.b{color:var(--ink);font-weight:700}
.rgrid .rc{height:20px;border-radius:3px;background:var(--card);display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",monospace;font-size:9px;color:var(--ink);position:relative}
.rgrid .rc.bt{box-shadow:inset 2px 0 0 var(--line)}
.rgrid .rc.sw{background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.rgrid .rc i{display:block;border-radius:50%;background:var(--rc)}
.rgrid .rc i.X{width:11px;height:11px}.rgrid .rc i.x{width:8px;height:8px}.rgrid .rc i.o{width:6px;height:6px;opacity:.8}
.rgrid .rc i.g{width:6px;height:6px;background:transparent;border:1px solid var(--rc)}
.rgrid .rc i.O{width:11px;height:11px;background:transparent;border:2px solid var(--rc)}
.rgrid .rc.now{outline:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--card))}
.rlegend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:9.5px;color:var(--mute);margin:6px 0 2px}
.rtext p{font-size:11.5px;line-height:1.8;margin:8px 0 0;color:var(--text4)}
.rtext b{color:var(--ink)}
.rnote{font-size:9.5px;color:var(--mute);margin-top:8px;line-height:1.6}
@media (min-width:900px){.rgrid{grid-template-columns:64px repeat(16,minmax(0,1fr))}.rgrid .rc{height:24px;font-size:11px}.rgrid .rl{font-size:11px}}
.rmeter{font-size:10.5px;font-weight:700;color:var(--accent);margin:8px 0 3px}

.rsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:6px 0 8px}
.rsum>div{background:var(--card);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:1px}
.rsum>div.wide{grid-column:1/-1}
.rsum span{font-size:9.5px;color:var(--mute)}
.rsum b{font-size:12.5px;color:var(--ink);line-height:1.35}
.rsum small{font-size:9.5px;color:var(--accent)}
.rplay{width:100%;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--ink);border-radius:999px;padding:8px;font:inherit;font-size:12px;cursor:pointer;margin-bottom:8px}
.rhow{font-size:11px;color:var(--text4);background:var(--card);border-radius:8px;padding:6px 10px;margin-bottom:8px}
.rhow summary{cursor:pointer;color:var(--accent)}
.rhow p{margin:6px 0 2px;line-height:1.7}
.rlvl{font-size:10px;color:var(--mute);margin-bottom:3px}
.rsay{font-size:11px;color:var(--mute);margin:6px 0 4px;line-height:1.6}
.rsay span{color:var(--ink);font-family:"JetBrains Mono",monospace;letter-spacing:.02em}
.rgrid .rl{line-height:1.05}
.rgrid .rl small{font-size:8px;color:var(--accent)}

.rsc{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:4px;margin-top:3px}
.rsc span{background:var(--card);border-radius:6px;padding:4px 6px;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink);white-space:nowrap}
.rsc span i{font-style:normal;color:var(--mute);opacity:.6}
.rsc em{font-style:normal;font-size:9px;color:var(--accent);margin-right:5px}
.rgrid .rl{font-size:10px}
.dh.par{background:transparent;border:1px dashed var(--line);color:var(--mute);margin-top:5px}
.dc.par{opacity:.78;border-left-style:dashed}
.dc.par.on{opacity:1}
.dia{max-height:calc(100vh - var(--th,150px) - 8px);overflow-y:auto;scrollbar-width:none}
.dia::-webkit-scrollbar{display:none}

#home{display:none;padding-top:max(6px,env(safe-area-inset-top))}
body.home #home{display:block}
body.home .tabs,body.home header,body.home .transport,body.home .legend,body.home details.intro,body.home .main,body.home #rhythmBox,body.home #summaryBox{display:none!important}
body.home{background:radial-gradient(900px 500px at 85% -10%,#2a1d5a 0%,transparent 60%),radial-gradient(800px 600px at -10% 40%,#0f2a3d 0%,transparent 60%),#0b0d18}
body.home #snow{opacity:.35}
.tabs{display:none!important}
.hhead{display:flex;gap:12px;align-items:center;margin:8px 0 12px}
.hlogo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#ff6ec7,#5cc8ff);display:flex;align-items:center;justify-content:center;font-size:24px;color:#0b0d18;font-weight:900;flex:none}
#home h1{font-size:21px;margin:0;color:#f1f2fb}
.hsub{font-size:11px;color:#9aa0c0;margin-top:2px}
#hsearch{width:100%;box-sizing:border-box;background:#151a2e;border:1px solid #2a3150;color:#f1f2fb;border-radius:10px;padding:9px 12px;font:inherit;font-size:13px;margin-bottom:10px}
#hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:700px){#hgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1000px){#hgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.hcard{position:relative;text-align:left;border:1px solid color-mix(in srgb,var(--ca) 40%,#2a3150);background:linear-gradient(160deg,color-mix(in srgb,var(--ca) 22%,#121628),#10131f 70%);border-radius:14px;padding:12px 11px 10px;cursor:pointer;color:#f1f2fb;font:inherit;min-height:112px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.hcard:active{transform:scale(.98)}
.hcard .ht{font-size:15px;font-weight:900;line-height:1.25}
.hcard .ha{font-size:10.5px;color:#aab0cf}
.hcard .hm{margin-top:auto;display:flex;flex-wrap:wrap;gap:4px}
.hcard .hm span{font-family:"JetBrains Mono",monospace;font-size:9.5px;padding:2px 6px;border-radius:999px;background:color-mix(in srgb,var(--ca) 20%,transparent);color:var(--ca)}
.hcard .hp{font-family:"JetBrains Mono",monospace;font-size:10px;color:#d6daf0;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hfoot{font-size:10.5px;color:#8a90b0;margin:14px 2px 30px;line-height:1.6}
#backBtn{background:var(--keybg);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer;margin-right:8px;vertical-align:middle}
header h1{display:flex;align-items:center;flex-wrap:wrap;gap:4px}

.main{display:block!important}
.kwrap{margin:6px 0 4px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.kwrap summary{font-size:11px;color:var(--accent);cursor:pointer}
.kwrap summary span{color:var(--mute);font-size:9.5px}
.ktab{display:grid;gap:2px;margin-top:4px;max-height:none!important;overflow:visible!important;position:static!important}
.ktab .kh{font-size:10px;font-weight:700;text-align:center;background:var(--keybg);color:var(--accent);border-radius:4px;padding:2px 1px;line-height:1.15}
.ktab .kh small{display:block;font-size:7.5px;font-weight:500;color:var(--mute)}
.ktab .kh{display:flex;flex-direction:column;justify-content:center}
.ktab .kh.par{background:transparent;border:1px dashed var(--line);color:var(--mute);font-size:10px}
.ktab .kh.par span{font-size:7px;font-weight:500}
.ktab .dc{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card);border-radius:3px;border-left:0;border-top:2px solid var(--fc);padding:1px 1px 0;min-width:0;opacity:1}
.ktab .dc.par{border-top-style:dashed;opacity:.78}
.ktab .dc b{font-family:"JetBrains Mono",monospace;font-size:9.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;letter-spacing:-.04em}
.ktab .dc i{font-style:normal;font-family:"JetBrains Mono",monospace;font-size:7.5px;color:var(--fc);line-height:1.1;white-space:nowrap}
.ktab .dc.on{background:color-mix(in srgb,var(--fc) 35%,var(--card));box-shadow:0 0 0 1px var(--fc);opacity:1}
@media (min-width:700px){.ktab .dc b{font-size:11px}.ktab .dc i{font-size:9px}.ktab .kh{font-size:11.5px}}
.hbk{background:#151a2e;border:1px solid #2a3150;color:#f1f2fb;border-radius:999px;width:34px;height:34px;font-size:18px;cursor:pointer;flex:none}
.hcard.art .ht{font-size:17px}
.hcard.pend{opacity:.5;cursor:default;--ca:#6a6f88;border-style:dashed}
.hcard.pend .hm span{font-family:inherit}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div class="wrap">

<template id="intro-fuyu"><p>この曲のキモは<b>同主調の行き来</b>です。Aメロ・Bメロは<b>Aメジャー</b>なのに、F♯m7（VIm7）から始まり、Vの代わりにBm7/E（E9sus4）を使うので、明るさの中にほんのり哀愁と浮遊感がある。Bメロ終わりの<b>Dm7</b>（AでもAmでもIVm7）を合図に、サビは同主調の<b>Aマイナー</b>へ転調。サビの最後は共通のドミナント<b>E7</b>を使って、何事もなかったようにAメジャー（AM7）へ帰ってきます。</p><p style="font-size:10px;color:var(--mute)">コードはご提供の譜面画像に合わせて修正し、小節割りは目安です。エンディングは画像に無いため推定です。度数は各セクションのキー基準（サビはAマイナー基準）。メロディと歌詞は含めていません。</p></template>
<template id="sum-fuyu">
    <h2>総括：この曲はどんな展開をしているか</h2>
    <div class="flow"><span>イントロ A</span><i>→</i><span>Aメロ A</span><i>→</i><span>Bメロ A→Am</span><i>→</i><span class="m">サビ Am</span><i>→</i><span>サビ後半 A</span></div>

    <h3>① 明と暗を「同じ主音」で行き来する</h3>
    <p>曲全体は、温かい<b>Aメジャー</b>と切ない<b>Aマイナー</b>という同主調どうしの対比でできています。主音（ラ）は変わらないまま色だけが明から暗へ、暗から明へと入れ替わるので、転調しても唐突さがなく、「同じ景色が冬の色に変わる」ような聴こえ方になります。</p>

    <h3>② イントロで「マイナー化」を予告する</h3>
    <p>イントロのDM7→DmM7は、3度のF♯だけがFに半音下がる動きです。このF（＝Aマイナーの音）が、のちにサビで本格的に訪れるAマイナーの予告になっています。GM7/A・G6/Aも同主短調から借りたコードで、最初から明るさの中に影が差し込んでいます。</p>

    <h3>③ ホームのAを、じらし続ける</h3>
    <p>注目したいのは、<b>Aメロでは主和音Aが一度も鳴らない</b>ことです。F♯m7・C♯m7といったトニック代理と、Vの代わりのBm7/E（E9sus4）だけで進むので、どこにも着地しない宙に浮いたような感覚が続きます。Bメロでやっと出てくるAも転回形のA/C♯で、ベースのB→C♯→Dの上行を支える経過的な役割です。</p>

    <h3>④ Bメロで緊張を最大まで高める</h3>
    <p>C♯m7とF♯m7の揺れでためを作り、上行するベースでDm7へ。Dm7はAメジャーでもAマイナーでもIVm7になる「共通のコード」で、ここで調がすり替わります。FM7/Gを経て、5度と9度をとがらせたEaug7(♯9)という最も緊張度の高いドミナントで、サビへ飛び込みます。</p>

    <h3>⑤ サビ：マイナーの切なさから、一気に視界が開ける</h3>
    <p>サビ前半はAm7→FM7→E7のマイナーの王道に、C/E→G♯M7→FM7/Gという半音的な動きを混ぜて切なさを深めます。後半、同じE7が今度はAマイナーではなく<b>AM7</b>へ解決します。ここが<b>曲中で初めて主和音Aが基本形でしっかり鳴る瞬間</b>で、AメロからずっとじらされてきたホームにAマイナーの暗さを経て辿り着くため、「冬がはじまる」わくわく感と温かさが一気に広がります。最後はBm7→AM7/C♯・F♯m7→Bm7・E→Aと、素直なAメジャーの進行で締めくくります。</p>

    <h3>まとめ</h3>
    <p>「冬の切なさ（Aマイナー）」と「二人の温かさ（Aメジャー）」を同じ主音の上で行き来させ、さらに主和音Aをサビ後半まで取っておくことで、解放感を最大にしている曲です。切なさを保ちながらも最後は明るく開けるコード進行の設計が、この曲の「寒いのにあたたかい」印象を生んでいます。</p>
  </template>
<template id="intro-fantasy"><p>中心はEマイナー。でもF♯m（IIm）とA（IV）という<b>ドリアンの音</b>を使うので、マイナーなのに暗く沈まず、ふわっと浮かぶ響きになります。Aメロは<b>C→D→E</b>（♭VI→♭VII→I）とメジャーのEへ駆け上がる「上昇する解決」、サビは<b>Em7→Am7→D→G</b>と4度ずつ進む連鎖。2回目のサビの終わりのD7をつなぎ目に、ラストは<b>短3度上のGマイナー</b>へ転調して、同じ進行で一段高いところへ昇っていきます。</p><p style="font-size:10px;color:var(--mute)">コードは公開されているギター譜（<a href="https://www.guitartabsexplorer.com/earth/fantasy-chords">Guitar Tabs Explorer</a>、<a href="https://amp.kompas.com/hype/read/2021/05/28/184500566/index.html">Kompas</a>）を元にした目安です。小節割りと、くり返しの省略は聴きやすさ優先で私が決めました。転調後のターンアラウンド（G/C→B♭→E♭→D7）やアウトロも譜面からの推定です。キーは譜面の表記（Em基準）に合わせています。メロディと歌詞は含めていません。</p></template>
<template id="sum-fantasy">
    <h2>総括：この曲はどんな展開をしているか</h2>
    <div class="flow"><span>イントロ Em</span><i>→</i><span>Aメロ Em</span><i>→</i><span>Bメロ Emドリアン</span><i>→</i><span>サビ Em</span><i>→</i><span>間奏</span><i>→</i><span>サビ2 Em→Gm</span><i>→</i><span class="m">ラストサビ Gm</span></div>

    <h3>① マイナーなのに、暗くならない</h3>
    <p>主和音はEm。でも自然短音階ならF♯dimになるIIをF♯m（IIm）に、IVもメジャーのAにしています。どちらも<b>ドリアン</b>の特徴音C♯を含むので、マイナーキーなのに明るく軽やかで、「切なさ」より「高揚感」が前に出ます。</p>

    <h3>② 上っていく解決：♭VI→♭VII→I</h3>
    <p>AメロはAm→Bm→C→Dと1音ずつ階段を上り、C→D→Eで<b>メジャーのE</b>に着地します。ふつうのV→Iではなく、♭VI→♭VII→Iとベースが下から押し上げる形（エオリアン終止）なので、落ち着くというより「飛び立つ」感覚。イントロのEsus4→Eも同じで、マイナーの曲が要所でメジャーのIに光を差します。</p>

    <h3>③ サビ：4度進行の連鎖とベースの半音上行</h3>
    <p>サビはEm7→Am7→D→G（D/G）→Bm7→Cと、根音が4度ずつ上がる（5度圏を下る）連鎖です。ひとつ進むたびに次のコードへ自然に引っぱられるので、ループしても止まらない推進力が生まれます。最後はAm→A♯dim7→Bとベースを半音で上げてVへ押し上げ、またEm7へ。</p>

    <h3>④ ドミナントは「ためて」から</h3>
    <p>B7sus4→B7、D7sus4→D7、Esus4→Eなど、sus4でためてから解決する場面が何度も出てきます。解決を半拍〜1拍じらすソウル／ゴスペル的な作法で、ホーンやコーラスの決めと組み合わさって高揚感を強めています。</p>

    <h3>⑤ 短3度上への転調で、もう一段高く</h3>
    <p>2回目のサビの終わりのD7は、EmではB7のあとの♭VII7ですが、GmではV7。この1コードを境に、全体が<b>短3度上のGマイナー</b>へ持ち上がり、同じ進行がひと回り高い音域で鳴り続けます。ターンアラウンドのG/C（同主長調のI）で一瞬光が差し、またGm7へ戻ってループしながらフェードアウトしていきます。</p>

    <h3>まとめ</h3>
    <p>ドリアンの明るいマイナーを土台に、<b>上へ上へと押し上げる</b>仕掛け（♭VI→♭VII→Iの上昇、ベースの半音上行、sus4のため、短3度上への転調）を何重にも重ねた曲です。タイトルどおり、聴き手を地上から宇宙へ連れていくような上昇感が、コード進行そのものに組み込まれています。</p>
  </template>
<template id="intro-yoru"><p>キーはE♭メジャー（平行調Cマイナー）。曲のほぼすべてが、<b>王道進行</b>（A♭M7→B♭7→Gm7→Cm7＝IV→V→IIIm→VIm）と、そのVをG7（III7）に替えた<b>丸サ進行／Just the Two of Us進行</b>（A♭M7→G7→Cm7）の2つの組み合わせでできています。どちらも主和音E♭に着地せずCm（VIm）で終わるので、明るいのに切ない「夜」の響きがループし続けます。ラストは半音下のDで静かに歌ったあと、一気に<b>F（原曲より全音上）</b>へ駆け上がります。</p><p style="font-size:10px;color:var(--mute)">コードは公開されているコード譜（<a href="https://www.ufret.jp/song.php?data=57091">U-FRET</a>、ChordWiki）を元にした目安です。くり返しは省略し、小節割りは私が決めました。セクション名と、アウトロの終わり方は推定です。メロディと歌詞は含めていません。</p></template>
<template id="sum-yoru">
    <h2>総括：この曲はどんな展開をしているか</h2>
    <div class="flow"><span>イントロ E♭</span><i>→</i><span>Aメロ</span><i>→</i><span>Bメロ</span><i>→</i><span>サビ</span><i>→</i><span>間奏</span><i>→</i><span class="m">落ちサビ D（半音下）</span><i>→</i><span>ラスサビ F（全音上）</span></div>

    <h3>① 2つの定番進行だけで走り切る</h3>
    <p>この曲のコードは、ほぼ<b>王道進行</b>（IVM7→V7→IIIm7→VIm）と、そのV7をIII7（G7）に置き換えた<b>丸サ進行</b>（IVM7→III7→VIm）の2種類だけ。Aメロもサビも同じ材料で、2小節ごとに入れ替えて変化をつけています。材料をしぼっているからこそ、BPM130の速さでも耳がついていける、とても聴きやすい構造です。</p>

    <h3>② 「明るいのに切ない」のは、Iに着地しないから</h3>
    <p>どちらの進行も、最後は主和音E♭ではなく<b>Cm（VIm）</b>に落ちます。キーはメジャーで、明るいコードから始まるのに、行き着く先はいつもマイナー。しかもG7（III7）はCmへの強いセカンダリードミナントなので、着地するたびに暗さがくっきりします。曲名どおり、明るい街の灯りの中に夜の暗さが沈んでいくような響きです。</p>

    <h3>③ ループを止めない「つなぎ」</h3>
    <p>Cmの後ろに2拍だけ置かれるB♭m7→E♭7（またはB♭m6→E♭）は、A♭M7に向かうツーファイブです。主和音のE♭を一瞬鳴らしてもすぐ7thにしてIVへ押し戻すので、ループの頭へ自然に戻り、立ち止まる場所がありません。</p>

    <h3>④ 下げてから、上げる転調</h3>
    <p>ラスサビの前に、キーを半音下のDへ下げて静かに歌う「落ちサビ」があります。いったん沈めてから、A♭→Aと半音で駆け上がって<b>F</b>へ。DからFは短3度、原曲のE♭から見ても全音上なので、最後のサビがいちばん高く、いちばん切迫して聴こえます。</p>

    <h3>⑤ 最後の最後でIへ</h3>
    <p>曲を通してほとんど避けてきた「IV→V→I」の終止が、アウトロでB♭→C→Fとしてようやく現れます（推定部分を含みます）。それでも最後はまたA7→Dm7（III7→VIm）に戻り、完全には明るくならない余韻を残します。</p>

    <h3>まとめ</h3>
    <p>王道進行と丸サ進行という2つの「VImに着地する進行」を高速でループさせ、主和音を徹底的に避けることで、<b>疾走感と切なさを同時に</b>鳴らし続ける曲です。終盤の「半音下げてから全音上へ」という転調が、その走り続ける物語に最後の加速を与えています。</p>
  </template>
<template id="intro-lemon"><p>キーはBメジャー（平行調G♯マイナー）。Aメロは<b>G♯m→F♯→E→B</b>（VIm→V→IV→I）と下りていき、サビは<b>E→B→F♯→G♯m</b>（IV→I→V→VIm＝4156進行）と同じコードを逆向きに上っていきます。要所ではD♯（III7）やA♯m7♭5→D♯（G♯mへのツーファイブ）でG♯mに引き戻し、明るいキーなのに悲しみへ着地する。Cメロだけは<b>同主調のG♯メジャー</b>へ移り、一瞬光が差します。</p><p style="font-size:10px;color:var(--mute)">コードは公開されているコード譜（<a href="https://www.ufret.jp/song.php?data=48737">U-FRET</a>）を元にした目安です。くり返し（2番）は省略し、小節割り・セクション名・N.C.の扱いは私が決めました。Fm・Fm7♭5は譜面の表記どおりで、理論上はE♯m・E♯m7♭5です。メロディと歌詞は含めていません。</p></template>
<template id="sum-lemon">
    <h2>総括：この曲はどんな展開をしているか</h2>
    <div class="flow"><span>Aメロ B</span><i>→</i><span>Bメロ</span><i>→</i><span>サビ</span><i>→</i><span class="m">Cメロ G♯（同主調）</span><i>→</i><span>ラスサビ B</span><i>→</i><span>アウトロ IVで終止</span></div>

    <h3>① 同じ4つのコードを、下る／上る</h3>
    <p>Aメロは<b>G♯m→F♯→E→B</b>（VIm→V→IV→I）と下り、サビは<b>E→B→F♯→G♯m</b>（IV→I→V→VIm）と上ります。使っているのはほぼ同じ4つのコードなのに、並べる向きを変えるだけで、うつむいた語りから感情があふれ出すサビへと景色が変わります。</p>

    <h3>② 明るいキーの中で、何度もG♯mへ引き戻される</h3>
    <p>キーはBメジャーですが、Aメロの頭もサビの着地も<b>G♯m（VIm）</b>。さらにD♯（III7）というG♯mへのセカンダリードミナントや、A♯m7♭5→D♯→G♯mというマイナーのツーファイブが要所に置かれ、明るい方へ進もうとするたびに悲しみの方へ引き戻されます。</p>

    <h3>③ 経過和音で「翳り」を足す</h3>
    <p>AメロのDdim→D♯や、サビ後半のF♯→Fm7♭5（E♯m7♭5）は、ベースを半音で動かす経過和音です。ほんの2拍ずつですが、ダイアトニックだけの進行にざらついた不安を混ぜ、感情の揺れを細かく描いています。</p>

    <h3>④ Cメロだけ、同主調のメジャーへ</h3>
    <p>Cメロでは、ずっと悲しみの重心だったG♯mが、同じ主音の<b>G♯メジャー</b>に変わります。IV→V→Iが素直に鳴る、曲中でいちばん明るい場面で、失ったものの温かい記憶が一瞬よみがえるような効果。最後のF♯がBメジャーのVとして働き、また元のキーの悲しみへ戻っていきます。</p>

    <h3>⑤ 最後はIVで止める</h3>
    <p>アウトロはC♯m7→G♯m→E→F♯のあと、主和音Bに帰らず<b>E（IV）</b>で終わります。解決しきらないまま宙に浮く終わり方が、喪失のあとに残る「答えの出ない気持ち」をそのまま音にしています。</p>

    <h3>まとめ</h3>

<template id="intro-magic"><p style="background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--ink)"><b>出典</b>：Chord ai（音源からの自動コード解析）の結果をもとに作成。自動解析なので、細かいコードやセクションの区切りは原曲と違う場合があります。</p><p>Chord aiの表示キーはGですが、A→Dの解決が多く、Aメロは平行調Bmを中心に回るので、ここでは<b>AメロをBm、それ以降をDメジャー</b>として分析しています。BPMは約82。</p><p>Bm→B♭augの半音の揺らぎ、ナポリのC、遠く離れたFm・F7・B♭M7など、調の外を漂うコードが多く、タイトル通り「魔法がかかったような」浮遊感が特徴です。</p></template>
<template id="sum-magic"><h2>総括</h2><p style="background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--ink)"><b>出典</b>：Chord ai（音源からの自動コード解析）の結果をもとに作成。自動解析なので、細かいコードやセクションの区切りは原曲と違う場合があります。</p><h3>① 半音の揺らぎで始まる</h3><p>Bm7⇄B♭augは、根音のBだけが半音下のA♯にずれるクリシェ。同じ場所でゆらゆら揺れる感覚が曲全体の色を決めています。</p><h3>② 調の外を漂うAメロ</h3><p>C（ナポリ）→B（同主調）→Dm、Fm→F7→B♭M7と、Bmから見て遠いコードへ次々に飛びます。どこにも着地しない不思議さが「Magic」の正体。A♭7（裏コード）でようやくDメジャーのGに着地します。</p><h3>③ Dメジャーのサビはセカンダリードミナントだらけ</h3><p>D7→G、B7→Em、F♯7→Bm、E7→Aと、行き先の5度上のドミナントを挟み続けて推進力を作ります。</p><h3>④ 同主調への寄り道</h3><p>間奏のFM7、CメロのB♭・Dm・Cm7・F、大サビのC→Dなど、同主調Dマイナー由来のコードで明るさに影を差します。</p><h3>⑤ 解決しないエンディング</h3><p>最後はF♯で止まります。F♯はBmへのドミナントなので、DでもBmでもない宙ぶらりんのまま終わり、魔法が解けきらない余韻を残します。</p></template>
<template id="rhy-magic"><p>テンポはChord aiの表示で約82（Cメロ付近は70前後まで落ちる）。ゆったりした4拍子で、ハイハットは16分を軽く刻むレイドバックしたノリにしています（ノリの細部は推定）。</p></template>
<template id="intro-irisout"><p>出典：ChordWiki・U-FRET・J-Total（キーG♯m、BPM135）。</p><p>AメロとBメロはC♯m7→G♯m→D♯7/G→G♯mの4小節ループ。サビでいきなり半音上のAmに上がり、FM7→E7→Amの短調の定番進行をたたみかけます。</p></template>
<template id="sum-irisout"><h2>総括</h2><h3>① 4小節ループ</h3><p>IVm7→Im→V7→Imというシンプルなループ。和音よりも、細かく動くベースのフレーズが曲を引っぱります。</p><h3>② 導音ベース</h3><p>D♯7/G（正しくはF𝄪）は、ドミナントのベースを導音にしてG♯へ半音で上げる形。しつこく主和音に戻ってくる感じを強めます。</p><h3>③ 半音上への転調</h3><p>サビでG♯mから半音上のAmへ。FM7→E7→Am（♭VI→V→Im）は短調で最も強い引力をもつ進行で、そこにN.C.の「キメ」を混ぜて、目がくらむような勢いを出します。</p></template>
<template id="rhy-irisout"><p>BPM135。キックが4分で刻む速いビートに、16分で動くベースが乗ります。Aメロはドラムとベースだけ、サビで全員が入ります。</p></template>
<template id="intro-sayonara"><p>出典：ChordWiki（キーG、BPM122）。</p><p>CM7→GM7→B7→Em9の切ない響きを軸に、A♯m/D♯→Am7/D→C♯m7♭5→Cm7と半音ずつ下がる流れや、Cm7・Cm9（サブドミナントマイナー）が繰り返し出てきます。明るいのに、どこか別れの寂しさが残る和声です。</p></template>
<template id="sum-sayonara"><h2>総括</h2><h3>① B7で切なくする</h3><p>CM7→GM7のあとにB7（Emへのドミナント）を置き、明るいGメジャーの中に一気に哀愁を持ち込みます。</p><h3>② 半音ずつ下がる流れ</h3><p>A♯m/D♯→Am7/D→C♯m7♭5→Cm7、Em→D♯m→Dm→C♯m→Cmなど、半音で下がるラインがたくさんあります。少しずつ景色が移っていくような感覚です。</p><h3>③ サブドミナントマイナー</h3><p>Cm7・Cm9は同主調Gマイナーから借りたIVm。「さよーなら」の直前に置いて、別れの切なさを決定づけます。</p><h3>④ セカンダリードミナントで押し上げる</h3><p>B7→Em、E7→Am7、F♯7→（Bm）など、次の和音へ引っぱるドミナントで前へ前へと進みます。</p></template>
<template id="rhy-sayonara"><p>BPM122のストレートな8ビート。軽快に弾むポップ・ロックで、サビは8分の刻みで勢いよく進みます。</p></template>
<template id="intro-kickback"><p>出典：ChordWiki（BPM205）。</p><p>B♭m（D♭）→F→B→E→A♭→E→B♭mと、セクションごとに調がどんどん変わる曲です。Bメロは長3度下、プレサビは増4度上、サビは完全4度上と、転調の幅も大きく、チェンソーの「キックバック」のように予想外の方向へ跳ね返ります。</p></template>
<template id="sum-kickback"><h2>総括</h2><h3>① めまぐるしい転調</h3><p>B♭m→F→B→E→A♭→E→B♭m。ほとんどのセクションで調が変わり、聴き手を振り回します。</p><h3>② 転調の継ぎ目</h3><p>Aメロ最後のベースC→B→B♭→F♯、BメロのF♯m→Fm、プレサビ最後のG♯（Eの調ではIII）など、短いつなぎで次の調へ飛び移っています。</p><h3>③ サビはC♯mが重心</h3><p>EメジャーなのにC♯m7→F♯m7→G♯7→C♯m7と平行調C♯mを中心に回り、明るさより焦燥感が勝ちます。</p><h3>④ ハーフタイムのオーケストラ</h3><p>間奏でテンポ感が半分になり、A♭メジャーのクラシカルな和声に。直前までの暴走とのギャップが強烈です。</p></template>
<template id="rhy-kickback"><p>BPM205の超高速8ビート。パンク／ハードコアのように突っ走り、オーケストラの間奏だけテンポ感が半分（ハーフタイム）になります。</p></template>
<template id="intro-yodaka"><p>出典：music-chord.com（Capo2の押さえ方表記を、実音のキーB／G♯mに直しています。BPM95）。</p><p>曲のほとんどが、EM7→F♯→G♯m7→B♯dim7→C♯m7→D♯7の4小節ループでできています。最後のアウトロだけループを離れ、主音の半音上のA（ナポリの和音）などで東アジア風の不思議な響きになります。</p></template>
<template id="sum-yodaka"><h2>総括</h2><h3>① ひとつのループで押し切る</h3><p>♭VI→♭VII→Im→経過dim→IVm→Vのループを、Aメロもサビも使い続けます。歌とアレンジの強弱だけで展開を作る、ブレイクビーツらしい作りです。</p><h3>② 半音で上がるベース</h3><p>G♯m7→B♯dim7→C♯m7は、ベースがB→B♯→C♯と半音で上がる流れ。ループに前へ進む力を与えます。</p><h3>③ アウトロのナポリ</h3><p>最後はG♯m7⇄A（♭II）、Gaug、Gdim7など、主音のまわりを半音でうごめく和音に。荒々しさと神秘的な響きを残して終わります。</p></template>
<template id="rhy-yodaka"><p>BPM95のブレイクビーツ。重いキックとスネアに細かいハイハットが絡み、篠笛など東アジアの音色が乗ります。</p></template>
<template id="intro-kanden"><p>出典：ChordWiki（キーB＝G♯m、BPM103、16分シャッフル）。</p><p>C♯m9→D♯7(♯9)→G♯m7→B9→E♯m7♭5→EM7→A♯m7♭5→D♯7と、9th・13th・♯9などのテンションを多用したファンク。サビではC♯9（ドリアンのIV）とF♯9で明るく開きます。</p></template>
<template id="sum-kanden"><h2>総括</h2><h3>① テンションだらけのファンク</h3><p>C♯m9、D♯7(♯9)、B9、A13など、ほぼ全部の和音にテンションが付いています。ホーン・セクションと合わせて、都会的でぎらついた響きです。</p><h3>② マイナーの中の明るさ</h3><p>サビのC♯9は、G♯マイナーなのにメジャーのIV（ドリアン）。F♯9・B7と合わせて、夜の街が光るような明るさを出します。</p><h3>③ 半音の寄り道</h3><p>G♯m7→G7♭5→F♯m7→B7、D♯7→Ddim7→C♯m9→C7(♯9)→B13など、半音ずつずれていく寄り道で「感電」したような不安定さを演出します。</p></template>
<template id="rhy-kanden"><p>BPM103の16分シャッフル。16分音符がハネるファンクで、ホーンのキメ（ユニゾンのフレーズ）が要所に入ります。</p></template>
<template id="intro-tsumi"><p>出典：ChordWiki（BPM80、4/4拍子シャッフル）。</p><p>AメロはFm、サビは同主調のFメジャー、間奏で全音上のGmへ上がり、2回目のサビはGメジャー。暗いマイナーと明るい同主調メジャーを行き来しながら、全体が全音ずつせり上がっていく構成です。</p></template>
<template id="sum-tsumi"><h2>総括</h2><h3>① 半音ずつ沈むベース</h3><p>Fm→FmM7/E→Fm7/E♭→Fm6/Dは、上の和音はFmのまま、ベースだけがF→E→E♭→Dと半音ずつ下がるライン・クリシェ。じわじわ沈む重さが「罪」の気分です。</p><h3>② サビは同主調のメジャー</h3><p>FmからFメジャーへ。主音は同じなのに一気に明るくなり、叫ぶようなサビになります。それでもD♭（Fmの♭VI）を混ぜて影を残します。</p><h3>③ 全音上への転調</h3><p>間奏でGmへ移り、2回目のサビはGメジャー。同じサビを一段高くして、感情を押し上げます。</p><h3>④ ブルースのIV7</h3><p>B♭7（Fmで）やC7（Gmで）は、マイナーなのにメジャーのIV7。ブルース・ロック的な荒っぽさを出しています。</p></template>
<template id="rhy-tsumi"><p>BPM80のシャッフル。8分音符を「タッ・カ」と3連のノリで跳ねさせる重いブルース・ロックです。サイレンの部分はドラムが半分のテンポ（ハーフタイム）になります。</p></template>
<template id="intro-honno"><p>出典：ChordWiki（キーDm、BPM96、16分シャッフル）。</p><p>曲のほとんどが、Dm→Gm7→B♭M7→Gm7/C→A7/C♯という4小節のループでできています。同じループを繰り返し、Bメロだけ平行調Fの明るさに寄る構成です。</p></template>
<template id="sum-honno"><h2>総括</h2><h3>① 4小節ループ</h3><p>Dm（Im）→Gm7（IVm7）→B♭M7（♭VIM7）→Gm7/C→A7/C♯（V7）。Aメロもサビも基本は同じループで、執着するような「本能」の感じを出します。</p><h3>② 半音で上がるベース</h3><p>ループの最後はベースがC→C♯→Dと半音で上がり、主和音に戻ります。A7を第1転回形（C♯ベース）にしているのがポイントです。</p><h3>③ Bメロは平行調の顔</h3><p>Gm7→Gm7/C→FM7は平行調Fのツーファイブ。ループから一瞬抜け出し、サビでまたDmのループに戻ります。</p></template>
<template id="rhy-honno"><p>BPM96の16分シャッフル。16分音符が少しハネるロックで、ベースがメロディのように動きます。</p></template>
<template id="intro-jinsei"><p>出典：ChordWiki（3/4拍子、冒頭BPM113→本編BPM200）。</p><p>AメロはE♭メジャー、Bメロとサビは同主調のE♭マイナー。E♭→E♭aug→E♭6→E♭7の上昇クリシェと、ジャズの「枯葉」と同じ4度進行の循環が組み合わさった、ミュージカルのような華やかなワルツです。</p></template>
<template id="sum-jinsei"><h2>総括</h2><h3>① 上昇クリシェ</h3><p>E♭→E♭aug→E♭6→E♭7は、和音の5度の音だけがB♭→B→C→D♭と半音ずつ上がる動き。わくわくと胸が膨らむような始まりです。</p><h3>② 同主調への転調</h3><p>BメロでE♭マイナーへ。主音はそのままで暗くなり、「こんな時代じゃあ」という世知辛さを表します。</p><h3>③ 循環進行（枯葉進行）</h3><p>A♭m7→D♭M7→G♭M7→C♭M7→Fm7♭5→B♭7→E♭mM7は、根音が4度ずつ巡る循環。ジャズのスタンダード「枯葉」と同じ骨組みで、大人っぽい哀愁があります。</p><h3>④ ほんの一瞬のメジャー</h3><p>サビの途中、E♭mのはずがE♭（メジャー）に戻る瞬間があり、「私の人生」を肯定するような明るさが差します。</p></template>
<template id="rhy-jinsei"><p>3/4拍子のワルツ。「ズン・チャッ・チャッ」と1拍目にベース、2・3拍目に和音が入ります。冒頭のAメロはBPM113でゆったり歌い、本編はBPM200と軽快に。ジャズ／ミュージカル風のブラスが入ります。</p></template>
<template id="intro-nippon"><p>出典：ChordWiki（キーE、BPM170）。</p><p>NHKのサッカー放送テーマ曲。Eメジャーのハードロックで、G♯7（C♯mへのドミナント）、F♯7（Bへのドミナント）などのセカンダリードミナントと、Bm7・Em/G・G6といった同主調・ミクソリディアン由来の和音が、勇ましさの中に陰影をつけています。</p></template>
<template id="sum-nippon"><h2>総括</h2><h3>① セカンダリードミナントの推進力</h3><p>D♯m7→G♯7→C♯m7（C♯mへのツーファイブ）、F♯→G♯7など、次の和音へ強く引っぱるドミナントを次々に挟み、前へ前へと突き進みます。</p><h3>② メジャーの中の影</h3><p>Bm7（ミクソリディアンのVm）、Em/G・G6（同主調Eマイナー由来）が、明るいだけでない緊張感を生みます。</p><h3>③ ベースの半音進行</h3><p>Bメロの最後はF♯7/A♯→Bsus4、G♯7/B♯→C♯と、転回形でベースを半音ずつ上げてサビへの勢いをつけます。</p><h3>④ 半音上への転調</h3><p>終盤はFM7をきっかけに半音上のFへ。最後のサビをさらに高揚させる定番の手法です。</p></template>
<template id="rhy-nippon"><p>BPM170のストレートな8ビート。ギターのキメ（ユニゾンのリフ）が多いハードロックで、Aメロにはスネアのゴーストノートが入ります。</p></template>
<template id="intro-matsuri"><p>出典：ChordWiki（キーF、BPM125）。</p><p>椎名林檎と浮雲のデュエット。サビはB♭M7→A7(♭13)→Dm9→F7の「丸サ進行」（IVM7→III7→VIm7→I7）。浮雲パートのAメロはDメジャーの中に同主調の和音を交互に置き、景色を変えています。</p></template>
<template id="sum-matsuri"><h2>総括</h2><h3>① 丸サ進行</h3><p>IVM7→III7→VIm7→I7は、椎名林檎「丸の内サディスティック」の名前がついた進行。A7（Dmへのドミナント）とF7（B♭へのドミナント）で、ループがぐるぐる回り続けます。</p><h3>② 浮雲パートは別の調</h3><p>Gm9→Bm7→B♭M9→DM9は、Dメジャーの中に同主調Dマイナー由来のGm9・B♭M9を交互に挟んだ進行。明るさと翳りが交互に来る、不思議な浮遊感です。</p><h3>③ 半音で下がるベース</h3><p>BメロのG7/B→B♭m6→F/A→A♭dim7は、ベースがB→B♭→A→A♭と半音ずつ下がる流れ。「祭」が終わっていくような切なさを足します。</p></template>
<template id="rhy-matsuri"><p>BPM125。サンバやサルサのようなラテン風16ビートに、村田陽一のブラス・アレンジが乗ります。キックとベースが3-3-2の組み合わせでシンコペーションします。</p></template>
<template id="intro-automatic"><p>出典：ChordWiki（キーA♭、BPM95、16分シャッフル）。</p><p>イントロとBメロはA♭メジャー、AメロとサビはFmを中心に分析しています。平行調（A♭とFm）を行き来しながら、E♭ベースのB♭m7、ドリアンのB♭9、ライン・クリシェなど、90年代R&Bの洒落た和声がぎゅっと詰まった曲です。</p></template>

  if(c.bassName&&!sc.includes(c.bass)&&!out.includes(c.bassName))out.push(c.bassName);

}

  if(c.bassName&&!sc.includes(c.bass)&&!out.some(o=>o.pc===c.bass))out.push({pc:c.bass,name:c.bassName});

}

  if(ki.minor){

    if(o.name===lt)return `${pretty(k)}の和声的短音階（導音）`;
    if(o.name===r6)return `${pretty(k)}の旋律的短音階／ドリアンの6度`;
    if(P.includes(o.pc)&&o.pc!==(t+11)%12&&o.pc!==(t+9)%12)return `同主調${pretty(par)}由来`;
    if(o.pc===(t+11)%12)return `半音階的な音（${pretty(lt)}の異名同音）`;
    if(o.pc===(t+9)%12)return `半音階的な音（${pretty(r6)}の異名同音）`;}
    if(P.includes(o.pc))return `同主調${pretty(par)}由来`;

  }

  if(o.name===lt)return `平行調${pretty(rel)}の和声的短音階（導音）`;
  if(o.name===r6)return `平行調${pretty(rel)}の旋律的短音階（6度）`;
  if(P.includes(o.pc))return `同主調${pretty(par)}由来`;
  if(o.pc===pcOf(lt))return `平行調${pretty(rel)}の導音（${pretty(lt)}の異名同音）`;
  if(o.pc===pcOf(r6))return `平行調${pretty(rel)}の旋律的短音階の6度（${pretty(r6)}の異名同音）`;

function degByName(name,k){

  if(bassIsTone&&c.ivs.includes(4)&&!c.ivs.includes(3)&&(c.qual===''||c.qual.startsWith('7')||c.qual==='aug7(#9)')){

/* 声部連結：前のボイシングに一番近い転回形を選ぶ */
let prevCenter=64;
function voice(pcs){
  let best=null,bestScore=1e9;
  for(let r=0;r<pcs.length;r++){
    const order=pcs.slice(r).concat(pcs.slice(0,r));
    for(const base of [52,55,58,60]){
      let notes=[],n=base-1;
      for(const pc of order){n++;while(((n%12)+12)%12!==pc)n++;notes.push(n);}
      const c=notes.reduce((a,b)=>a+b,0)/notes.length;
      const sc=Math.abs(c-prevCenter)+(notes[notes.length-1]>76?6:0);
      if(sc<bestScore){bestScore=sc;best=notes;}
    }
  }
  prevCenter=best.reduce((a,b)=>a+b,0)/best.length*0.7+64*0.3;
  return best;
}

const STEPS_PER_BAR=8; // 8分音符
let chords=[],stepMap=[],secRanges=[],TOTAL=0;
function build(){
  chords=[];stepMap=[];secRanges=[];prevCenter=64;
  let step=0;
  SONG.forEach((sec,si)=>{
    const s0=step;
    const per=sec.meter||STEPS_PER_BAR;
    sec.bars.forEach((bar,bi)=>{
      const b0=step,barLen=bar.reduce((a,x)=>a+(x[2]?.s??per/bar.length),0);
      
      bar.forEach(([sym,k,ov])=>{
        const len=ov?.s??per/bar.length;
        const dict=KEYS[k];
        const base=dict[sym]||['?','T',''];
        const c={sym,k,d:ov?.d||base[0],f:ov?.f||base[1],t:ov?.t||base[2],pv:!!ov?.pv,
                 sec:si,bar:bi,start:step,len,idx:chords.length,...parseChord(sym)};
        c.voicing=c.nc?[]:voice(c.pcs);c.an=ov?.sp?{...parseChord(ov.sp),idx:c.idx,nc:false}:c;c.out=outNotes(c.an,k);c.outD=outDetail(c.an,k);
        chords.push(c);
        for(let i=0;i<len;i++) stepMap.push({c:c.idx,i,sec:si,barStep:(step+i-b0),barLen,bar:bi});
        step+=len;
      });
    });
    secRanges.push([s0,step]);
  });
  TOTAL=stepMap.length;
}

let ctx,master,rev,revSend,comp;
const inst={drums:true,bass:true,keys:true,arp:true};
function initAudio(){
  if(ctx)return;
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=3;
  master=ctx.createGain();master.gain.value=0.8;
  master.connect(comp);comp.connect(ctx.destination);
  // リバーブ
  rev=ctx.createConvolver();
  const len=ctx.sampleRate*2.4,buf=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
  rev.buffer=buf;revSend=ctx.createGain();revSend.gain.value=0.35;
  revSend.connect(rev);rev.connect(master);
  noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
  const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
}
let noiseBuf;
const mtof=m=>440*Math.pow(2,(m-69)/12);

function ep(t,m,dur,vel=1){ // エレピ
  const f=mtof(m),g=ctx.createGain();
  const o1=ctx.createOscillator(),o2=ctx.createOscillator(),g2=ctx.createGain();
  o1.type='sine';o1.frequency.value=f;o2.type='sine';o2.frequency.value=f*4;
  g2.gain.setValueAtTime(0.25*vel,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.25);
  o2.connect(g2);g2.connect(g);o1.connect(g);
  const pk=0.075*vel;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(pk,t+0.006);
  g.gain.exponentialRampToValueAtTime(pk*0.35,t+0.6);
  g.gain.setTargetAtTime(0.0001,t+dur,0.12);
  out(g,0.25);o1.start(t);o2.start(t);o1.stop(t+dur+0.8);o2.stop(t+dur+0.8);
}
function pad(t,m,dur){
  const g=ctx.createGain(),lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1500;lp.Q.value=0.4;
  [-8,8].forEach(det=>{const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=mtof(m+12);o.detune.value=det;o.connect(lp);o.start(t);o.stop(t+dur+1.2);});
  lp.connect(g);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.018,t+0.35);
  g.gain.setTargetAtTime(0.0001,t+dur,0.3);
  out(g,0.5);
}
function bass(t,m,dur,vel=1){
  const o=ctx.createOscillator(),s=ctx.createOscillator(),lp=ctx.createBiquadFilter(),g=ctx.createGain();
  o.type='sawtooth';o.frequency.value=mtof(m);s.type='sine';s.frequency.value=mtof(m);
  lp.type='lowpass';lp.frequency.setValueAtTime(900,t);lp.frequency.exponentialRampToValueAtTime(300,t+0.15);lp.Q.value=2;
  o.connect(lp);s.connect(g);lp.connect(g);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.16*vel,t+0.005);
  g.gain.setTargetAtTime(0.0001,t+dur*0.85,0.03);
  out(g,0);o.start(t);s.start(t);o.stop(t+dur+0.2);s.stop(t+dur+0.2);
}
function bell(t,m,vel=1){
  const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=mtof(m);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.045*vel,t+0.004);g.gain.exponentialRampToValueAtTime(0.0008,t+0.35);
  o.connect(g);out(g,0.55);o.start(t);o.stop(t+0.4);
}
function kick(t,vel=1){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+0.12);
  g.gain.setValueAtTime(0.9*vel,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
  o.connect(g);out(g,0);o.start(t);o.stop(t+0.4);
}
function noise(t,dur,type,freq,gain,wet=0.1){
  const n=ctx.createBufferSource();n.buffer=noiseBuf;
  const f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;
  const g=ctx.createGain();g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  n.connect(f);f.connect(g);out(g,wet);n.start(t);n.stop(t+dur+0.05);
}
function snare(t,vel=1){
  noise(t,0.18,'bandpass',1800,0.45*vel,0.25);
  const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(160,t+0.08);
  g.gain.setValueAtTime(0.25*vel,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.1);o.connect(g);out(g,0.1);o.start(t);o.stop(t+0.12);
}
const hat=(t,vel=1,open=false)=>noise(t,open?0.25:0.045,'highpass',7500,0.16*vel,0.05);
const crash=t=>noise(t,1.6,'highpass',5000,0.22,0.3);

function audition(c){
  if(c.nc)return;
  initAudio();if(ctx.state==='suspended')ctx.resume();
  const t=ctx.currentTime+0.02;
  c.voicing.forEach(m=>{ep(t,m,1.4);pad(t,m,1.2);});
  bass(t,36+((c.bass-0+12)%12),1.4);
}

function patFor(G,lvl,len){
  const L=G.lv[lvl];
  if(len===8)return L;
  if(L['m'+len])return L['m'+len];
  const o={};for(const k in L){if(typeof L[k]==='string')o[k]=(L[k].repeat(2)).slice(0,len*2);}return o;
}
const FEELPOS={straight:[0,.25,.5,.75],sh8:[0,1/3,2/3,5/6],sh16:[0,.32,.5,.82]};
const VEL={X:1,x:.8,o:.5,g:.25,O:.7,R:1,r:.6,F:.9,'-':0};
/* ===================== シーケンサー ===================== */
let playing=false,curStep=0,nextTime=0,timer=null,bpm=87,loopMode='off',selIdx=0;
const uiQueue=[];
const stepDur=()=>60/bpm/2;

function scheduleStep(step,t){
  const sm=stepMap[step],c=chords[sm.c],sec=SONG[sm.sec],lvl=Math.max(1,Math.min(3,sec.lvl)),bs=sm.barStep,sd=stepDur();
  const [secStart,secEnd]=secRanges[sm.sec];
  const isLastBar=step>=secEnd-sm.barLen;
  const nextLvl=SONG[sm.sec+1]?.lvl||0;
  const G=GROOVES[CUR.id],P=patFor(G,lvl,sm.barLen),PL=P.k.length,POS=FEELPOS[G.feel],beat=sd*2,q16=beat/4;
  const beatStart=t-(bs%2)*sd;
  const tAt=n=>beatStart+POS[n%4]*beat;
  if(!c.nc&&inst.keys&&sm.i===0) c.voicing.forEach(m=>pad(t,m,c.len*sd));
  for(let h=0;h<2;h++){
    const n=bs*2+h, tt=tAt(n);
    if(!c.nc){
      // 鍵盤（エレピ）
      if(inst.keys){
        const v=VEL[P.c[n]]; if(v) c.voicing.forEach(m=>ep(tt,m,q16*2.6,v));
        else if(sm.i===0&&h===0&&P.c[n]==='-') c.voicing.forEach(m=>ep(tt,m,q16*2,0.45));
      }
      // ベース
      if(inst.bass){
        const ch=P.b[n];
        if(ch!=='-'){
          let gap=1;while(gap<8&&P.b[(n+gap)%PL]==='-')gap++;
          const iv={R:0,r:0,O:12,F:7}[ch]??0;
          bass(tt,36+c.bass+iv,Math.min(gap,4)*q16*G.gate,VEL[ch]);
        }
      }
      // アルペジオ
      if(inst.arp&&lvl>=2){const notes=c.voicing.map(m=>m+12).concat(c.voicing[0]+24);bell(tt,notes[(sm.i*2+h)%notes.length],h?0.55:0.9);}
      else if(inst.arp&&lvl===1&&n%4===0){const notes=c.voicing.map(m=>m+12);bell(tt,notes[(n/4)%notes.length],0.5);}
    }
    // ドラム
    if(inst.drums&&!c.nc){
      if(step===secStart&&h===0&&lvl>=2)crash(tt);
      const fill=isLastBar&&nextLvl>=2&&n>=PL-4;
      if(fill){snare(tt,0.45+0.15*(n-PL+4));}
      else{
        if(VEL[P.k[n]])kick(tt,VEL[P.k[n]]);
        if(VEL[P.s[n]])snare(tt,VEL[P.s[n]]);
        if(P.o[n]==='O')hat(tt,0.7,true); else if(VEL[P.h[n]])hat(tt,VEL[P.h[n]]);
      }
    }
    uiQueue.push({t:tt,n16:n,lvl,m:sm.barLen});
  }
  if(sm.i===0)uiQueue.push({t,idx:c.idx});
  uiQueue.push({t,prog:step});
}

function tick(){
  while(nextTime<ctx.currentTime+0.15){
    scheduleStep(curStep,nextTime);
    nextTime+=stepDur();
    curStep++;
    const sec=stepMap[curStep-1].sec;
    if(loopMode==='sec'&&curStep===secRanges[sec][1]){curStep=secRanges[sec][0];}
    else if(curStep>=TOTAL){
      if(loopMode==='all')curStep=0;
      else{setTimeout(stop,(nextTime-ctx.currentTime)*1000+400);clearInterval(timer);timer=null;return;}
    }
  }
}
function uiLoop(){
  if(!ctx)return;
  const now=ctx.currentTime;
  uiQueue.sort((a,b)=>a.t-b.t);
  while(uiQueue.length&&uiQueue[0].t<=now){
    const e=uiQueue.shift();
    if(e.n16!==undefined)markRhythm(e.n16,e.lvl,e.m);
    if(e.idx!==undefined)setActive(e.idx);
    if(e.prog!==undefined)$('prog').style.width=((e.prog+1)/TOTAL*100)+'%';
  }
  if(playing||uiQueue.length)requestAnimationFrame(uiLoop);
}
function start(fromIdx){
  initAudio();if(ctx.state==='suspended')ctx.resume();
  playing=true;$('play').textContent='❚❚';
  curStep=chords[fromIdx??selIdx].start;nextTime=ctx.currentTime+0.08;uiQueue.length=0;
  clearInterval(timer);timer=setInterval(tick,25);tick();
  requestAnimationFrame(uiLoop);
}
function stop(){
  playing=false;clearInterval(timer);timer=null;$('play').textContent='▶';uiQueue.length=0;
}
function onChordClick(i){
  chords[selIdx]?.el.classList.remove('sel');selIdx=i;chords[i].el.classList.add('sel');
  if(playing){curStep=chords[i].start;nextTime=ctx.currentTime+0.05;uiQueue.length=0;}
  else{audition(chords[i]);setActive(i);}
}

let snowColor='#fff';
/* ===================== 雪 ===================== */
(function(){
  const cv=$('snow'),g=cv.getContext('2d');let W,H,flakes=[];
  function rs(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;}
  rs();addEventListener('resize',rs);
  for(let i=0;i<60;i++)flakes.push({x:Math.random(),y:Math.random(),r:Math.random()*1.8+0.6,v:Math.random()*0.0007+0.0003,w:Math.random()*6});
  (function f(){g.clearRect(0,0,W,H);g.fillStyle=snowColor;
    const boost=playing?1.8:1;
    flakes.forEach(p=>{p.y+=p.v*boost;p.w+=0.01;if(p.y>1.02){p.y=-0.02;p.x=Math.random();}
      g.beginPath();g.arc((p.x+Math.sin(p.w)*0.01)*W,p.y*H,p.r*devicePixelRatio,0,7);g.fill();});
    requestAnimationFrame(f);})();
})();

let rhyLv=2,rhyAuto=true;
const RROWS=[['k','キック<br><small>ドン</small>','var(--D)'],['s','スネア<br><small>タン</small>','var(--SD)'],['h','ハイハット<br><small>ツ</small>','var(--T)'],['b','ベース','var(--SDm)'],['c','鍵盤','var(--accent)']];
function meterName(m){return m===8?'4/4拍子':(m===6&&typeof CUR!=='undefined'&&CUR&&CUR.m6name)||m+'/8拍子';}
function rhyGrid(P,G,m){
  const N=m*2,sw=G.feel!=='straight',cols=`grid-template-columns:56px repeat(${N},minmax(0,1fr))`;
  const isBeat=n=>m===8?n%4===0:(n===0||n===6);
  let head='<div></div>';
  for(let n=0;n<N;n++){
    if(m===8){const b=n%4===0;head+=`<div class="rh ${b?'b':''}">${b?(n/4+1):(n%4===2?'&amp;':'·')}</div>`;}
    else{head+=`<div class="rh ${isBeat(n)?'b':''}">${n%2===0?(n/2+1):'·'}</div>`;}
  }
  let rows='';
  RROWS.forEach(([key,name,col])=>{
    rows+=`<div class="rl">${name}</div>`;
    for(let n=0;n<N;n++){
      let ch=P[key][n]||'-'; if(key==='h'&&P.o[n]==='O')ch='O';
      const isSw=(G.feel==='sh8'&&n%4===2)||(G.feel==='sh16'&&n%2===1);
      let inner='';
      if(key==='b'){inner=ch==='-'?'':({R:'根',r:'<span style="opacity:.6">根</span>',O:'8',F:'5'}[ch]||'');}
      else if(ch!=='-'){inner=`<i class="${ch}"></i>`;}
      rows+=`<div class="rc ${isBeat(n)?'bt':''} ${isSw&&ch!=='-'?'sw':''}" data-n="${n}" data-m="${m}" style="--rc:${col}">${inner}</div>`;
    }
  });
  return `<div class="rgrid" style="${cols}">${head}${rows}</div>`;
}
function speedWord(b){return b<80?'ゆっくり':b<110?'ふつう':b<140?'やや速い':'速い';}
function feelWord(f){return f==='straight'?'まっすぐ（ハネない）':f==='sh8'?'ハネる（タッタ、タッタ）':'細かくハネる（16分音符がハネる）';}
function sayPattern(P,m){
  const N=m*2,out=[];/* 1拍＝4マス（4/4）、付点4分＝6マス（6/8・5/8は3＋2） */
  for(let n=0;n<N;n++){
    const k=P.k[n]&&P.k[n]!=='-',sn=P.s[n]&&P.s[n]!=='-'&&P.s[n]!=='g',h=(P.h[n]&&P.h[n]!=='-')||P.o[n]==='O';
    let w=k&&sn?'ドタン':k?'ドン':sn?'タン':P.o[n]==='O'?'シャ':h?'ツ':'・';
    out.push(w);
  }
  const parts=[];const cuts=m===8?[0,4,8,12,16]:[0,6,N];
  for(let j=0;j<cuts.length-1;j++)parts.push(out.slice(cuts[j],cuts[j+1]).join(' '));
  return parts;
}
function renderRhythm(){
  const G=GROOVES[CUR.id],box=$('rhythmBox');
  const used={},meters={};
  SONG.forEach(sc=>{const l=Math.max(1,Math.min(3,sc.lvl));(used[l]=used[l]||[]).push(sc.name);(meters[l]=meters[l]||new Set()).add(sc.meter||8);});
  const lvName={1:'静かめ',2:'通常',3:'盛り上がり'};
  if(!used[rhyLv])rhyLv=+Object.keys(used)[0];
  const sw=G.feel!=='straight';
  const allM=new Set();Object.values(meters).forEach(st=>st.forEach(m=>allM.add(m)));
  const ms=[...meters[rhyLv]];
  const grids=ms.map(m=>{const P=patFor(G,rhyLv,m);return `${ms.length>1||m!==8?`<div class="rmeter">${meterName(m)}</div>`:''}<div class="rsay">口で言うと（1拍ずつ）<div class="rsc">${sayPattern(P,m).map((x,i)=>`<span><em>${i+1}</em>${x.replace(/ ・/g,' <i>・</i>').replace(/^・/,'<i>・</i>')}</span>`).join('')}</div></div>${rhyGrid(P,G,m)}`;}).join('');
  const btns=Object.keys(used).map(l=>`<button data-l="${l}" class="${+l===rhyLv?'on':''}">${lvName[l]}（${used[l].join('・')}）</button>`).join('');
  const fb=G.feelBpm||G.bpm;
  box.innerHTML=`<h2>この曲のリズム</h2>
    <div class="rsum">
      <div><span>速さ</span><b>${speedWord(fb)}</b><small>${G.bpmLabel||('BPM '+G.bpm)}${G.feelBpm?`（体感 約${G.feelBpm}）`:''}</small></div>
      <div><span>ノリ</span><b>${feelWord(G.feel)}</b></div>
      <div><span>拍子</span><b>${[...allM].map(meterName).join('・')}</b></div>
      <div class="wide"><span>ひとことで</span><b>${G.point}</b></div>
    </div>
    <button class="rplay" id="rplay">🥁 ドラムとベースだけで聴く</button>
    <details class="rhow"><summary>下の図の読み方</summary>
      <p>横1列が1つの楽器、左から右へ1小節ぶんの時間が流れます。1マスは16分音符（1拍を4つに分けた長さ）で、上の数字が拍の頭です。丸があるマスで音が鳴ります（大きい丸＝強く、小さい丸＝弱く、白抜き＝ごく小さく）。ベースの「根」はコードの一番下の音、「8」はその1オクターブ上です。${sw?'色の付いたマスは、まっすぐ等間隔ではなく少し後ろにずれて鳴る（ハネる）位置です。':''}再生中は、今鳴っている列が光ります。</p>
    </details>
    <div class="rlvl">パターン：</div><div class="rlv">${btns}</div>
    ${grids}
    <div class="rtext">${document.getElementById('rhy-'+CUR.id).innerHTML}</div>
    <div class="rnote">速さとノリ（ハネ方・拍子）は原曲の資料に合わせていますが、ドラム・ベース・鍵盤の細かいパターンは原曲を1音ずつ写したものではなく、そのノリの典型的な形で組み直した再現です。</div>`;
  box.querySelectorAll('.rlv button').forEach(b=>b.addEventListener('click',()=>{rhyLv=+b.dataset.l;rhyAuto=false;renderRhythm();}));
  $('rplay').addEventListener('click',()=>{
    const only=!(inst.keys===false&&inst.arp===false);
    inst.keys=!only;inst.arp=!only;inst.drums=true;inst.bass=true;
    document.querySelectorAll('.tog[data-inst]').forEach(t=>t.classList.toggle('on',inst[t.dataset.inst]));
    $('rplay').textContent=only?'🎹 全部の楽器に戻す':'🥁 ドラムとベースだけで聴く';
    if(only&&!playing){const i=chords.findIndex(c=>Math.max(1,Math.min(3,SONG[c.sec].lvl))===rhyLv);start(i<0?0:i);}
  });
}
let lastRhy=null;
function markRhythm(n,lvl,m){

  const seq=[];(sg.find(x=>/サビ/.test(x.name))||sg[1]||sg[0]).bars.forEach(b=>b.forEach(c=>{if(seq[seq.length-1]!==c[0]&&seq.length<6)seq.push(c[0]);}));
  const artist=m.sub.split('｜').filter(x=>!/コード/.test(x)).join('・');
  return `<button class="hcard" data-id="${id}" style="--ca:${th.accent}"><div class="ht">${m.title}</div><div class="ha">${artist}</div><div class="hp">${seq.map(pretty).join(' → ')}</div><div class="hm">${m.guess?'<span style="background:#ff5a4f33;color:#ff8a80">推測版</span>':''}<span>Key ${k}</span><span>${(()=>{const L=GROOVES[id].bpmLabel;const v=L?L.replace(/（.*/,'').trim():'BPM '+m.bpm;return /^BPM/.test(v)?v:v;})()}</span></div></button>`;
}
function showHome(){
  try{stop();}catch(e){}
  document.body.classList.add('home');document.title='コード分析ノート';
  const q=($('hsearch').value||'').trim().toLowerCase();
  $('hcount').textContent=ARTISTS.length+'組・'+ORDER.filter(id=>SONGS[id]).length+'曲';
  $('hback').style.display='none';$('htitle').textContent='コード分析ノート';
  let html='';
  if(q){
    const ids=ORDER.filter(id=>SONGS[id]&&(META[id].title+META[id].sub).toLowerCase().includes(q));
    html=ids.map(songCard).join('')||'<div class="hsub">見つかりませんでした</div>';
  }else{
    html=ARTISTS.map(a=>{const th=THEMES[a.songs[0]];return `<button class="hcard art" data-a="${a.id}" style="--ca:${th.accent}"><div class="ht">${a.name}</div><div class="ha">${a.songs.length}曲${a.pending?`（＋準備中${a.pending.length}曲）`:''}</div><div class="hp">${a.songs.map(id=>META[id].title).join('・')}</div></button>`;}).join('');
  }
  $('hgrid').innerHTML=html;
  $('hgrid').querySelectorAll('.hcard').forEach(b=>b.addEventListener('click',()=>{location.hash=b.dataset.a?('a-'+b.dataset.a):b.dataset.id;}));
  window.scrollTo(0,0);
}
function showArtist(aid){
  try{stop();}catch(e){}
  const a=ARTISTS.find(x=>x.id===aid);if(!a){showHome();return;}
  document.body.classList.add('home');document.title=a.name+' — コード分析ノート';
  $('hback').style.display='';$('htitle').textContent=a.name;$('hcount').textContent=a.songs.length+'曲';
  $('hsearch').value='';
  let html=a.songs.map(songCard).join('');
  if(a.pending)html+=a.pending.map(t=>`<div class="hcard pend"><div class="ht">${t}</div><div class="ha">${a.name}</div><div class="hp">コード譜が見つからず準備中</div><div class="hm"><span>譜面の画像を送ってもらえれば追加できます</span></div></div>`).join('');
  $('hgrid').innerHTML=html;
  $('hgrid').querySelectorAll('.hcard[data-id]').forEach(b=>b.addEventListener('click',()=>{location.hash=b.dataset.id;}));
  window.scrollTo(0,0);
}
function route(){
  const h=location.hash.slice(1);
  if(SONGS[h]){document.body.classList.remove('home');loadSong(h);const a=artistOf(h);$('backBtn').textContent='‹ '+(a?a.name:'一覧');}
  else if(h.startsWith('a-'))showArtist(h.slice(2));
  else showHome();
}
$('hsearch').addEventListener('input',()=>{if(location.hash&&location.hash!=='#')location.hash='';showHome();});
$('hback').addEventListener('click',()=>{location.hash='';});
$('backBtn').addEventListener('click',()=>{const a=artistOf(CUR&&CUR.id);location.hash=a?('a-'+a.id):'';});
addEventListener('hashchange',route);
route();
// PWA
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('songs-sw.js').catch(()=>{});});}
</script>
</body>
</html>
