const curveCache = {};
function driveCurve(d){
  const key = Math.round(d * 100); if(curveCache[key]) return curveCache[key];
  const n = 1024, cv = new Float32Array(n), k = d * 60;

}

    a = Math.max(.04, a); susLv = pk * .85;
    g.setValueAtTime(0, t); g.linearRampToValueAtTime(pk, t + a); g.setTargetAtTime(susLv, t + a, .3);
  }
  const rel = Math.max(.03, S.r || .1);
  const release = at => {
    const hold = Math.max(at, t + a + .003);
    if(g.cancelAndHoldAtTime) g.cancelAndHoldAtTime(hold); else { g.cancelScheduledValues(hold); g.setValueAtTime(susLv, hold); }

    const stop = Math.min(endAt, hold + rel * 2 + .08); srcs.forEach(s => { try{ s.stop(stop); }catch(e){} });
  };
  if(isFinite(dur)) release(t + dur); else if(isFinite(endAt)) srcs.forEach(s => { try{ s.stop(endAt); }catch(e){} });
  return {release};
}

const SMP_BUF = new WeakMap();
function smpDecode(s){ const bin = atob(s.b64), n = bin.length >> 1, out = new Float32Array(n); for(let i = 0; i < n; i++){ let v = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8); if(v > 32767) v -= 65536; out[i] = v / 32768; } return out; }
function smpBuffer(c, id){
  let m = SMP_BUF.get(c); if(!m){ m = new Map(); SMP_BUF.set(c, m); }
  if(m.has(id)) return m.get(id);
  const s = getSmp(id); if(!s || !s.b64) return null;
  const pcm = smpDecode(s); if(!pcm.length) return null;
  const b = c.createBuffer(1, pcm.length, s.sr || 44100); b.getChannelData(0).set(pcm); m.set(id, b); return b;
}
function smpPlay(c, sb, t, tn, dm, dest){
  const s = c.createBufferSource(); s.buffer = sb; s.playbackRate.value = tn;
  const g = c.createGain(), L = sb.duration / tn, end = Math.min(L, L * dm);
  g.gain.setValueAtTime(1, t); if(dm < .999){ g.gain.setValueAtTime(1, t + end * .5); g.gain.linearRampToValueAtTime(0, t + end); }
  s.connect(g); g.connect(dest); s.start(t); s.stop(t + end + .02);
}

let AC = null, OUT = null, live = null;
function getAC(){
  if(!AC){
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const comp = AC.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 3; comp.connect(AC.destination);
    OUT = AC.createGain(); OUT.gain.value = .9; OUT.connect(comp);
    const cv = AC.createConvolver(), len = Math.floor(AC.sampleRate * 1.8), ib = AC.createBuffer(2, len, AC.sampleRate);
    for(let ch = 0; ch < 2; ch++){ const d = ib.getChannelData(ch); for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.4); }
    cv.buffer = ib; const rg = AC.createGain(); rg.gain.value = .16; OUT.connect(cv); cv.connect(rg); rg.connect(comp);

function laneNote(k, ch){
  if(k === 'H') return (ch === 'o' || ch === 'h') ? 46 : 42;

function tsBeats(ts){ const [n, d] = ts.split('/').map(Number); return d === 4 ? n : (d === 8 && (n === 6 || n === 12 || n === 9)) ? n / 3 : d === 8 ? n / 2 : n / 4; }
function rhBars(r){ return Math.max(1, ...Object.values(r.tr).map(t => t.length)); }
const RX_VAL = '0123456789ABCDEFGHIJKLMNOPQRSTUV';
// リズム → 音符（tick=96/拍）
function rhNotes(r){
  const st = PPQ / (r.steps / tsBeats(r.ts)), nb = rhBars(r), total = r.lenSteps ? Math.min(r.lenSteps, nb * r.steps) : nb * r.steps, out = [];
  for(const k in r.tr){ const t = r.tr[k];
    for(let b = 0; b < nb; b++){ const s = t[b % t.length] || '';
      for(let i = 0; i < r.steps; i++){ const c = s[i]; if(!c || c === '-') continue; const at = b * r.steps + i; if(at >= total) continue; const p = laneNote(k, c); if(!p) continue;
        let v = 0; const vt = r.v && r.v[k]; if(vt){ const vc = vt[b % vt.length][i]; if(vc && vc !== '-') v = RX_VAL.indexOf(vc) * 4 + 3; }
        v = v || (c === '>' ? 122 : c === 'g' ? 38 : 100);
        out.push({t:at * st, d:k === 'W' ? st * 2 : st, p, v, art:c === 'f' ? 'flam' : (c === 'z' || k === 'W') ? 'roll' : null, step:at});
      } } }
  return {notes:out, len:total * st, st};
}

const PLAYER = {on:false, timer:null, raf:0, bpm:120, swing:0};
function swingOff(t){ const st = PPQ / 4; return (Math.round(t) % (st * 2)) === st ? PLAYER.swing / 100 * st * .66 : 0; }
function playerStart(build, bpm, swing, onTick){
  playerStop(); getAC();
  PLAYER.on = true; PLAYER.bpm = bpm; PLAYER.swing = swing || 0; PLAYER.onTick = onTick;
  const spt = () => 60 / PLAYER.bpm / PPQ;
  const mk = () => { const b = build(); b.notes.sort((x, y) => x.t - y.t); return b; };
  let cur = mk(), cs = AC.currentTime + .06, idx = 0;
  if(!cur.len){ PLAYER.on = false; return; }
  const fire = (n, at, s) => {
    const tr = n.tr;
    if(n.art === 'flam' && tr.kind === 'drum') playNote(live, tr, n.p, Math.max(AC.currentTime, at - .025), .05, Math.round(n.v * .45));
    if(n.art === 'roll' && tr.kind === 'drum'){ const step = PPQ / 8 * s, cnt = Math.max(2, Math.round(n.d * s / step)); for(let i = 0; i < cnt; i++) playNote(live, tr, n.p, at + i * step, .05, Math.round(n.v * (i % 2 ? .78 : 1))); return; }
    playNote(live, tr, n.p, at, (n.d || 24) * s * .95, n.v);
  };
  const tick = () => {
    if(!PLAYER.on) return;
    const ahead = AC.currentTime + .15, s = spt();
    for(let guard = 0; guard < 5000; guard++){
      if(idx >= cur.notes.length){ const nx = cs + cur.len * s; if(nx > ahead) break; cs = nx; cur = mk(); idx = 0; if(!cur.len){ playerStop(); return; } continue; }
      const n = cur.notes[idx], at = cs + (n.t + swingOff(n.t)) * s; if(at > ahead) break;
      if(at >= AC.currentTime - .03) fire(n, at, s); idx++;
    }
  };
  PLAYER.timer = setInterval(tick, 25); tick();
  const fr = () => { if(!PLAYER.on) return; const el = (AC.currentTime - cs) / spt(); if(PLAYER.onTick && el >= 0) PLAYER.onTick(Math.min(el, cur.len), cur.len); PLAYER.raf = requestAnimationFrame(fr); };
  fr();
}
function playerStop(){ PLAYER.on = false; clearInterval(PLAYER.timer); cancelAnimationFrame(PLAYER.raf); if(PLAYER.onTick) PLAYER.onTick(-1, 0); }

function drawMiniGrid(cv, r, opt = {}){
  const g = cv.getContext('2d'), W = cv.width = cv.clientWidth * devicePixelRatio, H = cv.height = cv.clientHeight * devicePixelRatio;
  const used = LANES.filter(l => r.tr[l[0]]).concat(Object.keys(r.tr).filter(k => !LANE[k]).map(k => [k, k, 0]));
  const nb = rhBars(r), total = r.lenSteps || nb * r.steps, rh = H / Math.max(1, used.length), cw = W / total;
  g.clearRect(0, 0, W, H);
  for(let i = 0; i <= total; i++){ if(i % r.steps === 0){ g.fillStyle = '#ff4fd866'; g.fillRect(i * cw, 0, 1, H); } else if(i % (r.steps / tsBeats(r.ts)) === 0){ g.fillStyle = '#ffffff1a'; g.fillRect(i * cw, 0, 1, H); } }
  used.forEach(([k], ri) => { const t = r.tr[k]; for(let b = 0; b < nb; b++){ const s = t[b % t.length] || ''; for(let i = 0; i < r.steps; i++){ const c = s[i]; const at = b * r.steps + i; if(!c || c === '-' || at >= total) continue;
    g.fillStyle = c === '>' ? '#ffe66d' : c === 'g' ? '#8b5cff' : c === 'o' ? '#05ffa1' : (k === 'K' ? '#ff4fd8' : k === 'S' || k === 'L' ? '#3ff3ff' : k[0] === 'T' ? '#ff9e4f' : '#f6eaff'); g.fillRect(at * cw + 1, ri * rh + 1, Math.max(1, cw - 2), Math.max(1, rh - 2)); } } });
  if(opt.head >= 0){ g.fillStyle = '#ffe66d'; g.fillRect(opt.head / (PPQ / (r.steps / tsBeats(r.ts))) * cw, 0, 2 * devicePixelRatio, H); }
}

const LENS = [[4,'1拍'],[6,'1拍'],[8,'2拍'],[12,'1小節'],[16,'1小節'],[32,'2小節']];
function lenLabel(f){ const beats = f.len / (f.steps / tsBeats(f.ts)); return beats >= tsBeats(f.ts) * 2 ? '2小節' : beats >= tsBeats(f.ts) ? '1小節' : beats + '拍'; }
let opt = Object.assign({kit:'kit:std', bpm:110, useBpm:true, withBeat:true, mode:'fill', kitMode:'keep', setTempo:false, cat:'all', q:''}, LS.get('fill_opt', {}));
const saveO = () => LS.set('fill_opt', opt);
const allKits = () => [...builtinKits(), ...LS.get('drumlab_kits', [])];
const curKit = () => allKits().find(k => k.id === opt.kit) || builtinKits()[0];
function groove(steps, ts){
  if(ts === '6/8') return {H:'x-x-x-x-x-x-', S:'------x-----', K:'x-----------'};
  if(steps === 12) return {H:'x-xx-xx-xx-x', S:'---x-----x--', K:'x-----x-----'};
  if(steps === 24) return {H:'x--x--x--x--x--x--x--x--', S:'------x-----------x-----', K:'x-----------x--x--------'};
  if(steps === 32) return {H:'x---x---x---x---x---x---x---x---', S:'--------x---------------x-------', K:'x---------------x---x-----------'};
  return {H:'x-x-x-x-x-x-x-x-', S:'----x-------x---', K:'x-------x-x-----'};
}
// フィル → リズム形式（律動一覧表と同じ形）
function fillRhythm(f, withBeat, crash){
  const bars = Math.ceil(f.len / f.steps), tot = bars * f.steps, off = withBeat ? tot - f.len : 0, tr = {};
  const put = (k, i, c) => { if(!tr[k]) tr[k] = Array.from({length:bars}, () => D(f.steps)); const b = Math.floor(i / f.steps), j = i % f.steps; const s = tr[k][b]; tr[k][b] = s.slice(0, j) + c + s.slice(j + 1); };
  if(withBeat){ const g = groove(f.steps, f.ts); for(const k in g) for(let i = 0; i < off; i++){ const c = g[k][i % f.steps]; if(c !== '-') put(k, i, c); } }
  for(const k in f.tr) [...f.tr[k]].forEach((c, i) => { if(c !== '-') put(k, off + i, c); });
  if(crash){ put('C', 0, 'x'); put('K', 0, 'x'); }
  const r = {code:f.code, name:f.name, genre:f.genre, ts:f.ts, steps:f.steps, tr, tempo:f.bpm, swing:false};
  if(!withBeat){ r.lenSteps = f.len; r.alignEnd = true; }
  return r;
}
function payload(f){
  const r = fillRhythm(f, opt.mode === 'beat'), k = curKit();
  r.name = (opt.mode === 'beat' ? '' : 'フィル ') + f.name; r.kit = kitForDTM(k); r.samples = kitSamples(k); r.kitMode = opt.kitMode;
  if(opt.setTempo){ r.setTempo = true; r.bpm = opt.useBpm ? f.bpm : opt.bpm; r.swingPct = 0; }
  return TAG_RHYTHM + JSON.stringify(r);
}
// ---- 再生 ----
let playing = null;
function build(){ if(!playing) return {notes:[], len:0}; const r = fillRhythm(playing, opt.withBeat, opt.withBeat), tr = kitTrack(curKit()), {notes, len} = rhNotes(r); return {notes:notes.map(n => ({...n, tr})), len}; }
function play(f){
  if(playing && playing.code === f.code && PLAYER.on){ stop(); return; }
  playing = f; playerStart(build, opt.useBpm ? f.bpm : opt.bpm, 0, t => { const cv = document.querySelector(`canvas[data-mini="${f.code}"]`); if(cv && playing) drawMiniGrid(cv, fillRhythm(playing, opt.withBeat), {head:t}); });
  document.querySelectorAll('[data-play]').forEach(b => b.textContent = b.dataset.play === f.code ? '■' : '▶');
}
function stop(){ const f = playing; playerStop(); playing = null; document.querySelectorAll('[data-play]').forEach(b => b.textContent = '▶'); if(f){ const cv = document.querySelector(`canvas[data-mini="${f.code}"]`); if(cv) drawMiniGrid(cv, fillRhythm(f, opt.withBeat)); } }
// ---- 表示 ----
function renderControls(){
  $('kit').innerHTML = allKits().map(k => `<option value="${esc(k.id)}">${k.builtin ? '' : '★ '}${esc(k.name)}</option>`).join(''); $('kit').value = curKit().id;
  $('useBpm').checked = opt.useBpm; $('bpm').value = opt.bpm; $('bpm').disabled = opt.useBpm; $('withBeat').checked = opt.withBeat;
  $('mode').value = opt.mode; $('kitMode').value = opt.kitMode; $('setTempo').checked = opt.setTempo; $('q').value = opt.q;
  const cats = [['all','すべて'],['1拍','1拍'],['2拍','2拍'],['1小節','1小節'],['2小節','2小節']];
  $('cats').innerHTML = cats.map(([k, n]) => `<span class="chip ${opt.cat === k ? 'on' : ''}" data-c="${k}">${n}</span>`).join('');
  $('cats').querySelectorAll('.chip').forEach(c => c.onclick = () => { opt.cat = c.dataset.c; saveO(); renderControls(); renderList(); });
}
function renderList(){
  const q = opt.q.trim().toLowerCase();
  const list = FILLS.filter(f => (opt.cat === 'all' || lenLabel(f) === opt.cat) && (!q || (f.code + f.name + f.genre + f.d).toLowerCase().includes(q)));
  $('cnt').textContent = list.length + ' fills';
  $('list').innerHTML = list.map(f => `<div class="fl card" data-code="${f.code}">
    <div class="rfh"><span class="grip drag">⣿⣿</span><span class="tag">${f.code}</span><b>${esc(f.name)}</b><span class="tag" style="color:var(--yl);border-color:rgba(255,230,109,.5)">${lenLabel(f)}</span>
      <span class="btns"><button class="sm pri" data-play="${f.code}">▶</button><button class="sm cy" data-send="${f.code}" title="DTMへ送る">📤</button><button class="sm" data-lab="${f.code}" title="合体ラボへ送って編集">🥁</button></span>
      <span class="meta">${esc(f.genre)}・${f.ts}・♩${f.bpm}</span></div>
    <div class="rfd">${esc(f.d)}</div><canvas class="mini" data-mini="${f.code}"></canvas></div>`).join('') || '<p class="note">見つかりませんでした。</p>';
  const by = c => FILLS.find(x => x.code === c);
  $('list').querySelectorAll('.fl').forEach(el => { const f = by(el.dataset.code); makeDrag(el, () => payload(f), () => f.name); drawMiniGrid(el.querySelector('canvas'), fillRhythm(f, opt.withBeat)); });
  $('list').querySelectorAll('[data-play]').forEach(b => b.onclick = () => play(by(b.dataset.play)));
  $('list').querySelectorAll('[data-send]').forEach(b => b.onclick = () => { const f = by(b.dataset.send); sendToDTM(payload(f), `フィル「${f.name}」`); });
  $('list').querySelectorAll('[data-lab]').forEach(b => b.onclick = () => { const f = by(b.dataset.lab), s = payload(f);
    try{ const bc = new BroadcastChannel('drumlab'); bc.postMessage(s); setTimeout(() => bc.close(), 500); }catch(e){}
    try{ localStorage.setItem('drumlab-inbox', Date.now() + '|' + s); }catch(e){}
    toast(`「${f.name}」をドラム合体ラボへ送りました（開いていればマイリズムに入ります）`); });
}
function bindControls(){
  const ch = (id, fn, re = true) => $(id).onchange = () => { fn(); saveO(); if(re) renderList(); if(PLAYER.on && playing) PLAYER.bpm = opt.useBpm ? playing.bpm : opt.bpm; };
  ch('kit', () => opt.kit = $('kit').value, false); ch('useBpm', () => { opt.useBpm = $('useBpm').checked; $('bpm').disabled = opt.useBpm; }, false); ch('bpm', () => opt.bpm = clamp(+$('bpm').value || 110, 40, 300), false);
  ch('withBeat', () => opt.withBeat = $('withBeat').checked); ch('mode', () => opt.mode = $('mode').value, false); ch('kitMode', () => opt.kitMode = $('kitMode').value, false); ch('setTempo', () => opt.setTempo = $('setTempo').checked, false);
  $('q').oninput = () => { opt.q = $('q').value; saveO(); renderList(); };
  $('stopAll').onclick = stop;
}
document.addEventListener('keydown', e => { if(e.code === 'Space' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); stop(); } });
window.addEventListener('storage', e => { if(e.key === 'drumlab_kits'){ SAMPLES = LS.get('drumlab_samples', {}); renderControls(); } });
$('nav').innerHTML = navHTML('fill-app.html');
renderControls(); bindControls(); renderList();
window.addEventListener('resize', () => renderList());

</script>
