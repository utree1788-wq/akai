 ["審判","正位置","恋","審判のラッパは、理屈より先に鳴る","パスカル","『パンセ』","「心には、理性の知らないそれ自身の理由がある」。人を好きになる理由は、論理では説明しきれない。","理由を並べる前に\n胸の奥で何かが起きた"],
 ["塔","正位置","愛","雷は、いちばん高く積み上げたところに落ちる","仏教","四苦八苦「愛別離苦」","生きる苦しみの一つに「愛する者と別れる苦しみ」がある。深く愛するほど、別れの痛みも大きくなる。","高く積んだ思い出ほど\n崩れる音が大きかった"],
 ["死神","正位置","恋","死神は終わりではない。散るから美しいと教えるだけ","本居宣長","「もののあはれ」論","移ろいゆくものに触れて心が深く動くこと。とりわけ恋は、人の心を最も強く動かす「もののあはれ」だとされる。","散ると知ってたから\nあの春を覚えてる"],
 ["皇帝","正位置","友情","皇帝の玉座は、近づきすぎない距離で守られている","カント","『人倫の形而上学』","友情は、相手に近づこうとする「愛」と、相手との距離を保とうとする「尊敬」の均衡で成り立つ。近すぎても遠すぎても壊れる理想の関係。","肩が触れない距離で\nずっと隣を歩いてる"],
 ["教皇","正位置","友情","教皇の前に立つ弟子のように、まっすぐ言ってくれる友を持て","孔子","『論語』季氏篇","ためになる友は三種類（正直な友、誠実な友、物知りな友）。損になる友も三種類（体裁ばかりの友、こびへつらう友、口先だけの友）。","耳の痛いことを言う君が\n一番の味方だった"],
 ["愚者","正位置","友情","愚者の水筒には、甘い酒ではなく水が入っている","荘子","『荘子』山木篇","「君子の交わりは淡きこと水のごとし、小人の交わりは甘きこと醴（甘酒）のごとし」。淡い付き合いほど長く続き、甘すぎる付き合いはすぐ飽きて終わる。","甘くないから飽きなかった\n水みたいな僕らの話"],
 ["ソードの2","正位置","友情","交差した二本の剣は、互いを研ぐためにある","ニーチェ","『ツァラトゥストラはこう言った』「友について」","友の中に、最良の敵を持つべきだ。慰め合うだけでなく、互いを超えさせようとぶつかり合うのが本当の友。","君に負けたくなくて\n僕はここまで来られた"],
 ["正義","正位置","友情","正義の天秤は、友のためでも傾けない","キケロ","『友情について』","友情は徳（善さ）なしには成り立たない。恥ずべきことを友に頼まず、頼まれても行わないことが、友情の第一の掟。","君の味方だからこそ\nその嘘には乗らない"],
 ["カップの7","正位置","恋","雲の上の七つの杯。どれが本物の恋か、誰も見たことがない","ラ・ロシュフコー","『箴言集』","「真の恋は幽霊のようなものだ。誰もがその話をするが、見た者はほとんどいない」。","みんなが語る本物の恋を\n僕はまだ見たことがない"],
 ["カップのクイーン","正位置","恋","杯をなみなみと満たさず、少しだけ余白を残して差し出す女王","九鬼周造","『「いき」の構造』","「いき」は、相手に近づこうとする「媚態」、張りのある「意気地」、執着しない「諦め」の三つでできている。近づきすぎない距離にこそ色気が宿る。","全部は言わないでおく\nその余白に君がいる"],
 ["カップのエース","正位置","愛","杯からあふれた水は、「それ」ではなく「あなた」に注がれる","マルティン・ブーバー","『我と汝』","人は他者を、利用する「それ」として扱うこともできるし、全存在で向き合う「汝（あなた）」として出会うこともできる。本当の関係は「我と汝」の出会いの中にある。","役に立つかなんて忘れて\nただ君と目が合った"],
 ["隠者","正位置","愛","二つのランプは、互いの孤独を照らし合うだけで消し合わない","リルケ","『若き詩人への手紙』","愛とは、二つの孤独が互いを守り、境界を接し、挨拶を交わし合うこと。相手の孤独を消すのではなく、見守り合うのが愛。","君の孤独に触れないまま\n隣で灯りをともしてる"],
 ["ペンタクルの6","正位置","友情","天秤で量らずに分け与える手。友のように、すべての人へ","仏教","「慈悲」の思想","「慈」は、友のような親しみの心で相手の幸せを願うこと（サンスクリットでは「友」と同じ語源をもつ）。見返りを求めずに分け与える愛。","返してもらうつもりなんて\nはじめからなかった"]
];

const CATS=["愛","恋","友情"];
const state={q:"",cat:null,arc:null,card:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hl=s=>{const t=esc(s);if(!state.q)return t;const q=esc(state.q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return t.replace(new RegExp(q,"gi"),m=>`<mark>${m}</mark>`)};
const ord=e=>CARDS[e[0]][4]*2+(e[1]==="逆位置"?1:0);
const DATA=[...E].sort((a,b)=>ord(a)-ord(b));

function cardSvg(key,rev){
  const c=CARDS[key];
  return `<div class="tcard ${c[5]==="小"?"minor":""} ${rev?"rev":""}"><span class="r">${esc(c[0])}</span><span class="g">${c[2]}</span><span class="nm">${esc(c[1])}</span></div>`;
}
function match(e){
  if(state.cat&&e[2]!==state.cat)return false;
  if(state.arc&&CARDS[e[0]][5]!==state.arc)return false;
  if(state.card&&e[0]!==state.card)return false;
  if(state.q){const c=CARDS[e[0]];const hay=[...e,c[1],c[3]].join(" ").toLowerCase();if(!hay.includes(state.q.toLowerCase()))return false}
  return true;
}
function chips(){
  const mk=(row,label,on,fn,n,cls)=>{const b=document.createElement("button");b.className="chip"+(cls?" "+cls:"")+(on?" on":"");b.innerHTML=esc(label)+(n!=null?`<span class="n">${n}</span>`:"");b.onclick=fn;row.appendChild(b)};
  const cr=$("#catRow"),ar=$("#arcRow");
  cr.querySelectorAll(".chip").forEach(x=>x.remove());ar.querySelectorAll(".chip").forEach(x=>x.remove());
  CATS.forEach(c=>mk(cr,c,state.cat===c,()=>{state.cat=state.cat===c?null:c;render()},E.filter(e=>e[2]===c).length,"c-"+c));
  [["大","大アルカナ"],["小","小アルカナ"]].forEach(([k,l])=>mk(ar,l,state.arc===k,()=>{state.arc=state.arc===k?null:k;state.card=null;render()},E.filter(e=>CARDS[e[0]][5]===k).length));
}
function deck(){
  const used=[...new Set(DATA.map(e=>e[0]))];
  $("#deck").innerHTML=used.filter(k=>!state.arc||CARDS[k][5]===state.arc).map(k=>{const c=CARDS[k];return `<div class="mini ${c[5]==="小"?"minor":""} ${state.card===k?"on":""}" data-card="${esc(k)}"><span class="r">${esc(c[0])}</span><span class="g">${c[2]}</span><span class="nm">${esc(c[1])}</span></div>`}).join("");
}
function render(){
  chips(); deck();
  $("#clr").style.display=state.q?"block":"none";
  const filtered=!!(state.q||state.cat||state.arc||state.card);
  $("#reset").style.display=filtered?"inline":"none";
  const rows=DATA.filter(match);
  const groups=[["大","大アルカナ"],["小","小アルカナ"]];
  let html="";
  for(const [k,l] of groups){
    const g=rows.filter(e=>CARDS[e[0]][5]===k); if(!g.length) continue;
    html+=`<h2>${l}</h2><div class="grid">`+g.map(e=>{const c=CARDS[e[0]];return `<article class="entry">
      <div class="top">${cardSvg(e[0],e[1]==="逆位置")}<div class="tinfo"><div class="tname">${hl(c[1])}<span class="pos">${esc(e[1])}</span></div><div class="tmean">${hl(c[3])}</div><div class="metaphor">${hl(e[3])}</div></div></div>
      <div class="body"><div class="tags"><span class="cat ${e[2]}">${esc(e[2])}</span></div>
      <div class="who">${hl(e[4])}<span>${hl(e[5])}</span></div>
      <p class="idea">${hl(e[6])}</p>
      <div class="lyric"><b>歌詞の種</b>${hl(e[7])}</div></div></article>`}).join("")+`</div>`;
  }
  $("#list").innerHTML=html;
  $("#empty").style.display=html?"none":"block";
  $("#count").textContent=filtered?`${rows.length} 件`:`全 ${E.length} 件・カード ${new Set(E.map(e=>e[0])).size} 枚`;
}
$("#deck").addEventListener("click",e=>{const m=e.target.closest("[data-card]");if(!m)return;state.card=state.card===m.dataset.card?null:m.dataset.card;render();window.scrollTo({top:$("#list").offsetTop-200,behavior:"smooth"})});
$("#q").addEventListener("input",e=>{state.q=e.target.value.trim();render()});
$("#clr").onclick=()=>{$("#q").value="";state.q="";render()};
$("#reset").onclick=()=>{$("#q").value="";Object.assign(state,{q:"",cat:null,arc:null,card:null});render()};
render();
</script>
</body>
</html>
