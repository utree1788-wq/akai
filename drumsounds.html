<div class="fx scan"></div><div class="fx vig"></div>
<header>
<h1>ドラム音色図鑑</h1>
<div class="sub">ＤＲＵＭ　ＶＯＩＣＥ　ＡＲＣＨＩＶＥ <b id="cnt"></b></div>
<div class="bar"><input id="q" type="search" placeholder="検索：キック、808、ローファイ、ブラシ…"><select id="kitSel" title="「キットのまま」で鳴らすキット"></select></div>
<div class="chips" id="chips"></div>
</header>
<main id="list"></main>
<script>
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const DRUMKIT = [
  {p:75,n:'クラベス',a:'CLV'},{p:64,n:'コンガ(低)',a:'CN/L'},{p:62,n:'コンガ(高)',a:'CN/H'},{p:82,n:'シェイカー',a:'SHK'},{p:70,n:'マラカス',a:'MR'},{p:69,n:'カバサ',a:'CA'},{p:54,n:'タンバリン',a:'TAMB'},
  {p:68,n:'アゴゴ(低)',a:'AG/L'},{p:67,n:'アゴゴ(高)',a:'AG/H'},{p:61,n:'ボンゴ(低)',a:'BN/L'},{p:60,n:'ボンゴ(高)',a:'BN/H'},{p:47,n:'スルド(ミュート)',a:'M.SRD'},{p:43,n:'スルド',a:'O.SRD'},
  {p:52,n:'チャイナ',a:'CHINA'},{p:55,n:'スプラッシュ',a:'SPLASH'},
  {p:56,n:'カウベル',a:'CW'},{p:53,n:'ライドカップ',a:'CUP'},{p:51,n:'ライド',a:'RC'},{p:49,n:'クラッシュ',a:'CC'},
  {p:48,n:'ハイタム',a:'TOM1'},{p:45,n:'ミッドタム',a:'TOM2'},{p:41,n:'ロータム',a:'TOM3'},
  {p:46,n:'オープンHH',a:'OHH'},{p:44,n:'ペダルHH',a:'FHH'},{p:42,n:'クローズHH',a:'HH'},
  {p:39,n:'クラップ',a:'CLAP'},{p:37,n:'リム',a:'RIM'},{p:40,n:'スネア2',a:'SD2'},{p:38,n:'スネア',a:'SD'},{p:35,n:'キック2',a:'BD2'},{p:36,n:'キック',a:'BD'}
];

function makeNoise(c){ const b = c.createBuffer(1, c.sampleRate, c.sampleRate), d = b.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; }

const curveCache = {};
function driveCurve(d){
  const key = Math.round(d * 100); if(curveCache[key]) return curveCache[key];
  const n = 1024, cv = new Float32Array(n), k = d * 60;
  for(let i = 0; i < n; i++){ const x = i / (n - 1) * 2 - 1; cv[i] = k ? (1 + k) * x / (1 + k * Math.abs(x)) : x; }
  return curveCache[key] = cv;
}

const KITS = {
  std:    {n:'スタンダード', d:'クセのない基本の音。どのジャンルにも。', tune:0, decay:1, tone:1, drive:0},
  rock:   {n:'ロック（太い生ドラム）', d:'低く太いキックと鳴りの大きいスネア。ロック・メタルに。', tune:-1, decay:1.2, tone:.92, drive:.12},
  jazz:   {n:'ジャズ（ブラシ）', d:'ブラシのスネアと柔らかいキック、よく伸びるライド。ジャズ・ボサノヴァに。', tune:2, decay:1.1, tone:.8, drive:0},
  r808:   {n:'TR-808風', d:'長く伸びるブーンという低音キックと金属的なハイハット。ヒップホップ・トラップ・ブラコンに。', tune:0, decay:1, tone:1, drive:0},
  r909:   {n:'TR-909風', d:'アタックの強いキックとザラッとしたスネア。ハウス・テクノに。', tune:0, decay:1, tone:1, drive:.08},
  electro:{n:'エレクトロ', d:'短くタイトで歪んだ電子音。ドラムンベース・エレクトロに。', tune:0, decay:.7, tone:1, drive:.3},
  lofi:   {n:'ローファイ', d:'こもった暖かい音と軽い歪み。チル・ローファイヒップホップに。', tune:-2, decay:.85, tone:.35, drive:.35},
  perc:   {n:'パーカッション（明るめ）', d:'少し高めで明るい音色。ラテン・パーカッションに。', tune:1, decay:.9, tone:1, drive:0},
};
const pieceOf = (tr, p) => (tr.params.pieces && tr.params.pieces[p]) || {};
function playDrum(mix, tr, p, t, vel){
  const c = mix.c, out = trackNode(mix, tr).input, nb = mix.noise;
  const kid = tr.params.kit || 'std', K = KITS[kid] || KITS.std, pc = pieceOf(tr, p);
  const tn = Math.pow(2, ((tr.params.tune || 0) + K.tune + (pc.tune || 0)) / 12);
  const dm = (tr.params.decay || 1) * K.decay * (pc.decay ?? 1);
  const tone = clamp(K.tone * (pc.tone ?? 1) * (tr.params.tone ?? 1), .04, 1);
  const vg = c.createGain(); vg.gain.value = Math.pow(vel / 127, 1.3) * (pc.vol ?? 1);
  let node = vg;
  if(tone < .99){ const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500 + tone * tone * 19000; lp.Q.value = .5; node.connect(lp); node = lp; }
  const drv = K.drive + (pc.drive || 0);
  if(drv > 0){ const sh = c.createWaveShaper(); sh.curve = driveCurve(Math.min(1, drv)); const cg = c.createGain(); cg.gain.value = 1 - Math.min(.5, drv * .5); node.connect(sh); sh.connect(cg); node = cg; }
  if(pc.pan && c.createStereoPanner){ const pn = c.createStereoPanner(); pn.pan.value = pc.pan; node.connect(pn); node = pn; }
  node.connect(out);
  const E = (g, a, pk, dec, ts = t) => { g.gain.setValueAtTime(.0001, ts); g.gain.exponentialRampToValueAtTime(pk, ts + a); g.gain.exponentialRampToValueAtTime(.0001, ts + a + dec * dm); };
  const N = (dur, type, freq, q, ts = t) => { const s = c.createBufferSource(); s.buffer = nb; s.loop = true; const f = c.createBiquadFilter(); f.type = type; f.frequency.value = Math.min(20000, freq * tn); if(q) f.Q.value = q; const g = c.createGain(); s.connect(f); f.connect(g); g.connect(vg); s.start(ts, Math.random() * .5); s.stop(ts + dur * dm + .1); return g; };
  const O = (type, f0, f1, sweep, dur) => { const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0 * tn, t); if(f1) o.frequency.exponentialRampToValueAtTime(f1 * tn, t + sweep); const g = c.createGain(); o.connect(g); g.connect(vg); o.start(t); o.stop(t + dur * dm + .1); return g; };
  const M = (dur, hp, bp) => { // 808-style metallic: six detuned squares
    const f1 = c.createBiquadFilter(); f1.type = 'bandpass'; f1.frequency.value = bp * tn; f1.Q.value = .9;
    const f2 = c.createBiquadFilter(); f2.type = 'highpass'; f2.frequency.value = hp * tn; const g = c.createGain();
    [205.3,304.4,369.6,522.7,540,800].forEach(fr => { const o = c.createOscillator(); o.type = 'square'; o.frequency.value = fr * 1.7 * tn; o.connect(f1); o.start(t); o.stop(t + dur * dm + .1); });
    f1.connect(f2); f2.connect(g); g.connect(vg); return g;
  };
  // kit-specific voices
  const V = {
    r808:{
      36:() => { E(O('sine',140,47,.08,1.7),.002,1,1.35); E(O('sine',1200,null,0,.01),.0005,.12,.004); },
      35:() => E(O('sine',110,40,.12,2.1),.002,1,1.75),
      38:() => { E(O('sine',185,null,0,.25),.001,.45,.14); E(O('sine',330,null,0,.2),.001,.28,.09); E(N(.3,'highpass',1800),.001,.55,.2); },
      40:() => { E(O('sine',240,null,0,.2),.001,.4,.1); E(N(.2,'highpass',2600),.001,.5,.12); },
      39:() => { [0,.01,.02].forEach(d => E(N(.03,'bandpass',1100,1.5,t + d),.001,.8,.01,t + d)); E(N(.5,'bandpass',1100,1.5,t + .03),.001,.7,.35,t + .03); },
      37:() => { E(O('sine',1750,null,0,.04),.0005,.5,.02); E(O('sine',480,null,0,.04),.0005,.3,.02); },
      42:() => E(M(.08,7000,10000),.001,.09,.05), 44:() => E(M(.05,7000,9000),.001,.06,.03), 46:() => E(M(.6,7000,10000),.001,.08,.42),
      41:() => E(O('sine',100,80,.1,.9),.002,.95,.65), 45:() => E(O('sine',140,110,.1,.8),.002,.95,.55), 48:() => E(O('sine',195,150,.1,.7),.002,.95,.45),
      49:() => E(M(2,4000,8000),.002,.07,1.5), 51:() => E(M(1.2,5500,9500),.001,.05,.9),
    },
    r909:{
      36:() => { E(O('sine',240,52,.05,.55),.001,1,.42); E(N(.012,'highpass',4000),.0005,.7,.006); },
      35:() => { E(O('sine',200,45,.07,.7),.001,1,.55); E(N(.012,'highpass',3500),.0005,.6,.006); },
      38:() => { E(O('triangle',205,175,.05,.18),.001,.6,.1); E(O('triangle',340,null,0,.1),.001,.25,.06); E(N(.32,'highpass',1500),.001,.85,.22); },
      40:() => { E(O('triangle',260,220,.04,.12),.001,.5,.07); E(N(.2,'highpass',2500),.001,.7,.13); },
      39:() => { [0,.009,.018].forEach(d => E(N(.03,'bandpass',1400,1.3,t + d),.001,.8,.01,t + d)); E(N(.35,'bandpass',1400,1.3,t + .027),.001,.75,.24,t + .027); },
      42:() => { E(N(.08,'highpass',8500),.001,.42,.045); E(M(.05,8000,11000),.001,.04,.03); },
      46:() => { E(N(.6,'highpass',8000),.001,.36,.42); E(M(.4,8000,11000),.001,.04,.3); },
      49:() => E(N(2,'highpass',5200),.002,.42,1.6), 51:() => { E(N(1.4,'bandpass',8000,1.8),.001,.32,1.1); E(M(1,6000,9000),.001,.04,.8); },
    },
    rock:{
      36:() => { E(O('sine',112,46,.07,.65),.002,1,.52); E(N(.02,'bandpass',3500,1.5),.001,.5,.012); E(N(.09,'lowpass',320),.001,.45,.07); },
      38:() => { E(N(.5,'bandpass',2200,.6),.001,.75,.32); E(O('triangle',200,160,.04,.22),.001,.7,.15); E(N(.35,'highpass',4200),.001,.35,.26); },
      41:() => { E(O('sine',140,78,.18,.8),.002,.95,.6); E(N(.05,'lowpass',1200),.001,.2,.03); },
      45:() => { E(O('sine',190,110,.15,.7),.002,.95,.5); E(N(.05,'lowpass',1400),.001,.2,.03); },
      48:() => { E(O('sine',260,150,.13,.6),.002,.95,.42); E(N(.05,'lowpass',1600),.001,.2,.03); },
    },
    jazz:{
      36:() => E(O('sine',120,68,.08,.45),.004,.7,.32),
      38:() => { E(N(.4,'bandpass',4500,.7),.025,.38,.28); E(N(.12,'bandpass',1800,.8),.004,.18,.08); },
      40:() => E(N(.6,'bandpass',4000,.6),.08,.3,.4),
      37:() => { E(O('triangle',900,null,0,.08),.001,.25,.04); E(N(.05,'bandpass',2500,2),.001,.25,.03); },
      42:() => E(N(.06,'bandpass',8000,1.5),.002,.25,.045), 44:() => E(N(.05,'bandpass',6000,1.2),.003,.2,.03),
      51:() => { E(O('sine',4300,null,0,1.8),.001,.07,1.3); E(N(1.8,'bandpass',7500,2),.001,.3,1.5); },
    },
    electro:{
      36:() => { E(O('sine',190,40,.05,.4),.001,1,.32); E(O('square',900,null,0,.01),.0005,.2,.004); },
      38:() => { E(N(.18,'bandpass',2800,.7),.001,.8,.11); E(O('sine',250,180,.03,.1),.001,.5,.06); },
      39:() => E(N(.15,'bandpass',1700,1.5),.001,.9,.09),
      42:() => E(N(.03,'highpass',9500),.001,.45,.018), 46:() => E(N(.25,'highpass',9000),.001,.38,.17),
    },
  };
  const vv = pc.voice;
  if(vv && vv.startsWith('x:')){ const fam = DFAM[p], f = fam && XV[fam] && XV[fam][vv.slice(2)]; if(f){ f[1]({E, N, O, M, t}, p); return; } }
  else if(vv && vv !== 'std'){ const f2 = V[vv] && V[vv][p]; if(f2){ f2(); return; } }
  const kv = vv === 'std' ? null : V[kid] && V[kid][p]; if(kv){ kv(); return; }
  switch(p){
    case 36: E(O('sine',155,42,.12,.55),.002,1,.45); E(N(.03,'highpass',2500),.001,.3,.015); break;
    case 38: E(N(.3,'highpass',1200),.001,.6,.2); E(O('triangle',230,150,.06,.15),.001,.55,.1); break;
    case 37: E(O('square',820,null,0,.06),.001,.2,.03); E(N(.05,'bandpass',3200,2),.001,.45,.03); break;
    case 39: [0,.011,.022].forEach((d, i) => E(N(i === 2 ? .25 : .03,'bandpass',1600,1.2,t + d),.001,.75,i === 2 ? .18 : .012,t + d)); break;
    case 42: E(N(.07,'highpass',7500),.001,.35,.045); break;
    case 46: E(N(.45,'highpass',7000),.001,.3,.33); break;
    case 41: case 45: case 48: { const f = {41:95,45:135,48:185}[p]; E(O('sine',f * 1.6,f,.15,.5),.002,.85,.38); E(N(.05,'lowpass',1500),.001,.15,.03); break; }
    case 49: E(N(1.9,'highpass',4500),.002,.35,1.6); E(N(1.9,'bandpass',9000,.8),.002,.2,1.2); break;
    case 51: E(N(1.1,'bandpass',8500,1.5),.001,.28,.85); E(O('sine',5200,null,0,.5),.001,.04,.4); break;
    case 56: E(O('square',560,null,0,.3),.001,.18,.25); E(O('square',845,null,0,.3),.001,.18,.25); break;
    case 44: E(N(.06,'highpass',6000),.002,.22,.035); E(N(.03,'bandpass',900,1),.001,.08,.02); break;
    case 53: E(O('sine',2350,null,0,.8),.001,.22,.6); E(O('square',3550,null,0,.4),.001,.04,.35); E(N(.3,'bandpass',8000,3),.001,.1,.2); break;
    case 54: [0,.009,.018].forEach((d, i) => E(N(.14,'bandpass',8200,3,t + d),.001,i ? .2 : .32,.1,t + d)); break;
    case 82: E(N(.1,'highpass',5500,1),.012,.24,.05); break;
    case 70: E(N(.05,'highpass',6500,1),.002,.28,.03); break;
    case 69: E(N(.09,'highpass',7000,1),.004,.3,.06); break;
    case 35: E(O('sine',120,38,.22,1.1),.002,1,.95); E(N(.02,'highpass',3000),.001,.15,.01); break;
    case 40: E(N(.16,'bandpass',3200,.8),.001,.6,.11); E(O('triangle',330,220,.04,.09),.001,.4,.06); break;
    case 55: E(N(.8,'highpass',6500),.001,.4,.55); break;
    case 52: E(N(1.3,'bandpass',5000,1.5),.001,.45,1); E(N(1.3,'highpass',3000),.001,.2,.9); break;
    case 43: E(O('sine',78,60,.18,1.3),.003,1,1.05); E(N(.03,'lowpass',800),.001,.2,.02); break;
    case 47: E(O('sine',82,66,.05,.3),.002,.85,.16); E(N(.02,'lowpass',900),.001,.25,.015); break;
    case 60: E(O('sine',520,480,.03,.16),.001,.6,.1); E(N(.015,'bandpass',4000,2),.001,.2,.01); break;
    case 61: E(O('sine',380,350,.03,.22),.001,.6,.14); E(N(.015,'bandpass',3200,2),.001,.18,.01); break;
    case 67: E(O('sine',930,null,0,.45),.001,.35,.32); E(O('sine',2420,null,0,.2),.001,.08,.12); break;
    case 68: E(O('sine',690,null,0,.45),.001,.35,.32); E(O('sine',1810,null,0,.2),.001,.08,.12); break;
    case 62: E(O('sine',340,310,.04,.3),.001,.65,.16); E(N(.02,'bandpass',2600,2),.001,.18,.01); break;
    case 64: E(O('sine',225,200,.05,.4),.001,.7,.24); E(N(.02,'bandpass',1800,2),.001,.14,.01); break;
    case 75: E(O('sine',2500,null,0,.12),.001,.5,.05); break;
  }
}

// DRUM VOICE LIBRARY — each kit piece can pick its own sound
// ======================================================================
const DFAM = {36:'kick',35:'kick',38:'snare',40:'snare',39:'clap',37:'rim',42:'chh',44:'phh',46:'ohh',41:'tom',45:'tom',48:'tom',43:'tom',47:'tom',49:'crash',55:'crash',52:'crash',51:'ride',53:'ride',56:'cow'};
const TOMF = {41:95,45:135,48:185,43:78,47:82};
const KITVOICE = {r808:[36,35,38,40,39,37,42,44,46,41,45,48,49,51], r909:[36,35,38,40,39,42,46,49,51], rock:[36,38,41,45,48], jazz:[36,38,40,37,42,44,51], electro:[36,38,39,42,46]};
// X = {E, N, O, M, t}; p = piece pitch
const XV = {
  kick:{

// list of selectable sounds for one piece: [value, label]
function voiceList(p){
  const out = [['', 'キットのまま'], ['std', 'スタンダード']];
  for(const k in KITVOICE) if(KITVOICE[k].includes(p)) out.push([k, KITS[k].n.replace(/（.*/, '')]);
  const fam = DFAM[p];
  if(fam && XV[fam]) for(const id in XV[fam]) out.push(['x:' + id, XV[fam][id][0]]);
  return out;
}
function voiceLabel(p, v){ const hit = voiceList(p).find(x => x[0] === (v || '')); return hit ? hit[1] : 'キットのまま'; }

// ---- minimal audio host ----
let AC=null,live=null,OUT=null;
function getAC(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const comp=AC.createDynamicsCompressor();comp.threshold.value=-10;OUT=AC.createGain();OUT.gain.value=.9;OUT.connect(comp);comp.connect(AC.destination);live={c:AC,noise:makeNoise(AC)}}if(AC.state==='suspended')AC.resume();return AC}
function trackNode(){return {input:OUT}}
const TR={params:{kit:'std',tune:0,decay:1,pieces:{}}};
function play(p,voice,kit){getAC();TR.params.kit=kit||document.getElementById('kitSel').value;TR.params.pieces={};if(voice)TR.params.pieces[p]={voice};playDrum(live,TR,p,AC.currentTime+.01,108);hitE=1}
// ---- groups ----
const GROUPS=[['キック',[36,35]],['スネア',[38,40]],['クラップ・リム',[39,37]],['ハイハット',[42,44,46]],['タム',[48,45,41,43,47]],['シンバル',[49,55,52,51,53]],['パーカッション',[56,54,82,70,69,75,60,61,62,64,67,68]]];
const NAME=Object.fromEntries(DRUMKIT.map(d=>[d.p,d]));
const $=s=>document.querySelector(s);
$('#kitSel').innerHTML=Object.entries(KITS).map(([k,v])=>`<option value="${k}">基本キット：${v.n}</option>`).join('');
let cur='all';
const cats=['すべて',...GROUPS.map(g=>g[0]),'キット一覧'];
$('#chips').innerHTML=cats.map((c,i)=>`<button class="chip${i?'':' on'}">${c}</button>`).join('');
[...$('#chips').children].forEach(b=>b.onclick=()=>{cur=b.textContent==='すべて'?'all':b.textContent;[...$('#chips').children].forEach(x=>x.classList.toggle('on',x===b));render();scrollTo(0,0)});
function render(){const q=$('#q').value.trim().toLowerCase();let h='',n=0;
 if(cur==='all'||cur==='キット一覧'){const ks=Object.entries(KITS).filter(([k,v])=>!q||(v.n+v.d).toLowerCase().includes(q));if(ks.length){h+='<h2>キット一覧<small>DRUM KITS</small></h2><div class="kits">'+ks.map(([k,v])=>`<div class="kit"><b>${v.n}</b><p>${v.d}</p><button data-demo="${k}">▶ 8ビートで試聴</button></div>`).join('')+'</div>'}}
 for(const [g,ps] of GROUPS){if(cur!=='all'&&cur!==g)continue;let gh='';
  for(const p of ps){const d=NAME[p];if(!d)continue;const L=voiceList(p).filter(([v])=>v!=='');const hit=L.filter(([v,l])=>!q||(l+d.n+d.a+g).toLowerCase().includes(q));if(!hit.length)continue;n+=hit.length;
   gh+=`<div class="piece"><div class="ph"><b>${d.n}</b><span>${d.a}・NOTE ${p}・${hit.length}種類</span></div><div class="vs">${hit.map(([v,l])=>`<button class="v" data-p="${p}" data-v="${v}"><i>▶</i><span>${l}<small>${v.startsWith('x:')?'VOICE '+v.slice(2).toUpperCase():'KIT '+v.toUpperCase()}</small></span></button>`).join('')}</div></div>`}
  if(gh)h+=`<h2>${g}<small>${ps.length} PIECES</small></h2>`+gh}
 h+='<p class="note">ここの音色は、ポケットDTM Studioのドラムで楽器ごとに選べます（ステップ画面 →「音色の種類」、またはドラムトラックの🎛 → 楽器の音色）。音程・長さ・明るさ・歪みの調整と組み合わせると、さらに幅が広がります。</p>';
 $('#list').innerHTML=h||'<p class="note">見つかりません</p>';$('#cnt').textContent='— '+n+' VOICES';
 document.querySelectorAll('.v').forEach(b=>b.onclick=()=>{play(+b.dataset.p,b.dataset.v);b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),180)});
 document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>{const k=b.dataset.demo;[[36,0],[42,0],[42,.15],[38,.3],[42,.3],[42,.45],[36,.6],[36,.75],[42,.6],[42,.75],[38,.9],[42,.9],[46,1.05]].forEach(([p,t])=>setTimeout(()=>play(p,'',k),t*1000))});
}
$('#q').oninput=render;render();
let hitE=0;(function fr(){hitE*=.88;document.documentElement.style.setProperty('--hit',hitE.toFixed(3));requestAnimationFrame(fr)})();
