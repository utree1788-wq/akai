<meta name="theme-color" content="#13172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ボイシング帖">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#13172a;--panel:#1c2238;--panel2:#252c47;--line:#343d5e;--ink:#eeedf5;--sub:#9ba2bd;--acc:#f2a96b;--acc2:#ffd3a8;
  --r:#ef7a62;--t3:#f2c14e;--t5:#63c7a0;--t7:#6ea8f5;--tn:#bb95f3;--bs:#8e95b3;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,select,input,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:10;background:rgba(19,23,42,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hwrap{max-width:980px;margin:0 auto;padding:10px 14px 0}
h1{font-family:'Zen Maru Gothic',sans-serif;font-size:20px;margin:0 0 8px;letter-spacing:.06em}
h1 small{font-size:12px;color:var(--sub);font-weight:500;margin-left:8px;letter-spacing:0}
nav{display:flex;gap:4px}
nav button{flex:1;background:none;border:none;border-bottom:3px solid transparent;padding:8px 4px 9px;color:var(--sub);font-weight:700;cursor:pointer}
nav button.on{color:var(--acc);border-bottom-color:var(--acc)}
main{max-width:980px;margin:0 auto;padding:14px 14px 60px}
section{display:none}section.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.lbl{font-size:12px;color:var(--sub);margin:12px 0 6px;font-weight:700;letter-spacing:.05em}
.lbl:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);padding:6px 11px;border-radius:999px;font-size:14px;cursor:pointer;line-height:1.3}
.chip.on{background:var(--acc);color:#2a1a0c;border-color:var(--acc);font-weight:700}
.chip:disabled{opacity:.3;cursor:default}
.roots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.roots .chip{text-align:center;padding:8px 0;font-weight:700;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.step{display:inline-flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step button{background:none;border:none;width:38px;height:36px;cursor:pointer;font-size:16px}
.step span{min-width:92px;text-align:center;font-size:14px;font-weight:700}
.step.small span{min-width:56px}
.tog{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.tog input{display:none}
.tog:has(input:disabled){opacity:.4;cursor:default}
.tog i{width:38px;height:22px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);position:relative;transition:.2s}
.tog i::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--sub);transition:.2s}
.tog input:checked+i{background:var(--acc)}
.tog input:checked+i::after{left:18px;background:#2a1a0c}

<body>

<main>

<!-- ================= 進行 ================= -->

    <div class="chips" id="ptypes"></div>
    <div class="lbl">音の間隔</div>
    <div class="seg tightSeg"><button data-v="0">広め</button><button data-v="1">ふつう</button><button data-v="2">ぎゅっと</button><button data-v="3">右手だけ</button></div>

  <div class="sum" id="pSum"></div>

</section>

<!-- ================= 解説 ================= -->
<section id="v-learn" class="learn"></section>
</main>

<script>

 close:{how:'コードの音を1オクターブ以内にぎゅっと詰めて並べる、いちばん基本の形。',sound:'まとまりがあって明るく、はっきりした響き。',use:'右手のバッキング、ストリングスやブラスの基本形、合唱。',tip:'転回形を変えると、トップノート（いちばん上の音）を自由に選べる。'},

/* ---------- 和音の理論 ---------- */

const get=(ch,role)=>ch.tones.find(t=>t.role===role);

/* ---------- 弾きやすさ ---------- */
const IVN=['同音','短2度','長2度','短3度','長3度','4度','増4度','5度','短6度','長6度','短7度','長7度','1オクターブ','短9度','9度','短10度','10度','11度','増11度','12度'];

function maxGap(m){let g=0;for(let i=1;i<m.length;i++)g=Math.max(g,m[i]-m[i-1]);return g;}
function handInfo(notes){
  const m=notes.map(n=>n.midi).sort((a,b)=>a-b),n=m.length,span=m[n-1]-m[0],gap=maxGap(m);
  if(span<=12)return {hands:1,n,span,gap,ok:true,stars:span<=9?3:2};
  let best=null;
  for(let k=1;k<n;k++){const l=m[k-1]-m[0],r=m[n-1]-m[k],g=m[k]-m[k-1];
    if(l<=12&&r<=12){const sc=Math.max(l,r)+Math.max(0,g-7)*.6;if(!best||sc<best.sc)best={hands:2,k,l,r,g,sc};}}
  if(!best)return {hands:2,span,gap,ok:false,stars:1};
  return {...best,span,gap,ok:true,stars:(Math.max(best.l,best.r)<=9&&gap<=9)?3:gap<=12?2:1};
}
const notesCount=h=>h.n;
function handText(h){
  const st='★'.repeat(h.stars)+'☆'.repeat(3-h.stars);
  if(h.hands===1)return `${st}　${RH()?'右手だけで届く':'片手で届く'}（幅 ${ivName(h.span)}・${notesCount(h)}音）`;
  if(!h.ok)return `${st}　手が届きにくい（幅 ${ivName(h.span)}）`;
  return `${st}　両手：左 ${h.l?ivName(h.l):'1音'}／右 ${ivName(h.r)}`+(h.g>9?`　※手と手の間が ${ivName(h.g)} 空く`:'');

const GAPLIM=()=>[99,9,5,5][S.tight];
const easyOK=(notes,lim=GAPLIM())=>{const h=handInfo(notes);return h.ok&&h.gap<=lim;};

/* ---------- 鍵盤 SVG ---------- */
const isBlack=m=>[1,3,6,8,10].includes(mod12(m));
function kbSVG(notes,o={}){
  const ms=notes.map(n=>n.midi);let start,end;
  if(o.range)[start,end]=o.range;
  else{const lo=Math.min(...ms),hi=Math.max(...ms);start=Math.floor(lo/12)*12;end=Math.max(start+24,Math.ceil((hi+1)/12)*12);}
  const W=22,H=o.h||100,BW=13,BH=H*0.6;
  const whites=[];for(let m=start;m<=end;m++)if(!isBlack(m))whites.push(m);
  const x={};whites.forEach((m,i)=>x[m]=i*W);
  const map={};notes.forEach(n=>map[n.midi]=n);
  const keep=o.common||new Set();
  let w='',b='',t='';
  whites.forEach(m=>{
    const n=map[m];
    w+=`<rect class="wk ${n?'on '+n.role:''} ${n&&keep.has(m)?'keep':''}" data-midi="${m}" x="${x[m]+.5}" y=".5" width="${W-1}" height="${H-1}" rx="3"/>`;
    if(n)t+=`<text class="klab" x="${x[m]+W/2}" y="${H-9}">${n.lab}</text>`;
    else if(mod12(m)===0)t+=`<text class="cmark" x="${x[m]+W/2}" y="${H-6}">C${m/12-1}</text>`;
  });
  for(let m=start;m<=end;m++){
    if(!isBlack(m)||x[m-1]===undefined)continue;
    const n=map[m],bx=x[m-1]+W-BW/2;
    b+=`<rect class="bk ${n?'on '+n.role:''} ${n&&keep.has(m)?'keep':''}" data-midi="${m}" x="${bx}" y=".5" width="${BW}" height="${BH}" rx="2"/>`;
    if(n)t+=`<text class="klab bl" x="${bx+BW/2}" y="${BH-7}">${n.lab}</text>`;
  }
  return `<svg class="kb" viewBox="0 0 ${whites.length*W} ${H}" xmlns="http://www.w3.org/2000/svg">${w}${b}${t}</svg>`;
}
function pillsHTML(notes,flat,small){
  return notes.map(n=>`<span class="pill ${n.role}"><b>${n.lab}</b>${noteName(n.midi,n.lab,flat)}</span>`).join('');
}

/* ---------- 音 ---------- */
let AC=null,BUS=null,REV=null;
function audio(){
  if(!AC){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.connect(AC.destination);
    const conv=AC.createConvolver();const len=AC.sampleRate*2.2;const buf=AC.createBuffer(2,len,AC.sampleRate);
    for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2);}
    conv.buffer=buf;REV=AC.createGain();REV.gain.value=.28;REV.connect(conv);conv.connect(comp);
    AC._dry=AC.createGain();AC._dry.gain.value=.9;AC._dry.connect(comp);
    BUS=newBus();
  }
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function newBus(){const g=AC.createGain();g.connect(AC._dry);g.connect(REV);return g;}
function voice(midi,t,dur,vel,bus){
  const f=440*Math.pow(2,(midi-69)/12),out=bus||BUS;
  const env=AC.createGain();env.connect(out);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.connect(env);
  const oscs=[];
  const osc=(type,freq,gain,decay)=>{const o=AC.createOscillator();o.type=type;o.frequency.value=freq;const g=AC.createGain();
    if(decay){g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+decay);}else g.gain.value=gain;
    o.connect(g);g.connect(lp);oscs.push(o);return o;};
  let end;
  if(S.sound==='pad'){
    lp.frequency.value=1400;lp.Q.value=.6;
    const a=osc('sawtooth',f,.35);a.detune.value=-7;const c=osc('sawtooth',f,.35);c.detune.value=7;osc('sine',f/2,.25);
    env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(vel*.7,t+.28);env.gain.setTargetAtTime(0,t+dur,.35);end=t+dur+1.8;
  }else if(S.sound==='organ'){
    lp.frequency.value=3800;
    osc('sine',f,.6);osc('sine',f*2,.3);osc('sine',f*3,.18);osc('sine',f*4,.08);
    env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(vel*.75,t+.015);env.gain.setTargetAtTime(0,t+dur,.06);end=t+dur+.6;
  }else{
    lp.frequency.value=Math.min(5200,f*7+600);
    osc('sine',f,.9);osc('triangle',f,.18);osc('sine',f*2,.45,.5);osc('sine',f*7.02,.06,.12);
    env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(vel,t+.006);
    env.gain.setTargetAtTime(vel*.22,t+.006,.7);env.gain.setTargetAtTime(0,t+dur,.22);end=t+dur+1.4;
  }
  oscs.forEach(o=>{o.start(t);o.stop(end);});
}
function playNotes(notes,{when,dur=1.8,mode=S.mode,bus}={}){
  const a=audio();const t0=when??a.currentTime+.03;
  const s=[...notes].sort((x,y)=>x.midi-y.midi);const n=s.filter(x=>!x.bass).length||1;
  const vel=.34/Math.sqrt(n);
  s.forEach((x,i)=>{
    const off=mode==='arp'?i*.13:mode==='strum'?i*.028:0;
    voice(x.midi,t0+off,dur+(mode==='arp'?(s.length-i)*.13:0),x.bass?vel*1.25:vel,bus);
  });
}

/* ---------- 画面：進行 ---------- */
function parseChord(sym){
  let s=sym.trim().replace(/♭/g,'b').replace(/♯/g,'#').replace(/[()（）]/g,'').replace('6/9','69');
  const m=s.match(/^([A-Ga-g])([#b]?)(.*?)(?:\/([A-Ga-g])([#b]?))?$/);if(!m)return null;
  const pcOf=(L,a)=>mod12({C:0,D:2,E:4,F:5,G:7,A:9,B:11}[L.toUpperCase()]+(a==='#'?1:a==='b'?-1:0));
  const nm=(L,a)=>L.toUpperCase()+(a==='#'?'#':a==='b'?'♭':'');
  let q=QALIAS[m[3]];if(q===undefined)q=QALIAS[m[3].replace(/^maj/i,'M')];if(q===undefined)return null;
  const pc=pcOf(m[1],m[2]);
  return {pc,name:nm(m[1],m[2]),flat:m[2]==='b'||m[1].toUpperCase()==='F',q,
    bpc:m[4]?pcOf(m[4],m[5]):null,bname:m[4]?nm(m[4],m[5]):''};
}
function toChord(p,k){
  if(!k)return makeChord(p.pc,p.q,p.name,p.flat,p.bpc,p.bname);
  const pc=mod12(p.pc+k),r=ROOTS[pc];
  const bpc=p.bpc==null?null:mod12(p.bpc+k);
  return makeChord(pc,p.q,r.n,r.f,bpc,bpc==null?'':ROOTS[bpc].n);
}
function candidates(ch,ptype){
  let types=(ptype==='auto'?(RH()?['close']:S.easy?['close','drop2','spread'].concat(S.pbass?['rootless']:[]):['close','drop2']):[ptype]).filter(t=>available(ch,t));let fb=false;
  if(!types.length){types=['close'];fb=true;}
  const out=[];
  types.forEach(t=>{
    const [lo,hi]=RH()?[53,79]:RANGE[t];
    for(let i=0;i<invCount(ch,t);i++){
      const tones=gen(ch,t,i);const base=tones.map(x=>60+ch.rootPc+x.iv);
      for(let k=-36;k<=36;k+=12){
        const ms=base.map(v=>v+k);if(Math.min(...ms)<lo||Math.max(...ms)>hi)continue;
        out.push({type:t,inv:i,fb,notes:tones.map((x,j)=>({midi:ms[j],lab:x.lab,role:x.role})).sort((a,b)=>a.midi-b.midi)});
      }
    }
  });
  if(!out.length)out.push({type:'close',inv:0,fb:true,notes:placeSingle(ch,gen(ch,'close',0),'close',0,false)});
  out.forEach(c=>{c.full=S.pbass?addBass(ch,c.notes.map(n=>({...n}))):c.notes;});
  if(S.easy){
    for(const lim of [GAPLIM(),GAPLIM()+2,9]){
      const ok=out.filter(c=>easyOK(c.full,lim)&&Math.max(...mids(c))<=79&&Math.min(...mids(c))>=43);
      if(ok.length)return ok;
    }
    const fg=c=>maxGap(c.full.map(n=>n.midi));const g=Math.min(...out.map(fg));return out.filter(c=>fg(c)===g);
  }
  return out;
}
const mids=c=>c.notes.map(n=>n.midi);
function moveOf(a,b){let s=0;b.forEach(x=>s+=Math.min(...a.map(y=>Math.abs(x-y))));return s;}
function trans(p,c){
  const a=mids(p),b=mids(c);
  return (moveOf(a,b)+moveOf(b,a))/2+.35*Math.abs(a[a.length-1]-b[b.length-1]);
}
function regPen(c){const m=mids(c);const avg=m.reduce((x,y)=>x+y,0)/m.length;let p=.18*Math.max(0,Math.abs(avg-64)-5);if(S.easy){const sp=m[m.length-1]-m[0];const f=(c.full||c.notes).map(n=>n.midi);if(RH())p+=clusters(m)*.8;const w=S.tight>=2?[.4,.9,4]:[.25,.3,5];p+=w[0]*Math.max(0,sp-9)+w[1]*Math.max(0,maxGap(f)-w[2]);}return p;}
function voiceProg(chords,ptype){
  if(!chords.length)return [];
  const C=chords.map(ch=>candidates(ch,ptype));
  const cost=[C[0].map(c=>.3*Math.abs(mids(c).slice(-1)[0]-67)+regPen(c)+(c.inv?.4:0))],back=[[]];
  for(let i=1;i<C.length;i++){
    back[i]=[];
    cost[i]=C[i].map((c,j)=>{let best=Infinity,bi=0;C[i-1].forEach((p,k)=>{const v=cost[i-1][k]+trans(p,c);if(v<best){best=v;bi=k;}});back[i][j]=bi;return best+regPen(c);});
  }
  let j=cost[C.length-1].indexOf(Math.min(...cost[C.length-1]));const pick=[];
  for(let i=C.length-1;i>=0;i--){pick[i]=C[i][j];if(i>0)j=back[i][j];}
  return pick.map((c,i)=>{
    const prev=i?pick[i-1]:null;
    const common=new Set(prev?mids(c).filter(m=>mids(prev).includes(m)):[]);
    return {ch:chords[i],cand:c,notes:c.notes.map(n=>({...n})),common,move:prev?moveOf(mids(prev),mids(c)):null};
  });
}
let PROG=[];
function renderProg(){
  $('#progText').value=S.prog;
  const toks=S.prog.split(/[\s|,、]+/).filter(Boolean);
  const parsed=toks.map(t=>({t,p:parseChord(t)}));
  const bad=parsed.filter(x=>!x.p).map(x=>x.t);
  $('#progErr').innerHTML=bad.length?`<div class="err">読めなかったコード：${bad.join('、')}（例：CM7、Am7、G7(♭9)、Dm7b5、F/G）</div>`:'';
  const chords=parsed.filter(x=>x.p).map(x=>toChord(x.p,S.tr));
  if(RH()&&['drop2','spread'].includes(S.ptype))S.ptype='auto';
  PROG=voiceProg(chords,S.ptype);
  PROG.forEach(r=>{r.full=S.pbass?addBass(r.ch,r.notes.map(n=>({...n}))):r.notes;});

  $('#ptypes').innerHTML=[['auto','おまかせ'],['close','クローズ'],['drop2','ドロップ2'],['spread','左手ルート＋右手'],['shell','シェル'],['rootless','ルートレス'],['quartal','4度堆積']]
    .map(([v,n])=>`<button class="chip ${S.ptype===v?'on':''}" data-pt="${v}" ${RH()&&['drop2','spread'].includes(v)?'disabled':''}>${n}</button>`).join('');
  document.querySelectorAll('#patSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.pat));
  $('#bpm').value=S.bpm;$('#bpmV').textContent=S.bpm;$('#beats').value=S.beats;
  $('#pbassTog').checked=S.pbass&&!RH();$('#pbassTog').disabled=RH();$('#loopTog').checked=S.loop;$('#trSel').value=S.tr;

  if(!PROG.length){$('#pCards').innerHTML='';$('#pSum').innerHTML='';save();return;}
  const all=PROG.flatMap(r=>r.notes.map(n=>n.midi));
  const lo=Math.min(...all),hi=Math.max(...all);
  const range=[Math.floor(lo/12)*12,Math.max(Math.floor(lo/12)*12+24,Math.ceil((hi+1)/12)*12)];
  const total=PROG.reduce((s,r)=>s+(r.move||0),0);
  $('#pSum').innerHTML=`${PROG.length}コード／前のコードからの動きの合計 <b>${total}半音</b>`+(PROG.length>1?`（1コードあたり平均 <b>${(total/(PROG.length-1)).toFixed(1)}</b>）`:'');
  $('#pCards').innerHTML=PROG.map((r,i)=>{
    const bass=r.full.find(n=>n.bass);
    return `<div class="mini" data-pi="${i}">
      <h3><span class="pc-name">${r.ch.name}</span><span>${TNAME[r.cand.type]}・${invLabel(r.cand.type,r.cand.inv,r.ch)}${r.cand.fb?'（代わり）':''}</span></h3>
      <div class="kbw">${kbSVG(r.notes,{h:92,range,common:r.common})}</div>
      <div class="pills">${pillsHTML(r.notes,r.ch.flat)}</div>
      <div class="meta"><span>${bass?'ベース '+noteName(bass.midi,bass.lab,r.ch.flat):''}</span>
      <span class="mv">${r.move==null?'スタート':'動き '+r.move+'半音'+(r.common.size?'・共通音 '+r.common.size:'')}</span></div>
      <div class="hand">${handText(handInfo(r.full))}</div></div>`;
  }).join('');
  save();
}

/* 進行の再生 */
let player=null;
function stopProg(){
  if(!player)return;clearInterval(player.timer);player.tos.forEach(clearTimeout);
  try{player.bus.gain.setTargetAtTime(0,AC.currentTime,.05);const b=player.bus;setTimeout(()=>b.disconnect(),600);}catch(e){}
  player=null;document.querySelectorAll('#pCards .mini').forEach(e=>e.classList.remove('now'));
}
function playProg(){
  stopProg();if(!PROG.length)return;const a=audio();
  const bus=newBus();player={bus,tos:[],i:0,next:a.currentTime+.1};
  const spb=60/S.bpm,bar=spb*S.beats;
  const sched=()=>{
    while(player&&player.next<a.currentTime+.35){
      if(player.i>=PROG.length){if(!S.loop){const t=(player.next-a.currentTime)*1000+bar*1000;player.tos.push(setTimeout(stopProg,Math.max(0,t-bar*1000+1500)));clearInterval(player.timer);return;}player.i=0;}
      const r=PROG[player.i],t=player.next,idx=player.i;
      const bass=r.full.filter(n=>n.bass),up=r.notes;
      if(bass.length)playNotes(bass,{when:t,dur:bar*.95,mode:'block',bus});
      if(S.pat==='whole')playNotes(up,{when:t,dur:bar*.92,mode:'strum',bus});
      else if(S.pat==='quarter'){for(let k=0;k<S.beats;k++)playNotes(up,{when:t+k*spb,dur:spb*.7,mode:'block',bus});}
      else{const s=[...up].sort((x,y)=>x.midi-y.midi);const seq=s.concat(s.slice(1,-1).reverse());const vel=.34/Math.sqrt(2);
        for(let k=0;k<S.beats*2;k++)voice(seq[k%seq.length].midi,t+k*spb/2,spb*.9,vel,bus);}
      player.tos.push(setTimeout(()=>{document.querySelectorAll('#pCards .mini').forEach((e,j)=>e.classList.toggle('now',j===idx));},Math.max(0,(t-a.currentTime)*1000)));
      player.next+=bar;player.i++;
    }
  };
  sched();player.timer=setInterval(sched,60);
}

/* ---------- 画面：解説 ---------- */
function renderLearn(){
  const ex={close:['C','M7'],drop2:['C','M7'],drop3:['C','M7'],drop24:['C','M7'],spread:['C','M7'],shell:['G','7'],rootless:['D','m7'],quartal:['D','m7']};
  let h=`<div class="card"><h3>ボイシングってなに？</h3><div class="tip">同じ「CM7」でも、どの音を・どの高さに・どんな順番で置くかで響きはがらっと変わります。この「音の積み方」がボイシング。コードネームは<b>材料</b>、ボイシングは<b>盛りつけ</b>のようなものです。</div></div>`;
  TYPES.forEach(t=>{const I=INFO[t.id];h+=`<div class="card"><h3>${t.name}</h3><dl><dt>作り方</dt><dd>${I.how}</dd><dt>響き</dt><dd>${I.sound}</dd><dt>向いてる場面</dt><dd>${I.use}</dd><dt>コツ</dt><dd>${I.tip}</dd></dl>
    <div class="try"><button class="chip" data-try="${t.id}" data-r="${ex[t.id][0]}" data-q="${ex[t.id][1]}">▶ ${ex[t.id][0]}${QDISP[ex[t.id][1]]} で試す</button></div></div>`;});
  h+=`<div class="card"><h3>きれいにつなぐ5つのコツ</h3><ul>
   <li><b>共通音は残す</b>：次のコードにも同じ音があれば、同じ高さのまま弾き続ける。</li>
   <li><b>ほかの音は近くへ</b>：半音か全音で動ける音を探す（ボイスリーディング）。</li>
   <li><b>トップノートを歌わせる</b>：いちばん上の音はメロディのように耳に残る。なめらかに動かすか、メロディとぶつからないように。</li>
   <li><b>低音は広く、高音は狭く</b>：低い音域で3度以下の間隔を重ねると濁る（目安：E3より下では避ける）。</li>
   <li><b>手の幅で考える</b>：片手は1オクターブ以内、手と手の間も6度くらいまでに収めると弾きやすく、音もまとまる（「音の間隔」を「ふつう」か「ぎゅっと」にすると自動でこうなる。「ぎゅっと」は隣り合う音を4度以内に、「右手だけ」は1オクターブ以内・4音までに収める。音が多いコードは5度→ルート→11度→9度の順に省く）。</li>
   <li><b>ガイドトーンを追う</b>：7thコードの3度と7度は、次のコードの7度と3度へ半音で流れやすい。ii–V–I で確かめてみて。</li></ul></div>
   <div class="card"><h3>使い分けの早見表</h3><ul>
   <li>ピアノ1本・弾き語り → <b>左手ルート＋右手</b></li>
   <li>バンドの中・ベースがいる → <b>シェル</b> か <b>ルートレス</b></li>
   <li>おしゃれ・シティポップ感 → <b>ドロップ2</b>、<b>ルートレス</b></li>
   <li>パッドやストリングスで広がり → <b>ドロップ2&4</b>、<b>ドロップ3</b></li>
   <li>モダン・浮遊感 → <b>4度堆積</b></li></ul></div>`;
  $('#v-learn').innerHTML=h;
}

/* ---------- タブ ---------- */
function setTab(t){
  if(!['chord','prog','learn'].includes(t))t='chord';S.tab=t;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  document.querySelectorAll('main section').forEach(s=>s.classList.toggle('on',s.id==='v-'+t));
  if(t==='prog')renderProg();
  if(location.hash!=='#'+t)history.replaceState(null,'','#'+t);
  save();
}

/* ---------- イベント ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('button,[data-cmp],[data-pi],rect[data-midi]');if(!el)return;
  const d=el.dataset;
  if(d.tab){stopProg();setTab(d.tab);window.scrollTo(0,0);return;}
  if(d.root!==undefined){S.root=+d.root;if(S.tight>=2)S.inv=-1;renderChord(true);return;}
  if(d.q!==undefined&&!d.try){S.q=d.q;S.inv=-1;renderChord(true);return;}
  if(d.type){S.type=d.type;S.inv=-1;renderChord(true);return;}
  if(d.cmp){S.type=d.cmp;S.inv=+d.inv;renderChord(false);playNotes(lastMain);return;}
  if(d.midi){audio();voice(+d.midi,AC.currentTime+.02,1.2,.3);return;}
  if(d.pi!==undefined){const r=PROG[+d.pi];if(r)playNotes(r.full,{mode:'strum'});return;}
  if(d.pt){S.ptype=d.pt;renderProg();return;}
  if(d.try){S.type=d.try;S.root=ROOTS.findIndex(r=>r.n===d.r);S.q=d.q;S.inv=0;S.oct=0;setTab('chord');renderChord(false);playNotes(lastMain);window.scrollTo(0,0);return;}
  if(el.closest('.tightSeg')&&d.v){S.tight=+d.v;S.easy=S.tight>=1;S.inv=-1;stopProg();renderChord(S.tab==='chord');renderProg();return;}
  if(el.closest('#modeSeg')&&d.v){S.mode=d.v;renderChord(false);playNotes(lastMain);return;}
  if(el.closest('#soundSeg')&&d.v){S.sound=d.v;renderChord(false);playNotes(lastMain);return;}
  if(el.closest('#patSeg')&&d.v){S.pat=d.v;renderProg();if(player)playProg();return;}
});
$('#btnPlay').onclick=()=>playNotes(lastMain);
$('#invPrev').onclick=()=>{S.inv--;renderChord(true);};
$('#invNext').onclick=()=>{S.inv++;renderChord(true);};
$('#octDn').onclick=()=>{S.oct--;renderChord(true);};
$('#octUp').onclick=()=>{S.oct++;renderChord(true);};
$('#bassTog').onchange=e=>{S.bass=e.target.checked;if(S.tight>=2)S.inv=-1;renderChord(true);};
$('#autoTog').onchange=e=>{S.auto=e.target.checked;save();};
let tt;$('#progText').oninput=e=>{clearTimeout(tt);tt=setTimeout(()=>{S.prog=e.target.value;stopProg();renderProg();},350);};
$('#preset').innerHTML+=PRESETS.map((p,i)=>`<option value="${i}">${p[0]}</option>`).join('');
$('#preset').onchange=e=>{if(e.target.value==='')return;S.prog=PRESETS[+e.target.value][1];S.tr=0;e.target.value='';stopProg();renderProg();};
$('#trSel').innerHTML=Array.from({length:12},(_,i)=>i-5).map(k=>`<option value="${k}">移調 ${k>0?'+':''}${k}${k===0?'（そのまま）':''}</option>`).join('');
$('#trSel').onchange=e=>{S.tr=+e.target.value;stopProg();renderProg();};
$('#bpm').oninput=e=>{S.bpm=+e.target.value;$('#bpmV').textContent=S.bpm;save();};
$('#bpm').onchange=()=>{if(player)playProg();};
$('#beats').onchange=e=>{S.beats=+e.target.value;save();if(player)playProg();};
$('#pbassTog').onchange=e=>{S.pbass=e.target.checked;renderProg();};
$('#loopTog').onchange=e=>{S.loop=e.target.checked;save();};
$('#pPlay').onclick=playProg;
$('#pStop').onclick=stopProg;
window.addEventListener('hashchange',()=>setTab(location.hash.slice(1)));

renderChord(false);renderLearn();
setTab(location.hash?location.hash.slice(1):S.tab);
</script>
